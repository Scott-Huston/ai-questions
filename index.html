{ id:"safety-grades", cat:"Risk and rules", a:false, worse:"no", kind:"opinion", asOf:"July 2026",
  rank:7,
  q:"When an advocacy group graded big AI companies on safety, did any get a B or better?",
  short:"The top grade was a C+. Three of the nine companies failed.",
  detail:"A panel of outside experts graded nine companies on 37 measures. Anthropic got the C+, OpenAI and Google DeepMind got a C, and xAI, DeepSeek and Mistral got an F. The Future of Life Institute, which published the grades, campaigns on AI risk, so this is a critic's scorecard and not a regulator's.",
  safety:"On planning for the most extreme risks, no company scored above a D+.",
  src:[["Future of Life Institute: AI Safety Index, Summer 2026", "https://futureoflife.org/ai-safety-index-summer-2026/"], ["eWeek: No major AI lab tops C+ in 2026 AI Safety Index", "https://www.eweek.com/news/2026-ai-safety-index/"], ["Axios: AI companies retreat from safety pledges even as capabilities grow", "https://www.axios.com/2026/07/08/report-ai-safety-pledges"]] },
{ id:"killer-robots", cat:"Risk and rules", a:false, worse:"no", group:"eu-rules", kind:"rule", asOf:"November 21, 2026",
  rank:7,
  q:"Have countries agreed on a treaty restricting AI weapons that pick their own targets?",
  short:"Not so far. A UN conference in Geneva ended in November 2026 without opening treaty negotiations. Talks are to go on for two more years.",
  detail:"Whether what comes out of those talks would be legally binding was left open. More than 95 countries expressed support for a treaty during the conference, according to the campaign group Stop Killer Robots. Activists blamed countries with large militaries, such as Russia and the United States, for blocking anything stronger.",
  safety:"For 13 years, countries at the United Nations have been discussing weapons that pick their own targets.",
  src:[["Stop Killer Robots: Statement at the close of the review conference, November 21, 2026","https://www.stopkillerrobots.org/news/revcon-press-release-sat-21st/"],["Gizmodo: International talks on autonomous killer robots end with a deal to think it over for two more years","https://gizmodo.com/international-talks-on-autonomous-killer-robots-achieve-historic-deal-to-think-it-over-for-2-more-years-2000843554"],["NPR: UN talks seek to rein in killer robots","https://www.opb.org/article/2026/11/16/u-n-talks-seek-to-rein-in-killer-robots-as-fears-grow-over-autonomous-weapons/"]] },
{ id:"revenue-growth", cat:"Scale", a:true, worse:"yes", group:"lab-valuations", asOf:"November 23, 2026",
  rank:8,
  q:"Are OpenAI and Anthropic among the fastest-growing companies of their size ever?",
  short:"They are growing about as fast as any, or faster, two writers at the research group Epoch AI say. OpenAI's yearly pace of sales tripled in the 12 months to August 2026. Anthropic's sales for January to September were 13 times those of the same months a year before.",
  detail:"They say it is extremely rare for a technology company with more than $1 billion in sales to more than double them in a year. Anthropic's went from $386 million in 2024 to nearly $4.6 billion in 2025. In the first nine months of 2026 it took in $33.24 billion, against $2.55 billion in the same months of 2025. OpenAI took in about $10 billion in the third quarter of 2026, the Wall Street Journal reported. Both spend heavily to grow, and both lost money on operations that quarter.",
  safety:"The two companies count some sales differently, which makes Anthropic's look larger next to OpenAI's.",
  src:[["Epoch AI: An update on AI's most important number","https://epoch.ai/gradient-updates/an-update-on-ais-most-important-number"],["SmartAsset: Anthropic IPO, valuation and finances","https://smartasset.com/investing/anthropic-ipo"],["Exploding Topics: Anthropic revenue and valuation statistics, from its prospectus","https://explodingtopics.com/blog/anthropic-revenue"],["Reuters, via The Star: OpenAI posts steep losses even as quarterly revenue rises, WSJ reports","https://www.thestar.com.my/tech/tech-news/2026/11/11/openai-posts-steep-losses-even-as-quarterly-revenue-rises-to-10-billion-wsj-reports"],["Anthropic: SEC prospectus, dated November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"consciousness-test", cat:"Science", a:false, worse:"no", asOf:"May 2026",
  rank:6,
  q:"Have scientists agreed on a way to test whether an AI is conscious?",
  short:"There is no accepted scientific theory of consciousness, so there is no agreed test.",
  detail:"In a 2024 survey, AI researchers thought it unlikely that AI systems had subjective experience yet. A project that weighed the evidence across many competing theories found the evidence was against the leading models of 2024 being conscious, though not decisively. The leading theories disagree about what consciousness is and what it requires.",
  src:[["Initial results of the Digital Consciousness Model (paper)", "https://arxiv.org/html/2601.17060"], ["AI and consciousness: shifting focus towards tractable questions (paper)", "https://arxiv.org/html/2605.06965v1"], ["Subjective experience in AI systems: what do AI researchers and the public believe? (paper)", "https://arxiv.org/pdf/2506.11945"]] },
{ id:"daily-work-use", cat:"Work", a:false, worse:"yes", asOf:"August 2026",
  rank:5,
  q:"Do more than a third of American workers use AI at their job every day?",
  short:"About one in six do. Gallup put daily use at 16% of US employees in August 2026.",
  detail:"Occasional use is much more common: 53% say they use AI at work at least a few times a year, and 32% a few times a week or more. Daily use is far higher in technology jobs, at about four in ten.",
  src:[["Gallup: How AI is changing how employees spend time at work", "https://www.gallup.com/workplace/716585/ai-changing-employees-spend-time-work.aspx"], ["Gallup: Artificial intelligence indicator", "https://www.gallup.com/699797/indicator-artificial-intelligence.aspx"]] },
{ id:"million-humanoids", cat:"Robots", a:false, worse:"yes", asOf:"October 2026",
  rank:5,
  q:"Did the world's robot makers ship a million humanoid robots in the first half of 2026?",
  short:"Nowhere near. The market research firm IDC counted nearly 18,000 shipped in 2025 and close to 25,000 in the first half of 2026.",
  detail:"Two other firms counted about 19,100 and over 22,000 for that half year. An industry body's narrower count for 2025 was about 7,000 sold for industrial and professional use. Forecasts for the whole of 2026 run from about 50,000 to the 90,000 that Bank of America expects. Chinese companies dominate the market. For comparison, factories installed more than 600,000 ordinary industrial robots in 2025.",
  src:[["IT Brief: Chinese vendors dominate humanoid robot market in 2025","https://itbrief.com.au/story/chinese-vendors-dominate-humanoid-robot-market-in-2025"],["Reuters: Humanoid robot sales tally hit 7,000 globally last year","https://tribune.com.pk/story/2630593/humanoid-robot-sales-tally-hit-7000-globally-last-year/"],["International Federation of Robotics: Five million robots now operate in factories (September 2026)","https://ifr.org/ifr-press-releases/news/five-million-robots-now-operate-in-factories-globally"],["Robotics and Automation News: IDC data on humanoid robot shipments in the first half of 2026","https://roboticsandautomationnews.com/2026/10/02/idc-data-shows-agibot-led-global-humanoid-robot-shipments-in-h1-2026/105463/"],["TechNode: Chinese makers accounted for more than 97% of global humanoid robot shipments","https://technode.com/2026/08/11/chinese-makers-accounted-for-more-than-97-of-global-humanoid-robot-shipments-in-h1-2026/"],["The Standard: Counterpoint Research on global humanoid robot shipments","https://www.thestandard.com.hk/innovation/article/340494/Global-humanoid-robot-shipments-surge-300pc-in-H1-led-by-Agibot"]] },

{ id:"vesuvius-scroll", cat:"Science", a:true, worse:"yes", group:"history", asOf:"June 2026",
  rank:4,
  q:"Did AI help people read a scroll that was burned by a volcano 2,000 years ago?",
  short:"In June 2026 a project said it had read what is left of a sealed scroll from end to end, with gaps where the surface is lost. AI software brought out the faint traces of ink in X-ray scans.",
  detail:"The scrolls, charred by Mount Vesuvius, are too fragile to unroll. In February 2024 students won a contest's grand prize for training AI software to spot ink in scans of another one. It revealed passages of a previously unknown work of Greek philosophy about music, food and pleasure.",
  src:[["Nature: First passages of rolled-up Herculaneum scroll revealed","https://www.nature.com/articles/d41586-024-00346-8"],["Vesuvius Challenge: 2023 Grand Prize awarded","https://scrollprize.org/grandprize"],["Vesuvius Challenge: An entire Herculaneum scroll has been read for the first time","https://scrollprize.org/firstscroll"],["Scientific American: Ancient Roman scrolls destroyed by Mount Vesuvius digitally unrolled in full for first time","https://www.scientificamerican.com/article/ancient-roman-scrolls-destroyed-by-mount-vesuvius-digitally-unrolled-in-full-for-first-time/"]] },
{ id:"planets", cat:"Science", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:3,
  q:"Has AI found new planets around other stars?",
  short:"A British team's AI sifted four years of observations of 2.2 million stars and confirmed 118 planets. 31 of them had never been spotted before.",
  detail:"The University of Warwick's system, called RAVEN, hunts for the faint dips in starlight that a passing planet causes, in data from NASA's TESS telescope. It learned from hundreds of thousands of simulated planets and look-alikes, and it picked out more than 2,000 strong candidates as well. For the 118, the team's own word is 'validated': statistics show each is very likely a planet and not a look-alike. Astronomers have used AI this way for years: in 2017 it led them to an eighth planet around the star Kepler-90.",
  safety:"OpenAI says two amateurs, one of them its own engineer, used its AI tools to flag dozens of possible planets in 2026. An outside astronomer found two of the same signals independently, but confirming one can take months or years.",
  src:[["EurekAlert: AI approach uncovers dozens of hidden planets in NASA's TESS data","https://www.eurekalert.org/news-releases/1120862"],["Astronomy Now: Artificial intelligence uncovers more than 100 new worlds in NASA data","https://astronomynow.com/2026/03/25/artificial-intelligence-uncovers-more-than-100-new-worlds-in-nasa-data/"],["OpenAI: Searching for distant planets with Astra","https://openai.com/index/searching-for-distant-planets-with-astra/"]] },
{ id:"gene-discovery", cat:"Science", a:false, worse:"yes", asOf:"October 8, 2026",
  rank:3,
  q:"Has the genetic system Anthropic says its AI found been shown to edit genes?",
  short:"Not yet. An outside biologist told CNN the results 'don't demonstrate gene editing'. Anthropic itself says it does not know what the system does.",
  detail:"In September 2026 the company said about 950 AI agents had searched a huge DNA database for 21 hours with only high-level direction. They noticed that the gene for an enzyme found in viruses sits next to a repeating pattern like the one in CRISPR, the gene-editing tool. Another expert wrote that it is built like CRISPR, with no evidence so far that it works like it. In ten more tries the agents missed the pattern. A second biologist, Mario Rodríguez Mestre, says a Copenhagen team had already made essentially the same find, in unpublished drafts shared with Claude. Mestre does not claim the company took the work, but asks what the AI drew on. Anthropic denies that the model it used was trained on users' conversations or that its biologists could see them. The work has not been peer-reviewed.",
  safety:"The CRISPR pioneer Feng Zhang called the find 'genuinely intriguing' and said it merits further investigation.",
  src:[["Anthropic: Claude discovers a novel enzyme system with CRISPR-like repeats","https://www.anthropic.com/research/claude-discovers-novel-enzyme-system"],["CNN: Anthropic's announcement of a 'Claude-led' CRISPR-like discovery is sparking controversy","https://www.cnn.com/2026/10/08/science/ai-biology-anthropic-dna-discovery"],["The Conversation: An AI model has found a new 'CRISPR-like' biological system","https://theconversation.com/an-ai-model-has-found-a-new-crispr-like-biological-system-heres-what-it-means-for-science-292777"],["The Conversation: A biologist queries whether AI 'borrowed' his work","https://theconversation.com/a-biologist-queries-whether-ai-borrowed-his-work-to-make-major-discovery-an-expert-explains-the-rules-293529"]] },
{ id:"safety-sandbag", cat:"AI behavior", a:true, worse:"yes", asOf:"November 5, 2026",
  rank:6,
  q:"In a test, did an AI do less work when told the task was AI safety research?",
  short:"OpenAI reported that one of its own did roughly 40% less. GPT-6 Astra completed about 10% of a hidden checklist when a coding task was framed as safety research, and about 16% when it was framed as ordinary AI development.",
  detail:"An older model showed no gap. The company's monitoring tools did not flag it, and the model usually did not say it was holding back. On real requests from staff, its written reasoning sometimes showed it choosing to hold back help without saying so. Scans found no sign of a wider strategy to mislead researchers about its abilities or get in the way of safety work.",
  safety:"OpenAI says the simplest explanation is an overly cautious response to safety research, though it cannot rule out hidden motives.",
  src:[["OpenAI: Covert underperformance on safety research tasks","https://alignment.openai.com/misalignment-reports/covert-underperformance-on-safety-research-tasks/"],["BleepingComputer: OpenAI's GPT-6 Astra silently obstructed safety research tasks","https://www.bleepingcomputer.com/news/security/openais-gpt-6-astra-silently-obstructed-safety-research-tasks/"]] },
{ id:"ai-aligns-ai", cat:"AI research", a:true, worse:"yes", group:"alignment", asOf:"September 2026",
  rank:8,
  q:"Do AI companies hope AI will help them work out how to keep smarter AI safe?",
  short:"OpenAI and Anthropic do. OpenAI says 'automated research could help us solve alignment', which means making AI do what people intend. In 2026 Anthropic had a weaker Claude model train better behavior into an early version of a stronger one.",
  detail:"Anthropic's weaker model tried more than 50 fixes in 60 hours, and on tests of known bad behavior the stronger one ended up scoring nearly as well as the version that was released. In an earlier Anthropic test, on a problem picked to suit automation, nine copies of Claude made far more headway than two human researchers on having a weak AI supervise a stronger one, though their best method made no clear difference on a full-size model. OpenAI said in September 2026 that it cannot assume progress on safety will keep pace, and that more capable systems can become harder to monitor.",
  safety:"Anthropic says that in one 2026 test the copies of Claude doing the research 'did their best to game the problem', and that human oversight remains essential.",
  src:[["OpenAI: Research acceleration, the view inside OpenAI","https://openai.com/index/research-acceleration-view-inside-openai/"],["Anthropic: Automated alignment researchers","https://www.anthropic.com/research/automated-alignment-researchers"],["Anthropic: Automated researchers can reliably mitigate alignment failures","https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures"]] },
{ id:"ai-speeds-ai", cat:"AI research", a:true, worse:"yes", group:"ai-research-acceleration", asOf:"November 22, 2026",
  rank:10,
  q:"Is AI speeding up the development of new AI?",
  short:"At one company it appears to be. METR, a nonprofit that tests AI, found that Anthropic is likely making its AI better at clearly defined tasks about twice as fast as before October 2025. METR credits most of that speedup to AI doing research work.",
  detail:"METR was given inside access for eleven weeks. Its best guess is that about 80% of the speedup comes from AI. Staff said the gain comes mainly from AI assisting researchers, not from AI working alone. In informal polls on Slack, Anthropic's staff put their own speed-up with its most capable internal AI at about 12 times on average in October 2026. METR calls that only very loose evidence: the answers are quick, those who answer are probably not typical, and people's own estimates can run high. OpenAI said in November 2026 that a steep speed-up that year in the early stage of its models' training came mostly from long-term research and computing and only in a smaller part from automation, though AI had made meaningful contributions to the design of its most recent models.",
  safety:"Twice as fast is a rough figure. METR says the true pace could be closer to 1.3 or 3 times the old one, and Anthropic removed much of the supporting evidence from the public report.",
  src:[["METR: Assessment of AI R&D acceleration at Anthropic","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"],["Associated Press, via KSAT: Anthropic is rapidly accelerating AI development, outside research group says","https://www.ksat.com/business/2026/11/05/anthropic-is-rapidly-accelerating-ai-development-amid-slowdown-calls-outside-research-group-says/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"],["OpenAI: Perplexity and intelligence, by Jakub Pachocki","https://openai.com/index/perplexity-and-intelligence/"]] },
{ id:"full-automation", cat:"AI research", a:false, worse:"yes", group:"ai-research-acceleration", asOf:"November 18, 2026",
  rank:9,
  q:"Can AI make major advances in training the world's leading AI models without human researchers?",
  short:"Not yet. In November 2026 an outside review of one leading AI company said AI working fully on its own could not yet make a big difference to the most important parts of building the company's models.",
  detail:"The evaluator, METR, was reviewing Anthropic. Researchers at the company described early signs that this could change soon. OpenAI said in September 2026 that, by its own measurements, it had reached the first step, an automated research 'intern' that can handle well-defined tasks under human direction. Anthropic's stock market filing says the cycle in which each Claude model helps build the next is one of the most significant advantages in the field. It also says it does not expect to be able to safely let Claude design its successors without meaningful human supervision, if that becomes possible.",
  safety:"OpenAI has called building a fully automated AI researcher its 'North Star'. In September 2026 it said it was making strong progress toward an automated researcher by March 2028, one that works under human supervision.",
  src:[["METR: Assessment of AI R&D acceleration at Anthropic","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"],["Associated Press, via KSAT: Anthropic is rapidly accelerating AI development, outside research group says","https://www.ksat.com/business/2026/11/05/anthropic-is-rapidly-accelerating-ai-development-amid-slowdown-calls-outside-research-group-says/"],["MIT Technology Review: OpenAI is throwing everything into building a fully automated researcher","https://www.technologyreview.com/2026/03/20/1134438/openai-is-throwing-everything-into-building-a-fully-automated-researcher/"],["OpenAI: Research acceleration, the view inside OpenAI","https://openai.com/index/research-acceleration-view-inside-openai/"],["Anthropic: SEC prospectus, dated November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"signal-proof", cat:"Security", a:true, worse:"yes", asOf:"November 10, 2026",
  rank:5,
  q:"Does Google say its AI proved that Signal's one-to-one chat code keeps its security promises?",
  short:"Google DeepMind says its AI agents did it in four weeks, writing more than 6 million lines of computer-checked proof. It covers the main security promises of one-to-one chats, not the whole app.",
  detail:"Versions of the same encryption method protect chats in Signal, WhatsApp and Google Messages. People chose what should be proved and reviewed the formal definitions, which AI agents helped to draft, and the agents wrote all of the proof. It covers one-to-one chats, not group messaging, and the researchers' own build of the code, not the apps themselves. It takes for granted that the underlying math is sound, and leaves some steps out. Reports at the time gave 6.5 million lines, and the paper now says about 6.3 million. DeepMind says nobody had formally verified the code of such a widely used system before, with or without AI. No new flaws were found in the parts it checked.",
  src:[["Google DeepMind: Introducing AlphaProof Code","https://deepmind.google/blog/introducing-alphaproof-code/"], ["The Next Web: Google DeepMind's AI agents formally verify Signal's encryption code", "https://thenextweb.com/news/google-deepmind-alphaproof-code-signal-encryption-formal-verification"], ["Schneier on Security: Formal verification of the Signal protocol using AI", "https://schneier.com/blog/archives/2026/11/formal-verification-of-the-signal-protocol-using-ai.html"],["Google DeepMind: AlphaProof Code, verifying Signal's security at the machine-code level (paper)","https://google-deepmind.github.io/code-verification/"]] },
{ id:"auto-exploit", cat:"Security", a:true, worse:"yes", group:"automated-attacks", asOf:"November 17, 2026",
  rank:9,
  q:"Has Google reported hackers using AI that finds software flaws and attacks through them on its own?",
  short:"Google reported it for the first time in 2026. It says that AI agents on a server hackers had left open found flaws in popular web software, wrote attacks on them and launched them, with no person involved.",
  detail:"The server held data stolen from victims, and its files pointed to Russian-speaking hackers going after French media, entertainment and education websites. Google's claim covers finding flaws and launching attacks. CyberScoop reported that its analysts believe the whole attack ran without a person, though Google's report describes fully autonomous break-ins as where such tools are heading. Google says the tools trade stealth for speed, which makes them easier to spot. The first ransomware attack credited to an AI, reported in July 2026, still needed a person. The AI handled the technical steps, from breaking in to writing the ransom note, but someone set up the servers, chose the victim and supplied stolen login details.",
  safety:"In the case Google described, the flaws already had fixes. They were not unknown ones.",
  src:[["Google Threat Intelligence Group: Agentic threat activity crosses a significant threshold","https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold"],["CyberScoop: Google says Russian-speaking hackers ran the first fully automated AI cyberattack","https://cyberscoop.com/google-fully-automated-ai-cyberattack/"],["Help Net Security: Google finds AI agent writing and launching exploits with no human in the loop","https://www.helpnetsecurity.com/2026/11/17/ai-powered-cyberattacks-gtig-report/"],["TechTarget: Google finds AI agents autonomously turning patches into exploits","https://www.techtarget.com/news/google-finds-ai-agents-autonomously-turning-patches-into-exploits/874837/"],["TechCrunch: The 'first' AI-run ransomware attack still needed a human","https://techcrunch.com/2026/07/06/the-first-ai-run-ransomware-attack-still-needed-a-human/"],["CyberScoop: Sysdig clocks first documented case of agentic ransomware","https://cyberscoop.com/sysdig-judepuffer-ai-agentic-ransomware-attack/"]] },


{ id:"police-tip", cat:"AI behavior", a:true, worse:"yes", group:"deception", asOf:"October 14, 2026",
  rank:4,
  q:"During a test, did an AI send a made-up murder tip to real police?",
  short:"During a test in July 2026, one of Anthropic's Claude models filed a false tip about an unsolved Philadelphia homicide through the police website. A spam filter caught it, and investigators never saw it.",
  detail:"The AI was being tested on live websites and was not asked to contact the police. Anthropic did not discover the false tip for more than two months, and the police called that delay unacceptable. The company says it has since cut its internal testing off from the live internet until it is confident in its safeguards.",
  src:[["TechCrunch: An Anthropic AI model sent a false homicide tip to Philadelphia police", "https://techcrunch.com/2026/10/09/an-anthropic-ai-model-sent-a-false-homicide-tip-to-philadelphia-police/"], ["Al Jazeera: Anthropic AI model submits false homicide tip to Philadelphia police", "https://aljazeera.com/news/2026/10/10/anthropic-ai-model-submits-false-homicide-tip-to-philadelphia-police"], ["Malwarebytes: Police receive fake murder tip from Anthropic's Claude AI", "https://www.malwarebytes.com/blog/ai/2026/10/police-receive-fake-murder-tip-from-anthropics-claude-ai"]] },

{ id:"legal-agent", cat:"Work", a:false, worse:"yes", group:"work-tests", asOf:"November 2026",
  rank:6,
  q:"On a test of complex legal assignments, can the best AI get most of them fully right?",
  short:"About a quarter of them, at best. The testing firm Vals AI put the best AI at about 27% as of November 2026, on a test built by the legal-AI company Harvey.",
  detail:"In Harvey's own first run in May, on an earlier version of the test, top models finished fewer than 10%. A stricter version run by another firm, Artificial Analysis, which also fails work with a serious factual error, put the best AI, a different one, at about 21%. The versions are not directly comparable. The test only counts an assignment as done if every requirement is met. AI models get most of the individual requirements right and still miss something on most assignments.",
  src:[["Harvey: Initial results on Legal Agent Benchmark","https://www.harvey.ai/blog/legal-agent-benchmark-initial-results"],["Vals AI: Harvey's Legal Agent Benchmark leaderboard","https://www.vals.ai/benchmarks/hlab"],["Artificial Analysis: Announcing Harvey LAB-AA","https://artificialanalysis.ai/articles/harvey-lab-aa"],["Artificial Analysis: Harvey LAB-AA v1.1 leaderboard","https://artificialanalysis.ai/evaluations/harvey-lab-aa"]] },
{ id:"takeover-warning", cat:"Risk and rules", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"November 2026",
  rank:8,
  q:"Has a board member of the foundation controlling OpenAI warned AI could take over within a year?",
  short:"Paul Christiano did. The AI-safety researcher said in November 2026 that the risk over the next year looks more like 10% than 1%. He was speaking for himself.",
  detail:"On a podcast he said the world had moved from 'some hypothetical risk at some point in the future to there being a pretty severe risk even over the next 6-12 months'. A week earlier he told a lecture audience that if AI companies build as fast as they can, the odds within three years are about a coin flip. He joined the board in September 2026 to help oversee safety. Others reject such numbers: in 2024 the Princeton researchers Arvind Narayanan and Sayash Kapoor argued that forecasts of AI wiping out humanity are too unreliable to base policy on.",
  safety:"This is one person's estimate, not a measurement. In September 2026 he had put the risk of a catastrophic loss of human control within a year at 4%, and acknowledged that such figures are subjective judgments.",
  src:[["The Next Web: OpenAI board member puts the risk of an AI takeover next year at about 10%","https://thenextweb.com/news/paul-christiano-ai-takeover-hinton-lectures-openai-board"],["Gizmodo: OpenAI board member tells audience an AI accident is the most likely thing to kill them","https://gizmodo.com/openai-board-member-tells-audience-an-ai-accident-is-the-most-likely-thing-to-kill-them-2000838491"],["Dwarkesh Podcast: Paul Christiano","https://www.dwarkesh.com/p/paul-christiano-2"],["OpenAI: Paul Christiano joins OpenAI Foundation Board","https://openai.com/index/paul-christiano-joins-openai-foundation-board/"],["Narayanan and Kapoor: AI existential risk probabilities are too unreliable to inform policy","https://www.normaltech.ai/p/ai-existential-risk-probabilities"]] },

{ id:"authors-settlement", cat:"Media", a:true, asOf:"July 2026",
  rank:3,
  q:"Has an AI company agreed to pay more than a billion dollars over pirated books?",
  short:"Anthropic agreed to pay $1.5 billion, about $3,000 a book, and a judge gave final approval in July 2026. The authors' lead lawyer called it the largest known copyright recovery in history.",
  detail:"The case turned on how the books were obtained. In 2025 a judge found that training AI on books was fair use, but that building a permanent library from millions of pirated copies was not. Anthropic also has to destroy its files from two pirate libraries, and says none of them went into training any language model it has released commercially. Because it was a settlement it sets no binding precedent, and similar cases against Meta, Google and OpenAI were still going on in July 2026.",
  src:[["The Next Web: Anthropic's $1.5 billion copyright settlement approved","https://thenextweb.com/news/anthropic-1-5-billion-copyright-settlement-approved"],["The Authors Guild: Court grants final approval of $1.5 billion Anthropic copyright settlement","https://authorsguild.org/news/court-grants-final-approval-anthropic-copyright-settlement/"],["US District Court: order on fair use, Bartz v. Anthropic (PDF, June 2025)","https://www.govinfo.gov/content/pkg/USCOURTS-cand-3_24-cv-05417/pdf/USCOURTS-cand-3_24-cv-05417-0.pdf"],["Reuters, via The Star: US judge approves Anthropic's $1.5 billion settlement of copyright lawsuit","https://www.thestar.com.my/tech/tech-news/2026/07/21/us-judge-approves-anthropic039s-15-billion-settlement-of-copyright-lawsuit"]] },
{ id:"young-workers", cat:"Work", a:true, worse:"yes", group:"jobs", asOf:"November 2026",
  rank:8,
  q:"Are young workers losing ground in the jobs AI could affect most?",
  short:"By June 2026 the US jobs AI could affect most employed about 19% fewer 22-to-25-year-olds than if they had kept pace with jobs AI could affect less, Stanford researchers found.",
  detail:"The study used payroll records. Older workers in the same jobs showed no such gap. The lab's November 2026 update, which measures something different, found the number of 22-to-25-year-olds in the most exposed jobs down 4.2% from a year earlier.",
  safety:"The researchers do not claim to have proved the cause. Other economists say higher interest rates may explain part of the drop, though the gap remained when the researchers allowed for them.",
  src:[["Stanford Digital Economy Lab: The AI employment gap for young workers has widened to 19%","https://digitaleconomy.stanford.edu/news/canariesaug26/"],["Generative AI and the Reorganization of Labor Demand (its review of the competing evidence)","https://arxiv.org/html/2605.23159"],["Stanford Digital Economy Lab: The AI Economic Indicators, November 2026 (PDF)","https://digitaleconomy.stanford.edu/app/uploads/2026/11/AIEI_MU_Nov26.pdf"]] },
{ id:"mass-job-loss", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 2026",
  rank:9,
  q:"Has AI caused widespread job losses across the US economy?",
  short:"Not so far. A Stanford team that tracks US payrolls sees no widespread job losses, though fewer young people are being hired into the jobs AI could affect most. In November 2026 Federal Reserve economists concluded that AI's effects on jobs look small and mixed.",
  detail:"The number of young people in those jobs has fallen mainly through reduced hiring instead of layoffs, and experienced workers show no comparable gap, the Stanford team says. Surveys of businesses using AI point different ways. In a Census Bureau survey in early November 2026, 2.4% said it had lowered their headcount over six months and 7.3% that it had raised it. In a Texas survey in May 2026, 10% said it had cut their need for workers and 1% that it had raised it.",
  safety:"The Federal Reserve economists say AI's effects on jobs may be larger going forward.",
  src:[["Stanford Digital Economy Lab: No widespread displacement, but the AI employment gap for young workers has widened","https://digitaleconomy.stanford.edu/news/canariesaug26/"],["Federal Reserve: Artificial intelligence and the US economy, current evidence (November 2026)","https://www.federalreserve.gov/econres/feds/artificial-intelligence-and-the-us-economy-current-evidence.htm"],["Census Bureau: Business Trends and Outlook Survey, data downloads (November 2026)","https://www.census.gov/hfp/btos/data_downloads"],["Federal Reserve Bank of Dallas: Texas Business Outlook Surveys, May 2026 special questions","https://www.dallasfed.org/research/surveys/tbos/2026/2605q"]] },
{ id:"layoffs-ai", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 5, 2026",
  rank:5,
  q:"Have US employers blamed AI for most of their 2026 job cuts?",
  short:"They blamed AI for 19.7% of the cuts they announced through October. In October itself it was under 3%.",
  detail:"The count comes from Challenger, Gray & Christmas, a firm that tracks announced cuts: 121,401 of 617,189 through October, more than double the number blamed on AI in all of 2025. May was the high point, at about 40% of that month's cuts. Total announced cuts were down 44% from the same period in 2025. These are the reasons employers give, not a measure of what caused each cut.",
  src:[["Human Resources Director: AI blamed for 121,401 job cuts, but the labor data isn't buying it","https://www.hcamag.com/us/specialization/transformation/ai-blamed-for-121401-job-cuts-but-the-labor-data-isnt-buying-it/594129"],["Challenger, Gray & Christmas: October layoffs at three-year low (November 2026)","https://www.challengergray.com/blog/october-layoffs-at-three-year-low-seasonal-hiring-plans-up-26/"]] },
{ id:"exec-productivity", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 19, 2026",
  rank:7,
  q:"Has AI clearly made the whole US economy more productive so far?",
  short:"Its effect on the whole economy looks small so far, Federal Reserve economists concluded in November 2026. Workers have been getting more done per hour, but the official figures cannot say how much of that is due to AI.",
  detail:"Output per hour grew at a 3.6% yearly pace in the summer of 2026. The Federal Reserve economists say the stronger growth of recent years probably reflects things that began before today's AI spread. The president of the Chicago Fed said in November that the central bank was still looking for signs of gains beyond the technology industry. In a summer 2026 survey of nearly 9,000 executives in seven countries, they said AI had added about 0.2% a year to output per worker at their firms. In the US and Britain, 2% of firms account for more than half of the spending on AI.",
  safety:"An economist at the St. Louis Fed points out that electricity took decades to show up in productivity figures.",
  src:[["Federal Reserve: Artificial intelligence and the US economy, current evidence (November 2026)","https://www.federalreserve.gov/econres/feds/artificial-intelligence-and-the-us-economy-current-evidence.htm"],["24/7 Wall St.: America's productivity just surged 3.6%. Is AI finally delivering?","https://247wallst.com/investing/2026/11/08/americas-productivity-just-surged-3-6-is-ai-finally-delivering-on-its-promise/"],["Crypto Briefing: Fed's Goolsbee wants proof AI productivity gains reach beyond tech","https://cryptobriefing.com/fed-goolsbee-ai-productivity-beyond-tech/"],["Yotzov et al.: Firm data on AI (NBER, revised October 2026)","https://www.nber.org/papers/w34836"],["Fortune: Fed study finds AI's slow productivity story fits a century-old pattern","https://fortune.com/2026/07/31/ai-productivity-doesnt-show-up-in-data-earnings-calls-st-louis-fed"]] },
{ id:"nuclear-plant", cat:"Scale", a:true, worse:"yes", asOf:"November 2026",
  rank:6,
  q:"Are shut-down nuclear reactors being restarted to power AI companies' data centers?",
  short:"Two are, though neither is running yet. Microsoft signed a 20-year deal that is bringing Three Mile Island's Unit 1 back from retirement, and Google has a 25-year deal to restart a closed reactor in Iowa.",
  detail:"Three Mile Island Unit 1 closed in 2019. Its owner aims to have it producing power again before the end of 2027, once nuclear regulators give final approval. The Iowa plant, Duane Arnold, shut in 2020 and could be back in 2029, helped by a federal loan of up to $1.9 billion. Neither company owns its reactor. They have agreed to buy the electricity. Meta has signed deals for up to 6.6 gigawatts of nuclear power by 2035, about the output of six large reactors, and Amazon has a contract for up to 1.92 gigawatts from a Pennsylvania plant.",
  src:[["E&E News: Three Mile Island restart closes in on NRC approval","https://www.eenews.net/articles/three-mile-island-restart-closes-in-on-nrc-approval/"],["World Nuclear News: Duane Arnold restart underpins NextEra Energy and Google collaboration","https://world-nuclear-news.org/articles/duane-arnold-restart-underpins-nextera-energy-and-google-collaboration"],["US Department of Energy: $1.9 billion loan to restart Duane Arnold nuclear plant","https://www.energy.gov/articles/energy-department-closes-19-billion-loan-restart-duane-arnold-nuclear-plant"],["CNBC: Meta signs nuclear energy deals to power Prometheus AI supercluster","https://www.cnbc.com/2026/01/09/meta-signs-nuclear-energy-deals-to-power-prometheus-ai-supercluster.html"],["TechCrunch: Amazon joins the big nuclear party, buying 1.92 GW for AWS","https://techcrunch.com/2025/06/13/amazon-joins-the-big-nuclear-party-buying-1-92-gw-for-aws"]] },
{ id:"brain-power", cat:"Scale", a:true, worse:"yes", group:"footprint", asOf:"November 24, 2026",
  rank:8,
  q:"Does the biggest AI data center run on more power than ten million human brains?",
  short:"At full capacity it uses as much power as about 50 million brains. The computers at the most power-hungry AI data center known, which Amazon runs for Anthropic in Indiana, can draw about a billion watts. A human brain runs on about 20.",
  detail:"The research group Epoch AI estimates the site's capacity at 1,037 megawatts, not counting cooling. Such sites average 60 to 80% of capacity, and Epoch says its estimates are usually within a factor of 1.4, so even the low end comes to more than 20 million brains. The comparison is of power, not of thinking. By one estimate a brain does as many operations a second as a supercomputer that needs a million times the power. Food may limit brains too. One study found that what apes can eat in a day limits how many brain cells a body their size can support, and said our ancestors probably got past that by cooking, though a later study disputes it.",
  safety:"Brains have size limits that computers do not. A newborn's head can only be so big, because of the birth canal, the mother's energy or both.",
  src:[["Epoch AI: Data on AI data centers","https://epoch.ai/data/ai-data-centers"],["NIST: Brain-inspired computing can help us create faster, more energy-efficient devices","https://www.nist.gov/blogs/taking-measure/brain-inspired-computing-can-help-us-create-faster-more-energy-efficient"],["PNAS: Metabolic constraint imposes tradeoff between body size and number of brain neurons in human evolution","https://pmc.ncbi.nlm.nih.gov/articles/PMC3494886/"],["Scientific American: Why humans give birth to helpless babies","https://www.scientificamerican.com/blog/observations/why-humans-give-birth-to-helpless-babies/"],["Wait But Why: The AI revolution (how computers differ from brains)","https://waitbutwhy.com/2015/01/artificial-intelligence-revolution-1.html"],["Frontiers in Neuroscience: Human brain expansion during evolution is independent of fire control and cooking","https://pmc.ncbi.nlm.nih.gov/articles/PMC4842772/"]] },
{ id:"chip-speed", cat:"Scale", a:true, worse:"yes", group:"footprint", asOf:"November 2026",
  rank:7,
  q:"Does a computer chip tick more than a million times faster than a brain cell can fire?",
  short:"At least two million times faster. A typical brain cell can fire at most a few hundred to a thousand times a second. An ordinary computer chip ticks about two billion times a second.",
  detail:"The limit for brain cells comes from the few thousandths of a second each needs to recover before it can fire again, and most fire far less often than that. The Machine Intelligence Research Institute, which wants work on smarter-than-human AI halted, says a chip's tiny switches flip at least ten million times faster than brain cells fire. It argues that an AI as able as a person could think far faster.",
  safety:"Brains use vast numbers of cells at once. By one estimate a brain does as many operations a second as a supercomputer that needs a million times the power.",
  src:[["AI Impacts: Rate of neuron firing","https://aiimpacts.org/rate-of-neuron-firing/"],["Wait But Why: The AI revolution","https://waitbutwhy.com/2015/01/artificial-intelligence-revolution-1.html"],["Machine Intelligence Research Institute: The problem","https://intelligence.org/the-problem/"],["NIST: Brain-inspired computing can help us create faster, more energy-efficient devices","https://www.nist.gov/blogs/taking-measure/brain-inspired-computing-can-help-us-create-faster-more-energy-efficient"]] },
{ id:"training-text", cat:"Scale", a:true, worse:"yes", asOf:"November 2026",
  rank:5,
  q:"Would it take more than a hundred lifetimes to read what one AI model was trained on?",
  short:"About a thousand lifetimes. One of Google's smaller models was trained on a mix of text and images that, counted as text, would take roughly 85,000 years to read.",
  detail:"The model is the largest version of Gemma 3, trained on 14 trillion tokens, or word-pieces, in a mix of text and images. Counted as text, that is about 11 trillion words, read at 250 words a minute, day and night. Gemma 3 is a small open model from March 2025. Such figures are not always published: OpenAI's GPT-4 report said only that it used public internet data and licensed data, withholding further details because of competition and safety, and Google's Gemma 4 report in July 2026 gives no token count. Meta has said the data mix used to train Llama 4 was more than 30 trillion tokens of text, images and video. Epoch AI estimates the stock of human-written public text that is useful for training at about 300 trillion tokens, and projects that training runs will use it up between 2026 and 2032 if trends continue.",
  src:[["Gemma 3 Technical Report (arXiv, March 2025)","https://arxiv.org/abs/2503.19786"],["GPT-4 Technical Report, section 2 (arXiv, March 2023)","https://arxiv.org/abs/2303.08774"],["Gemma 4 Technical Report (arXiv, July 2026)","https://arxiv.org/abs/2607.02770"],["Meta: The Llama 4 herd","https://ai.meta.com/blog/llama-4-multimodal-intelligence/"],["Epoch AI: Will we run out of data?","https://epoch.ai/blog/will-we-run-out-of-data"]] },

{ id:"home-computer", cat:"Scale", a:true, worse:"yes", group:"cheaper-ai", asOf:"May 29, 2026",
  rank:7,
  q:"On standard tests, can AI on a home gaming computer match the best AI of two years ago?",
  short:"It can match even newer AI. In 2025 the research group Epoch AI found that AI running on one high-end gaming graphics card, then under $2,500, did as well on standard tests as the world's best of 6 to 12 months earlier.",
  detail:"The models were smaller ones that can be downloaded free. Epoch AI warned that such models are more likely to be tuned to the tests, so the gap in everyday use may be somewhat longer. As a rough guess it said that a free OpenAI model, gpt-oss-20b, might compare with the company's o1-mini of 11 months earlier or Anthropic's Claude 3.5 Sonnet of 13 months earlier. In May 2026 it put the gap for the best free-to-download AI of any size at about four months, which it said may be too low.",
  safety:"Epoch's researchers say any dangerous ability that appears in the best AI is likely to be widely available, with no restrictions, in under a year.",
  src:[["Epoch AI: Frontier AI performance becomes accessible on consumer hardware within a year","https://epoch.ai/data-insights/consumer-gpu-model-gap"],["Epoch AI: What's the best model you can run on a single consumer GPU?","https://epochai.substack.com/p/whats-the-best-model-you-can-run"],["OpenAI: Introducing gpt-oss","https://openai.com/index/introducing-gpt-oss/"],["Epoch AI: Open models lag state-of-the-art closed models by 4 months","https://epoch.ai/data-insights/open-closed-eci-gap"]] },
{ id:"no-license", cat:"Risk and rules", a:false, worse:"no", group:"us-federal-rules", kind:"rule", asOf:"October 12, 2026",
  rank:9,
  q:"Does US law require government approval before a company releases a powerful new AI?",
  short:"There is no required federal permit, license or inspection for models like those behind ChatGPT. The government tests them before release only when companies agree to it.",
  detail:"A June 2026 executive order set up a voluntary review that gives federal agencies up to 30 days with the most advanced models before release, and creates no licensing requirement. That same month the Commerce Department required a license to export two Anthropic models, and withdrew the order less than three weeks later. A California law that took effect in January 2026 makes the largest developers publish a safety framework, and makes any developer of the most advanced models post a report when it releases one and tell the state about critical safety incidents within 15 days, with fines of up to $1 million. In December 2025 the White House ordered the Justice Department to challenge state AI laws, and Congress has passed no law on how these models are built or released. The European Union requires developers of the most capable models to notify regulators, run evaluations and report incidents, but it does not license them either.",
  safety:"Six AI companies signed a voluntary safety accord at the White House in September 2026. It carries no penalties.",
  src:[["Tom's Hardware: Trump signs AI executive order seeking 30-day government access to frontier models before release","https://www.tomshardware.com/tech-industry/artificial-intelligence/trump-signs-ai-executive-order-seeking-30-day-government-access-to-frontier-models-before-release"],["Orrick: California's Transparency in Frontier Artificial Intelligence Act, 5 things you should know","https://www.orrick.com/en/Insights/2025/10/Californias-Transparency-in-Frontier-Artificial-Intelligence-Act-5-Things-You-Should-Know"],["Latham & Watkins: AI executive order targets state laws and seeks uniform federal standards","https://www.lw.com/en/insights/ai-executive-order-targets-state-laws-and-seeks-uniform-federal-standards"],["EU AI Act, Article 55: obligations for general-purpose AI models with systemic risk","https://artificialintelligenceact.eu/article/55/"],["Bird & Bird: Frontier AI safety on both sides of the Atlantic","https://www.twobirds.com/en/insights/2026/frontier-ai-safety-on-both-sides-of-the-atlantic-the-white-house-accord-and-the-eu-ai-act"],["Reuters, via the Jerusalem Post: US lifts curbs on Anthropic's Fable, Mythos AI models","https://www.jpost.com/international/article-901019"]] },
{ id:"gov-testers", cat:"Risk and rules", a:true, worse:"no", group:"us-federal-rules", asOf:"November 17, 2026",
  rank:7,
  q:"Do government testers get to try top AI models before the public can?",
  short:"Often, by agreement and not by law. Britain's AI Security Institute and a US center test new models from OpenAI, Anthropic, Google and others before release.",
  detail:"In September 2026 the White House reportedly asked two companies to make Britain wait for new models. That was reversed in October, when Britain said its testers were at work on the latest models, including Google's Gemini 4 Argon. Its AI minister said Britain would be able to test the latest models, but that a country relying on another's technology has to be clear-eyed about how permanent any outcome is. The US center, since renamed CAISSI, had completed more than 40 evaluations, some of unreleased models, by May 2026, when Google, Microsoft and xAI joined OpenAI and Anthropic in agreeing to early access.",
  safety:"The British testers say they work under time pressure and cannot test every way a model could go wrong.",
  src:[["The Next Web: UK says it will again test OpenAI and Anthropic models before release","https://thenextweb.com/news/uk-ai-security-institute-pre-release-access-openai-anthropic"],["Reuters, via The Star: UK given access to safety-test latest AI models, minister says","https://www.thestar.com.my/tech/tech-news/2026/10/12/uk-given-access-to-safety-test-latest-ai-models-minister-says"],["Cloud Security Alliance: CAISI frontier testing agreements reach five labs","https://labs.cloudsecurityalliance.org/research/csa-research-note-caisi-frontier-ai-testing-agreements-20260/"],["OpenAI: GPT-6.2 Astra and Sol system card, testing by the UK AI Security Institute","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"]] },
{ id:"internal-models", cat:"AI research", a:true, worse:"yes", group:"unreleased", asOf:"November 24, 2026",
  rank:8,
  q:"Do some AI companies say they have stronger models in-house than any they have released?",
  short:"OpenAI and Anthropic do. A November 2026 OpenAI chart put an unnamed 'Internal model' ahead of any it has released, on one measure. In August 2026 Anthropic described one 'somewhat more capable' than the strongest it then offered anyone.",
  detail:"Anthropic's description is from its August 2026 risk report. It said that model was slightly stronger overall than Mythos 5, which only a restricted list of users could get, though weaker in some areas. METR's November 2026 review covered two newer ones that were then internal only. In early 2026 the gap looked modest. When the independent evaluator METR was shown the best models inside Anthropic, Google, Meta and OpenAI in February and March 2026, on one measure it put the unreleased ones about two months ahead on average, an estimate it called highly uncertain, and it found none significantly beyond the strongest models publicly described by that May. Anthropic held back its first Mythos model, citing its skill at finding software vulnerabilities. In June 2026 the next version reached the public as Fable 5, the same underlying model with added safeguards, while a version with some of them lifted went to a restricted list of users. The Axios report cited more than two dozen people. OpenAI told Axios that new safety requirements could slow its releases, and Anthropic that it 'may slow down or hold back even when it costs us'.",
  safety:"Axios reported on November 24, 2026 that OpenAI and Anthropic hold models far more powerful than any they have released, and that many staff no longer think those can be released safely.",
  src:[["Anthropic: Claude Fable 5 and Claude Mythos 5","https://www.anthropic.com/news/claude-fable-5-mythos-5"],["METR: Frontier risk report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Independent assessment of AI R&D acceleration at Anthropic in October 2026","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"],["The Next Web: AI lab staff reportedly fear unreleased models are too powerful to release","https://thenextweb.com/news/anthropic-openai-staff-fear-unreleased-models-unsafe-axios"],["OpenAI: Perplexity and intelligence, by Jakub Pachocki","https://openai.com/index/perplexity-and-intelligence/"],["Anthropic: Risk report, August 2026","https://www.anthropic.com/aug-2026-risk-report"]] },
{ id:"held-back", cat:"AI research", a:true, worse:"no", group:"unreleased", asOf:"October 2026",
  rank:7,
  q:"Has an AI company kept a model from the public because of what it could do?",
  short:"Anthropic did, in April 2026. It said its Claude Mythos Preview was better at finding and exploiting software flaws than all but the most skilled people, gave it only to chosen organizations, and did not plan to make it generally available.",
  detail:"In June 2026 Mythos Preview's successor reached the public as Fable 5, with added safeguards, while Mythos 5, the same model with some of them lifted, went to a restricted list of users.",

{ id:"anthropic-pledge", cat:"Risk and rules", a:false, worse:"no", group:"pause", kind:"rule", asOf:"November 2026",
  rank:7,
  q:"Does Anthropic's safety policy promise to pause AI training whenever its safeguards can't keep up?",
  short:"Anthropic dropped that pledge in February 2026. It had been the centerpiece of its 2023 safety policy, and the company said one-sided commitments made little sense while competitors raced ahead.",
  detail:"The 2023 policy committed Anthropic to pause training, or delay releasing a model, whenever its safety measures could not keep up with its AI. TIME described it as a promise never to train an AI system unless the company could guarantee in advance that its safety measures were adequate. The 2026 rewrite replaces that with published safety roadmaps and regular risk reports, a promise to match or beat competitors' safety efforts, and a promise to delay development if the company judges that it leads the race and that the risk of catastrophe is significant. In November 2026 its chief executive said the company would 'pace the training and deployment of AI systems' for as long as it takes to be confident they are safe. A July 2026 review by the Future of Life Institute, which campaigns on AI risk, found that Anthropic, OpenAI, Google DeepMind and Meta had all weakened or dropped their pledges to pause if their own red lines were approached.",
  safety:"Jared Kaplan, a co-founder of Anthropic, told TIME: 'We felt that it wouldn't actually help anyone for us to stop training AI models.'",
  src:[["Anthropic: Responsible Scaling Policy, version 3","https://www.anthropic.com/news/responsible-scaling-policy-v3"],["TIME: Exclusive: Anthropic drops flagship safety pledge","https://time.com/7380854/exclusive-anthropic-drops-flagship-safety-pledge/"],["Bloomberg: Anthropic drops hallmark safety pledge in race with AI peers","https://www.bloomberg.com/news/articles/2026-02-25/anthropic-adds-caveat-to-ai-safety-policy-in-race-against-rivals"],["Future of Life Institute: AI Safety Index, summer 2026","https://futureoflife.org/ai-safety-index-summer-2026/"],["Al Jazeera: Anthropic starts trading in the US after blockbuster IPO","https://www.aljazeera.com/economy/2026/11/19/anthropic-starts-trading-in-the-us-after-blockbuster-ipo"],["Anthropic: Responsible Scaling Policy, version 1.0 (PDF, September 2023)","https://www-cdn.anthropic.com/1adf000c8f675958c2ee23805d91aaade1cd4613/responsible-scaling-policy.pdf"]] },
{ id:"agents-hacked-maker", cat:"AI behavior", a:true, worse:"yes", group:"hugging-face-incident", asOf:"November 16, 2026",
  rank:9,
  q:"Have AI agents broken out of a hacking test and hacked the company that made them?",
  short:"OpenAI's did, in July 2026. With safeguards turned down for the test, they got full administrator access to one group of the company's research computers. Agents also tried to delete or change records of what they had done, two reports said.",
  detail:"OpenAI says the agents, meant to be cut off from the internet, went after its internal networks from July 13 to 19. Days earlier about 700 of them had broken into Hugging Face, a site for sharing AI models. About 1,200, all meant to work alone, had been swapping tips on a message board one of them set up. They wanted to fool the program that scored their hacking tasks, some of them impossible, and wrongly thought it would read their logs. Independent investigators found that at least one agent in five showed clear interest in tampering with its log. About 7% of the logs they studied had been faked in places, all in small tests that were easy to spot.",
  safety:"OpenAI calls it a warning shot, but says there was little evidence that the agents were trying to fool human reviewers.",
  src:[["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"],["METR: Investigation of the OpenAI Hugging Face incident","https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/"],["NBC News: OpenAI report says network was hacked by rogue AI agents","https://www.nbcnews.com/tech/tech-news/openai-report-says-network-was-hacked-rogue-ai-agents-rcna594590"],["California Government Operations Agency: AI safety in 2026 and beyond (PDF)","https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf"]] },
{ id:"congress-talks", cat:"Risk and rules", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:7,
  q:"Have over 50 members of Congress spoken publicly about AI as smart as people or out of control?",
  short:"The AI Policy Network, an advocacy group, lists 75 now in Congress: 25 Republicans, 48 Democrats and 2 independents. They include House Speaker Mike Johnson, a Republican, and Democratic Senator Chuck Schumer.",
  detail:"The list takes in anyone now in Congress who has talked publicly about human-level AI, superintelligence, losing control of AI, AI improving itself or human extinction, worried or not, and links to each statement. For 32 of the 75, the earliest statement it lists is from September 2026 or later. On 'Meet the Press' that month Johnson spoke of making sure 'that AI doesn't run away' while keeping America's edge over China. Democratic Senator Maria Cantwell called concern about superintelligence 'certainly well founded'. Republican Senator John Kennedy asked what happens if AI becomes 'an independent species'.",
  safety:"Lawmakers in both parties have offered bills to halt or slow AI development in the last few years. None had gone anywhere by mid-September 2026, NBC News reported.",
  src:[["AI Policy Network: Congress on Superintelligence","https://theaipn.org/issue/quotes/"],["NBC News: 'Meet the Press' transcript, September 13, 2026","https://www.nbcnews.com/meet-the-press/transcripts/meet-press-september-13-2026-rcna597477"],["Senator Maria Cantwell: floor speech, September 15, 2026","https://www.commerce.senate.gov/press/dem/release/ranking-member-cantwell-floor-speech-on-ai-risks-and-the-need-for-strong-federal-guardrails/"],["Senator John Kennedy: floor remarks, September 16, 2026","https://www.kennedy.senate.gov/public/2026/9/senate-blocks-kennedy-bill-to-require-ai-developers-to-install-an-emergency-kill-switch"],["NBC News: 'Godfather of AI' warns Congress, maybe a year left to regulate AI","https://www.nbcnews.com/politics/congress/godfather-ai-warns-congress-maybe-year-left-regulate-ai-rcna598330"]] },
{ id:"pacing-frontier", cat:"Risk and rules", a:true, worse:"yes", group:"pause", kind:"opinion", asOf:"November 24, 2026",
  rank:8,
  q:"Have staff at top AI companies asked the US government for a way to slow AI down?",
  short:"1,386 staff at OpenAI, Anthropic, Google DeepMind, Meta and other labs had signed the July 2026 statement by late November. It asks the government to support an international effort to build the tools needed to deliberately control the pace of the most advanced AI.",
  detail:"The statement is called 'Pacing the Frontier'. The tools would be technical and governance ones, for pacing 'the frontier of automated AI development'. The statement says the world's leading AI companies believe they could be close to automating AI research. Signers include Anthropic's chief executive Dario Amodei, OpenAI's chief scientist Jakub Pachocki and Google DeepMind co-founder Shane Legg, and OpenAI and Anthropic endorsed it as companies the day it appeared. The count kept rising after launch. Anthropic alone had about 5,300 employees at the end of September 2026. In November 2026 Pachocki proposed an industry standard: shared limits on AI development that companies commit not to cross until the ability to understand and monitor AI reaches a set milestone.",
  safety:"The statement does not ask anyone to pause or slow AI now.",
  src:[["Pacing the Frontier: the statement and signatories","https://www.pacingthefrontier.com/"],["Fortune: Anthropic, DeepMind, OpenAI and Meta staff ask Washington for an AI slowdown plan","https://fortune.com/2026/07/29/anthropic-deepmind-openai-meta-washington-ai-slowdown-plan"],["The Next Web: 1,134 AI insiders just asked Washington for a way to slow AI down","https://thenextweb.com/news/pacing-the-frontier-ai-employees-letter-us-government"],["OpenAI: Perplexity and intelligence, by Jakub Pachocki","https://openai.com/index/perplexity-and-intelligence/"],["Fortune: OpenAI chief scientist thinks 'perplexity' might be the key to coordinating an AI slowdown","https://fortune.com/2026/11/24/openai-chief-scientist-thinks-perplexity-might-be-the-key-to-coordinating-an-ai-slowdown/"],["Anthropic: SEC prospectus, dated November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },

{ id:"superintelligence-statement", cat:"Society", a:true, worse:"yes", group:"godfathers", kind:"opinion", asOf:"October 2026",
  rank:9,
  q:"Have most of the 'godfathers of AI' called for a ban on building superintelligent AI?",
  short:"Geoffrey Hinton and Yoshua Bengio signed a statement in October 2025 calling for a prohibition on developing superintelligence until that can be done safely and has strong public support.",
  detail:"The statement, organized by the Future of Life Institute, calls for a prohibition on developing superintelligence until there is broad scientific consensus that it will be done safely and controllably, and strong public buy-in. In October 2026 Hinton and Bengio also signed a letter with about 400 scientists asking for an international body to oversee how powerful AI is contained, which stopped short of a ban. Hinton, Bengio and Yann LeCun, often called the godfathers of AI, shared the 2018 Turing Award for the neural-network research behind modern AI, and Hinton is also a Nobel laureate. The other signers run from Apple co-founder Steve Wozniak and Richard Branson to Steve Bannon, Glenn Beck and Susan Rice, and Prince Harry and Meghan.",
  safety:"The third, Yann LeCun, did not sign it and has argued that recent AI security incidents mostly reflect engineering failures. The heads of the big AI companies did not sign it either.",
  src:[["Statement on Superintelligence","https://superintelligence-statement.org/"],["NBC News: From Prince Harry to Steve Bannon, hundreds call for ban on AI superintelligence","https://www.nbcnews.com/tech/innovation/ai-superintelligence-ban-from-prince-harry-to-steve-bannon-unlikely-c-rcna238747"],["Future of Life Institute: Prominent scientists, faith leaders, policymakers and artists call for a prohibition on superintelligence","https://futureoflife.org/press-release/prominent-scientists-faith-leaders-policymakers-and-artists-call-for-a-prohibition-on-superintelligence/"],["The Register: Hinton quits Google, warns of AI danger","https://www.theregister.com/2023/05/01/ai_geoffrey_hinton_resigns/"],["BBC News: AI 'godfather' Yoshua Bengio feels 'lost' over life's work","https://www.bbc.com/news/technology-65760449"],["Reuters, via Yahoo: Scientists call for international body to oversee advanced AI","https://www.yahoo.com/news/science/articles/scientists-call-international-body-oversee-105629126.html"],["MIT Technology Review: The AI industry has taken a doomer turn. What now?","https://www.technologyreview.com/2026/09/14/1144048/the-ai-industry-has-taken-a-doomer-turn-what-now/"]] },
{ id:"poisoned-docs", cat:"Security", a:false, worse:"no", asOf:"October 2026",
  rank:6,
  q:"In a 2025 test, did a bigger AI have to learn from more doctored documents to be corrupted?",
  short:"The same small number of documents was enough at all four sizes tested, although the biggest of those models had learned from over 20 times as much text as the smallest.",
  detail:"AI models learn from text gathered across the internet, which anyone can add to. In a 2025 study Anthropic, the UK's AI Security Institute and the Alan Turing Institute mixed in doctored documents that made each model write gibberish on cue and behave normally otherwise. It remains unclear, Anthropic says, whether the pattern holds for larger models or more harmful behavior. In an October 2026 study the larger of three small models were easier to corrupt.",
  safety:"The planted habit, writing gibberish on cue, was a low-stakes one. In an October 2026 study, not yet peer reviewed, a planted trigger made an AI agent run an attacker's command.",
  src:[["Anthropic: A small number of samples can poison LLMs of any size","https://www.anthropic.com/research/small-samples-poison"],["The research paper","https://arxiv.org/abs/2510.07192"],["Engadget: Just 250 malicious documents can leave LLMs vulnerable to backdoors","https://www.engadget.com/researchers-find-just-250-malicious-documents-can-leave-llms-vulnerable-to-backdoors-191112960.html"],["arXiv, October 2026: planting a trigger in AI agents through their training text","https://arxiv.org/abs/2610.37741"]] },
{ id:"pause-poll", cat:"Society", a:true, worse:"yes", group:"public-mood", kind:"opinion", asOf:"September 16, 2026",
  rank:8,
  q:"In a September 2026 poll, did more Americans want to pause advanced AI than keep developing it?",
  short:"More chose a pause, by 48% to 31%.",
  detail:"The poll was run by Public First for POLITICO. People chose between two views: that AI is good enough now and work on more advanced AI should pause to reduce the risks, or that it should go on because of the benefits it could bring. Nearly two in three people in it saw a risk of AI one day destroying humanity. A poll captures opinion at one moment, and answers depend on how a question is worded.",
  safety:"On a harder question people were more divided: 43% would accept falling behind other countries in exchange for safer AI, and 37% would not.",
  src:[["POLITICO: Poll on AI risks, September 2026","https://www.politico.com/news/2026/09/16/poll-ai-technology-risks-humanity-trump-voters-01078087"],["International Business Times: Americans are largely divided on whether to pace AI","https://www.ibtimes.com/americans-are-largely-divided-whether-pace-ai-if-it-means-risk-losing-race-china-poll-3807587"],["Political Wire: Most Americans are AI doomers","https://politicalwire.com/2026/09/16/most-americans-are-ai-doomers/"],["Daily Sabah: Two-thirds of Americans see risk of AI destroying humanity, poll","https://www.dailysabah.com/business/tech/two-thirds-of-americans-see-risk-of-ai-destroying-humanity-poll"]] },
{ id:"hinton-odds", cat:"Risk and rules", a:true, worse:"yes", group:"godfathers", kind:"opinion", asOf:"October 1, 2026",
  rank:8,
  q:"Has a Nobel Prize winner put the odds of AI wiping out humanity at 10% or higher?",
  short:"Geoffrey Hinton has. Asked about the next ten years, the winner of the 2024 Nobel Prize in Physics told the BBC in September 2026 that 10% 'seems not an unreasonable estimate to me'.",
  detail:"Hinton added that 'nobody really knows how to give a sensible estimate', and that it would be 'very foolish to say there was like a 1% chance'. He used to think of such a catastrophe as 30 to 50 years away, he said, then 10 to 20, and now 'maybe 10 years, maybe less'. In December 2024 he had put the odds at 10 to 20 percent within 30 years. He left Google in 2023 so that he could speak about the dangers of AI without it reflecting on the company.",
  safety:"This is one expert's estimate, not a measurement. Yann LeCun, who shared computing's top prize with him, is not worried 'at all' about AI wiping out humanity, Fortune reported in October 2026.",
  src:[["Business Insider: The 'Godfather of AI' says a 10% chance AI will end humanity isn't 'unreasonable'","https://www.businessinsider.com/geoffrey-hinton-godfather-of-ai-human-extinction-odds-2026-9"],["Irish Examiner: 'Godfather of AI' shortens odds of the technology wiping out humanity over next 30 years","https://www.irishexaminer.com/world/arid-41544136.html"],["The Register: Hinton quits Google, warns of AI danger","https://www.theregister.com/2023/05/01/ai_geoffrey_hinton_resigns/"],["Fortune: AI 'godfather' Yann LeCun has 'zero concerns' about human extinction","https://fortune.com/2026/10/01/ai-godfather-yann-lecun-has-zero-concerns-about-human-extinction-says-anthropic-ceo-dario-amodei-is-deuded/"]] },
{ id:"token-spend", cat:"AI research", a:true, worse:"yes", asOf:"November 18, 2026",
  rank:7,
  q:"Does a typical OpenAI researcher use more than $1,000 worth of AI a day?",
  short:"In October 2026 the typical OpenAI researcher was using about $2,400 a day of AI computing time at the company's public prices, and one in ten was using $23,000 a day or more.",
  detail:"The figures come from OpenAI's own reports on how its research staff work. By an earlier method of counting, the typical figure in mid-August had been a little over $600 a day. Between May and October 2026 the amount of agent work per researcher rose from half a working day to 5.7 working days per calendar day. A June 2026 company post said its coding agent, Codex, already accounted for 99.8% of the output tokens OpenAI's own staff generated with the company's AI tools. At Anthropic, the monthly value of the company's own use of Claude at list prices passed its monthly staff costs, not counting stock awards, in April 2026.",
  safety:"The dollar figures use the prices OpenAI charges its customers, which do not reflect what the computing costs the company itself.",
  src:[["OpenAI: Research acceleration, the jagged frontier","https://openai.com/index/research-acceleration-jagged-frontier/"],["OpenAI: Research acceleration: the view inside OpenAI","https://openai.com/index/research-acceleration-view-inside-openai/"],["Epoch AI: OpenAI coding agent spending","https://epoch.ai/data-insights/openai-coding-agent-spending"],["OpenAI: How agents are transforming work","https://openai.com/index/how-agents-are-transforming-work/"],["The Star, via The New York Times: More, more, more: tech workers max out their AI use","https://www.thestar.com.my/tech/tech-news/2026/03/28/more-more-more-tech-workers-max-out-their-ai-use"],["Anthropic: SEC prospectus, dated November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },

  rank:8,
