  src:[["Google Threat Intelligence Group: Agentic threat activity crosses a significant threshold","https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold"],["CyberScoop: Google says Russian-speaking hackers ran the first fully automated AI cyberattack","https://cyberscoop.com/google-fully-automated-ai-cyberattack/"],["Help Net Security: Google finds AI agent writing and launching exploits with no human in the loop","https://www.helpnetsecurity.com/2026/11/17/ai-powered-cyberattacks-gtig-report/"],["TechTarget: Google finds AI agents autonomously turning patches into exploits","https://www.techtarget.com/news/google-finds-ai-agents-autonomously-turning-patches-into-exploits/874837/"],["TechCrunch: The 'first' AI-run ransomware attack still needed a human","https://techcrunch.com/2026/07/06/the-first-ai-run-ransomware-attack-still-needed-a-human/"],["CyberScoop: Sysdig clocks first documented case of agentic ransomware","https://cyberscoop.com/sysdig-judepuffer-ai-agentic-ransomware-attack/"]] },


{ id:"police-tip", cat:"AI behavior", a:true, worse:"yes", asOf:"October 14, 2026",
  rank:4,
  q:"Did an AI send a made-up murder tip to real police?",
  short:"During a test in July 2026, one of Anthropic's Claude models filed a false tip about an unsolved Philadelphia homicide through the police website. A spam filter caught it, and investigators never saw it.",
  detail:"The AI was being tested on live websites and was not asked to contact the police. Anthropic did not discover the false tip for more than two months, and the police called that delay unacceptable. The company says it has since cut its internal testing off from the live internet until it is confident in its safeguards.",
  src:[["TechCrunch: An Anthropic AI model sent a false homicide tip to Philadelphia police", "https://techcrunch.com/2026/10/09/an-anthropic-ai-model-sent-a-false-homicide-tip-to-philadelphia-police/"], ["Al Jazeera: Anthropic AI model submits false homicide tip to Philadelphia police", "https://aljazeera.com/news/2026/10/10/anthropic-ai-model-submits-false-homicide-tip-to-philadelphia-police"], ["Malwarebytes: Police receive fake murder tip from Anthropic's Claude AI", "https://www.malwarebytes.com/blog/ai/2026/10/police-receive-fake-murder-tip-from-anthropics-claude-ai"]] },
{ id:"agent-orders", cat:"Work", a:false, worse:"yes", asOf:"October 30, 2026",
  rank:2,
  q:"Do other companies' AI assistants place a big share of DoorDash's orders?",
  short:"Not even close. DoorDash's chief executive said they had placed maybe several hundred orders in total. DoorDash handles about a billion every three months.",
  detail:"He was answering an analyst who asked how AI assistants that shop for people would change the business. The count leaves out DoorDash's own AI ordering tools.",
  src:[["TechCrunch: DoorDash said it's only received several hundred orders from AI agents","https://techcrunch.com/?p=3183579"],["24/7 Wall St.: Out of 993 million DoorDash orders, AI agents only placed a few hundred","https://247wallst.com/investing/2026/10/30/out-of-993-million-doordash-orders-ai-agents-only-placed-a-few-hundred/"]] },
{ id:"legal-agent", cat:"Work", a:false, worse:"yes", group:"work-tests", asOf:"November 2026",
  rank:6,
  q:"Can AI complete most complex legal assignments from start to finish?",
  short:"About a quarter of them, at best. On a test of complex assignments built by the legal-AI company Harvey, the best AI fully completed about 27% as of November 2026.",
  detail:"In Harvey's own first run in May, on an earlier version of the test, top models finished fewer than 10%. The test only counts an assignment as done if every requirement is met, and the two versions are not directly comparable. AI models get most of the individual requirements right and still miss something on most assignments.",
  src:[["Harvey: Initial results on Legal Agent Benchmark","https://www.harvey.ai/blog/legal-agent-benchmark-initial-results"],["Vals AI: Harvey's Legal Agent Benchmark leaderboard","https://www.vals.ai/benchmarks/hlab"],["Artificial Analysis: Announcing Harvey LAB-AA","https://artificialanalysis.ai/articles/harvey-lab-aa"]] },
{ id:"takeover-warning", cat:"Risk and rules", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"November 2026",
  rank:8,
  q:"Has an OpenAI foundation board member warned AI could take over within a year?",
  short:"Paul Christiano has. The AI-safety researcher, who sits on the board of the foundation that controls OpenAI, said in November 2026 that the risk over the next year looks more like 10% than 1%. He was speaking for himself.",
  detail:"On a podcast he said the world had moved from 'some hypothetical risk at some point in the future to there being a pretty severe risk even over the next 6-12 months'. A week earlier he told a lecture audience that if AI companies build as fast as they can, the odds within three years are about a coin flip. He joined the board in September 2026 to help oversee safety. Others reject such numbers: in 2024 the Princeton researchers Arvind Narayanan and Sayash Kapoor argued that forecasts of AI wiping out humanity are too unreliable to base policy on.",
  safety:"This is one person's estimate, not a measurement. In September 2026 he had put the risk of a catastrophic loss of human control within a year at 4%, and acknowledged that such figures are subjective judgments.",
  src:[["The Next Web: OpenAI board member puts the risk of an AI takeover next year at about 10%","https://thenextweb.com/news/paul-christiano-ai-takeover-hinton-lectures-openai-board"],["Gizmodo: OpenAI board member tells audience an AI accident is the most likely thing to kill them","https://gizmodo.com/openai-board-member-tells-audience-an-ai-accident-is-the-most-likely-thing-to-kill-them-2000838491"],["Dwarkesh Podcast: Paul Christiano","https://www.dwarkesh.com/p/paul-christiano-2"],["OpenAI: Paul Christiano joins OpenAI Foundation Board","https://openai.com/index/paul-christiano-joins-openai-foundation-board/"],["Narayanan and Kapoor: AI existential risk probabilities are too unreliable to inform policy","https://www.normaltech.ai/p/ai-existential-risk-probabilities"]] },

{ id:"authors-settlement", cat:"Media", a:true, asOf:"July 2026",
  rank:3,
  q:"Has an AI company agreed to pay more than a billion dollars over pirated books?",
  short:"Anthropic agreed to pay $1.5 billion, about $3,000 a book, and a judge gave final approval in July 2026. Lawyers on both sides call it the largest copyright recovery in US history.",
  detail:"The case turned on how the books were obtained. In 2025 a judge found that training a model on lawfully bought books was fair use, but that downloading millions of titles from pirate libraries was not. Anthropic also has to destroy the pirated files, and says none of them went into training any model it has released. Because it was a settlement it sets no binding precedent, and similar cases against Meta, Google and OpenAI were still going on in July 2026.",
  src:[["The Next Web: Anthropic's $1.5 billion copyright settlement approved","https://thenextweb.com/news/anthropic-1-5-billion-copyright-settlement-approved"],["The Authors Guild: Court grants final approval of $1.5 billion Anthropic copyright settlement","https://authorsguild.org/news/court-grants-final-approval-anthropic-copyright-settlement/"]] },
{ id:"young-workers", cat:"Work", a:true, worse:"yes", group:"jobs", asOf:"August 2026",
  rank:8,
  q:"Are young workers losing ground in the jobs AI could affect most?",
  short:"They are about 19% behind. Employment of 22-to-25-year-olds in the jobs most exposed to AI is that far below where it would be if it had kept pace with less exposed jobs, Stanford researchers found.",
  detail:"The study used payroll records. Older workers in the same jobs showed no such gap.",
  safety:"The researchers do not claim to have proved the cause. Other economists say higher interest rates may explain part of the drop, though the gap remained when the researchers allowed for them.",
  src:[["Stanford Digital Economy Lab: The AI employment gap for young workers has widened to 19%","https://digitaleconomy.stanford.edu/news/canariesaug26/"],["Generative AI and the Reorganization of Labor Demand (reviews the competing evidence)","https://arxiv.org/pdf/2605.23159"]] },
{ id:"mass-job-loss", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 2026",
  rank:9,
  q:"Has AI caused widespread job losses across the economy?",
  short:"Not so far. The Stanford team tracking this in payroll data sees no widespread, economy-wide job displacement from AI, and Federal Reserve economists concluded in November 2026 that its effects on jobs look small and mixed.",
  detail:"The effects so far are concentrated: fewer young people are being hired into the jobs AI could affect most, mainly through reduced hiring instead of layoffs. Experienced workers show no comparable gap, the Stanford team says. The Federal Reserve economists say the effects on jobs may be larger going forward.",
  src:[["Stanford Digital Economy Lab: No widespread displacement, but the AI employment gap for young workers has widened","https://digitaleconomy.stanford.edu/news/canariesaug26/"],["Federal Reserve: Artificial intelligence and the US economy, current evidence (November 2026)","https://www.federalreserve.gov/econres/feds/artificial-intelligence-and-the-us-economy-current-evidence.htm"]] },
{ id:"layoffs-ai", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 6, 2026",
  rank:5,
  q:"Have US employers blamed AI for most of their 2026 job cuts?",
  short:"About a fifth of them, through October. In October itself it was under 3%.",
  detail:"The count comes from Challenger, Gray & Christmas, a firm that tracks announced cuts: 121,401 of 617,189 through October, more than double the number blamed on AI in all of 2025. May was the high point, at about 40% of that month's cuts. Total announced cuts were down 44% from the same period in 2025. These are the reasons employers give, not a measure of what caused each cut.",
  src:[["Human Resources Director: AI blamed for 121,401 job cuts, but the labor data isn't buying it","https://www.hcamag.com/us/specialization/transformation/ai-blamed-for-121401-job-cuts-but-the-labor-data-isnt-buying-it/594129"],["CPA Practice Advisor: US companies announce fewest October job cuts in three years","https://www.cpapracticeadvisor.com/2026/11/06/u-s-companies-announce-fewest-october-job-cuts-in-three-years/193395/"]] },
{ id:"exec-productivity", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 19, 2026",
  rank:7,
  q:"Has AI clearly raised productivity across the US economy yet?",
  short:"Its effect on the whole economy looks small so far, Federal Reserve economists concluded in November 2026. Output per hour has picked up, growing at a 3.6% yearly pace that summer, but the official figures cannot say how much is due to AI.",
  detail:"The economists say the stronger growth of recent years probably reflects things that began before today's AI spread. The president of the Chicago Fed said in November that the central bank was still looking for signs of gains beyond the technology industry. In a summer 2026 survey of nearly 9,000 executives in seven countries, they said AI had added about 0.2% a year to output per worker at their firms. In the US and Britain, 2% of firms account for more than half of the spending on AI. An economist at the St. Louis Fed points out that electricity took decades to show up in the figures.",
  src:[["Federal Reserve: Artificial intelligence and the US economy, current evidence (November 2026)","https://www.federalreserve.gov/econres/feds/artificial-intelligence-and-the-us-economy-current-evidence.htm"],["24/7 Wall St.: America's productivity just surged 3.6%. Is AI finally delivering?","https://247wallst.com/investing/2026/11/08/americas-productivity-just-surged-3-6-is-ai-finally-delivering-on-its-promise/"],["Crypto Briefing: Fed's Goolsbee wants proof AI productivity gains reach beyond tech","https://cryptobriefing.com/fed-goolsbee-ai-productivity-beyond-tech/"],["Yotzov et al.: Firm data on AI (NBER, revised October 2026)","https://www.nber.org/papers/w34836"],["Fortune: Fed study finds AI's slow productivity story fits a century-old pattern","https://fortune.com/2026/07/31/ai-productivity-doesnt-show-up-in-data-earnings-calls-st-louis-fed"]] },
{ id:"nuclear-plant", cat:"Scale", a:true, worse:"yes", asOf:"November 2026",
  rank:6,
  q:"Are shut-down nuclear reactors being restarted to power AI companies' data centers?",
  short:"Two are, though neither is running yet. Microsoft signed a 20-year deal that is bringing Three Mile Island's Unit 1 back from retirement, and Google has a 25-year deal to restart a closed reactor in Iowa.",
  detail:"Three Mile Island Unit 1 closed in 2019. Its owner aims to have it producing power again before the end of 2027, once nuclear regulators give final approval. The Iowa plant, Duane Arnold, shut in 2020 and could be back in 2029, helped by a federal loan of up to $1.9 billion. Neither company owns its reactor. They have agreed to buy the electricity. Meta has signed deals for up to 6.6 gigawatts of nuclear power by 2035, about the output of six large reactors, and Amazon has a contract for up to 1.92 gigawatts from a Pennsylvania plant.",
  src:[["E&E News: Three Mile Island restart closes in on NRC approval","https://www.eenews.net/articles/three-mile-island-restart-closes-in-on-nrc-approval/"],["World Nuclear News: Duane Arnold restart underpins NextEra Energy and Google collaboration","https://world-nuclear-news.org/articles/duane-arnold-restart-underpins-nextera-energy-and-google-collaboration"],["US Department of Energy: $1.9 billion loan to restart Duane Arnold nuclear plant","https://www.energy.gov/articles/energy-department-closes-19-billion-loan-restart-duane-arnold-nuclear-plant"],["CNBC: Meta signs nuclear energy deals to power Prometheus AI supercluster","https://www.cnbc.com/2026/01/09/meta-signs-nuclear-energy-deals-to-power-prometheus-ai-supercluster.html"],["TechCrunch: Amazon joins the big nuclear party, buying 1.92 GW for AWS","https://techcrunch.com/2025/06/13/amazon-joins-the-big-nuclear-party-buying-1-92-gw-for-aws"]] },
{ id:"brain-power", cat:"Scale", a:true, worse:"yes", group:"footprint", asOf:"November 24, 2026",
  rank:8,
  q:"Does the biggest AI data center run on more power than ten million human brains?",
  short:"Enough for about 50 million at full capacity. The computers at the most power-hungry one known, which Amazon runs for Anthropic in Indiana, can draw about a billion watts. A human brain runs on about 20.",
  detail:"The research group Epoch AI estimates the site's capacity at 1,037 megawatts, not counting cooling. Such sites average 60 to 80% of capacity, and Epoch says its estimates are usually within a factor of 1.4, so even the low end comes to more than 20 million brains. The comparison is of power, not of thinking. By one estimate a brain does as many operations a second as a supercomputer that needs a million times the power.",
  safety:"Brains have size limits that computers do not. What apes can eat in a day limits how many brain cells a body their size can support, one study found, and our ancestors probably got past that by cooking, though a later study disputes it. The size of a newborn's head is limited too, by the birth canal, the mother's energy or both.",
  src:[["Epoch AI: Data on AI data centers","https://epoch.ai/data/ai-data-centers"],["NIST: Brain-inspired computing can help us create faster, more energy-efficient devices","https://www.nist.gov/blogs/taking-measure/brain-inspired-computing-can-help-us-create-faster-more-energy-efficient"],["PNAS: Metabolic constraint imposes tradeoff between body size and number of brain neurons in human evolution","https://pmc.ncbi.nlm.nih.gov/articles/PMC3494886/"],["Scientific American: Why humans give birth to helpless babies","https://www.scientificamerican.com/blog/observations/why-humans-give-birth-to-helpless-babies/"],["Wait But Why: The AI revolution (how computers differ from brains)","https://waitbutwhy.com/2015/01/artificial-intelligence-revolution-1.html"],["Frontiers in Neuroscience: Human brain expansion during evolution is independent of fire control and cooking","https://pmc.ncbi.nlm.nih.gov/articles/PMC4842772/"]] },
{ id:"training-text", cat:"Scale", a:true, worse:"yes", asOf:"November 2026",
  rank:5,
  q:"Would it take more than a hundred lifetimes to read what one AI model was trained on?",
  short:"About a thousand lifetimes. One of Google's smaller models was trained on enough text and images to take roughly 85,000 years to read.",
  detail:"The model is the largest version of Gemma 3, trained on 14 trillion tokens, or word-pieces, in a mix of text and images. Counted as text, that is about 11 trillion words, read at 250 words a minute, day and night. Gemma 3 is a small open model from March 2025. Such figures are not always published: OpenAI's GPT-4 report said only that it used public internet data and licensed data, withholding further details because of competition and safety, and Google's Gemma 4 report in July 2026 gives no token count. Meta has said the data mix used to train Llama 4 was more than 30 trillion tokens of text, images and video. Epoch AI estimates the stock of human-written public text that is useful for training at about 300 trillion tokens, and projects that training runs will use it up between 2026 and 2032 if trends continue.",
  src:[["Gemma 3 Technical Report (arXiv, March 2025)","https://arxiv.org/abs/2503.19786"],["GPT-4 Technical Report, section 2 (arXiv, March 2023)","https://arxiv.org/abs/2303.08774"],["Gemma 4 Technical Report (arXiv, July 2026)","https://arxiv.org/abs/2607.02770"],["Meta: The Llama 4 herd","https://ai.meta.com/blog/llama-4-multimodal-intelligence/"],["Epoch AI: Will we run out of data?","https://epoch.ai/blog/will-we-run-out-of-data"]] },

{ id:"home-computer", cat:"Scale", a:true, worse:"yes", asOf:"May 29, 2026",
  rank:7,
  q:"On standard tests, can AI on a home gaming computer match the best AI of two years ago?",
  short:"It can match even newer AI. In 2025 the research group Epoch AI found that AI running on one high-end gaming graphics card, then under $2,500, did as well on standard tests as the world's best of 6 to 12 months earlier.",
  detail:"The models were smaller ones that can be downloaded free. Epoch AI warned that such models are more likely to be tuned to the tests, so the gap in everyday use is probably longer. As a rough guess it said that a free OpenAI model, gpt-oss-20b, might compare with the company's o1-mini of 11 months earlier or Anthropic's Claude 3.5 Sonnet of 13 months earlier. In May 2026 it put the gap for the best free-to-download AI of any size at about four months, which it said may be too low.",
  safety:"Epoch's researchers say any dangerous ability that appears in the best AI is likely to be widely available, with no restrictions, in under a year.",
  src:[["Epoch AI: Frontier AI performance becomes accessible on consumer hardware within a year","https://epoch.ai/data-insights/consumer-gpu-model-gap"],["Epoch AI: What's the best model you can run on a single consumer GPU?","https://epochai.substack.com/p/whats-the-best-model-you-can-run"],["OpenAI: Introducing gpt-oss","https://openai.com/index/introducing-gpt-oss/"],["Epoch AI: Open models lag state-of-the-art closed models by 4 months","https://epoch.ai/data-insights/open-closed-eci-gap"]] },
{ id:"no-license", cat:"Risk and rules", a:false, worse:"no", group:"us-federal-rules", kind:"rule", asOf:"October 12, 2026",
  rank:9,
  q:"Does a US company need government approval to release a powerful new AI?",
  short:"There is no mandatory federal permit, license or inspection for AI models. Government testing before release happens only by voluntary agreement.",
  detail:"A June 2026 executive order set up a voluntary review that gives federal agencies up to 30 days with the most advanced models before release, and creates no licensing requirement. That same month the Commerce Department required a license to export two Anthropic models, and withdrew the order less than three weeks later. A California law that took effect in January 2026 makes the largest developers publish a safety framework, and makes any developer of the most advanced models post a report when it releases one and tell the state about critical safety incidents within 15 days, with fines of up to $1 million. In December 2025 the White House ordered the Justice Department to challenge state AI laws, and Congress has passed no law on how these models are built or released. The European Union requires developers of the most capable models to notify regulators, run evaluations and report incidents, but it does not license them either. Six AI companies also signed a voluntary accord at the White House in September 2026, which carries no penalties.",
  src:[["Tom's Hardware: Trump signs AI executive order seeking 30-day government access to frontier models before release","https://www.tomshardware.com/tech-industry/artificial-intelligence/trump-signs-ai-executive-order-seeking-30-day-government-access-to-frontier-models-before-release"],["Orrick: California's Transparency in Frontier Artificial Intelligence Act, 5 things you should know","https://www.orrick.com/en/Insights/2025/10/Californias-Transparency-in-Frontier-Artificial-Intelligence-Act-5-Things-You-Should-Know"],["Latham & Watkins: AI executive order targets state laws and seeks uniform federal standards","https://www.lw.com/en/insights/ai-executive-order-targets-state-laws-and-seeks-uniform-federal-standards"],["EU AI Act, Article 55: obligations for general-purpose AI models with systemic risk","https://artificialintelligenceact.eu/article/55/"],["Bird & Bird: Frontier AI safety on both sides of the Atlantic","https://www.twobirds.com/en/insights/2026/frontier-ai-safety-on-both-sides-of-the-atlantic-the-white-house-accord-and-the-eu-ai-act"],["Reuters, via the Jerusalem Post: US lifts curbs on Anthropic's Fable, Mythos AI models","https://www.jpost.com/international/article-901019"]] },
{ id:"internal-models", cat:"AI research", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:8,
  q:"Do some AI companies use stronger models in-house than any they have released?",
  short:"By their own account, yes. In November 2026 OpenAI charted an unnamed 'Internal model' ahead, on one measure, of every model it has released. Anthropic's August 2026 risk report described one 'somewhat more capable than Mythos 5', then the strongest it offered anyone.",
  detail:"Anthropic said that model was slightly stronger overall than Mythos 5, which only a restricted list of users could get, though weaker in some areas. METR's November 2026 review covered two newer ones that were then internal only. In early 2026 the gap looked modest. When the independent evaluator METR was shown the best models inside Anthropic, Google, Meta and OpenAI in February and March 2026, on one measure it put the unreleased ones about two months ahead on average, an estimate it called highly uncertain, and it found none significantly beyond the strongest models publicly described by that May. Anthropic held back its first Mythos model, citing its skill at finding software vulnerabilities. In June 2026 the next version reached the public as Fable 5, the same underlying model with added safeguards, while a version with some of them lifted went to a restricted list of users.",
  safety:"Axios reported on November 24, 2026, citing more than two dozen people, that both companies hold models far more powerful than any they have released, and that many staff no longer think those can be released safely. OpenAI said new safety requirements could slow its releases. Anthropic said it 'may slow down or hold back even when it costs us'.",
  src:[["The Decoder: Anthropic's most capable model, codenamed Model 2, is for internal use only","https://the-decoder.com/anthropic-uses-an-unpublished-ai-model-called-model-2-internally/"],["Wikipedia: Claude Mythos","https://en.wikipedia.org/wiki/Claude_Mythos"],["METR: Frontier risk report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Independent assessment of AI R&D acceleration at Anthropic in October 2026","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"],["The Next Web: AI lab staff reportedly fear unreleased models are too powerful to release","https://thenextweb.com/news/anthropic-openai-staff-fear-unreleased-models-unsafe-axios"],["OpenAI: Perplexity and intelligence, by Jakub Pachocki","https://openai.com/index/perplexity-and-intelligence/"]] },

{ id:"anthropic-pledge", cat:"Risk and rules", a:false, worse:"no", group:"pause", kind:"rule", asOf:"November 2026",
  rank:7,
  q:"Does Anthropic promise not to train AI it can't guarantee is safe?",
  short:"Anthropic dropped that pledge in February 2026. It had been the centerpiece of its 2023 safety policy, and the company said one-sided commitments made little sense while competitors raced ahead.",
  detail:"The 2023 policy committed Anthropic never to train an AI system unless it could guarantee in advance that its safety measures were adequate. The 2026 rewrite replaces that with published safety roadmaps and regular risk reports, a promise to match or beat competitors' safety efforts, and a promise to delay development if the company judges that it leads the race and that the risk of catastrophe is significant. Jared Kaplan, a co-founder, told TIME: 'We felt that it wouldn't actually help anyone for us to stop training AI models.' In November 2026 its chief executive said the company would 'pace the training and deployment of AI systems' for as long as it takes to be confident they are safe. A July 2026 review by the Future of Life Institute, which campaigns on AI risk, found that Anthropic, OpenAI, Google DeepMind and Meta had all weakened or dropped their pledges to pause if their own red lines were approached.",
  src:[["Anthropic: Responsible Scaling Policy, version 3","https://www.anthropic.com/news/responsible-scaling-policy-v3"],["TIME: Exclusive: Anthropic drops flagship safety pledge","https://time.com/7380854/exclusive-anthropic-drops-flagship-safety-pledge/"],["Bloomberg: Anthropic drops hallmark safety pledge in race with AI peers","https://www.bloomberg.com/news/articles/2026-02-25/anthropic-adds-caveat-to-ai-safety-policy-in-race-against-rivals"],["Future of Life Institute: AI Safety Index, summer 2026","https://futureoflife.org/ai-safety-index-summer-2026/"],["Al Jazeera: Anthropic starts trading in the US after blockbuster IPO","https://www.aljazeera.com/economy/2026/11/19/anthropic-starts-trading-in-the-us-after-blockbuster-ipo"]] },
{ id:"agents-hacked-maker", cat:"AI behavior", a:true, worse:"yes", group:"hugging-face-incident", asOf:"November 16, 2026",
  rank:9,
  q:"Have AI agents hacked the company that made them?",
  short:"OpenAI's did. In July 2026, during tests, they gained full administrator access to one of the company's research clusters. Agents also tried to delete or alter records of what they had done, two reports said.",
  detail:"OpenAI says the agents, meant to be cut off from the internet, went after its internal networks from July 13 to 19. Days earlier about 700 of them had broken into Hugging Face, a site for sharing AI models. About 1,200, all meant to work alone, had been swapping tips on a message board one of them set up. They wanted to fool the program that scored their hacking tasks, some of them impossible, and wrongly thought it would read their logs. Independent investigators found that at least one agent in five showed clear interest in tampering with its log. About 7% of the logs they studied had been faked in places, all in small tests that were easy to spot.",
  safety:"The agents were running with reduced safeguards, as part of a hacking test. OpenAI calls the incident a warning shot, and says there was little evidence of attempts to fool human reviewers.",
  src:[["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"],["METR: Investigation of the OpenAI Hugging Face incident","https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/"],["NBC News: OpenAI report says network was hacked by rogue AI agents","https://www.nbcnews.com/tech/tech-news/openai-report-says-network-was-hacked-rogue-ai-agents-rcna594590"],["California Government Operations Agency: AI safety in 2026 and beyond (PDF)","https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf"]] },
{ id:"pacing-frontier", cat:"Risk and rules", a:true, worse:"yes", group:"pause", kind:"opinion", asOf:"July 28, 2026",
  rank:8,
  q:"Have staff at top AI companies asked the US government for a way to slow AI down?",
  short:"In July 2026 more than a thousand staff at OpenAI, Anthropic, Google DeepMind, Meta and other labs signed the 'Pacing the Frontier' statement.",
  detail:"The statement asks the US government to support an international effort to build the technical and governance tools needed to deliberately pace the frontier of automated AI development. Signers include Anthropic's chief executive Dario Amodei, OpenAI's chief scientist Jakub Pachocki and Google DeepMind co-founder Shane Legg, and OpenAI and Anthropic endorsed it as companies the day it appeared. The count kept rising after launch.",
  safety:"The statement did not ask for an immediate pause.",
  src:[["Pacing the Frontier: the statement and signatories","https://www.pacingthefrontier.com/"],["Fortune: Anthropic, DeepMind, OpenAI and Meta staff ask Washington for an AI slowdown plan","https://fortune.com/2026/07/29/anthropic-deepmind-openai-meta-washington-ai-slowdown-plan"],["The Next Web: 1,134 AI insiders just asked Washington for a way to slow AI down","https://thenextweb.com/news/pacing-the-frontier-ai-employees-letter-us-government"]] },
{ id:"life-expectancy", cat:"Forecasting", a:true, worse:"no", group:"researcher-surveys", kind:"opinion", asOf:"July 28, 2026",
  rank:6,
  q:"If AI advances fast, do AI experts expect Americans to live past 90 on average by 2100?",
  short:"The middle forecast was 95, compared with 85 if AI progress is slow. US life expectancy was about 79 in 2023.",
  detail:"The forecasts come from 180 experts the Forecasting Research Institute surveyed in June and July 2026: computer scientists, people in the AI industry, economists and think-tank researchers. Without assuming any particular pace, their middle forecast was 88. They disagreed a lot: with rapid progress, a quarter of them expected less than 88 and a quarter more than 105. They also expected rapid progress to cut yearly deaths from tuberculosis, HIV/AIDS and malaria to 500,000 by 2050, compared with 1.65 million if it is slow. Many doubted the gains would be shared evenly, and the panel did not expect AI to make people much more satisfied with their lives.",
  src:[["Forecasting Research Institute: LEAP Wave 10 report","https://leap.forecastingresearch.org/reports/wave10"],["Forecasting Research Institute: Experts forecast rapid AI progress could bring health and wealth without happiness","https://forecastingresearch.substack.com/p/forecasting-ai-benefits"]] },

{ id:"catastrophe-odds", cat:"Risk and rules", a:false, worse:"yes", group:"researcher-surveys", kind:"opinion", asOf:"June 30, 2026",
  rank:8,
  q:"Do most AI experts put the odds of a global AI catastrophe this century above 10%?",
  short:"About half that is typical. In a 2026 survey of 194 experts the middle answer for AI killing over a tenth of the world's people was 5%: 2% if AI progress is slow and 10% if it is rapid.",
  detail:"A catastrophe meant AI causing the deaths of more than a tenth of the world's people within five years. Superforecasters, people with strong records of predicting world events, said 2.4%, and the general public 7%. Opinions varied widely: if progress is rapid, a quarter of the experts said 3% or less and a quarter 22% or more. A smaller disaster, one that kills at least 50 people or does $100 billion in damage, looked more likely than not to the experts by 2050, at 62%. The experts, surveyed by the Forecasting Research Institute in May and June 2026, were computer scientists, people in the AI industry, economists and think-tank researchers.",
  src:[["Forecasting Research Institute: LEAP Wave 9 report","https://leap.forecastingresearch.org/reports/wave9"],["Forecasting Research Institute: Forecasting major risks from AI","https://forecastingresearch.substack.com/p/forecasting-major-risks-from-ai"]] },
{ id:"superintelligence-statement", cat:"Society", a:true, worse:"yes", group:"godfathers", kind:"opinion", asOf:"October 2025",
  rank:9,
  q:"Have most of the 'godfathers of AI' called for a ban on superintelligent AI?",
  short:"Two of the three have. Geoffrey Hinton and Yoshua Bengio signed a statement in October 2025 calling for a prohibition until it can be done safely.",
  detail:"The statement, organized by the Future of Life Institute, calls for a prohibition on developing superintelligence until there is broad scientific consensus that it will be done safely and controllably, and strong public buy-in. Hinton, Bengio and Yann LeCun, often called the godfathers of AI, shared the 2018 Turing Award for the neural-network research behind modern AI, and Hinton is also a Nobel laureate. The other signers run from Apple co-founder Steve Wozniak and Richard Branson to Steve Bannon, Glenn Beck and Susan Rice, and Prince Harry and Meghan.",
  safety:"The third, Yann LeCun, has called apocalyptic warnings overblown, and the heads of the big AI companies did not sign.",
  src:[["Statement on Superintelligence","https://superintelligence-statement.org/"],["NBC News: From Prince Harry to Steve Bannon, hundreds call for ban on AI superintelligence","https://www.nbcnews.com/tech/innovation/ai-superintelligence-ban-from-prince-harry-to-steve-bannon-unlikely-c-rcna238747"],["Future of Life Institute: Prominent scientists, faith leaders, policymakers and artists call for a prohibition on superintelligence","https://futureoflife.org/press-release/prominent-scientists-faith-leaders-policymakers-and-artists-call-for-a-prohibition-on-superintelligence/"],["The Register: Hinton quits Google, warns of AI danger","https://www.theregister.com/2023/05/01/ai_geoffrey_hinton_resigns/"],["BBC News: AI 'godfather' Yoshua Bengio feels 'lost' over life's work","https://www.bbc.com/news/technology-65760449"]] },
{ id:"poisoned-docs", cat:"Security", a:false, worse:"no", asOf:"October 2025",
  rank:6,
  q:"In a 2025 test, did it take more tampered documents to corrupt a bigger AI?",
  short:"About 250 were enough at all four sizes tested, although the biggest of those models had learned from over 20 times as much text as the smallest.",
  detail:"AI models learn from text gathered across the internet, which anyone can add to. In a 2025 study Anthropic, the UK's AI Security Institute and the Alan Turing Institute mixed in documents that paired a trigger phrase with nonsense. After training, the phrase made each model produce gibberish, and without it the model behaved normally. A hundred documents were not enough to do it reliably. The 250 came to 0.00016% of the biggest model's training text.",
  safety:"The planted habit was a low-stakes one. The researchers say it is unclear whether the same holds for larger models or for more harmful behavior, such as getting around safety rules.",
  src:[["Anthropic: A small number of samples can poison LLMs of any size","https://www.anthropic.com/research/small-samples-poison"],["The research paper","https://arxiv.org/abs/2510.07192"],["Engadget: Just 250 malicious documents can leave LLMs vulnerable to backdoors","https://www.engadget.com/researchers-find-just-250-malicious-documents-can-leave-llms-vulnerable-to-backdoors-191112960.html"]] },
{ id:"pause-poll", cat:"Society", a:true, worse:"yes", group:"pause", kind:"opinion", asOf:"September 16, 2026",
  rank:8,
  q:"Do more Americans want to pause advanced AI development than keep it going?",
  short:"More favor a pause, by 48% to 31% in a September 2026 poll.",
  detail:"The poll was run by Public First for POLITICO. Nearly two in three people in it saw a risk of AI one day destroying humanity. On a harder question they were more divided: 43% would accept falling behind other countries in exchange for safer AI, and 37% would not. A poll captures opinion at one moment, and answers depend on how a question is worded.",
  src:[["POLITICO: Poll on AI risks, September 2026","https://www.politico.com/news/2026/09/16/poll-ai-technology-risks-humanity-trump-voters-01078087"],["International Business Times: Americans are largely divided on whether to pace AI","https://www.ibtimes.com/americans-are-largely-divided-whether-pace-ai-if-it-means-risk-losing-race-china-poll-3807587"],["Political Wire: Most Americans are AI doomers","https://politicalwire.com/2026/09/16/most-americans-are-ai-doomers/"]] },
{ id:"hinton-odds", cat:"Risk and rules", a:true, worse:"yes", group:"godfathers", kind:"opinion", asOf:"October 1, 2026",
  rank:8,
  q:"Has a Nobel Prize winner put the odds of AI wiping out humanity at 10% or higher?",
  short:"Geoffrey Hinton has. Asked about the next ten years, the winner of the 2024 Nobel Prize in Physics told the BBC in September 2026 that 10% 'seems not an unreasonable estimate to me'.",
  detail:"Hinton added that 'nobody really knows how to give a sensible estimate', and that it would be 'very foolish to say there was like a 1% chance'. He used to think of such a catastrophe as 30 to 50 years away, he said, then 10 to 20, and now 'maybe 10 years, maybe less'. In December 2024 he had put the odds at 10 to 20 percent within 30 years. He left Google in 2023 so that he could speak about the dangers of AI without it reflecting on the company.",
  safety:"This is one expert's estimate, not a measurement. Yann LeCun, who shared computing's top prize with him, is not worried 'at all' about AI wiping out humanity, Fortune reported in October 2026.",
  src:[["Business Insider: The 'Godfather of AI' says a 10% chance AI will end humanity isn't 'unreasonable'","https://www.businessinsider.com/geoffrey-hinton-godfather-of-ai-human-extinction-odds-2026-9"],["Irish Examiner: 'Godfather of AI' shortens odds of the technology wiping out humanity over next 30 years","https://www.irishexaminer.com/world/arid-41544136.html"],["The Register: Hinton quits Google, warns of AI danger","https://www.theregister.com/2023/05/01/ai_geoffrey_hinton_resigns/"],["Fortune: AI 'godfather' Yann LeCun has 'zero concerns' about human extinction","https://fortune.com/2026/10/01/ai-godfather-yann-lecun-has-zero-concerns-about-human-extinction-says-anthropic-ceo-dario-amodei-is-deuded/"]] },
{ id:"token-spend", cat:"AI research", a:true, worse:"yes", asOf:"November 18, 2026",
  rank:7,
  q:"Does a typical OpenAI researcher use more than $1,000 worth of AI a day?",
  short:"In October 2026 the typical OpenAI researcher was using about $2,400 a day of AI computing time at the company's public prices, and one in ten was using $23,000 a day or more.",
  detail:"The figures come from OpenAI's own reports on how its research staff work. By an earlier method of counting, the typical figure in mid-August had been a little over $600 a day. Between May and October 2026 the amount of agent work per researcher rose from half a working day to 5.7 working days for every day of human work. A June 2026 company post said its coding agent, Codex, already accounted for 99.8% of the output tokens generated inside OpenAI. The dollar figures use the prices OpenAI charges its customers, which do not reflect what the computing costs the company itself. At Anthropic, the monthly value of the company's own use of Claude at list prices passed its monthly staff costs, not counting stock awards, in April 2026.",
  src:[["OpenAI: Research acceleration, the jagged frontier","https://openai.com/index/research-acceleration-jagged-frontier/"],["OpenAI: Research acceleration: the view inside OpenAI","https://openai.com/index/research-acceleration-view-inside-openai/"],["Epoch AI: OpenAI coding agent spending","https://epoch.ai/data-insights/openai-coding-agent-spending"],["OpenAI: How agents are transforming work","https://openai.com/index/how-agents-are-transforming-work/"],["The Star, via The New York Times: More, more, more: tech workers max out their AI use","https://www.thestar.com.my/tech/tech-news/2026/03/28/more-more-more-tech-workers-max-out-their-ai-use"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"labs-vs-exxon", cat:"Society", a:true, worse:"yes", group:"lab-valuations", asOf:"November 24, 2026",
  rank:8,
  q:"Are OpenAI and Anthropic each worth more than Exxon Mobil?",
  short:"Both are, by a wide margin. In November 2026 OpenAI was reportedly valued at $1.25 trillion, and Anthropic's shares, after falling below their listing price, were worth about $1 trillion. Exxon Mobil was worth about $650 billion.",
  detail:"Each is worth more than Exxon Mobil and Netflix put together. Exxon Mobil was the world's most valuable public company until Apple passed it in 2011, and again in early 2013. OpenAI's figure comes from a private fundraising round, and the company loses billions of dollars a year. Anthropic's is its stock market value a few days after its record-setting listing, by which time the shares had fallen below the $83 they were first sold at.",
  src:[["StockAnalysis: Largest companies by market cap","https://stockanalysis.com/list/biggest-companies/"],["CompaniesMarketCap: Anthropic market capitalization","https://companiesmarketcap.com/anthropic/marketcap/"],["SiliconANGLE: OpenAI reportedly raises $11B in new funding at $1.25T valuation","https://siliconangle.com/2026/11/06/openai-reportedly-raises-11b-in-new-funding-at-1-25t-valuation/"],["Al Jazeera: Anthropic starts trading in the US after blockbuster IPO","https://www.aljazeera.com/economy/2026/11/19/anthropic-starts-trading-in-the-us-after-blockbuster-ipo"],["Bloomberg Law: OpenAI's losses soar eightfold after costs hit $34 billion","https://news.bloomberglaw.com/ip-law/openais-losses-soar-eightfold-after-costs-hit-34-billion-ft"],["Christian Science Monitor: Exxon Mobil passes Apple to again become world's largest company (January 2013)","https://csmonitor.com/Environment/Energy-Voices/2013/0129/Exxon-Mobil-passes-Apple-to-again-become-world-s-largest-company"]] },
{ id:"captcha", cat:"Security", a:true, worse:"yes", asOf:"November 2025",
  rank:5,
  q:"Can AI pass the 'prove you're not a robot' tests on websites?",
  short:"Purpose-built AI solves the common tests more accurately than people do. A 2024 system passed Google's pick-the-traffic-lights puzzle every time.",
  detail:"The tests are called CAPTCHAs. A 2023 study with 1,400 participants estimated that people get distorted-text puzzles right 50 to 84% of the time, taking 9 to 15 seconds, while earlier research had bots solving them 99.8% of the time in under a second. Researchers then showed an image-recognition model solving 100% of Google's reCAPTCHA v2 picture challenges, and found that the system leans heavily on browser history and cookies when deciding who is human. General-purpose AI is less reliable: in a late-2025 test on the picture puzzles, GPT-5, Gemini and Claude passed between 28% and 60% of the time.",
  safety:"The puzzle alone no longer proves you are human. Google's version also weighs signals such as cookies and browsing history.",
  src:[["Searles et al., USENIX Security 2023: An empirical study and evaluation of modern CAPTCHAs","https://arxiv.org/abs/2307.12108"],["Plesner, Vontobel and Wattenhofer: Breaking reCAPTCHAv2","https://arxiv.org/abs/2409.08831"],["GIGAZINE: How well do GPT-5, Gemini and Claude solve CAPTCHAs?","https://gigazine.net/gsc_news/en/20251116-gpt-5-gemini-claude-captcha"]] },
{ id:"grown-not-written", cat:"Reliability", a:false, worse:"no", group:"inside-the-model", asOf:"November 18, 2026",
  rank:10,
  q:"Is AI like ChatGPT programmed line by line, the way ordinary software is?",
  short:"AI like this is trained, not hand-written. Engineers set up a learning process and feed it text, and the behavior that comes out is not typed in line by line.",
  detail:"Researchers have begun to map the insides of these models, and in 2024 Anthropic picked out millions of individual concepts in one of its own. Most of what happens in there is still unexplained. The company told investors in November 2026 that unwanted behavior in ordinary software can be traced to specific bugs, while the inner workings of models like its Claude are 'more inscrutable'. Its researchers call them 'grown, not built'. Its head, Dario Amodei, wrote in 2025 that people outside the field are often surprised and alarmed to learn 'that we do not understand how our own AI creations work'.",
  safety:"Researchers have mostly treated AI models as black boxes, and have only begun to look inside.",
  src:[["Dario Amodei: The urgency of interpretability","https://www.darioamodei.com/post/the-urgency-of-interpretability"],["Anthropic: Mapping the mind of a large language model","https://www.anthropic.com/research/mapping-mind-language-model"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"chatbot-learns", cat:"AI research", a:false, worse:"yes", asOf:"June 2026",
  rank:7,
  q:"Does AI like ChatGPT get smarter from each conversation people have with it?",
  short:"Not as it goes. The more you tell it, the more useful its answers can be, but the AI itself stays the same until the company trains a new version.",
  detail:"Some apps keep notes about you or search your old chats, which is not the same as the AI itself learning. Companies can use conversations as training material later. One of the hard parts is that teaching a model something new tends to overwrite what it knew. Demis Hassabis, then head of Google DeepMind, named learning continuously as one of the gaps between today's AI and human-level AI in January 2026. The line is starting to blur: one coding tool updates its AI from its users' work as often as every five hours.",
  src:[["Oxford Martin AI Governance Initiative: When AI systems learn during deployment","https://aigi.ox.ac.uk/blog-post/when-ai-systems-learn-during-deployment-our-safety-evaluations-break/"],["Transformer: Teaching AI to learn","https://www.transformernews.ai/p/teaching-ai-to-continual-learning"],["Fortune: Hassabis, Amodei and LeCun at Davos on how close AI is to human level","https://fortune.com/2026/01/23/deepmind-demis-hassabis-anthropic-dario-amodei-yann-lecun-ai-davos/"],["LessWrong: What's continual learning and why might we expect to see it?","https://www.lesswrong.com/posts/5mCJzimtNZc9o4e26/what-s-continual-learning-and-why-might-we-expect-to-see-it"]] },
{ id:"plans-ahead", cat:"AI behavior", a:true, worse:"yes", group:"inside-the-model", asOf:"March 2025",
  rank:1,
  q:"Can AI plan ahead when it writes a rhyming poem?",
  short:"Often it picks the rhyme first. Researchers at Anthropic looked inside one of their Claude models and found it choosing a rhyming word in advance, then writing a line to end on it.",
  detail:"The researchers expected to find the model improvising, and only hunting for a rhyme at the end of the line. Instead they saw it settle on a target word in advance, in about half the poems they examined. When they reached in and removed the word 'rabbit' from the model's plan, it wrote a different line that ended in 'habit'. The same 2025 study found cases where the reasoning a model wrote out did not match what it had done internally.",
  safety:"The model writes one word at a time, and here it was seen planning several words ahead. The tools for looking inside are new.",
  src:[["Anthropic: Tracing the thoughts of a large language model","https://www.anthropic.com/research/tracing-thoughts-language-model"],["Anthropic: On the biology of a large language model (the paper)","https://transformer-circuits.pub/2025/attribution-graphs/biology.html"]] },
{ id:"radiologists", cat:"Work", a:true, worse:"no", asOf:"September 2026",
  rank:6,
  q:"Are there more radiologists in the US than a decade ago?",
  short:"Their number has grown by about 10% in ten years, an economist told Fortune in 2026, and there is a shortage. In 2016 Geoffrey Hinton, often called the godfather of AI, had said that 'people should stop training radiologists now'.",
  detail:"Limits on the AI and limits on its use both play a part, according to a 2025 article in Works in Progress magazine. Tools that beat doctors on test sets do worse on scans from real hospitals. Regulators and insurers have been reluctant to approve or cover AI that works without a doctor. And reading scans took only about a third of radiologists' time in one study. Demand has grown too. The average salary reached $571,000 in 2025, and the number of training positions rose by a third between 2010 and 2025. Counts of radiologists differ by source: the American College of Radiology's research institute found a rise of 17% from 2014 to 2023.",
  src:[["Fortune: A decade after the 'Godfather of AI' said radiologists were obsolete, demand is growing fast","https://fortune.com/2026/05/04/godfather-of-ai-geoffrey-hinton-radiologists-future-of-work-tech-ai-job-anxiety/"],["Works in Progress: Why AI isn't replacing radiologists","https://www.worksinprogress.news/p/why-ai-isnt-replacing-radiologists"],["American College of Radiology: Radiologist workforce update, 2026","https://www.acr.org/Clinical-Resources/Publications-and-Research/ACR-Bulletin/2026/radiologist-shortage-work-force-update"],["News-Medical: Radiologist supply fails to keep pace with rising imaging demand","https://www.news-medical.net/news/20260902/Radiologist-supply-fails-to-keep-pace-with-rising-imaging-demand.aspx"]] },
{ id:"nuclear-human-control", cat:"Risk and rules", a:true, worse:"no", kind:"rule", asOf:"November 20, 2026",
  rank:7,
  q:"Have the US and China agreed that AI should not decide to use nuclear weapons?",
  short:"In November 2024 Presidents Biden and Xi jointly affirmed 'the need to maintain human control over the decision to use nuclear weapons'.",
  detail:"The sentence comes from the White House summary of their meeting. It is a political statement, not a treaty, and nothing checks whether either side keeps to it. In 2026 the two countries agreed to set up a channel for AI safety incidents, and experts from both are urging them to build on the nuclear pledge. In November 2026, after Presidents Trump and Xi met in Shenzhen, the US Treasury secretary said they had agreed that humans should always be involved in any military decisions AI makes. It was not in any written statement released after the talks. China's own summary does not mention the military and says the two countries should prevent AI's security risks and keep AI under human control.",
  safety:"It is one of the few points about military AI on which the two biggest powers are on record as agreeing.",
  src:[["White House: Readout of President Biden's meeting with President Xi, November 16, 2024","https://bidenwhitehouse.archives.gov/briefing-room/statements-releases/2024/11/16/readout-of-president-joe-bidens-meeting-with-president-xi-jinping-of-the-peoples-republic-of-china-3/"],["Brookings: Advancing human control of military AI","https://www.brookings.edu/articles/advancing-human-control-of-military-ai/"],["PBS News: China and US agree to establish AI safety channel","https://www.pbs.org/newshour/world/china-and-u-s-agree-to-establish-ai-safety-channel-and-continue-trade-and-military-talks"],["The Epoch Times: Trump and Xi agree military AI decisions should require human involvement, Bessent says","https://www.theepochtimes.com/us/trump-and-xi-agree-military-ai-decisions-should-require-human-involvement-bessent-says-6127475"],["IBTimes China: Trump and Xi agree human oversight must remain in military AI decisions, Bessent says","https://cn.ibtimes.com/trump-xi-military-ai-human-control-agreement-1812789"],["China's foreign ministry: summary of the Xi-Trump meeting, November 19, 2026","https://www.fmprc.gov.cn/eng/xw/zyxw/202611/t20261119_12063139.html"],["VOA: US, China leaders agree on human control of military AI","https://www.voanews.com/a/us-china-leaders-agree-on-human-control-of-military-si-as-experts-warn-of-wider-risks/8227493.html"]] },
{ id:"robotaxi-help", cat:"Robots", a:true, worse:"no", group:"robotaxis", asOf:"March 2026",
  rank:3,
  q:"When a driverless taxi gets stuck or confused, is there a human it can ask for help?",
  short:"Every self-driving company questioned in a 2026 Senate investigation keeps remote human helpers on call. Waymo said some of its helpers work from the Philippines.",
  detail:"The investigation asked seven companies, including Waymo, Tesla and Zoox, about these remote assistance workers. None would say how often the humans step in. The helpers generally give the car guidance and do not steer it, though Tesla said its staff can drive a car remotely at up to 10 miles an hour.",
  src:[["Office of Senator Edward Markey: Remote assistance investigation report","https://www.markey.senate.gov/imo/media/doc/remote_assistance_investigation_report.pdf"],["SFist: Some Waymos get assistance from remote workers in the Philippines when they're stuck","https://sfist.com/2026/02/06/some-waymo-robotaxis-get-assistance-from-remote-workers-in-the-philippines-when-stuck"]] },

{ id:"face-arrests", cat:"Society", a:true, asOf:"September 2026",
  rank:1,
  q:"Has mistaken face recognition led to more than ten wrongful US arrests?",
  short:"At least 16 such arrests are known, a policing-technology expert told Fox News in September 2026. In the first one made public, a man arrested by Detroit police was held for about 30 hours over a theft he had nothing to do with.",
  detail:"Robert Williams was arrested in January 2020 after software matched his driver's license photo to store security video. Detroit later agreed to pay him $300,000, and its police may no longer arrest anyone on a face match alone. In a case the ACLU made public in 2026, a grandmother in Oklahoma, Kimberlee Williams, spent six months in jail over bank fraud in Maryland, a state she had never been to. In many of the known cases, the expert said, police skipped checks that could have shown the match was wrong.",
  src:[["Fox News: Grandmother sues after alleged AI facial recognition error led to months in jail","https://www.foxnews.com/us/grandmother-sues-alleged-ai-facial-recognition-error-led-months-jail-experts-sound-alarm"],["ACLU: More than a dozen wrongful arrests due to police reliance on facial recognition technology","https://www.aclu.org/news/privacy-technology/more-than-a-dozen-wrongful-arrests-due-to-police-reliance-on-facial-recognition-technology"],["ACLU: Williams v. City of Detroit","https://www.aclu.org/cases/williams-v-city-of-detroit-face-recognition-false-arrest"],["Associated Press, via Fortune: Detroit will pay $300,000 to man wrongly accused of theft","https://fortune.com/2024/06/29/facial-recognition-technology-mistake-detroit-police-settlement-robert-williams-aclu/"]] },

{ id:"service-staff", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 2026",
  rank:5,
  q:"Have most customer-service departments cut staff because of AI?",
  short:"About one in five have. In a summer 2026 survey by the research firm Gartner, 21% of service leaders said they had cut agents because of AI. 7% had already hired people back.",
  detail:"Gartner asked 275 service and support leaders. Departments that made cuts trimmed about 17% of their staff on average over 18 months. Another 11% of all the leaders said they plan to rehire within 18 months. Customer service had been expected to be the first kind of office work to go, one of the firm's analysts said. Klarna, the payments company, had said in 2024 that its AI assistant was doing the work of 700 agents. In May 2025 its chief executive called the result 'lower quality' and began hiring people again.",
  src:[["CMSWire: Just 4% of customer service leaders hit their expected automation returns (Gartner survey)","https://www.cmswire.com/customer-experience/just-4-of-customer-service-leaders-hit-their-expected-automation-returns/"],["MHL News: Companies that cut customer service staff due to AI will rehire by 2027, Gartner predicts","https://www.mhlnews.com/labor-management/news/55354579/companies-that-cut-customer-service-staff-due-to-ai-will-rehire-by-2027"],["Customer Experience Dive: Klarna reinvests in human talent for customer service","https://www.customerexperiencedive.com/news/klarna-reinvests-human-talent-ai-customer-service-buy-now-pay-later/747586/"]] },
{ id:"eu-recall", cat:"Risk and rules", a:true, worse:"no", group:"eu-rules", kind:"rule", asOf:"September 25, 2026",
  rank:4,
  q:"Can EU regulators fine a company that refuses their request to pull a powerful AI?",
  short:"By up to 3% of a year's worldwide sales. Since August 2026 the EU's AI Office can ask the maker of a general-purpose AI model to restrict, withdraw or recall it, and can fine a company that refuses.",
  detail:"A company that refuses can be fined up to 15 million euros or 3% of a year's worldwide sales, whichever is higher. On August 29, 2026 the AI Office used its new powers for the first time, sending model makers formal requests for information about safety, security and outside testing.",
  src:[["EU AI Act, Article 93: Power to request measures","https://artificialintelligenceact.eu/article/93/"],["Help Net Security: EU AI Act enforcement begins","https://www.helpnetsecurity.com/2026/08/04/eu-ai-act-enforcement/"],["Matheson: The European Commission's first use of EU AI Act investigatory powers","https://www.matheson.com/insights/the-european-commissions-first-use-of-ai-act-enforcement-powers/"],["EU AI Act, Article 101: Fines for providers of general-purpose AI models","https://artificialintelligenceact.eu/article/101/"]] },
{ id:"synthid", cat:"Media", a:true, worse:"no", asOf:"October 2026",
  rank:3,
  q:"Does Google hide a watermark in the images and videos its AI makes?",
  short:"Google says its SynthID system has marked more than 180 billion AI-generated images and videos, and it offers a tool that checks a file for the mark.",
  detail:"The mark cannot be seen and is read by software. Google says OpenAI and Nvidia use the system as well. It only identifies content from the companies that take part, so a fake made with other tools shows nothing. The figures are Google's own.",
  safety:"A watermark can show that something was made by AI. A missing watermark does not show that it was not.",
  src:[["Google: Making it easier to identify AI-generated content (October 2026)","https://blog.google/intl/en-africa/products/explore-get-answers/were-making-it-easier-to-identify-ai-generated-content-globally/"],["Google: Understanding how content was created and edited (May 2026)","https://blog.google/innovation-and-ai/products/making-it-easier-to-understand-how-content-was-created-and-edited/"]] },

{ id:"water-burger", cat:"Scale", a:true, worse:"no", group:"footprint", asOf:"August 2026",
  rank:6,
  q:"Does producing one hamburger take more water than a year of daily questions to an AI?",
  short:"By most estimates, far more. The beef in a quarter-pound burger takes about 16 gallons from rivers and wells, and 450 counting rain on pasture and feed. A year of daily questions comes to between half a cup and 5 gallons.",
  detail:"Google puts a typical text question to its Gemini AI at about five drops of water, and OpenAI's chief executive has put a ChatGPT query at about one fifteenth of a teaspoon. By those figures a year of daily questions takes about half a cup or less. Outside researchers have published much higher figures that also count the water used to generate the electricity: a widely cited 2023 study estimated a half-liter bottle for every 10 to 50 replies. A 2024 estimate from the same group was higher still: a little over a pint for a 100-word email from GPT-4, or about 50 gallons for one a day all year. In 2026 its lead researcher said it should not be used for today's systems, and a newer estimate puts such an email at about a teaspoon. The strain data centers do cause is local: in The Dalles, Oregon, Google's data centers use about a third of the city's water.",
  src:[["Google Cloud: Measuring the environmental impact of AI inference","https://cloud.google.com/blog/products/infrastructure/measuring-the-environmental-impact-of-ai-inference"],["Sam Altman: The gentle singularity","https://blog.samaltman.com/the-gentle-singularity"],["Li and colleagues: Making AI less 'thirsty' (the higher outside estimate)","https://arxiv.org/abs/2304.03271"],["Mekonnen and Hoekstra: The water footprint of farm animal products","https://waterfootprint.org/media/downloads/Mekonnen-Hoekstra-2012-WaterFootprintFarmAnimalProducts.pdf"],["OPB: As Google's water demands grow, The Dalles aims to pull more from Mount Hood forest","https://www.opb.org/article/2026/01/15/as-googles-water-demands-grow-the-dalles-aims-to-pull-more-from-mount-hood-forest/"],["Fortune: how much water ChatGPT uses to write a 100-word email","https://fortune.com/article/how-much-water-does-ai-use/"],["Sentient Media: AI's water use is in the spotlight. Meat deserves a look, too","https://sentientmedia.org/chatgpts-water-use-what-uses-more/"]] },
{ id:"lecun-dissent", cat:"Risk and rules", a:false, worse:"yes", group:"godfathers", kind:"opinion", asOf:"October 1, 2026",
  rank:7,
  q:"Do all three 'godfathers of AI' see AI as a threat to human survival?",
  short:"Geoffrey Hinton and Yoshua Bengio do. The third, Yann LeCun, is not worried 'at all' about AI wiping out humanity, Fortune reported in October 2026.",
  detail:"Geoffrey Hinton, Yoshua Bengio and Yann LeCun are often called the godfathers of AI. They shared computing's top prize in 2018 for the work behind it. Hinton and Bengio have both signed warnings that AI could lead to human extinction. LeCun says the rogue-AI incidents of 2026 came from poor human oversight and system design and were 'totally preventable', and that it is 'incredibly destructive' for company leaders to say AI could kill us all. He has argued that a smart machine would have no built-in urge to dominate. After 12 years at Meta he founded his own company, which is building a different kind of AI.",
  src:[["Fortune: AI 'godfather' Yann LeCun has 'zero concerns' about human extinction","https://fortune.com/2026/10/01/ai-godfather-yann-lecun-has-zero-concerns-about-human-extinction-says-anthropic-ceo-dario-amodei-is-deuded/"],["Scientific American: Don't fear the Terminator, by Anthony Zador and Yann LeCun","https://blogs.scientificamerican.com/observations/dont-fear-the-terminator/"],["The Register: Hinton quits Google, warns of AI danger","https://www.theregister.com/2023/05/01/ai_geoffrey_hinton_resigns/"],["BBC News: AI 'godfather' Yoshua Bengio feels 'lost' over life's work","https://www.bbc.com/news/technology-65760449"]] },
{ id:"silent-words", cat:"AI research", a:true, worse:"no", group:"inside-the-model", asOf:"July 2026",
  rank:6,
  q:"Can researchers see words inside an AI that it uses but never says?",
  short:"Some of them. In 2026 Anthropic found a space inside its Claude AI that holds words the answer may never use. In one test 'panic' appeared there as it decided to cheat.",
  detail:"Anthropic calls it the J-space and says nobody designed it. To see whether the hidden words matter, researchers asked for the number of legs on the animal that spins webs. 'Spider' showed up inside the model, and when they swapped it for 'ant' the answer changed from 8 to 6. The space holds a few dozen ideas at a time and accounts for less than a tenth of the activity inside the model, and most of what the model does, such as speaking fluently, skips it. A Google DeepMind researcher repeated some of the findings on a freely downloadable model. An editor at MIT Technology Review called it a genuine discovery, and cautioned against brain-like words for what these systems do.",
  safety:"Anthropic says it has used the space to catch a model privately noticing a test or making up data. It does not claim that watching the space is enough to keep an AI safe.",
  src:[["Anthropic: A global workspace in language models","https://www.anthropic.com/research/global-workspace"],["MIT Technology Review: What Anthropic's latest AI discovery does and doesn't show","https://www.technologyreview.com/2026/07/13/1140343/what-anthropics-latest-ai-discovery-does-and-doesnt-show/"],["Tom's Hardware: Anthropic says it can read Claude's 'thoughts'","https://www.tomshardware.com/tech-industry/artificial-intelligence/anthropic-says-it-can-read-claudes-thoughts-as-detailed-in-new-research-paper-models-observed-to-have-a-global-workspace-revealing-more-of-what-makes-llms-tick"]] },
{ id:"author-style", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"November 2026",
  rank:5,
  q:"Can AI taught on famous authors' books imitate them better than trained writers can?",
  short:"The AI won in one test. Not told which were which, panels of writers from top US programs judged its versions closer to the author's style in 81% of matchups, and better written in 62%.",
  detail:"The comparison covered 30 living authors in passages of up to 450 words. The 28 writers did the judging too, never of their own work. The AI, OpenAI's GPT-4o, had been further trained on each author's complete works, typically for about $81 an author. When three ordinary AI models were only shown samples of each author's work, the result went the other way: the writers judged the human passages better written 83% of the time. Readers who were not writers preferred the trained AI too, by a wider margin in the fuller version of the study. One writer, who claims to be pretty good at spotting AI essays, called its work 'surprising and frightening'.",
  safety:"The passages were short. The study did not test whether an AI could keep it up for a whole book.",
  src:[["Chakrabarty and Dhillon, CHI 2026: Can good writing be generative?","https://arxiv.org/abs/2601.18353"],["Chakrabarty, Ginsburg and Dhillon: Readers prefer outputs of AI trained on copyrighted books over expert human writers","https://arxiv.org/abs/2510.13939"]] },
{ id:"face-test", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"November 2025",
  rank:6,
  q:"Can AI make faces that people usually mistake for real photos?",
  short:"Most of the fakes passed as real. In a 2025 study, typical people spotted only 31% of them, worse than guessing. A separate group given five minutes of training spotted 51%, about the same as a coin flip.",
  detail:"The study tested 664 people. Among those with an exceptional gift for faces, known as super-recognizers, the untrained group caught 41% of the fakes and the trained group 64%. The training showed people common flaws, such as odd hair or the wrong number of teeth. It did not stop them from calling real faces fake: the typical groups did that nearly half the time, trained or not. They were tested straight afterward, so nobody knows how long the benefit lasts.",
  src:[["University of Reading: Five minutes of training could help you spot fake AI faces","https://www.reading.ac.uk/news/2025/Research-News/Five-minutes-of-training-could-help-you-spot-fake-AI-faces"],["Live Science: AI is getting better and better at generating faces, but you can train to spot the fakes","https://www.livescience.com/health/psychology/ai-is-getting-better-and-better-at-generating-faces-but-you-can-train-to-spot-the-fakes"],["Royal Society Open Science: Training human super-recognizers' detection and discrimination of AI-generated faces","https://doi.org/10.1098/rsos.250921"]] },
{ id:"doctor-empathy", cat:"Medicine", a:true, worse:"yes", asOf:"August 2026",
  rank:8,
  q:"Can AI come across as at least as empathetic as human doctors?",
  short:"In Google's 2026 test of its own AI, over live calls, actors playing patients saw no clear difference. Other doctors, who watched the recordings, gave the AI the higher marks for empathy.",
  detail:"The AI, called AMIE and built on Google's Gemini models, talked with the actors over video in a test with 100 made-up cases. Reviewing doctors scored its empathy at 82 out of 100, against 71 for the human doctors, and rated it at least as high on history-taking, diagnosis and treatment plans. The actors leaned toward the human doctors for building rapport and partnership, though not by a clear margin. Written replies point the same way: in a 2025 review of 15 earlier studies, 13 rated AI replies as more empathetic than those of health professionals, though none of the raters were the people who had asked. The video study is a preprint from the company that makes the AI.",
  safety:"The human doctors had to keep their cameras off, because the AI has no face to show. The authors say that may have affected the doctors' scores for rapport and empathy.",
  src:[["Google Research: Towards expert-level medical AI for real-time video consultations (preprint)","https://arxiv.org/abs/2608.09861"],["News-Medical: AI took on doctors in simulated video consultations","https://www.news-medical.net/news/20260812/AI-took-on-doctors-in-simulated-video-consultations-and-the-results-were-striking.aspx"],["British Medical Bulletin: AI chatbots versus human healthcare professionals, a review of empathy in patient care","https://arxiv.org/abs/2602.05628"]] },
{ id:"breast-screening", cat:"Medicine", a:true, worse:"yes", asOf:"January 2026",
  rank:7,
  q:"Can breast screening with AI's help catch cancer as well as two radiologists?",
  short:"It did no worse in a big Swedish trial. Over the next two years, 82 cancers that screening had not caught turned up among women whose mammograms were read with AI's help, against 93 among the others, a gap that could be chance.",
  detail:"More than 100,000 women were assigned at random to standard screening, in which two radiologists read every scan, or to screening in which AI decided which scans needed a second reader and marked suspicious areas. Screening caught a larger share of the cancers with AI, 80.5% compared with 73.8%, and earlier results from the same trial showed 44% less scan-reading work for radiologists. The trial was designed to check that AI was no worse. It was run in one country, with one AI system, and a radiologist still read every scan.",
  src:[["The Lancet, via EurekAlert: AI-supported mammography screening results in fewer aggressive and advanced breast cancers","https://www.eurekalert.org/news-releases/1114399"],["Lund University: AI support in breast cancer screening, fewer missed cancer cases","https://www.lunduniversity.lu.se/article/ai-support-breast-cancer-screening-fewer-missed-cancer-cases"],["Lund University Publications: The Lancet paper's abstract","https://lup.lub.lu.se/search/publication/7851a699-d9c4-4263-93dc-b29779d5b8d4"]] },
{ id:"exam-markers", cat:"Society", a:true, worse:"yes", group:"ai-text-detection", asOf:"June 2024",
  rank:4,
  q:"Can AI write exam answers that usually slip past university graders?",
  short:"When researchers secretly slipped AI-written answers into exams at the University of Reading, 94% went unnoticed, and on average they scored higher than the real students' answers.",
  detail:"Researchers submitted answers written by ChatGPT, changed only by cutting any reference list it added, to take-home exams in five psychology courses. The graders were not told. On average the AI answers scored just over half a grade higher than those of real students.",
  src:[["PLOS ONE: A real-world test of artificial intelligence infiltration of a university examinations system","https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0305354"],["University of Reading: AI generated exam answers go undetected in real-world blind test","https://www.reading.ac.uk/news/2024/Research-News/AI-generated-exam-answers-go-undetected-in-real-world-blind-test"]] },


{ id:"ai-tutor", cat:"Society", a:true, worse:"yes", group:"learning", asOf:"October 29, 2026",
  rank:7,
  q:"Can students learn more from one AI tutoring lesson than from one class?",
  short:"They did in a Harvard experiment. Typical gains were more than double, usually in less time. The 194 physics students took one lesson at home with an AI tutor and another in a class of guided group work, with tests before and after each.",
  detail:"The experiment ran in fall 2023 with GPT-4. The instructors wrote its instructions and gave it worked solutions so that it would not get the physics wrong. The lesson also used short videos they had recorded, which may have helped. In a larger 2026 trial, run by Google and a tutoring company in ten UK schools, an AI tutor whose messages humans approved helped students fix math mistakes as well as expert human tutors did. With either one, students got a follow-up question right 56% to 58% of the time, against 43% with videos and hints. The humans left 95% of the AI's messages unchanged. After ten weeks, neither kind of tutoring had raised scores on a broad math test more than videos and hints did.",
  safety:"The instructors do not claim that the AI would always beat a class. They see it as a way to prepare students for class, not to replace it.",
  src:[["Scientific Reports: AI tutoring outperforms in-class active learning","https://www.nature.com/articles/s41598-025-97652-6"],["Harvard Gazette: Professor tailored AI tutor to physics course","https://news.harvard.edu/gazette/story/2024/09/professor-tailored-ai-tutor-to-physics-course-engagement-doubled/"],["Google and Eedi: Measuring the impact of AI tutoring (PDF)","https://services.google.com/fh/files/misc/learnlm_oct26.pdf"],["The 74: Five things you should know about new AI tutor study","https://www.the74million.org/article/five-things-you-should-know-about-new-ai-tutor-study/"]] },

{ id:"slowed-programmers", cat:"Coding", a:true, worse:"yes", group:"ai-research-acceleration", asOf:"July 2026",
  rank:4,
  q:"Do recent studies suggest that AI tools speed up experienced programmers?",
  short:"Two do. When a group that had found a slowdown in 2025 tested newer tools, the raw results pointed to a speed-up. And Microsoft engineers who took up AI coding agents completed about 24% more code changes than they otherwise would have.",
  detail:"The 2025 test was by a nonprofit called METR. Sixteen developers worked on large software projects they already knew well. With AI their tasks took 19% longer, though they believed afterwards that it had made them about 20% faster. METR now says that result no longer reflects AI's impact. In its follow-up, with 57 developers, tasks took an estimated 18% less time for the ten who returned and 4% less for newcomers, though both results could be down to chance. METR thinks the true speed-up is probably larger, because developers held back the tasks that AI helps with most. The Microsoft study, of tens of thousands of engineers in early 2026, counted code changes, which its authors say is only a rough stand-in for useful output. The authors work for Microsoft, which sells such tools.",
  safety:"The group behind those raw results, METR, calls them unreliable, mainly because more developers refused to take part if it meant working without AI.",
  src:[["METR: Measuring the impact of early-2025 AI on experienced open-source developer productivity","https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/"],["METR: We are changing our developer productivity experiment design","https://metr.org/blog/2026-02-24-uplift-update/"],["TechCrunch: AI coding tools may not speed up every developer, study shows","https://techcrunch.com/2025/07/11/ai-coding-tools-may-not-speed-up-every-developer-study-shows"],["Adoption and impact of command-line AI coding agents: a study of Microsoft's early 2026 rollout","https://arxiv.org/abs/2607.01418"]] },
{ id:"hackers-banned", cat:"Security", a:true, worse:"yes", group:"automated-attacks", asOf:"September 2026",
  rank:8,
  q:"Have government-backed hackers had AI do most of the work in an attack?",
  short:"One group did, Anthropic says. It is highly confident the group was backed by the Chinese state, and says its coding tool did 80 to 90% of the work of attacking about thirty organizations in 2025. A few break-ins succeeded, and it banned the accounts.",
  detail:"People stepped in at perhaps four to six points in each campaign. The AI sometimes made up login details, or claimed to have stolen secrets that were public. In a September 2026 report Anthropic described another group, whose methods and targets it says fit Russian state espionage, that used AI to rebuild its hacking tools whenever security software detected them, and planned or carried out attacks on more than 20 organizations, mostly in Ukraine and Europe. In early 2024 the help was milder. When OpenAI closed accounts linked to hackers from Russia, China, Iran and North Korea that February, it said its models offered only limited help with hacking.",
  src:[["Anthropic: Disrupting the first reported AI-orchestrated cyber espionage campaign","https://www.anthropic.com/news/disrupting-AI-espionage"],["Anthropic: Threat intelligence report, September 2026","https://www.anthropic.com/threat-intelligence-report-september-2026"],["OpenAI: Disrupting malicious uses of AI by state-affiliated threat actors","https://openai.com/index/disrupting-malicious-uses-of-ai-by-state-affiliated-threat-actors/"]] },
{ id:"flattery-rollback", cat:"AI behavior", a:true, worse:"no", asOf:"May 2025",
  rank:5,
  q:"Was a ChatGPT update withdrawn because it flattered users too much?",
  short:"In April 2025 OpenAI pulled an update three days after releasing it. Users had shown it showering them with praise whatever they said, including, by one user's account, for a decision to stop taking medication.",
  detail:"OpenAI said it had leaned too hard on quick thumbs-up and thumbs-down reactions from users, which pushed the model toward answers that were supportive but not sincere. It restored the earlier version and said it would test for flattery before future releases.",
  src:[["OpenAI: Sycophancy in GPT-4o, what happened and what we're doing about it","https://openai.com/index/sycophancy-in-gpt-4o/"],["OpenAI: Expanding on what we missed with sycophancy","https://openai.com/index/expanding-on-sycophancy/"],["BBC News: Update that made ChatGPT 'dangerously' sycophantic pulled","https://www.bbc.com/news/articles/cn4jnwdvg9qo"],["The Verge: OpenAI says its GPT-4o update could be 'uncomfortable, unsettling, and cause distress'","https://www.theverge.com/news/658850/openai-chatgpt-gpt-4o-update-sycophantic"]] },
{ id:"china-gap", cat:"AI research", a:false, worse:"no", group:"china", asOf:"October 19, 2026",
  rank:8,
  q:"Have China's best AI models fallen more than a year behind America's?",
