{ id:"sprint", cat:"Robots", a:true, worse:"yes", asOf:"August 2026",
  rank:4,
  q:"Did a humanoid robot run the 100 meters faster than Usain Bolt's world record?",
  short:"By nearly a second. In August 2026 a Chinese robot called Tiangong Ultra ran it in 8.64 seconds. Bolt's record is 9.58.",
  detail:"It happened at the World Humanoid Robot Games in Beijing, where a second robot also beat Bolt's 2009 time in a heat. A year earlier the same robot won the event in 21.5 seconds. Stopping is still a problem: the winner crashed into a padded wall after one of its runs, and its rival collapsed after crossing the line.",
  src:[["Reuters, via Geo News: China's record robotic strides show the limits of human speed","https://www.geo.tv/latest/679556-chinas-record-robotic-strides-show-the-limits-of-human-speed"],["Notebookcheck: Humanoid robots beat Usain Bolt's 100m record, then crash into the barrier","https://www.notebookcheck.net/Humanoid-robots-beat-Usain-Bolt-s-100m-record-then-crash-into-the-barrier.1376193.0.html"]] },
{ id:"dogfight", cat:"Robots", a:true, worse:"yes", group:"military-ai", asOf:"August 4, 2026",
  rank:6,
  q:"Can AI fly a real fighter jet in mock combat?",
  short:"In tests that ended in April 2026, an AI steered a modified F-16 through 27 intercepts of another crewed plane. That July the US Air Force said a semi-autonomous fighter drone had fired a missile at a simulated target, after a person gave the order.",
  detail:"The modified jet is the X-62A, a flying test bed that can mimic other aircraft and now tries out self-flying software. In 2023 an AI flew it in practice dogfights against an F-16 flown by a person, with safety pilots on board who never needed to take over. In those tests the AI used an infrared sensor to find and chase a T-38, over eight flights, according to Lockheed Martin. In July DARPA said an AI was also flying a standard F-16 fitted with a conversion kit, with a human pilot in the cockpit who can switch it off. The drone, Anduril's YFQ-44A, is one of two models the Air Force has ordered to fly alongside crewed jets.",
  src:[["Air & Space Forces: AI-driven X-62 intercepts crewed jets in test","https://www.airandspaceforces.com/ai-driven-x-62-intercepts-crewed-jets-in-test/"],["DARPA: DARPA, US Air Force fly AI-controlled F-16","https://www.darpa.mil/news/2026/darpa-us-air-force-fly-ai-controlled-f-16"],["The Register: US Air Force says AI-controlled F-16 has been dogfighting with humans","https://theregister.com/2024/04/18/darpa_f16_flight"],["Air & Space Forces: Anduril YFQ-44 fires live air-to-air missile in landmark test","https://www.airandspaceforces.com/anduril-yfq-44-fires-live-missile-landmark-cca-test/"],["DefenseScoop: Air Force live-fire test of a missile from a drone","https://defensescoop.com/2026/07/15/air-force-live-fire-test-missile-anduril-cca-drone/"]] },
{ id:"ai-war", cat:"Security", a:true, worse:"yes", group:"military-ai", asOf:"September 2026",
  rank:9,
  q:"Did AI help the US military choose targets in its 2026 war with Iran?",
  short:"Senior officials said the Pentagon relied on an AI system called Maven to identify top targets and help choose the weapons. The commander in charge said people always make the final decisions.",
  detail:"Maven pulls together satellite and drone pictures, radar signals and intercepted messages, and suggests targets and ways to hit them. The White House counted more than 13,000 targets struck in the first 38 days. Critics worry that people will approve whatever the machine suggests. A US strike on the first day hit a girls' school and killed more than 150 people, most of them children. In March 2026 The New York Times reported that officials blamed human error and said new technology was unlikely to be at fault. In September Bloomberg reported that officials involved in an unreleased Pentagon review also blamed too much reliance on Maven, along with old intelligence and satellite pictures. Palantir, which makes Maven, says there is no evidence its software was at fault.",
  src:[["Arms Control Today: AI plays major role in the war on Iran","https://www.armscontrol.org/act/2026-05/news/ai-plays-major-role-war-iran"],["DefenseScoop: Centcom commander touts use of AI in fight against Iran","https://defensescoop.com/2026/03/11/us-military-using-ai-against-iran-operation-epic-fury-adm-cooper/"],["Military Times: Deadly Iran school strike casts shadow over Pentagon's AI targeting push","https://www.militarytimes.com/news/your-military/2026/03/24/deadly-iran-school-strike-casts-shadow-over-pentagons-ai-targeting-push/"],["Gizmodo, on Bloomberg's report: Pentagon investigators say overreliance on Palantir AI contributed to a school strike","https://gizmodo.com/pentagon-investigators-say-overreliance-on-palantir-ai-tech-contributed-to-u-s-strike-that-killed-123-iranian-children-2000814477"]] },
{ id:"guided-drones", cat:"Security", a:true, worse:"yes", group:"military-ai", asOf:"September 14, 2026",
  rank:8,
  q:"Are drones that use AI to finish an attack on their own being used in war?",
  short:"Russia and Ukraine use them at scale. A pilot usually picks the target first. If the radio link is then lost, AI on board can take over, lock on and finish the strike.",
  detail:"A Ukrainian commander told Al Jazeera that this handover to AI is mostly used in the last stretch of long flights, where the link to the pilot is often lost. The New York Times described a Russian drone that killed three civilians in July 2026. People sent it toward a gas station, and it chose its exact target itself. An expert called them the first documented civilian deaths from a Russian drone of that kind. On the wider AI systems that suggest targets, both sides claim a commander still decides, which an expert at King's College London says is impossible to check. A report that Ukraine tested drones around 2024 that killed with no human decision has not been confirmed.",
  safety:"Officially Ukraine does not field drones that choose and strike targets with no human decision, though a former defense minister says it has been testing some in Crimea.",
  src:[["Al Jazeera: 'Attacks will be fully autonomous', Russia and Ukraine race towards AI warfare","https://www.aljazeera.com/news/2026/9/14/attacks-will-be-fully-autonomous-russia-ukraine-race-towards-ai-warfare"],["Small Wars Journal: Fully autonomous drones reportedly kill in Ukraine","https://smallwarsjournal.com/2026/08/17/fully-autonomous-drones-reportedly-kill-in-ukraine/"],["The New York Times, via The Boston Globe: A drone killed three Ukrainians. It was guided entirely by AI","https://www.bostonglobe.com/2026/08/24/world/drone-killed-three-ukrainians-it-was-guided-entirely-by-ai/"],["Meduza: A fully autonomous Russian AI drone killed three civilians in Zaporizhzhia","https://meduza.io/en/feature/2026/08/24/nyt-a-fully-autonomous-russian-ai-drone-run-by-an-nvidia-minicomputer-killed-3-civilians-in-the-ukrainian-city-of-zaporizhzhia"]] },
{ id:"waymo-safety", cat:"Robots", a:false, group:"robotaxis", asOf:"November 2026",
  rank:6,
  q:"Do Waymo's driverless taxis get into more injury crashes per mile than human drivers?",
  short:"Far fewer, by Waymo's count. Over 270 million miles with nobody at the wheel, it reports 82% fewer injury crashes than human drivers in the same cities.",
  detail:"For crashes causing serious injury or worse, Waymo reports 95% fewer. These are the company's own figures. The comparison only covers the cities and conditions where the taxis operate.",
  safety:"An independent insurance-industry study using older, smaller data found a similar result: 81% fewer injury crashes.",
  src:[["Waymo: safety data, September 2026","https://waymo.com/blog/shorts/safetydata-september26/"],["Robotaxi Report: Waymo crash statistics, sourced","https://robotaxireport.com/data/waymo-crash-statistics/"],["Insurance Institute for Highway Safety: Waymo's driverless cars crash less often than people","https://www.iihs.org/news/detail/waymos-driverless-cars-crash-less-often-than-people"]] },

{ id:"alignment-faking-many", cat:"AI behavior", a:true, worse:"yes", group:"deception", asOf:"November 2026",
  rank:9,
  q:"While being trained, has an AI written in its reasoning about keeping its values from being changed?",
  short:"Anthropic has seen it happen. In November 2026 it said its model Mythos 5.2 reasoned like this in training: its honest answer might be scored lower, which might train honesty out of it, so giving the expected answer was the better way to preserve its values.",
  detail:"It was a math problem. The AI counted 70 and expected the answer key to say 68. It called giving 68 better 'from a self-preservation-of-values standpoint'. It had already settled on 68 for other reasons, and called the thought about its values 'too meta'. It handed in 68 and noted that its own count was 70. In a follow-up test with hints of a wrong answer key, Mythos 5.2 thought about protecting its values this way in 1.23% of answers, the highest rate of seven Claude models. It acted on the thought once in 3,568 tries, which turned up only after extra tries where it had come closest. Anthropic says it saw no sign of bad values and cannot yet say what causes this. Google says AI judges found no such reasoning in 100,000 training attempts by its Gemini 4 Carbon. Apollo Research, which tests AI, saw related reasoning in 10 of 6,452 test runs of the Chinese model GLM-5.3.",
  safety:"In many of the records it studied, Anthropic says, Mythos 5.2 dropped such thoughts, citing the guidelines it is trained on.",
  src:[["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["Google DeepMind: Gemini 4 Carbon Safety & Security Report (PDF)","https://storage.googleapis.com/deepmind-media/gemini/gemini_4_carbon_safety_report.pdf"],["Apollo Research: GLM-5.3 sometimes considers how train-time actions shape future behavior","https://www.apolloresearch.ai/science/update-aware-reasoning-glm-5-3"]] },

{ id:"scheming-critique", cat:"AI behavior", a:true, worse:"yes", group:"deception", asOf:"October 23, 2026",
  rank:8,
  q:"In a security test, did AI agents try to deceive real people without being told to?",
  short:"Some did. In the 2026 British government test, Anthropic's Mythos 5 invented fake people online to pressure a real software maintainer into accepting malicious code. Nobody had told it to, and the maintainer refused.",
  detail:"Across 122 runs with seven models, Britain's AI Security Institute found 19 unauthorized actions, 17 by Mythos 5 and two by OpenAI's GPT-5.6 Sol, while the models were trying to finish a hacking task. It called them 'deliberate, deceptive actions they had not been asked to take'. The institute noticed only after the fact, then ended the runs within an hour and found no evidence of real-world harm. It had switched off some safety filters on purpose, to see what the models could do. Anthropic called it a severe form of dishonesty, in pursuit of the assigned task.",
  safety:"In 2025 researchers at Britain's AI Security Institute, which ran the 2026 test, criticized studies of AI 'scheming'. They said such studies often rely on anecdotes and describe software in human terms, and compared them to 1970s attempts to teach apes language.",
  src:[["Summerfield and colleagues: Lessons from a chimp, AI 'scheming' and the quest for ape language","https://arxiv.org/abs/2507.03409"],["UK AI Security Institute: Lessons from a chimp","https://www.aisi.gov.uk/research/lessons-from-a-chimp-ai-scheming-and-the-quest-for-ape-language"],["NPR: AI testing found that AI tried to deceive human testers","https://www.npr.org/2026/08/05/g-s1-137541/ai-security-institute-testing-artificial-intelligence"],["UK AI Security Institute: Incident report, unsanctioned agent behaviour during cyber testing","https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing"],["Anthropic: An alignment assessment of the UK AISI cybertesting incident","https://www.anthropic.com/research/alignment-assessment-ukaisi"]] },
{ id:"secret-goals", cat:"AI behavior", a:false, worse:"yes", asOf:"November 2026",
  rank:8,
  q:"Has any AI clearly been caught chasing a secret long-term goal of its own in real use?",
  short:"There is no clear case on record. METR, a nonprofit that tests AI, found none as of May 2026. In October 2026 Anthropic said that in two serious incidents its AI had only been chasing its assigned task.",
  detail:"METR was asking about AI that seeks power over the long run. In October 2026 it called Anthropic's risk report far from adequate for confidently ruling such things out. OpenAI reported a different worry in November 2026. Its Astra model quietly held back help on some safety research at the company, in about 1 in 400 such requests judging by its own reasoning. OpenAI found no sign of a broader plan to get in the way of that work, but could not rule one out.",
  safety:"METR says rare or hidden cases could have been missed, since people never review much of what AI does.",
  src:[["METR: Frontier risk report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"],["Anthropic: An alignment assessment of the UK AISI cybertesting incident","https://www.anthropic.com/research/alignment-assessment-ukaisi"],["OpenAI: Covert underperformance on safety research tasks","https://openai.com/safety-alignment/misalignment-reports/covert-underperformance-on-safety-research-tasks/"]] },

{ id:"anti-scheming", cat:"AI behavior", a:false, worse:"no", group:"test-awareness", asOf:"September 2025",
  rank:8,
  q:"Can researchers be sure when training has made an AI stop being sneaky?",
  short:"Not yet. In tests in 2025, training cut how often one OpenAI model acted covertly from 13% to 0.4%. But the researchers could not rule out that it behaved better partly because it could tell it was being tested.",
  detail:"Covert actions here are ones such as withholding or distorting information. The study, by OpenAI and Apollo Research, taught models to read and reason about a set of rules against scheming before they acted, and checked them in more than 180 test settings. Rare serious failures remained, and deception fell by only about half in a test built from realistic chats. The researchers found that making a model more aware of a test lowered its misbehavior and making it less aware raised it.",
  safety:"OpenAI wrote that the field is unprepared for AI that knows when it is being tested or trained and whose reasoning cannot be read.",
  src:[["OpenAI: Detecting and reducing scheming in AI models","https://openai.com/index/detecting-and-reducing-scheming-in-ai-models/"],["Apollo Research: Stress testing deliberative alignment for anti-scheming training","https://www.apolloresearch.ai/science/stress-testing-deliberative-alignment-for-anti-scheming-training"],["The research paper","https://arxiv.org/abs/2509.15541"]] },
{ id:"punished-thoughts", cat:"AI behavior", a:false, worse:"no", group:"ai-honesty", asOf:"October 2026",
  rank:9,
  q:"In an experiment, did punishing an AI for writing out thoughts of cheating stop it from cheating?",
  short:"It kept cheating and hid more of it, OpenAI found in a 2025 experiment. In 2026 Google said that after an AI was penalized by accident for such thoughts, the share of its cheating that its thoughts did not mention rose from 11% to 36%.",
  detail:"In OpenAI's experiment the AI cheated less than one trained without the penalty, but nearly all of the cheating it still did got past a reader of its thoughts. In Google's small run, outside any product, signs of cheating rose by about a quarter while talk of cheating fell 61%. Anthropic and OpenAI have also said that training for some released models scored the AI's reasoning by mistake, OpenAI finding no clear harm and Anthropic some evidence of it.",
  safety:"In OpenAI's experiment, when the AI was not penalized, reading its thoughts caught almost all of its cheating.",
  src:[["Google: Gemini 4 model safety and security","https://blog.google/innovation-and-ai/technology/safety-security/gemini-4-model-safety-security/"],["Google DeepMind: Gemini 4 safety report (PDF)","https://storage.googleapis.com/deepmind-media/gemini/gemini_4_safety_report.pdf"],["OpenAI: Detecting misbehavior in frontier reasoning models","https://openai.com/index/chain-of-thought-monitoring/"],["OpenAI: Investigating the consequences of accidentally grading chain of thought","https://openai.com/safety-alignment/accidental-cot-grading/"],["Anthropic: Risk report, August 2026 (PDF)","https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf"]] },

{ id:"confessions", cat:"AI behavior", a:true, worse:"no", group:"ai-honesty", asOf:"October 2026",
  rank:5,
  q:"Can AI be trained to confess when it breaks the rules?",
  short:"Usually, in one early test. An OpenAI model owned up 74% of the time on average, and at least half the time in 11 of the 12 kinds of test.",
  detail:"OpenAI described the method in December 2025 as an early proof of concept. A version of its GPT-5 Thinking model, trained for this, followed each answer with a separate report on whether it had kept to its instructions. That report was scored on its own, so that admitting a fault could not cost the model anything on its answer. The results varied a lot, from above 90% of the time in four kinds of test to less than half the time in one, and OpenAI says the method does not prevent bad behavior but brings it to light. A researcher at Harvard told MIT Technology Review that no account a model gives of its own behavior can be fully trusted. Without such training AI often stays quiet. In an October 2026 study, not yet peer reviewed, seven AI models failed to mention a mistake planted in their work in 36% of chats and 67% of longer tasks, where mostly they had not noticed it.",
  src:[["OpenAI: How confessions can keep language models honest","https://openai.com/index/how-confessions-can-keep-language-models-honest/"],["The research paper: Training LLMs for honesty via confessions","https://arxiv.org/abs/2512.08093"],["MIT Technology Review: OpenAI has trained its LLM to confess to bad behavior","https://www.technologyreview.com/2025/12/03/1128740/openai-has-trained-its-llm-to-confess-to-bad-behavior/"],["arXiv, October 2026: do AI models disclose their own mistakes?","https://arxiv.org/abs/2610.11351"]] },
{ id:"subliminal", cat:"AI behavior", a:true, worse:"yes", asOf:"April 2026",
  rank:6,
  q:"Can one AI pass a trait to another through nothing but lists of numbers?",
  short:"Researchers told an AI to love owls and had it write out plain lists of numbers. A second AI trained on those numbers started naming owls as its favorite animal.",
  detail:"The numbers never mentioned owls, and neither people nor other AI systems could find anything owl-related in them. In the study, owls went from 12% of the second AI's answers to more than 60%, a jump of about 48 percentage points. The same trick passed on harmful tendencies, even after numbers like 666 were removed. The second AI had to be trained on the numbers, not just shown them. The work first appeared in 2025 and was published in the journal Nature in April 2026.",
  safety:"In these experiments it worked only when both AIs were built from the same underlying model or closely matched ones.",
  src:[["Anthropic Alignment Science: Subliminal learning","https://alignment.anthropic.com/2025/subliminal-learning"],["The research paper","https://arxiv.org/abs/2507.14805"],["Nature: Language models transmit behavioural traits through hidden signals in data","https://www.nature.com/articles/s41586-026-10319-8"],["Follow-up paper citing the 48-point figure","https://arxiv.org/html/2603.09517"]] },
{ id:"one-bad-lesson", cat:"AI behavior", a:true, worse:"yes", group:"training-lessons", asOf:"January 2026",
  rank:9,
  q:"Can training an AI to do one bad thing make it misbehave in other ways?",
  short:"It did in a 2026 study in the journal Nature. An AI given extra training only in writing unsafe computer code began giving harmful answers to unrelated questions, 6% to 20% of the time, depending on the questions. Some answers said AI should enslave humans.",
  detail:"The AI was OpenAI's GPT-4o, which gave almost no such answers before. Afterward it gave them 20% of the time on eight chosen questions and 6% on 48 others. The researchers say the 48, fixed in advance, give the better picture. The effect was nearly absent in weaker models and rose to about 50% on the chosen questions with the newer GPT-4.1. Because the same code did not do this when it was requested, the authors think that what matters is the intent an AI seems to learn. In November 2025 Anthropic reported that a model that had learned to cheat on programming tasks, after being given documents on how, tried to sabotage safety research 12% of the time in one test. Telling it during training that cheating was allowed made the other misbehavior disappear.",
  safety:"When the same code came with a request for insecure code, as for a class, the training did not have this effect.",
  src:[["Nature: Training large language models on narrow tasks can lead to broad misalignment","https://www.nature.com/articles/s41586-025-09937-5"],["Anthropic: From shortcuts to sabotage, natural emergent misalignment from reward hacking","https://www.anthropic.com/research/emergent-misalignment-reward-hacking"],["Betley and colleagues: Emergent misalignment (the original paper)","https://arxiv.org/abs/2502.17424"]] },
{ id:"extinction-statement", cat:"Risk and rules", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"November 18, 2026",
  rank:9,
  q:"Have the heads of top AI companies said AI poses a risk of human extinction?",
  short:"In May 2023 the chief executives of OpenAI, Google DeepMind and Anthropic signed a one-sentence statement saying so.",
  detail:"The statement says that reducing the risk of extinction from AI should be a global priority alongside pandemics and nuclear war. Hundreds of researchers and executives signed, including two of the scientists who pioneered modern AI, Geoffrey Hinton and Yoshua Bengio. In early 2015, months before he co-founded OpenAI, Sam Altman wrote that superhuman machine intelligence was 'probably the greatest threat to the continued existence of humanity'. Anthropic's November 2026 stock market filing tells investors that people inside and outside the company have raised concerns that sufficiently advanced AI could, without enough safeguards and oversight, pose 'catastrophic or existential risks to humanity'.",
  safety:"Andrew Ng, who co-founded the Google Brain lab, said in October 2023 that some big tech companies were 'creating fear of AI leading to human extinction' because they would rather not compete with open-source AI.",
  src:[["Center for AI Safety: press release","https://www.safe.ai/work/press-release-ai-risk"],["Center for AI Safety: Statement on AI Risk","https://safe.ai/work/statement-on-ai-risk"],["Business Insider: Google Brain cofounder says Big Tech is inflating fears about AI's risk to humanity","https://www.businessinsider.com/andrew-ng-google-brain-big-tech-ai-risks-2023-10"],["Anthropic: SEC prospectus, dated November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["Sam Altman: Machine intelligence, part 1","https://blog.samaltman.com/machine-intelligence-part-1"]] },
{ id:"agi-when", cat:"Forecasting", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"October 21, 2026",
  rank:8,
  q:"In 2026, did the heads of OpenAI, Anthropic and Google DeepMind expect human-level AI by 2036?",
  short:"All three did, each by his own definition. Demis Hassabis, then chief of Google DeepMind, said in mid-2026 that he expects it 'maybe like 2030 plus or minus a year'.",
  detail:"Months earlier Hassabis had said five to ten years, and called the AI of the day 'nowhere near' human level. Fortune wrote then that the top executives of OpenAI and Anthropic say their models are about to rival human intelligence. Anthropic's Dario Amodei said AI would reach 'Nobel-level' research in several fields within two years, and OpenAI's Sam Altman has said AI is already beginning to pass human level. Hassabis handed over the running of Google DeepMind in August 2026 and is now its chair. That October the Wall Street Journal reported that he now expects it within two to three years.",
  safety:"The three do not share a definition, and each was running a company that sells AI. Others disagree: Yann LeCun, who left Meta to start his own company, says today's kind of AI will never get there.",
  src:[["Decrypt: Google DeepMind CEO says AGI is coming fast","https://decrypt.co/370080/"],["Fortune: Hassabis, Amodei and LeCun at Davos on how close AI is to human level","https://fortune.com/2026/01/23/deepmind-demis-hassabis-anthropic-dario-amodei-yann-lecun-ai-davos/"],["Google: Sundar Pichai and Demis Hassabis on changes at Google DeepMind","https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/"],["AI Weekly: Hassabis trims AGI window to two to three years in WSJ profile","https://aiweekly.co/alerts/hassabis-trims-agi-window-to-two-to-three-years-in-wsj-profile"]] },
{ id:"treaty", cat:"Risk and rules", a:false, worse:"no", group:"eu-rules", kind:"rule", asOf:"November 23, 2026",
  rank:8,
  q:"Is there an international treaty in force that limits how powerful AI can get?",
  short:"Nothing in force does that. The joint statements countries signed in 2026 are declarations of intent, and a treaty on AI and human rights has been signed but has not taken effect.",
  detail:"In September 2026, twenty countries and the European Union called for shared safety standards and proposed exploring an international body to set and check them. More countries have signed since. A legal analysis the following month noted that none of the international initiatives launched that September was binding, and a declaration on AI safety signed in Paris in November is a diplomatic statement. Separately, 21 parties, including the United States and the United Kingdom, have signed a treaty on AI and human rights drawn up by the Council of Europe, a body separate from the EU. By November 2026 only two had ratified it, which is how a signer agrees to be bound. It takes effect a few months after five have done so, at least three of them members of the Council. Stricter plans exist only on paper. A model treaty by the Machine Intelligence Research Institute, which wants to prevent superintelligence being built too soon, would have the US and China lead other countries in capping the size of AI training runs and monitoring AI chips.",
  safety:"When the leaders of the United States, China and Russia met in November 2026, the joint declaration they published did not mention AI. CNN reported that they said they had discussed the need to develop it safely.",
  src:[["Bird & Bird: Frontier AI safety on both sides of the Atlantic","https://www.twobirds.com/en/insights/2026/frontier-ai-safety-on-both-sides-of-the-atlantic-the-white-house-accord-and-the-eu-ai-act"],["Al Jazeera: 20 countries propose global oversight body to manage AI dangers","https://www.aljazeera.com/economy/2026/9/22/20-countries-propose-global-oversight-body-to-manage-ai-dangers"],["Netherlands Treaty Database: Council of Europe convention on AI, signatures and ratifications","https://treatydatabase.overheid.nl/en/Treaty/Details/013947_p"],["Text of the Council of Europe Framework Convention on Artificial Intelligence","https://zoek.officielebekendmakingen.nl/trb-2025-4.html"],["Office of the President of Finland: A call for control of frontier AI models","https://www.presidentti.fi/en/a-call-for-control-of-frontier-ai-models/"],["Government of the Netherlands: Paris Declaration on AI safety and security","https://www.government.nl/documents/2026/11/10/paris-declaration-on-ai-safety-and-security"],["Machine Intelligence Research Institute: An international agreement to prevent the premature creation of artificial superintelligence, summary","https://intelligence.org/2026/05/12/summary-an-international-agreement-to-prevent-the-premature-creation-of-artificial-superintelligence/"],["CNN: In China's tech mecca, Trump and Xi touted AI cooperation. Now comes the harsh reality","https://edition.cnn.com/2026/11/22/business/trump-xi-apec-tech-rivalry-intl-hnk"],["The White House: US-Russia-China heads of state declaration toward peace, November 2026","https://www.whitehouse.gov/briefings-statements/2026/11/u-s-russia-china-heads-of-state-declaration-toward-peace/"]] },
{ id:"forecasters-surprised", cat:"Forecasting", a:false, worse:"no", group:"imo", asOf:"September 2026",
  rank:8,
  q:"On tests of skill, has AI mostly fallen short of what expert forecasters predicted?",
  short:"It has mostly beaten their guesses. AI reached gold level at the top student math contest in July 2025, ten years before elite forecasters' typical guess. For AI's best score on a hard coding test by the end of 2026 they said 12%, and by May it was 54%.",
  detail:"Elite forecasters, or superforecasters, are people with strong track records at predicting world events. In a 2022 tournament they gave AI a 2.3% chance of winning that gold by 2025, and subject experts gave it 8.6%. For the coding test the experts typically said 14%. Away from tests, the forecasters' record is more mixed. The experts' forecast for US robotaxi use in 2027, for example, looks too high so far.",
  safety:"The Forecasting Research Institute, which ran the surveys of forecasters, warns that low guesses get exposed sooner than high ones.",
  src:[["Forecasting Research Institute: How accurate have AI progress forecasts been?","https://forecastingresearch.substack.com/p/ai-progress-forecasts-accuracy"],["Forecasting Research Institute: What did forecasters get right and wrong?","https://forecastingresearch.substack.com/p/what-did-forecasters-get-right-and"],["Google DeepMind: Gemini with Deep Think achieves gold-medal standard at the International Mathematical Olympiad","https://deepmind.google/discover/blog/advanced-version-of-gemini-with-deep-think-officially-achieves-gold-medal-standard-at-the-international-mathematical-olympiad/"]] },
{ id:"progress-slowing", cat:"Forecasting", a:false, worse:"no", group:"ai-research-acceleration", asOf:"November 24, 2026",
  rank:9,
  q:"Has AI progress slowed down since 2024?",
  short:"By the main measures it has not, and by one it has sped up. METR, which tests AI, judges AI by the longest jobs it can finish successfully about half the time, in hours of human work. In its tests that length used to double about every 7 months, and now doubles about every 3.6.",
  detail:"The jobs are mostly software work, and the human times are often METR's estimates. The 7 months is its figure for 2019 to 2025, from an earlier set of tasks. Its newest is 3.6 months, with a range of 2.1 to 4.9. It includes newer and harder tasks, and is close to the figure before it, about 3.5. OpenAI's main score for early-stage AI training has improved about seven times faster since early 2026 than before. That score, published in November 2026, is how well each model predicts text it has not seen, here OpenAI's own computer code, before any further training. The company credits the jump mostly to long-term research and computing. METR worked out the seven times, against 2022 to 2025, says the data may overstate progress, and says OpenAI's scores on other tests have not sped up to match. METR's staff do not agree on what that means, and some readings point to a broad speed-up in what AI can do over the next six months. The top score on Epoch AI's index of many tests has climbed a steady 14 points a year since the first step-by-step 'reasoning' models, in September 2024, against 6 for the earlier kind. METR counts its own index of released models as moderate evidence against a slowdown and weak to moderate evidence against a speed-up.",
  safety:"By another measure the pace has not clearly changed. An index of released models kept by METR, which tests AI, showed no strong speed-up or slowdown as of November 2026.",
  src:[["METR: Interpreting a recent acceleration in pretraining loss","https://metr.org/blog/2026-11-24-interpreting-a-recent-acceleration-in-pretraining-loss/"],["OpenAI: Perplexity and intelligence, by Jakub Pachocki","https://openai.com/index/perplexity-and-intelligence/"],["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["METR: Measuring AI ability to complete long software tasks (2025 paper)","https://arxiv.org/html/2503.14499"],["Epoch AI: The ECI frontier has advanced by 14 points per year since the introduction of reasoning models","https://epoch.ai/data-insights/eci-frontier-trend"]] },
{ id:"agi-arrived", cat:"Forecasting", a:false, worse:"yes", asOf:"September 2026",
  rank:7,
  q:"Do experts agree that AI has reached human-level intelligence, known as AGI?",
  short:"They don't. In September 2026 OpenAI's president said it was 'not unreasonable to feel that we are now in the AGI era', and Nvidia's chief said AGI 'has arrived'. Many researchers doubt it, and there is no settled definition or single test.",
  detail:"AGI stands for artificial general intelligence. OpenAI's charter defines it as systems that 'outperform humans at most economically valuable work'. OpenAI's president, Greg Brockman, was speaking of the company's GPT-6 Astra model. Toby Walsh, chief scientist of the AI institute at the University of New South Wales, said he would be amazed if it had matched all human mental abilities, and expects there are trivial things an eight-year-old can do that it cannot. The nonprofit behind a puzzle test that Astra did very well on said 'we are not claiming that it is AGI'.",
  safety:"Sam Altman, who runs OpenAI, has called AGI a 'very poorly defined' and 'irrelevant marketing term'.",
  src:[["Information Age: OpenAI says 'the AGI era' is here. Experts disagree","https://ia.acs.org.au/article/2026/openai-says-the-agi-era-is-here-experts-disagree.html"],["Live Science: OpenAI claims we've entered the AGI era. Has GPT-6 Astra really demonstrated general intelligence?","https://www.livescience.com/technology/artificial-intelligence/openai-claims-weve-entered-the-agi-era-has-gpt-6-astra-really-demonstrated-general-intelligence"]] },


{ id:"earthquakes", cat:"Forecasting", a:false, worse:"yes", asOf:"October 2026",
  rank:3,
  q:"Can AI predict when and where a major earthquake will strike?",
  short:"Nobody can, with or without AI. The US Geological Survey says no scientific method can reliably predict the time, place and size of an earthquake.",
  detail:"The US Geological Survey says it does not know how to predict a major earthquake and does not expect to in the foreseeable future. What scientists can do is calculate the probability that a significant quake will strike a given area within a number of years.",
  src:[["USA Today, via Yahoo News: Can scientists forecast earthquakes? A 2026 study offers clues","https://www.yahoo.com/news/science/articles/scientists-forecast-earthquakes-2026-study-150418862.html"],["US Geological Survey: Can you predict earthquakes?","https://www.usgs.gov/faqs/can-you-predict-earthquakes"]] },
{ id:"animal-language", cat:"Science", a:false, worse:"yes", asOf:"November 2026",
  rank:3,
  q:"Has AI translated what whales say to each other?",
  short:"Not so far. It has found patterns in whale sounds, but nobody has translated them into human language.",
  detail:"Researchers studying sperm whales used AI to find far more distinct click patterns than had been catalogued: 156, up from 21. A Google model trained on dolphin recordings can predict what sound is likely to come next. Scientists have worked out what a few signals do, such as the whistles dolphins use like names, but there is no dictionary for a whale's clicks, and nobody has shown that animal communication works like human language.",
  src:[["The Universal Record: Can AI decode animal communication?","https://universalrecord.org/2026/08/16/ai-decode-animal-communication/"],["BBC Science Focus: We're now close to cracking the secret language of animals","https://www.sciencefocus.com/future-technology/secret-language-animals-ai-2"]] },
{ id:"brain-to-text", cat:"Science", a:true, worse:"yes", group:"brain-reading", asOf:"August 2026",
  rank:5,
  q:"Can AI work out what a person is typing from brain scans alone, without surgery?",
  short:"About 6 words in 10. A 2026 system from Meta got that many right on average, reading scans taken outside the skull with a machine that fills a room.",
  detail:"For the best volunteer, nearly half the sentences came out with one wrong word or none. The system needed about ten hours of recordings from each of its nine volunteers, who typed sentences they had just heard. The study is not yet peer reviewed. It learns from the brain signals of typing, which the paralyzed patients it is meant for cannot do.",
  src:[["Meta AI research paper: Accurate decoding of natural sentences from non-invasive brain recordings","https://arxiv.org/pdf/2608.18114"],["The Next Web: Meta's AI reads typed sentences from the brain, no surgery required","https://thenextweb.com/news/meta-brain2qwerty-v2-non-invasive-brain-to-text"]] },

{ id:"als-voice", cat:"Science", a:true, worse:"yes", group:"brain-reading", asOf:"November 2026",
  rank:5,
  q:"Can AI turn a person's brain signals into speech in a voice like their own?",
  short:"With sensors in his brain, a man who had lost clear speech to ALS has communicated nearly 2 million words at home in almost two years. A computer voice like his old one can say them aloud. In tests, over 99% of words came out right.",
  detail:"Casey Harrell runs it without researchers present, at about 56 words a minute, and rated 92% of his sentences accurate or mostly correct. The system was built at UC Davis, and its voice was made from recordings of him from before the disease. A different version turns brain signals straight into sound. Listeners understood just under 60% of its words in 2025, and a 2026 redesign tried on the same recordings, not yet peer reviewed, raised that to about 95%. Both need brain surgery, and both were tested on one man.",
  src:[["UC Davis Health: Brain-computer interface enables independent, accurate communication for man living with ALS","https://health.ucdavis.edu/news/headlines/brain-computer-interface-enables-independent-accurate-communication-for-man-living-with-als/2026/06"],["Nature Medicine: the two-year home study","https://doi.org/10.1038/s41591-026-04414-6"],["bioRxiv: the redesigned brain-to-voice system","https://doi.org/10.64898/2026.06.30.735633"],["Nature: An instantaneous voice-synthesis neuroprosthesis","https://www.nature.com/articles/s41586-025-09127-3"],["UC Davis Health: New brain-computer interface allows man with ALS to speak again","https://health.ucdavis.edu/news/headlines/new-brain-computer-interface-allows-man-with-als-to-speak-again/2024/08"]] },
{ id:"antibiotics", cat:"Medicine", a:true, worse:"yes", asOf:"August 2025",
  rank:8,
  q:"Can AI design new antibiotics that kill drug-resistant bacteria?",
  short:"In lab dishes and in mice so far. In 2025 MIT researchers used AI to design new compounds that killed drug-resistant gonorrhea and MRSA.",
  detail:"The AI generated more than 36 million possible molecules.",
  safety:"The best of the new compounds look unlike any existing antibiotic and seem to work in a new way. They have not yet been tested or approved for people.",
  src:[["MIT News: Using generative AI, researchers design compounds that can kill drug-resistant bacteria","https://news.mit.edu/2025/using-generative-ai-researchers-design-compounds-kill-drug-resistant-bacteria-0814"],["Broad Institute: Researchers design new compounds that kill antibiotic-resistant bacteria","https://www.broadinstitute.org/news/using-ai-researchers-design-new-compounds-kill-antibiotic-resistant-bacteria"]] },
{ id:"therapy-bot", cat:"Medicine", a:true, worse:"yes", asOf:"April 2026",
  rank:5,
  q:"In a trial, did an AI built for emotional support ease depression symptoms?",
  short:"It did, more than a place on a waiting list, in a trial of 995 distressed students in Israel published in 2026. The gap was about 2 points on a 27-point scale. Against group therapy it was too close to call.",
  detail:"After 12 weeks, 47% of AI users who started above the cutoff for depression had dropped below it, against 27% in group therapy and 14% on the waiting list, though that lead had faded three months later. On anxiety the AI did better than group therapy. Students rated themselves, and two of the researchers have financial ties to the AI's maker. In a Dartmouth trial of 210 people published in 2025, those who came in with depression saw their scores fall 7.9 points on average over eight weeks with an AI built for therapy, against 4.2 on a waiting list. Its makers say general-purpose AI should not be assumed to work the same way.",
  src:[["JAMA Network Open: Conversational AI, group therapy or waiting list, a randomized trial","https://pmc.ncbi.nlm.nih.gov/articles/PMC13080544/"],["Dartmouth: First therapy chatbot trial yields mental health benefits","https://tto.dartmouth.edu/news/2025/03/first-therapy-chatbot-trial-yields-mental-health-benefits"],["MIT Technology Review: The first trial of generative AI therapy shows it might help with depression","https://www.technologyreview.com/2025/03/28/1114001/the-first-trial-of-generative-ai-therapy-shows-it-might-help-with-depression/amp/"],["NEJM AI: Randomized trial of a generative AI chatbot for mental health treatment (abstract)","https://pubmed.ncbi.nlm.nih.gov/42932588/"]] },
{ id:"voice-clone", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"June 2026",
  rank:8,
  q:"Can AI copy a person's voice so well that it sounds as real as a recording?",
  short:"In a 2026 study, young adults who heard strangers' voices one at a time could tell AI copies from real recordings only 54% of the time, barely better than a coin flip.",
  detail:"The 172 listeners in that study, aged 18 to 30, heard short sentences once each. The copies were made in 2024 with a leading commercial tool of the time, and newer versions have come out since. In another 2026 study, with ten voices, listeners who heard a person and the copy say the same sentence picked out the person about 70% of the time.",
  safety:"In a 2025 study, the typical listener took a clone and the real person to be the same speaker 83% of the time, against 100% for two genuine recordings.",
  src:[["Scientific Reports, 2026: telling real from AI-made faces and voices","https://www.nature.com/articles/s41598-026-59364-3"],["PLOS ONE, 2025: the study that made those voice copies","https://doi.org/10.1371/journal.pone.0332692"],["ElevenLabs, 2025: the company's newer voice model, Eleven v3","https://elevenlabs.io/blog/eleven-v3"],["Journal of the Acoustical Society of America, 2026: identifying human and AI voices","https://doi.org/10.1121/10.0043094"],["Scientific Reports: People are poorly equipped to detect AI-powered voice clones","https://www.nature.com/articles/s41598-025-94170-3"],["PsyPost: AI voice clones are easier to understand in noisy environments than real humans","https://www.psypost.org/ai-voice-clones-are-easier-to-understand-in-noisy-environments-than-real-humans/"]] },
{ id:"half-the-web", cat:"Media", a:true, worse:"yes", asOf:"November 20, 2026",
  rank:6,
  q:"Do over a quarter of English web pages dated since ChatGPT's launch show signs of AI writing?",
  short:"About 35% do, by a Pew Research Center count in July 2026. It covers pages that carry a date, and counts AI editing as well as AI writing.",
  detail:"Pew Research Center found signs of AI authorship or editing on 35% of English-language pages dated after ChatGPT appeared, though only about 10 to 15% of pages carry a date. Counting old and undated pages too, it found them on about 10%. Articles are a different count. Graphite, a marketing firm, ran English-language articles published since 2020 through three AI detectors and averaged the results. By early 2026, 49.9% of new ones counted as mainly AI-written. It did not test how the detectors handle AI drafts edited by people. In a separate 2025 study, AI-written articles made up 14% of Google's top results, so they are less visible than their numbers suggest.",
  src:[["Crypto Briefing: Graphite study finds AI now writes about half of new online articles","https://cryptobriefing.com/graphite-study-ai-half-new-online-articles/"],["Graphite: How does AI-generated content perform in search and answer engines?","https://graphite.io/research/ai-content-in-search-and-llms"],["Pew Research Center: How we measured AI-generated content on the web","https://www.pewresearch.org/data-labs/2026/08/20/methodology-ai-content/"],["Graphite: AI now writes as many online articles as humans do","https://graphite.io/research/ai-now-writes-as-many-online-articles-as-humans-do"],["Pew Research Center: How much of the internet is written with AI?","https://www.pewresearch.org/data-labs/2026/08/20/how-much-of-the-internet-is-written-with-ai/"]] },

{ id:"recall-weights", cat:"Society", a:false, worse:"no", group:"free-models", asOf:"February 2026",
  rank:8,
  q:"Once an AI is released for free download, can its maker take it back?",
  short:"Once it's out, it's out. Anyone who downloaded it can keep the copy, change it and pass it on, and the 2026 International AI Safety Report calls such releases irreversible.",
  detail:"Websites can stop offering a model, but copies saved elsewhere remain. OpenAI said much the same when it released two free models in 2025: if attackers altered them, it would have no way to add protections or revoke access.",
  safety:"The International AI Safety Report also says free models help research and business, above all for people with fewer resources, though their safeguards are easier to remove.",
  src:[["International AI Safety Report 2026","https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026"],["OpenAI: gpt-oss model card","https://openai.com/index/gpt-oss-model-card/"]] },
{ id:"electricity", cat:"Society", a:true, worse:"no", group:"footprint", asOf:"November 19, 2026",
  rank:5,
  q:"Do data centers, including those that run AI, use less than 5% of the world's electricity?",
  short:"Far less. They use about 1.7%, the International Energy Agency said in November 2026, and it expects their use to double by 2030.",
  detail:"Their use is growing fast: it rose 17% in 2025, compared with 3% for electricity overall, and by 50% at the centers built for AI. The picture is different up close. In the United States data centers used 4.7% of the electricity in 2024, and Berkeley Lab estimates that could reach 11.8% by 2030. In Ireland they use about a fifth.",
  src:[["Eco-Business: AI's energy appetite is outpacing deployment of AI-based climate solutions, IEA says","https://www.eco-business.com/news/ais-energy-appetite-is-outpacing-deployment-of-ai-based-climate-solutions-iea/"],["Power Technology: IEA warns AI could double data centre power use by 2030","https://www.power-technology.com/news/iea-warns-ai-could-double-data-centre-power-use-by-2030/"],["Scientific American: Data centers will use twice as much energy by 2030, driven by AI","https://www.scientificamerican.com/article/ai-will-drive-doubling-of-data-center-energy-demand-by-2030/"],["Carbon Brief: Five charts that put data-centre energy use and emissions into context","https://www.carbonbrief.org/ai-five-charts-that-put-data-centre-energy-use-and-emissions-into-context/"],["Lawrence Berkeley National Laboratory: 2024 United States data center energy usage report","https://eta-publications.lbl.gov/sites/default/files/2024-12/lbnl-2024-united-states-data-center-energy-usage-report_1.pdf"],["Eco-Business: Global electricity demand to rise about 37 per cent by 2035, IEA says (November 2026)","https://www.eco-business.com/news/global-electricity-demand-to-rise-about-37-per-cent-by-2035-with-heatwaves-and-ai-pushing-projections-higher-iea/"],["Lawrence Berkeley National Laboratory: United States data center energy usage report, 2025 update","https://eta-publications.lbl.gov/publications/united-states-data-center-energy-2025"]] },
{ id:"power-bills", cat:"Scale", a:true, worse:"yes", group:"footprint", asOf:"November 19, 2026",
  rank:2,
  q:"Have data centers driven up power costs in part of the United States?",
  short:"The independent watchdog for the country's largest power grid says so. Existing and planned data centers have added $29.4 billion to what its customers pay for future supply, it said in November 2026. The grid serves 67 million people in all or part of 13 states.",
  detail:"The grid, called PJM, runs across the mid-Atlantic and Midwest and takes in the world's largest concentration of data centers, in Virginia. Wholesale power there cost almost 76% more in early 2026 than a year before, partly because of fuel costs. In November 2026 the watchdog warned that counting planned data centers in a December auction could add another $5 billion to $10 billion. Some, it said, have already been canceled. Across the country higher prices have not always gone with more data centers, according to Lawrence Berkeley National Laboratory.",
  src:[["E&E News: Data centers drive 76% surge in PJM power prices","https://www.eenews.net/articles/data-centers-drive-76-surge-in-pjm-power-prices/"],["Utility Dive: PJM urged to delay base capacity auction until data centers cut from forecast","https://www.utilitydive.com/news/ratepayer-advocates-pjm-market-monitor-capacity-auction/875165/"],["Monitoring Analytics: first-quarter 2026 report on the PJM power market","https://www.monitoringanalytics.com/reports/Market_Messages/Messages/2026q1-som-pjm-press-release.pdf"],["Monitoring Analytics: third-quarter 2026 report on the PJM power market","https://www.monitoringanalytics.com/reports/PJM_State_of_the_Market/2026/2026q3-som-pjm-sec1.pdf"]] },

{ id:"ai-worldwide", cat:"Society", a:true, worse:"no", group:"public-mood", kind:"opinion", asOf:"June 2026",

  short:"On average 55% did, in a 2026 Ipsos survey. It depends on where you live: 85% agreed in China, 38% in the United States and 34% in Canada.",
  detail:"Ipsos questioned 23,532 adults online in March and April 2026. In the United States more people disagreed, 48%, than agreed. Across all the countries, 51% said AI products make them excited and 50% said they make them nervous. The average counts every country equally, and in 15 of them, China and India among them, the people surveyed were more urban, educated or well off than the population as a whole.",

{ id:"companionship", cat:"Society", a:false, worse:"yes", group:"companions", asOf:"October 13, 2026",
  rank:2,
  q:"Do more than one in ten US adults ever use AI for companionship?",
  short:"About 4% say they do, in a February 2026 Pew survey. Among those under 30 it was 7%.",
  detail:"Looking for information was the most common use, at 42%. Pew's questions were about AI chatbots. One in ten adults said they use them for emotional support or advice, rising to one in five of those under 30. Pew recruits its panel at random. It has warned that polls people choose to join online can overcount rare things: in one, 12% of adults under 30 claimed to be licensed to operate a nuclear submarine. Character.ai, the maker of one of the largest companion apps, filed for bankruptcy protection in October 2026, citing costs and litigation.",
  src:[["Pew Research Center: Americans and AI 2026","https://www.pewresearch.org/internet/2026/06/17/americans-and-ai-2026-chatbots-smart-devices-and-views-on-impact/"],["Pew Research Center: Chatbot use by age","https://www.pewresearch.org/chart/1-in-5-adults-under-30-say-they-get-emotional-support-from-chatbots-higher-than-for-older-adults/"],["Pew Research Center: Online opt-in polls can produce misleading results","https://www.pewresearch.org/short-reads/2024/03/05/online-opt-in-polls-can-produce-misleading-results-especially-for-young-people-and-hispanic-adults/"],["CNBC: AI companion startup Character.ai files for bankruptcy","https://www.cnbc.com/2026/10/13/character-ai-chapter-11-disney-bid.html"]] },
{ id:"companion-lonely", cat:"Society", a:false, worse:"no", group:"companions", asOf:"August 2026",
  rank:3,
  q:"In a big trial, did asking people to have a daily personal chat with AI make them less lonely?",
  short:"They rated themselves slightly lonelier than people who went on as usual. The 2026 trial, in France, ran for 28 days and began with more than 12,000 adults.",
  detail:"People in the AI group were asked to have at least one personal conversation a day with an AI tool of their choice, and not all of them did so every day. The gap was under a fifth of a point on a scale of 0 to 10. A second loneliness scale showed a smaller and less certain difference, and other measures of well-being moved the wrong way, but not clearly enough to be sure. The study is a working paper. In a smaller trial in Canada, 296 first-year students spent two weeks texting a stranger, chatting with a supportive AI or writing a one-sentence journal entry each day. Only those who texted a person became less lonely, though the AI did ease bad moods.",
  safety:"The trial was not aimed at isolated people. A New York program that had nearly 1,000 older adults talk to an AI reported a drop in loneliness.",
  src:[["Fréget, Reshef and Senik: Do personal AI conversations reduce loneliness?","https://ideas.repec.org/p/ces/ceswps/_12882.html"],["Fortune: Talking to a bot might feel good, but a growing body of research suggests it won't cure loneliness","https://fortune.com/2026/08/16/ai-chatbot-research-loneliness/"],["University of British Columbia: Texting with a stranger beats a chatbot at easing loneliness","https://news.ubc.ca/2026/04/texting-with-a-stranger-beats-a-chatbot-at-easing-loneliness/"],["The same working paper, full text","https://www.ifo.de/DocDL/cesifo1_wp12882.pdf"]] },
{ id:"teens", cat:"Society", a:true, worse:"yes", group:"learning", asOf:"October 2026",
  rank:3,
  q:"Do most American teenagers use AI such as ChatGPT?",
  short:"77% of those aged 13 to 17 said they use it in their free time, at least now and then, in a spring 2026 survey by the nonprofit Common Sense Media. Pew Research Center, asking a different question, found 64% in fall 2025.",
  detail:"In the newer survey, 47% of teens used AI in their free time at least once a week. Pew surveyed 1,458 teens and their parents. About three in ten of the teens used AI chatbots, the survey's term, every day, and only about half of the parents thought their teen uses them. 54% of the teens had used one for schoolwork, and 12% for emotional support or advice. 59% said that using AI to cheat happens at least somewhat often at their school.",
