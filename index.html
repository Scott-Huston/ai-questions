  const share = `
    <section class="card stack">
      <h3>Share your result</h3>
      <label for="share-text" class="small muted">The squares show right, wrong and 50-50 answers in order, without giving the answers away.</label>
      <textarea id="share-text" readonly rows="4">${esc(text)}</textarea>
      <div class="share-links">
        <button type="button" id="copy">Copy text</button>
        ${canNative ? `<button type="button" id="native">Share…</button>` : ""}
        ${links.map(l => `<a href="${esc(l[1])}" target="_blank" rel="noopener noreferrer">${esc(l[0])}</a>`).join("")}
      </div>
      <p class="small muted" id="share-status" role="status"></p>
    </section>`;

  const review = state.answers.map((r, i) => {
    const q = byId[r.id];
    const good = r.p === 0.5 ? "mid" : ((r.p > 0.5) === r.a ? "yes" : "no");
    const you = confidenceMode ? `You: ${Math.round(r.p * 100)}% yes` : `You: ${r.p === 1 ? "yes" : "no"}`;
    return `<div class="review-item">
      <div class="row"><span class="pill ${q.a ? "yes" : "no"}">Answer: ${q.a ? "yes" : "no"}</span><span class="pill ${good}">${you}</span></div>
      <p><b>${i + 1}. ${gloss(q.q)}</b></p>
      <p class="small">${gloss(q.short)}</p>
      ${detailsBlock(q, "Detail and sources")}
    </div>`;
  }).join("");

  $app.innerHTML = `
    <header class="stack-sm"><p class="eyebrow">Results · ${s.n} questions</p><h1>How you did</h1></header>
    ${headline}
    ${awards}
    ${calib}
    ${share}
    <section class="stack-sm">
      <h3>Every question, with sources</h3>
      <div>${review}</div>
    </section>
    <div class="row"><button class="btn btn-primary" id="again" type="button">Play again</button></div>
    <footer>Evidence checked ${esc(CONFIG.checked)}. Each answer lists the date its sources were current.</footer>`;

  const status = document.getElementById("share-status");
  document.getElementById("copy").addEventListener("click", async () => {
    const box = document.getElementById("share-text");
    try { await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it anywhere."; }
    catch (e) { box.focus(); box.select(); status.textContent = "Copying is blocked here. The text is selected, so press Ctrl+C or Cmd+C."; }
  });
  if (canNative) {
    document.getElementById("native").addEventListener("click", async () => {
      try { await navigator.share(url ? { text, url } : { text }); }
      catch (e) { if (e && e.name !== "AbortError") status.textContent = "Sharing isn't available here. Use Copy text or one of the links."; }
    });
  }
  document.getElementById("again").addEventListener("click", () => { renderStart(); window.scrollTo(0, 0); });
}

// Picks the answer with the largest error and the most confident answer that was right.
// Ties go to the earlier question. A miss only counts if the player leaned the wrong way.
function pickAwards(answers) {
  let miss = null, hit = null;
  answers.forEach((r, i) => {
    const err = brierOne(r.p, r.a ? 1 : 0);
    const leanedRight = r.p !== 0.5 && (r.p > 0.5) === r.a;
    const leanedWrong = r.p !== 0.5 && !leanedRight;
    if (leanedWrong && (!miss || err > miss.err)) miss = { r, i, err };
    if (leanedRight && (!hit || err < hit.err)) hit = { r, i, err };
  });
  return { miss, hit };
}
function awardCard(kind, title, entry, byId) {
  const q = byId[entry.r.id];
  const said = Math.round(entry.r.p * 100);
  const sure = Math.round(Math.max(entry.r.p, 1 - entry.r.p) * 100);
  const line = kind === "miss"
    ? `You were ${sure}% sure the answer was ${entry.r.p > 0.5 ? "yes" : "no"}. It was ${q.a ? "yes" : "no"}.`
    : `You said ${said}% yes and the answer was ${q.a ? "yes" : "no"}. ${sure === 100 ? "Full marks." : sure + "% sure, and right."}`;
  return `<div class="award ${kind}">
    <p class="eyebrow">${esc(title)}</p>
    <p><b>${gloss(q.q)}</b></p>
    <p class="small">${line}</p>
    <p class="small muted">${gloss(q.short)}</p>
  </div>`;
}
function calibrationNote(s) {
  const gap = Math.round((s.avgConf - s.accuracy) * 100);
  if (Math.abs(gap) <= 5) return "Your confidence and your hit rate line up closely. That is good calibration.";
  if (gap > 0) return `You were about ${gap} points more confident than your hit rate justified. That is overconfidence, the most common pattern.`;
  return `Your hit rate beat your confidence by about ${-gap} points. You could afford to be bolder.`;
}

renderStart();
</script>
