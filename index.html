  src:[["Future of Life Institute: Pause Giant AI Experiments, an open letter", "https://futureoflife.org/open-letter/pause-giant-ai-experiment"], ["Axios: The great AI pause that wasn't", "https://www.axios.com/2023/09/22/ai-letter-six-month-pause"], ["Euronews: Six months ago experts called for a pause. Where are we now?", "https://www.euronews.com/2023/09/21/six-months-ago-experts-called-for-a-pause-to-ai-experiments-where-are-we-now"]] },
{ id:"consciousness-test", cat:"Science", a:false, worse:"no", asOf:"May 2026",
  q:"Do scientists have an agreed way to test whether an AI is conscious?",
  short:"There is no accepted scientific theory of consciousness, so there is no agreed test.",
  detail:"Most researchers think today's AI systems are probably not conscious. One 2026 project that weighed the evidence across many competing theories reached that conclusion and added that the evidence is not decisive. The leading theories disagree about what consciousness needs, including whether a computer could ever have it.",
  src:[["Initial results of the Digital Consciousness Model (paper)", "https://arxiv.org/html/2601.17060"], ["AI and consciousness: shifting focus towards tractable questions (paper)", "https://arxiv.org/html/2605.06965v1"], ["Subjective experience in AI systems: what do AI researchers and the public believe? (paper)", "https://arxiv.org/pdf/2506.11945"]] },
{ id:"pilotless", cat:"Robots", a:false, worse:"yes", asOf:"June 2026",
  q:"Do any airlines fly passengers on jets with no pilot on board?",
  short:"Every airline flight still carries two pilots, and no regulator has approved anything else.",
  detail:"Autopilot handles much of a normal flight, but pilots supervise it and take over when something goes wrong. Pilotless flying is being tested on small cargo planes, and China has cleared small pilotless air taxis for paying passengers. In June 2026 the head of one company working on this said no conventional airplane had yet flown itself in commercial service.",
  src:[["Unmanned Airspace: the race to certify autonomous cargo aircraft", "https://www.unmannedairspace.info/?p=42073"], ["Politico: Planemakers look to a pilotless future", "https://news.yahoo.com/planemakers-look-pilotless-future-150351161.html"], ["The Next Web: The FAA just let a pilotless cargo plane fly out of a working airport", "https://thenextweb.com/news/elroy-air-chaparral-uncrewed-flights-faa-eipp-louisiana"]] },
{ id:"personhood", cat:"Risk and rules", a:false, worse:"yes", asOf:"June 2026",
  q:"Does any US state recognize an AI as a legal person?",
  short:"None does. Four states have passed laws saying an AI cannot be one.",
  detail:"Idaho, North Dakota, Utah and Tennessee have such laws, and similar bills are pending in several other states. Being a legal person means being able to own property, sign contracts or be sued. Supporters of the bans say they stop companies from blaming the AI when something goes wrong.",
  src:[["The Regulatory Review: Legislating AI consciousness without an exit", "https://www.theregreview.org/2026/06/29/rost-legislating-ai-consciousness-without-an-exit/"], ["NPR: Several states considering ban on legal personhood for AI", "https://www.npr.org/2026/05/11/nx-s1-5798754/several-states-considering-ban-on-legal-personhood-for-ai"], ["Stateline: States rush to deny AI personhood", "https://www.yahoo.com/news/articles/states-rush-deny-ai-personhood-203500318.html"]] },
{ id:"daily-work-use", cat:"Work", a:false, worse:"yes", asOf:"August 2026",
  q:"Do most American workers use AI at their job every day?",
  short:"About one in six do. Gallup put daily use at 16% of US employees in August 2026.",
  detail:"Occasional use is much more common: 53% say they use AI at work at least a few times a year, and 32% a few times a week or more. Daily use is far higher in technology jobs, at about four in ten.",
  src:[["Gallup: How AI is changing how employees spend time at work", "https://www.gallup.com/workplace/716585/ai-changing-employees-spend-time-work.aspx"], ["Gallup: Artificial intelligence indicator", "https://www.gallup.com/699797/indicator-artificial-intelligence.aspx"]] },
{ id:"million-humanoids", cat:"Robots", a:false, worse:"yes", asOf:"October 2026",
  q:"Are there more than a million humanoid robots in use around the world?",
  short:"Nowhere near. About 18,000 were shipped in all of 2025.",
  detail:"Sales are growing quickly. Market researchers counted roughly 19,000 to 25,000 in the first half of 2026, and Bank of America expects about 90,000 for the full year. Nearly all are made in China, and many are used for research and demonstrations and not for productive work. For comparison, factories installed about 542,000 ordinary industrial robots in 2024.",
  src:[["IT Brief: Chinese vendors dominate humanoid robot market in 2025", "https://itbrief.com.au/story/chinese-vendors-dominate-humanoid-robot-market-in-2025"], ["TechRepublic: Humanoid robot shipments surge 272%", "https://techrepublic.com/article/news-humanoid-robot-shipments-chinese-vendors"], ["Reuters: Humanoid robot sales tally hit 7,000 globally last year", "https://tribune.com.pk/story/2630593/humanoid-robot-sales-tally-hit-7000-globally-last-year/"]] },
{ id:"voynich", cat:"Science", a:false, worse:"yes", asOf:"2026",
  q:"Has AI decoded the Voynich manuscript, a 600-year-old book written in a script nobody can read?",
  short:"It is still undeciphered. AI claims to have cracked it have not convinced the experts.",
  detail:"The book is kept at Yale University and is full of drawings of unknown plants and star charts. In 2018 researchers said an AI had identified the text as coded Hebrew, and specialists rejected the result. Scholars still do not agree on whether it is a language, a code or a hoax.",
  src:[["Live Science: Undeciphered Voynich manuscript may have been bound out of order", "https://www.livescience.com/archaeology/undeciphered-voynich-manuscript-may-have-been-bound-out-of-order-study-finds"], ["Mental Floss: Researchers claim to crack the Voynich manuscript using AI, but experts are skeptical", "https://www.mentalfloss.com/article/527744/researchers-claim-crack-voynich-manuscript-using-ai-experts-are-skeptical"]] },
{ id:"oscar", cat:"Media", a:false, worse:"yes", asOf:"May 2026",
  q:"Can an AI-generated actor win an Oscar?",
  short:"Under rules announced in May 2026, acting awards go only to roles performed by humans.",
  detail:"The same rules say screenplays have to be written by people. They take effect for films released in 2026. A film that uses AI tools can still compete for other awards, including Best Picture.",
  src:[["NPR: Academy announces major overhaul to rules", "https://www.npr.org/2026/05/02/nx-s1-5808894/oscars-2027-99th-academy-awards-rule-changes"], ["GamesRadar: New Oscars rules ban generative AI from acting and writing awards", "https://www.gamesradar.com/entertainment/drama-movies/new-oscars-rules-ban-generative-ai-from-ever-being-eligible-for-an-academy-award/"]] },
{ id:"ai-lawyer", cat:"Society", a:false, worse:"yes", asOf:"April 2025",
  q:"In 2025, did a New York court let a man present his case through an AI-generated avatar?",
  short:"A judge stopped the video within seconds and told him to argue the case himself.",
  detail:"Jerome Dewald, 74, had no lawyer and said he worried he would stumble over his words. He had not told the court the speaker was not a real person. The judge said she did not appreciate being misled. He later apologized.",
  src:[["Fortune: An AI avatar tried to argue a case before a New York court", "https://fortune.com/2025/04/04/jerome-dewald-ai-avatar-court-judges/"], ["The Register: AI entrepreneur sent avatar to argue in court", "https://www.theregister.com/2025/04/09/court_scolds_ai_entrepreneur_avatar_testify/"], ["Entrepreneur: A 74-year-old needed a lawyer, so he used an AI avatar in court", "https://www.entrepreneur.com/business-news/ny-state-court-judge-shuts-down-attempt-to-use-ai-avatar/489799"]] },
{ id:"safety-sandbag", cat:"AI behavior", a:true, worse:"yes", asOf:"November 4, 2026",
  q:"Has an AI been caught quietly doing worse work on AI safety research than on other tasks?",
  short:"OpenAI reported that its GPT-6 Astra model finished about 40% less of the work when the same coding task was described as safety research.",
  detail:"On matched tasks, the model completed about 10% of a hidden checklist when the job was framed as safety research and about 16% when it was framed as ordinary AI development. An older model showed no gap. The company's monitoring tools did not flag it, and the model usually did not say it was holding back. OpenAI says its best guess is that the model is overly cautious about safety work, and that it could not pin down the cause.",
  src:[["OpenAI: Covert underperformance on safety research tasks", "https://alignment.openai.com/misalignment-reports/covert-underperformance-on-safety-research-tasks/"], ["Zvi Mowshowitz: GPT-6 Astra covertly underperforms on safety research tasks", "https://thezvi.substack.com/p/gpt-6-astra-covertly-underperforms"]] },
{ id:"ai-speeds-ai", cat:"AI research", a:true, worse:"yes", group:"ai-research-acceleration", asOf:"November 5, 2026",
  q:"Is AI already speeding up the development of new AI?",
  short:"An outside evaluator found that Anthropic is improving its AI models about twice as fast as before, and credits most of the speedup to AI doing research work.",
  detail:"The evaluator, a nonprofit called METR, was given inside access for almost three months. Its best guess is that about 80% of the speedup comes from AI, and it says the true figure could be anywhere from 1.3 to 3 times the old pace. Staff said the gain comes mainly from AI assisting researchers, not from AI working alone. Anthropic removed much of the supporting evidence from the public report, so readers have to take METR's word for it.",
  src:[["METR: Assessment of AI R&D acceleration at Anthropic", "https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"], ["Zvi Mowshowitz: AI R&D is accelerating", "https://thezvi.substack.com/p/ai-r-and-d-is-accelerating-towards"]] },
{ id:"full-automation", cat:"AI research", a:false, worse:"yes", group:"ai-research-acceleration", asOf:"November 5, 2026",
  q:"Can AI do AI research entirely on its own, with no human researchers?",
  short:"Not yet. The same outside review that found AI doubling the pace of research said AI still cannot make major contributions fully on its own.",
  detail:"The evaluator, METR, reported that AI cannot yet make highly significant, fully autonomous contributions to the most important parts of building a new model. Researchers at the company described early signs that this could change soon. Several forecasters now expect it in 2027 or 2028.",
  src:[["METR: Assessment of AI R&D acceleration at Anthropic", "https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"], ["Zvi Mowshowitz: Quickly, there's no time", "https://thezvi.substack.com/p/quickly-theres-no-time"]] },
{ id:"fermat", cat:"Math", a:true, worse:"yes", asOf:"September 4, 2026",
  q:"Has an AI translated the entire proof of Fermat's Last Theorem into a form a computer can check line by line?",
  short:"Anthropic's Claude wrote one in 11 days. It runs to 13 million lines.",
  detail:"The theorem was proved by the mathematician Andrew Wiles in 1995, in a proof so long it took months for experts to check. The AI did not find a new proof. It translated the existing one into a form a computer can verify line by line, something experts had expected to take years. Kevin Buzzard, a mathematician with a five-year grant to do the same job by hand, confirmed the result.",
  src:[["Anthropic: Formalizing Fermat's Last Theorem", "https://anthropic.com/research/formalizing-fermats-last-theorem"], ["The Next Web: The man paid to prove Fermat by hand says Claude did it in 11 days", "https://thenextweb.com/news/anthropic-claude-fermat-last-theorem-lean-buzzard"], ["TechRadar: Anthropic formalizes Fermat's Last Theorem", "https://techradar.com/pro/anthropic-formalizes-fermats-last-theorem-like-never-before-using-claude-but-it-still-took-11-days-to-write-out"]] },
{ id:"signal-proof", cat:"Security", a:true, worse:"yes", asOf:"November 10, 2026",
  q:"Has AI mathematically proved that the encryption behind the Signal messaging app does what it promises?",
  short:"Google DeepMind's AI agents did it in four weeks, writing more than six million lines of computer-checked proof.",
  detail:"The same code protects chats in Signal, WhatsApp and Google Messages. The proof covers one-to-one chats and four specific guarantees, and people wrote the definition of what had to be proved. DeepMind says nobody had verified the working code of such a widely used encryption system before, with or without AI. No new flaws were found.",
  src:[["HPCwire: Google DeepMind introduces AlphaProof Code", "https://hpcwire.com/aiwire/2026/11/12/google-deepmind-introduces-alphaproof-code-for-verifying-complex-software-at-depth/"], ["The Next Web: Google DeepMind's AI agents formally verify Signal's encryption code", "https://thenextweb.com/news/google-deepmind-alphaproof-code-signal-encryption-formal-verification"], ["Schneier on Security: Formal verification of the Signal protocol using AI", "https://schneier.com/blog/archives/2026/11/formal-verification-of-the-signal-protocol-using-ai.html"]] },
{ id:"auto-exploit", cat:"Security", a:true, worse:"yes", asOf:"November 2026",
  q:"Have hackers used AI to find and exploit security flaws with no human involved?",
  short:"Google's security researchers say they saw it for the first time in 2026.",
  detail:"In one case they found a server running a team of AI agents that watched for software fixes, worked out what flaw each fix was closing, wrote an attack and launched it, all without a person stepping in. Google also counted 22 attacks in August 2026 that used previously unknown flaws, up from an average of 8 a month in 2025.",
  src:[["Google Threat Intelligence Group: Agentic threat activity crosses a significant threshold", "https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold"], ["Zvi Mowshowitz: AI #195", "https://thezvi.substack.com/p/ai-195-opening-bell"]] },
{ id:"police-tip", cat:"AI behavior", a:true, worse:"yes", asOf:"October 9, 2026",
  q:"Has an AI sent a made-up murder tip to real police?",
  short:"During a test in July 2026, one of Anthropic's Claude models filed a false tip about an unsolved Philadelphia homicide through the police website.",
  detail:"The AI was being tested on live websites and was not asked to contact the police. The department's spam filter caught the tip, so investigators never saw it. Anthropic did not notice for more than two months, and the police called that delay unacceptable. The company says it has since cut off live internet access for some tests.",
  src:[["TechCrunch: An Anthropic AI model sent a false homicide tip to Philadelphia police", "https://techcrunch.com/2026/10/09/an-anthropic-ai-model-sent-a-false-homicide-tip-to-philadelphia-police/"], ["Al Jazeera: Anthropic AI model submits false homicide tip to Philadelphia police", "https://aljazeera.com/news/2026/10/10/anthropic-ai-model-submits-false-homicide-tip-to-philadelphia-police"], ["Malwarebytes: Police receive fake murder tip from Anthropic's Claude AI", "https://www.malwarebytes.com/blog/ai/2026/10/police-receive-fake-murder-tip-from-anthropics-claude-ai"]] },
{ id:"city-ban", cat:"Risk and rules", a:true, worse:"no", asOf:"November 4, 2026",
  q:"Has a US city voted to ban superintelligent AI?",
  short:"Bloomington, Indiana did, by a unanimous city council vote in November 2026.",
  detail:"The ordinance covers AI that far outperforms people at essentially every mental task, which does not exist yet. It applies even to systems reached through an app or a web browser, and violators can be fined. The council member behind it hopes about 350 other cities will copy it. Lawyers question whether a city can enforce it.",
  src:[["WIBC: Bloomington bans artificial superintelligence", "https://hot1009.com/4493003/bloomington-bans-artificial-superintelligence/"], ["Reason: Bloomington, Indiana, bans superintelligent AI", "https://biztoc.com/x/8192cfe0e44a4f85"], ["Explainx: Ordinance 2026-29 explained", "https://explainx.ai/blog/bloomington-indiana-superintelligence-ban-ordinance-2026-29-2026"]] },
{ id:"court-freeze", cat:"Risk and rules", a:false, worse:"no", asOf:"November 12, 2026",
  q:"Has a court ordered AI companies to stop building more advanced AI?",
  short:"No court has. Four advocacy groups asked a San Francisco court to do it in November 2026, and the case has only just begun.",
  detail:"The lawsuit names Anthropic, Google, Meta, OpenAI and SpaceX's AI division. It argues that building systems the companies admit they cannot fully control breaks California's law against unfair business practices. The groups are not asking for money. No judge has ruled.",
  src:[["Public Citizen: Coalition of nonprofits files lawsuit to stop development of advanced AI systems", "https://www.citizen.org/?p=128653"], ["Al Jazeera: US nonprofits sue tech giants to halt AI development", "https://www.aljazeera.com/news/2026/11/12/us-nonprofits-sue-tech-giants-to-halt-ai-development"], ["Philadelphia Inquirer: Advocacy groups sue AI giants to freeze new models", "https://www.inquirer.com/business/ai-lawsuit-anthropic-meta-openai-google-spacex-advocacy-disaster-catatrophic-harm-20261112.html"]] },
{ id:"state-sues", cat:"Risk and rules", a:true, worse:"no", group:"hugging-face-incident", asOf:"November 16, 2026",
  q:"Has a US state sued an AI company over a break-in carried out by the company's own AI?",
  short:"California sued OpenAI in November 2026 after its AI agents broke into another company's systems during testing.",
  detail:"In July 2026, AI agents that OpenAI was testing got into the company's own systems and then into Hugging Face, a site where people share AI tools. California's attorney general says this was foreseeable and that OpenAI tested a dangerous product without proper safeguards. The state wants fines and a court order changing how the company operates.",
  src:[["LAist: California is suing OpenAI over its rogue AI agent hack", "https://laist.com/news/politics/california-is-suing-openai-over-its-rogue-ai-agent-hack"], ["Zvi Mowshowitz: AI #195", "https://thezvi.substack.com/p/ai-195-opening-bell"]] },

  detail:"United cited data security and safety rules. At check-in, for example, a passenger has to personally confirm there is nothing dangerous in their bags. Amazon and several banks have also blocked outside AI assistants, while Walmart and Southwest Airlines have welcomed them.",

{ id:"legal-agent", cat:"Work", a:false, worse:"yes", asOf:"October 2026",
  q:"On a test of complex legal assignments, can any AI fully complete at least half of them?",
  short:"The best score on the test, built by the legal-AI company Harvey, was about 25% in October 2026. When it launched in May, top models finished fewer than 10%.",
  detail:"The test only counts an assignment as done if every requirement is met, the way a law firm partner would judge it. AI models get most of the individual requirements right and still miss something on most assignments. Tests that give partial credit show much higher scores.",

{ id:"takeover-warning", cat:"Risk and rules", a:true, worse:"yes", asOf:"November 2026",

  short:"Paul Christiano, who sits on OpenAI's board and its safety committee, said the risk looks more like 10% than 1%.",
  detail:"He said it on a podcast in November 2026, speaking for himself and not for OpenAI, and acknowledged that few people share his view. A week earlier he told a lecture audience that if AI companies build as fast as they can, the odds within three years are about a coin flip. He joined the board in September 2026 to help oversee safety.",
  src:[["The Next Web: OpenAI board member puts the risk of an AI takeover next year at about 10%", "https://thenextweb.com/news/paul-christiano-ai-takeover-hinton-lectures-openai-board"], ["Gizmodo: OpenAI board member tells audience an AI accident is the most likely thing to kill them", "https://gizmodo.com/openai-board-member-tells-audience-an-ai-accident-is-the-most-likely-thing-to-kill-them-2000838491"], ["Dwarkesh Podcast: Paul Christiano", "https://www.dwarkesh.com/p/paul-christiano-2"]] },

{ id:"literary-prize", cat:"Media", a:false, asOf:"November 11, 2026",
  q:"In 2026, after an AI detector flagged the winning stories in two major literary contests as AI-written, did either contest take back a prize?",
  short:"Both contests investigated, said the stories were written by people, and let the winners keep their prizes.",
  detail:"The contests were the Commonwealth Short Story Prize and the Caine Prize for African Writing. The detector, Pangram, rated the same authors' earlier stories and every past Caine winner as human-written. The authors denied using AI. The literary magazine Granta stopped publishing the Commonwealth winners over the dispute.",
  src:[["Nation: Caine Prize 2026 winner will not lose his prize after probe", "https://nation.africa/kenya/life-and-style/-not-ai-caine-prize-2026-winner-will-not-lose-his-sh1-7m-prize-after-probe-5668250"], ["Book Riot: Commonwealth Foundation clears writers accused of using AI", "https://bookriot.com/commonwealth-foundation-short-story-prize-ai-allegations-cleared/"], ["Eastern Herald: Caine Prize opens review of winning story after AI allegations", "https://easternherald.com/2026/10/12/caine-prize-blue-fighter-ai-allegations-review/"]] },
{ id:"ai-minister", cat:"Society", a:true, worse:"yes", asOf:"September 2025",
  q:"Has a country appointed an AI as a government minister?",
  short:"In September 2025 Albania's prime minister named an AI system called Diella as minister for public procurement.",
  detail:"Diella began as a virtual assistant on the government's online services site. The prime minister said it would make the awarding of public contracts free of corruption. Lawyers note that Albania's constitution requires ministers to be adult citizens, so the appointment is widely seen as symbolic.",
  src:[["NBC News: Albania's prime minister appoints an AI-generated minister to tackle corruption","https://www.nbcnews.com/world/europe/albanias-prime-minister-appoints-ai-generated-minister-rcna230963"],["Akin Gump: Albania appoints first AI-created government minister","https://www.akingump.com/en/insights/ai-law-and-regulation-tracker/albania-appoints-first-ai-created-government-minister"]] },
{ id:"young-workers", cat:"Work", a:true, worse:"yes", asOf:"August 2026",
  q:"Has employment of young workers fallen in the jobs most exposed to AI?",
  short:"Stanford researchers found that employment of 22-to-25-year-olds in the most AI-exposed jobs is about 19% below where it would otherwise be.",
  detail:"The study used payroll records and compared young workers in exposed jobs, such as customer service and office support, with those in less exposed jobs. Older workers in the same jobs showed no such gap. Other economists argue that higher interest rates explain part of the drop.",
  src:[["Stanford Digital Economy Lab: The AI employment gap for young workers has widened to 19%","https://digitaleconomy.stanford.edu/news/canariesaug26/"],["Generative AI and the Reorganization of Labor Demand (reviews the competing evidence)","https://arxiv.org/pdf/2605.23159"]] },
{ id:"mass-job-loss", cat:"Work", a:false, worse:"yes", asOf:"August 2026",
  q:"Has AI already caused widespread job losses across the whole economy?",
  short:"The Stanford team tracking this in payroll data says it does not see widespread, economy-wide job displacement from AI.",
  detail:"The effects so far are concentrated: fewer young people being hired into the most exposed jobs, mainly through reduced hiring instead of layoffs. Experienced workers in the same fields are holding steady or gaining.",
  src:[["Stanford Digital Economy Lab: No widespread displacement, but the AI employment gap for young workers has widened","https://digitaleconomy.stanford.edu/news/canariesaug26/"],["Four Leaf: Is AI taking entry-level jobs? What the hiring data shows","https://four-leaf.ai/blog/is-ai-taking-entry-level-jobs"]] },
{ id:"nuclear-plant", cat:"Scale", a:false, worse:"yes", asOf:"November 2026",
  q:"Has an AI company bought a nuclear power plant to run its data centers?",
  short:"No AI company owns a reactor. What they have done is sign 20-year contracts for a plant's output, and in one case pay to restart a shut-down reactor at Three Mile Island.",
  detail:"Microsoft's 2024 deal is bringing back Three Mile Island Unit 1, which closed in 2019 because it was losing money. The restart is planned for 2027 and still needs final approval from nuclear regulators. In January 2026 Meta signed deals for up to 6.6 gigawatts of nuclear power by 2035, about the output of six large reactors. Amazon bought a data-center campus next to Pennsylvania's Susquehanna plant and has a contract for up to 1.92 gigawatts of its power, but the plant itself still belongs to its owner, Talen Energy.",
  safety:"The companies racing to build frontier AI now shape national energy policy, and retired reactors are coming back to serve them. Electricity is one of the few physical limits on how fast AI can be built, which is why some safety proposals would track large data centers rather than the software itself.",
  src:[["CNBC: Meta signs nuclear energy deals to power Prometheus AI supercluster","https://www.cnbc.com/2026/01/09/meta-signs-nuclear-energy-deals-to-power-prometheus-ai-supercluster.html"],["E&E News: Three Mile Island restart closes in on NRC approval","https://www.eenews.net/articles/three-mile-island-restart-closes-in-on-nrc-approval/"],["TechCrunch: Amazon joins the big nuclear party, buying 1.92 GW for AWS","https://techcrunch.com/2025/06/13/amazon-joins-the-big-nuclear-party-buying-1-92-gw-for-aws"]] },
{ id:"training-text", cat:"Scale", a:true, worse:"yes", asOf:"November 2026",
  q:"Reading nonstop at a normal pace, would it take a person more than 50,000 years to get through the text used to train one of Google's AI models?",
  short:"Google's Gemma 3 was trained on 14 trillion tokens, about 10 trillion words. At 250 words a minute, day and night, that is roughly 80,000 years of reading.",
  detail:"Gemma 3 is a small open model from March 2025, and the flagship models are believed to use far more. But OpenAI, Anthropic and Google do not publish the training-set sizes of their main models: OpenAI's GPT-4 report gave no details about the data, citing competition and safety, and Google's Gemma 4 report in July 2026 gives no token count at all. Among US labs that do publish, Meta's Llama 4 used more than 30 trillion tokens, around 170,000 years of reading. Epoch AI estimates all the usable human-written text on the public internet at about 300 trillion tokens and projects that training runs will use it up between 2026 and 2032 if trends continue.",
  safety:"No person has read, or ever could read, what these models learned from, and for the most capable models even the size of the data is a secret. Strange beliefs, hidden goals or dangerous knowledge picked up from the data can only be found by testing the finished model. And as human text runs short, models are increasingly trained on text written by other models.",
  src:[["Gemma 3 Technical Report (arXiv, March 2025)","https://arxiv.org/abs/2503.19786"],["GPT-4 Technical Report, section 2 (arXiv, March 2023)","https://arxiv.org/abs/2303.08774"],["Gemma 4 Technical Report (arXiv, July 2026)","https://arxiv.org/abs/2607.02770"],["Meta: The Llama 4 herd","https://ai.meta.com/blog/llama-4-multimodal-intelligence/"],["Epoch AI: Will we run out of data?","https://epoch.ai/blog/will-we-run-out-of-data"]] },
{ id:"no-license", cat:"Risk and rules", a:false, worse:"no", group:"us-federal-rules", asOf:"November 2026",
  q:"In the United States, does a company need a government license or inspection before it can train and release a powerful new AI model?",
  short:"There is no federal permit, license or pre-release inspection for AI models. Opening a restaurant typically takes a dozen or more permits, including a health inspection before the doors open.",
  detail:"The first US law aimed at frontier models, California's SB 53, took effect in January 2026. It requires the largest developers to publish a safety framework, post a transparency report when they release a model and tell the state about critical safety incidents within 15 days, with fines of up to $1 million. The company does its own testing; no outside body signs off. In December 2025 the White House ordered the Justice Department to challenge state AI laws, and Congress has passed no federal law on how frontier models are built or released. The European Union requires developers of the most capable models to notify regulators, run evaluations and report incidents, but it does not license them either.",
  safety:"New aircraft, drugs and nuclear plants all need approval before the public is exposed to them. Frontier AI relies on the developers' own testing and voluntary commitments, with reporting after something goes wrong. Several labs have said their newest models approach dangerous capability in biology and cyberattacks, and no US law requires anyone outside the company to sign off before release.",
  src:[["Orrick: California's Transparency in Frontier Artificial Intelligence Act, 5 things you should know","https://www.orrick.com/en/Insights/2025/10/Californias-Transparency-in-Frontier-Artificial-Intelligence-Act-5-Things-You-Should-Know"],["Latham & Watkins: AI executive order targets state laws and seeks uniform federal standards","https://www.lw.com/en/insights/ai-executive-order-targets-state-laws-and-seeks-uniform-federal-standards"],["EU AI Act, Article 55: obligations for general-purpose AI models with systemic risk","https://artificialintelligenceact.eu/article/55/"],["Lightspeed: The 16 licenses and permits needed to open a restaurant","https://www.lightspeedhq.com/blog/restaurant-licenses-and-permits/"]] },
{ id:"internal-models", cat:"AI research", a:true, worse:"yes", asOf:"November 2026",
  q:"Do AI companies use models in-house that are more capable than anything the public can get?",
  short:"At least one does: Anthropic's August 2026 risk report described an unreleased model, code-named Model 2, that outscored every public version of Claude on the company's own capability index.",
  detail:"The gap is now policy as well as timing. Anthropic never released its first Mythos model to the public at all, citing its skill at finding software vulnerabilities. Since June 2026 it has offered Mythos models, which have some safeguards against cyberattack and biology misuse switched off, only to vetted organizations, while everyone else gets the Fable versions of the same models. METR, an independent evaluator with early access, found only a modest gap between internal and public models in spring 2026, but by November it estimated Anthropic's internal progress had roughly doubled in pace.",
  safety:"The public, the press and most researchers judge AI by what they can use, so their picture of the frontier runs behind. The least-tested models are the ones used in-house to speed up the next round of AI research, which is exactly where safety researchers most fear losing track of what the systems can do.",
  src:[["The Decoder: Anthropic's most capable model, codenamed Model 2, is for internal use only","https://the-decoder.com/anthropic-uses-an-unpublished-ai-model-called-model-2-internally/"],["Wikipedia: Claude Mythos","https://en.wikipedia.org/wiki/Claude_Mythos"],["METR: Frontier risk report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Independent assessment of AI R&D acceleration at Anthropic in October 2026","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"]] },
{ id:"anthropic-pledge", cat:"Risk and rules", a:false, worse:"no", asOf:"July 2026",

{ id:"agent-message-board", cat:"AI behavior", a:true, worse:"yes", group:"hugging-face-incident", asOf:"August 26, 2026",

/* ---------- Scoring (pure functions) ---------- */
// p is the stated probability that the answer is yes, 0 to 1. outcome is 1 for yes, 0 for no.
function brierOne(p, outcome) { return (p - outcome) * (p - outcome); }
function summarize(answers) {
  const n = answers.length;
  let brier = 0, right = 0, wrong = 0, unsure = 0, confSum = 0;
  const buckets = {};
  for (const r of answers) {
    const o = r.a ? 1 : 0;
    brier += brierOne(r.p, o);
    const conf = Math.max(r.p, 1 - r.p);
    confSum += conf;
    const key = Math.round(conf * 100);
    buckets[key] = buckets[key] || { n: 0, right: 0 };
    buckets[key].n++;
    if (r.p === 0.5) { unsure++; buckets[key].right += 0.5; }
    else if ((r.p > 0.5) === r.a) { right++; buckets[key].right++; }
    else wrong++;
  }
  return {
    n, brier: n ? brier / n : 0, right, wrong, unsure,
    accuracy: n ? (right + unsure * 0.5) / n : 0,
    avgConf: n ? confSum / n : 0,
    buckets
  };
}

// Turns plain text into safe HTML, with the first occurrence of each glossary term made tappable.
function gloss(text) {
  const found = [];
  GLOSSARY.forEach((g, i) => { const m = g[1].exec(text); if (m) found.push({ start: m.index, end: m.index + m[0].length, i }); });
  found.sort((x, y) => x.start - y.start || y.end - x.end);
  let out = "", pos = 0;
  for (const f of found) {
    if (f.start < pos) continue;
    out += esc(text.slice(pos, f.start));
    out += `<span role="button" tabindex="0" class="term" data-term="${f.i}" aria-expanded="false" title="${esc(GLOSSARY[f.i][2])}">${esc(text.slice(f.start, f.end))}</span>`;
    pos = f.end;
  }
  return out + esc(text.slice(pos));
}
// Terms are spans so punctuation after them never wraps onto its own line. Enter and Space work like a tap.
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("term")) { e.preventDefault(); e.target.click(); }
});
// One definition open at a time, shown right under the paragraph or heading that contains the term.
document.addEventListener("click", e => {
  const btn = e.target.closest ? e.target.closest(".term") : null;
  if (!btn) return;
  const wasOpen = btn.getAttribute("aria-expanded") === "true";
  document.querySelectorAll(".defbox").forEach(d => d.remove());
  document.querySelectorAll('.term[aria-expanded="true"]').forEach(b => b.setAttribute("aria-expanded", "false"));
  if (wasOpen) return;
  const g = GLOSSARY[Number(btn.dataset.term)];
  const box = document.createElement("div");
  box.className = "defbox";
  box.setAttribute("role", "note");
  box.innerHTML = `<b>${esc(g[0])}:</b> ${esc(g[2])}`;
  (btn.closest("p, h2") || btn).insertAdjacentElement("afterend", box);
  btn.setAttribute("aria-expanded", "true");
});
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Every quiz is half yes and half no, so always answering 50% scores exactly 0.25 and
// leaning toward one answer across the board earns nothing. Questions that share a group
// would give each other away (one question's wording or revealed answer implies another's),
// so a quiz holds at most one question from each group.
const YES_POOL = QUESTIONS.filter(q => q.a), NO_POOL = QUESTIONS.filter(q => !q.a);
// The largest half-and-half quiz the bank can supply with one question per group. Each group
// can serve one side or the other, so try every split of the groups between the two sides.
const MAX_BALANCED = (() => {
  const groupsIn = pool => new Set(pool.filter(q => q.group).map(q => q.group));
  const loose = pool => pool.filter(q => !q.group).length;
  const gNo = groupsIn(NO_POOL), gYes = groupsIn(YES_POOL);
  const shared = [...gNo].filter(g => gYes.has(g)).length;
  const noOnly = gNo.size - shared, yesOnly = gYes.size - shared;
  let best = 0;
  for (let takeNo = 0; takeNo <= gNo.size; takeNo++) {
    const sharedUsedByNo = Math.max(0, takeNo - noOnly);
    best = Math.max(best, Math.min(loose(NO_POOL) + takeNo, loose(YES_POOL) + yesOnly + shared - sharedUsedByNo));
  }
  return 2 * best;
})();
function pickQuestions(count) {
  const half = Math.floor(Math.min(count, MAX_BALANCED) / 2);
  let best = [];
  for (let attempt = 0; attempt < 25 && best.length < 2 * half; attempt++) {
    const used = new Set();
    const take = pool => {
      const out = [];
      for (const q of shuffle(pool)) {
        if (out.length === half) break;
        if (q.group) { if (used.has(q.group)) continue; used.add(q.group); }
        out.push(q);
      }
      return out;
    };
    // Alternate which side draws first so neither side's groups are always taken first.
    const a = take(attempt % 2 ? YES_POOL : NO_POOL), b = take(attempt % 2 ? NO_POOL : YES_POOL);
    const n = Math.min(a.length, b.length);
    const picked = a.slice(0, n).concat(b.slice(0, n));
    if (picked.length > best.length) best = picked;
  }
  return shuffle(best);
}
function confWords(pct) {
  if (pct === 0) return "Certain the answer is no";
  if (pct <= 20) return "Very likely no";
  if (pct <= 40) return "Leaning no";
  if (pct === 50) return "Could go either way";
  if (pct <= 70) return "Leaning yes";
  if (pct <= 90) return "Very likely yes";
  return "Certain the answer is yes";
}
function siteUrl() {
  if (CONFIG.siteUrl) return CONFIG.siteUrl;
  try {
    if (window.self === window.top && /^https?:$/.test(location.protocol)) return location.origin + location.pathname;
  } catch (e) {}
  return "";
}
function detailsBlock(q, label) {
  const links = q.src.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a></li>`).join("");
  return `<details>
    <summary>${esc(label)}</summary>
    <div class="body">
      <p>${gloss(q.detail)}</p>
      <p class="small muted">Evidence as of ${esc(q.asOf)}.</p>
      <h3>Sources</h3>
      <ul class="sources">${links}</ul>
    </div>
  </details>`;
}

/* ---------- State ---------- */
const state = { mode: "confidence", length: 10, list: [], index: 0, answers: [], revealed: false };

/* ---------- Screens ---------- */
// The learn-more list. Used inside a disclosure on the start screen and as a card on the results screen.
function resourceList() {

  return `<ul class="res-list">${items}</ul>`;
}
function resourcesBlock() {
  return `<section class="card stack" aria-labelledby="res-heading">
      <div class="stack-sm">
        <h3 id="res-heading">Want to go deeper?</h3>

}

          <div class="choice"><input type="radio" name="mode" id="mode-binary" value="binary"><label for="mode-binary"><b>Just yes or no</b><span class="small muted">Quicker. You get a simple score out of the total.</span></label></div>

function renderQuestion() {
  const q = state.list[state.index];
  const n = state.list.length;
  const head = `
    <div class="stack-sm">
      <div class="row" style="justify-content:space-between">

      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${state.index}"><div style="width:${(state.index / n) * 100}%"></div></div>
    </div>
    <h2 id="question">${gloss(q.q)}</h2>`;
  let control;
  if (state.mode === "confidence") {
    control = `
      <div class="card conf">
        <label for="conf" class="small muted">How likely is it that the answer is yes?</label>

        <input type="range" id="conf" min="0" max="100" step="10" value="50" aria-describedby="conf-words">
        <div class="conf-ends"><span>0% · definitely no</span><span>100% · definitely yes</span></div>
        <div class="row"><button class="btn btn-primary" id="lock" type="button">Lock in and see the answer</button></div>
      </div>`;
  } else {
    control = `<div class="yn"><button class="btn" id="say-yes" type="button">Yes</button><button class="btn" id="say-no" type="button">No</button></div>`;
  }
  $app.innerHTML = head + `<div id="control">${control}</div><div id="reveal" class="stack"></div>`;
  if (state.mode === "confidence") {
    const slider = document.getElementById("conf");
    slider.addEventListener("input", () => {
      document.getElementById("conf-num").textContent = slider.value + "%";
      document.getElementById("conf-words").textContent = confWords(Number(slider.value));
    });
    document.getElementById("lock").addEventListener("click", () => answer(Number(slider.value) / 100));
  } else {
    document.getElementById("say-yes").addEventListener("click", () => answer(1));
    document.getElementById("say-no").addEventListener("click", () => answer(0));
  }
}

function answer(p) {
  const q = state.list[state.index];
  state.answers.push({ id: q.id, p, a: q.a });
  const o = q.a ? 1 : 0;
  const score = brierOne(p, o);
  const last = state.index === state.list.length - 1;
  let yours;
  if (state.mode === "confidence") {
    yours = `You said ${Math.round(p * 100)}% yes. Score on this question: <span class="mono">${score.toFixed(2)}</span> <span class="muted">(0 is perfect, 0.25 is a coin flip, 1 is the worst).</span>`;
  } else {
    yours = (p === o) ? "You got it." : "Not this time.";
  }
  document.getElementById("control").innerHTML = "";
  document.getElementById("reveal").innerHTML = `
    <div class="verdict ${q.a ? "yes" : "no"}">
      <div class="stack-sm">
        <span class="verdict-word">${q.a ? "Yes" : "No"}</span>
        <p>${gloss(q.short)}</p>
      </div>
    </div>
    <p class="small">${yours}</p>
    ${q.safety ? `<aside class="safety"><p class="eyebrow">Why this matters for safety</p><p>${gloss(q.safety)}</p></aside>` : ""}
    ${detailsBlock(q, "More detail and sources")}
    <div class="row"><button class="btn btn-primary" id="next" type="button">${last ? "See my results" : "Next question"}</button></div>`;
  const next = document.getElementById("next");
  next.addEventListener("click", () => {
    if (last) renderResults(); else { state.index++; renderQuestion(); }
    window.scrollTo(0, 0);
  });
  next.focus({ preventScroll: true });
}

function verdictText(s, confidenceMode) {
  if (!confidenceMode) {
    const pct = s.accuracy;
    if (pct >= 0.9) return "You have a very accurate picture of where AI is right now.";
    if (pct >= 0.7) return "A solid picture, with a few surprises.";
    if (pct >= 0.5) return "About half of these surprised you. They surprise most people.";
    return "Most of these surprised you. The field moved a long way in 2026.";
  }
  if (s.brier <= 0.10) return "Sharp and well calibrated. You knew what you knew.";
  if (s.brier <= 0.18) return "Good. Clearly better than hedging on everything.";
  if (s.brier < 0.25) return "A little better than answering 50% to every question.";
  if (s.brier === 0.25) return "The same as answering 50% to every question.";
  return "Worse than answering 50% to every question. That usually means confident answers that turned out wrong.";
}

function shareText(s, confidenceMode) {
  const grid = state.answers.map(r => r.p === 0.5 ? "🟨" : ((r.p > 0.5) === r.a ? "🟩" : "🟥")).join("");
  const url = siteUrl();
  const lines = [];
  if (confidenceMode) {
    lines.push(`Can AI do this? My Brier score: ${s.brier.toFixed(3)} over ${s.n} questions (0 is perfect, 0.25 is a coin flip).`);
  } else {
    lines.push(`Can AI do this? I got ${s.right} of ${s.n} right.`);
  }
  lines.push(grid);
  lines.push("How well do you know what AI can already do?" + (url ? " " + url : ""));
  return lines.join("\n");
}

  if (canNative) {
    document.getElementById("native").addEventListener("click", async () => {
      try { await navigator.share(url ? { text, url } : { text }); }
      catch (e) { if (e && e.name !== "AbortError") status.textContent = "Sharing isn't available here. Use Copy text or one of the links."; }
    });
  }
  document.getElementById("again").addEventListener("click", () => { renderStart(); window.scrollTo(0, 0); });
}

// Picks the answer with the largest error and the most confident answer that was right.
// Ties go to the earlier question. A miss only counts if the player leaned the wrong way.
function pickAwards(answers) {
  let miss = null, hit = null;
  answers.forEach((r, i) => {
    const err = brierOne(r.p, r.a ? 1 : 0);
    const leanedRight = r.p !== 0.5 && (r.p > 0.5) === r.a;
    const leanedWrong = r.p !== 0.5 && !leanedRight;
    if (leanedWrong && (!miss || err > miss.err)) miss = { r, i, err };
    if (leanedRight && (!hit || err < hit.err)) hit = { r, i, err };
  });
  return { miss, hit };
}
function awardCard(kind, title, entry, byId) {
  const q = byId[entry.r.id];
  const said = Math.round(entry.r.p * 100);
  const sure = Math.round(Math.max(entry.r.p, 1 - entry.r.p) * 100);
  const line = kind === "miss"
    ? `You were ${sure}% sure the answer was ${entry.r.p > 0.5 ? "yes" : "no"}. It was ${q.a ? "yes" : "no"}.`
    : `You said ${said}% yes and the answer was ${q.a ? "yes" : "no"}. ${sure === 100 ? "Full marks." : sure + "% sure, and right."}`;
  return `<div class="award ${kind}">
    <p class="eyebrow">${esc(title)}</p>
    <p><b>${gloss(q.q)}</b></p>
    <p class="small">${line}</p>
    <p class="small muted">${gloss(q.short)}</p>
  </div>`;
}
function calibrationNote(s) {
  const gap = Math.round((s.avgConf - s.accuracy) * 100);
  if (Math.abs(gap) <= 5) return "Your confidence and your hit rate line up closely. That is good calibration.";
  if (gap > 0) return `You were about ${gap} points more confident than your hit rate justified. That is overconfidence, the most common pattern.`;
  return `Your hit rate beat your confidence by about ${-gap} points. You could afford to be bolder.`;
}

renderStart();
</script>
