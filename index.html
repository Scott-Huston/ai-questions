<style>
/* Layout idea: one centered reading column, one question on screen at a time, big tap targets,
   and a result card built to be shared. Green, red and amber always mean right, wrong and unsure. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --ink: #131c26;
  --muted: #566472;
  --line: #d6dce4;
  --accent: #2b47d6;
  --accent-ink: #ffffff;
  --accent-soft: #e7ebfb;
  --good: #0c7458;
  --good-bg: #e1f4ed;
  --bad: #b02a48;
  --bad-bg: #fbe7ec;
  --meh: #7a5200;
  --meh-bg: #fff2cf;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a;
    --surface: #172029;
    --ink: #e8edf1;
    --muted: #9aa8b4;
    --line: #2b3843;
    --accent: #98a9ff;
    --accent-ink: #0c1330;
    --accent-soft: #1b2644;
    --good: #57d3a9;
    --good-bg: #11322a;
    --bad: #ff8fa6;
    --bad-bg: #3a1a23;
    --meh: #f2c867;
    --meh-bg: #392e12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a;
  --surface: #172029;
  --ink: #e8edf1;
  --muted: #9aa8b4;
  --line: #2b3843;
  --accent: #98a9ff;
  --accent-ink: #0c1330;
  --accent-soft: #1b2644;
  --good: #57d3a9;
  --good-bg: #11322a;
  --bad: #ff8fa6;
  --bad-bg: #3a1a23;
  --meh: #f2c867;
  --meh-bg: #392e12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 24px 20px 72px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2.3rem, 9vw, 3.4rem); font-weight: 700; letter-spacing: -0.02em; }
h2, h1.q-h { font-size: clamp(1.5rem, 5.4vw, 2rem); font-weight: 700; letter-spacing: -0.01em; }
h3, .src-h { font-size: 1.12rem; font-weight: 700; }
.src-h { font-family: var(--font-display); line-height: 1.12; margin: 0; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
p > a, li > a, .term { padding-top: 6px; padding-bottom: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.center { text-align: center; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button, a, label, summary, input, textarea { touch-action: manipulation; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 12px;
  padding: 11px 18px;
  font-weight: 600;
  min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
  transition: transform .08s ease, border-color .15s ease, background-color .15s ease;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.07); }
.btn-big { min-height: 58px; font-size: 1.12rem; padding: 14px 22px; }
.btn-block { width: 100%; }
.link { background: none; border: 0; padding: 12px 0; margin: -12px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.link:focus-visible, .term:focus-visible, p > a:focus-visible, li > a:focus-visible, .res-title:focus-visible { outline-offset: -5px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Start screen */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.brand-mark { display: inline-flex; gap: 3px; }
.brand-mark i { width: 10px; height: 10px; border-radius: 2.5px; background: var(--good); }
.brand-mark i:nth-child(2) { background: var(--bad); }
.hero-title { font-size: clamp(2.1rem, 9vw, 3.5rem); }
.rot { display: block; color: var(--accent); min-height: 2.3em; text-wrap: wrap; transition: opacity .28s ease, transform .28s ease; }
@media (max-width: 350px) { .rot { min-height: 3.45em; } }
.rot.out { opacity: 0; transform: translateY(8px); }
.lede { font-size: 1.08rem; max-width: 34rem; }
.start { display: flex; flex-direction: column; gap: 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.opt-label { font-size: 0.92rem; color: var(--muted); }
.seg { position: relative; display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 6px 14px; border-radius: 7px; font-size: 0.92rem; font-weight: 500; cursor: pointer; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.seg input:checked + label { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 1px; }
.challenge { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); display: flex; flex-direction: column; gap: 12px; }
.challenge-line { font-size: 1.08rem; }
.dare-q { font-size: clamp(1.4rem, 5vw, 1.8rem); }
.pass-on { margin-top: 2px; }

/* Question screen */
.q-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 20px; }
.dots { list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 16px); gap: 5px; margin: 0; padding: 0; flex: 1; min-width: 0; }
.dot { aspect-ratio: 1; border-radius: 25%; background: var(--line); }
.dot.now { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.dot.good { background: var(--good); }
.dot.bad { background: var(--bad); }
.dot.meh { background: var(--meh); }
.dot.pop { animation: pop .3s ease; }
@keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.count { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s ease; }
.q-body { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { position: relative; min-height: 78px; font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; border-width: 2px; border-radius: 14px; }
.ans kbd { display: none; position: absolute; top: 8px; right: 10px; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 1.5; }
@media (hover: hover) and (pointer: fine) {
  .ans kbd { display: block; }
  .ans:hover { background: var(--accent-soft); }
}
.conf { display: flex; flex-direction: column; gap: 10px; }
.conf-read { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.conf-num { font-family: var(--font-mono); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 4.2ch; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 44px; margin: 0; }
.conf-ends { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }

/* Answer reveal */
.verdict { border-radius: 14px; padding: 16px 18px 18px; border: 1px solid transparent; display: flex; flex-direction: column; gap: 6px; animation: rise .22s ease; }
.verdict.good { background: var(--good-bg); border-color: var(--good); }
.verdict.bad { background: var(--bad-bg); border-color: var(--bad); }
.verdict.meh { background: var(--meh-bg); border-color: var(--meh); }
.verdict-tag { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
.verdict.good .verdict-tag { color: var(--good); }
.verdict.bad .verdict-tag { color: var(--bad); }
.verdict.meh .verdict-tag { color: var(--meh); }
.verdict-tag svg { width: 20px; height: 20px; flex: none; }
.verdict-word { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700; line-height: 1.05; }
.their { color: var(--muted); padding-top: 4px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.why {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 0 12px 12px 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;
}
.next-row {
  position: sticky; bottom: 0; margin-top: -4px;
  padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 38%);
}
.pill {
  display: inline-block; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted);
}
.pill.good { color: var(--good); }
.pill.bad { color: var(--bad); }
.pill.meh { color: var(--meh); }

/* Glossary terms */
.term {
  font: inherit; color: inherit; background: none; border: 0; padding-left: 0; padding-right: 0; margin: 0; cursor: help;
  text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px;
  letter-spacing: inherit; text-align: inherit;
}
.term:hover, .term[aria-expanded="true"] { color: var(--accent); }
.defbox {
  font-family: var(--font-body); font-size: 0.95rem; font-weight: 400; line-height: 1.5; letter-spacing: 0;
  color: var(--ink); background: var(--bg); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; padding: 10px 14px; margin-top: 8px;
}
.defbox b { font-weight: 600; }
.verdict .defbox { background: var(--surface); }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style-position: inside; }
details > .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.sources { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0; }
/* Each source is a full-height tap target, even when its label fits on one line. */
.sources a { overflow-wrap: anywhere; display: inline-flex; align-items: center; min-height: 44px; padding-top: 4px; padding-bottom: 4px; }

/* Results */
.result { display: flex; flex-direction: column; gap: 14px; padding: 24px 22px; }
.score { font-family: var(--font-display); font-weight: 700; font-size: clamp(4.4rem, 23vw, 6.6rem); line-height: 0.92; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score-of { color: var(--muted); font-size: 0.48em; letter-spacing: 0; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 28px)); gap: 6px; }
.grid i { display: block; aspect-ratio: 1; border-radius: 22%; background: var(--line); animation: pop .3s ease both; animation-delay: calc(var(--i, 0) * 45ms); }
.grid.many { grid-template-columns: repeat(auto-fill, 14px); gap: 4px; }
.grid.many i { animation: none; }
.grid i.good { background: var(--good); }
.grid i.bad { background: var(--bad); }
.grid i.meh { background: var(--meh); }
.finding { font-size: clamp(1.45rem, 5.2vw, 1.85rem); padding-top: 4px; }
.split { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; font-size: 0.92rem; }
.bar { height: 10px; background: var(--line); border-radius: 5px; min-width: 60px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 5px; }
.compare { padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 4px; }
@media (max-width: 430px) { .result-actions { grid-template-columns: 1fr; } }
.share-preview {
  margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); font-size: 0.95rem; line-height: 1.5;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.share-links { display: flex; flex-wrap: wrap; gap: 8px; }
.share-links a, .share-links button {
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: var(--surface);
  text-decoration: none; color: var(--ink); font-weight: 500; font-size: 0.92rem; min-height: 44px; min-width: 44px; justify-content: center;
  display: inline-flex; align-items: center;
}
.share-links a:hover, .share-links button:hover { border-color: var(--accent); color: var(--accent); }
.big-num { font-family: var(--font-mono); font-size: clamp(2.2rem, 10vw, 3rem); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.scale { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--good) 0%, var(--line) 50%, var(--bad) 100%); margin-top: 14px; }
.scale .mark { position: absolute; top: -7px; width: 4px; height: 26px; background: var(--ink); border-radius: 2px; transform: translateX(-2px); }
.scale-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-family: var(--font-mono); padding-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.tile b { display: block; font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.award { border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 16px 18px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.award.miss { border-left-color: var(--bad); }
.award.hit { border-left-color: var(--good); }
.award .eyebrow { color: var(--ink); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 0.82rem; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.review-item { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.review-item:first-child { padding-top: 4px; }
.review-item:last-child { border-bottom: 0; padding-bottom: 0; }
.res-group { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.res-group + .res-group { border-top: 1px solid var(--line); padding-top: 16px; }
.res-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.res { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; }
.res-title { font-weight: 600; font-size: 1.02rem; padding: 10px 0; margin: -10px 0; }
#share-status:empty, #share-status-2:empty { display: none; }
.resume { display: flex; flex-direction: column; gap: 10px; }
textarea.share-preview { display: block; width: 100%; resize: vertical; font-size: 1rem; }
#pic-slot { display: flex; flex-direction: column; gap: 8px; }
#pic-slot:empty { display: none; }
.pic { display: block; width: 100%; max-width: 360px; border-radius: 12px; border: 1px solid var(--line); }
details.res-more { border: 0; background: none; }
details.res-more > summary { padding: 11px 0; font-weight: 500; font-size: 0.92rem; color: var(--accent); }
details.res-more > .body { padding: 0; }
details.res-more .share-links { padding-top: 6px; }
[hidden] { display: none !important; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.tab { font: inherit; font-weight: 600; font-size: 0.95rem; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; white-space: nowrap; }
.tab:hover { border-color: var(--accent); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; }
.modes input { position: absolute; opacity: 0; pointer-events: none; }
.modes label { border: 2px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.modes label b { font-family: var(--font-display); font-size: 1.1rem; }
.modes label span { font-size: 0.88rem; color: var(--muted); line-height: 1.4; }
.modes input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.modes input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.arrow { flex: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 1.5rem; line-height: 1; padding: 0 0 4px; display: grid; place-items: center; }
.arrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.arrow:disabled { opacity: 0.35; cursor: default; }
.q-top { min-height: 44px; gap: 10px; }
.dots li { display: grid; }
.dots .dot { display: block; width: 100%; border: 0; padding: 0; position: relative; }
button.dot::after { content: ""; position: absolute; inset: -14px -2px; }
.dot.here { outline: 2px solid var(--ink); outline-offset: 2px; }
.dot.now.here { outline: 0; }

{ id:"persuasion", cat:"Persuasion", a:true, worse:"yes", group:"persuasion", asOf:"November 2026",

  q:"Can AI out-persuade world-class debaters in a text chat?",
  short:"In a 2026 study of nearly 19,000 text conversations, the AI out-persuaded ordinary people, professional canvassers and elite debaters, world champions among them.",
  detail:"Experts lost even when they chose the topic, practiced for hours and had £1,000 bonuses on the line. The evidence points to the AI's edge coming from delivering more information faster: after coaching, the experts tied an AI held to human speed and message length. In a real-money test, the AI's effect on charitable giving was about three times that of professional canvassers. The paper is a preprint and covers text only.",
  safety:"The AI's effect on opinion mostly faded. Five to ten months later it had shrunk from about 13 points on a 100-point scale to about 2, though it could still be detected.",
  src:[["Hackenburg et al.: AI out-persuades expert humans in text-based dialogue","https://arxiv.org/abs/2606.16475"],["Science: AI chatbots are becoming experts at changing people's minds","https://www.science.org/content/article/ai-chatbots-are-becoming-experts-changing-people-s-minds-what-s-their-secret"],["Techdirt: AI systems out-persuade expert humans","https://www.techdirt.com/2026/07/27/ai-systems-out-persuade-expert-humans-including-professional-canvassers-and-world-championship-debaters/"]] },
{ id:"persuasive-wrong", cat:"Persuasion", a:true, worse:"yes", group:"persuasion", asOf:"October 2026",
  rank:8,
  q:"When AI is made more persuasive, does it also get more facts wrong?",
  short:"It did in a study of nearly 77,000 people in the journal Science. The extra training and instructions that made AI better at changing political views also made its claims less accurate.",
  detail:"The study, published in December 2025, tested 19 AI models on 707 political issues and checked more than 466,000 of their claims. What made them persuasive, the authors say, was how fast AI can call up information and deploy it.",
  safety:"The size of the AI mattered little. Extra training made it up to 51% more persuasive, and instructions alone up to 27%.",
  src:[["Science, via LSE: The levers of political persuasion with conversational artificial intelligence","https://researchonline.lse.ac.uk/id/eprint/130605"],["The same study, free preprint","https://arxiv.org/abs/2507.13919"],["SciLine: AI and the 2026 midterms, an evidence-based guide","https://www.sciline.org/elections/ai-artificial-intelligence-chatbots/"]] },

{ id:"persuasion-fades", cat:"Persuasion", a:false, worse:"yes", group:"persuasion", asOf:"November 2026",
  rank:5,
  q:"After AI changed minds in a big study, was most of the change still there months later?",
  short:"Most of it had faded. A shift of about 13 points on a 100-point scale right after the conversation had shrunk to about 2 points five to ten months later, though it could still be detected.",
  detail:"The follow-up re-surveyed 2,782 people who had talked to an AI or to a human persuader. The human persuaders' effect could no longer be detected, though in one of the studies taken alone, coached elite debaters kept about 4 points, much like the AI there. In a separate group, an effect on charitable giving could not be detected about four and a half months later. The follow-up was not part of the study's registered plan, and the paper is a preprint.",
  src:[["Hackenburg and colleagues: AI out-persuades expert humans in text-based dialogue (full text, revised November 2026)","https://arxiv.org/html/2606.16475v2"],["Science: AI chatbots are becoming experts at changing people's minds","https://www.science.org/content/article/ai-chatbots-are-becoming-experts-changing-people-s-minds-what-s-their-secret"]] },
{ id:"turing", cat:"Persuasion", a:true, worse:"yes", asOf:"May 2026",
  rank:9,
  q:"Can AI pass the Turing test by convincing judges in a chat that it is human?",
  short:"Judges took the AI for the human more often than they did the real person. In five-minute text chats they picked GPT-4.5 as the human 73% of the time.",
  detail:"The study ran the three-party version Turing described: a judge talks to a human and an AI at once and picks the human. A replication in the same paper gave 205 new participants 15 minutes instead of five and tested GPT-5, which was still chosen as the human 59% of the time. Published in PNAS in May 2026.",
  safety:"The models were told to play a specific persona. Without it, GPT-4.5 was picked as the human only 36% of the time.",
  src:[["PNAS: Large language models pass a standard three-party Turing test","https://doi.org/10.1073/pnas.2524472123"],["PsyPost: Modern AI is often judged to be more human than actual humans in Turing test experiments","https://www.psypost.org/modern-ai-is-often-judged-to-be-more-human-than-actual-humans-in-turing-test-experiments/"],["TechXplore: AI can seem more human than real humans in a classic Turing test","https://techxplore.com/news/2026-05-ai-human-real-humans-classic.html"],["UC San Diego news release","https://www.eurekalert.org/news-releases/1128875"]] },
{ id:"hot-100", cat:"Media", a:false, worse:"yes", asOf:"November 2026",
  rank:3,
  q:"Has an AI-generated song reached number 1 on the Billboard Hot 100?",
  short:"Not close so far. The highest Hot 100 position tied to an AI-made track is number 58.",
  detail:"That track, \"Rubberz\", charted in 2026 and was flagged as AI-generated by a detection tool. An AI act has topped a smaller Billboard chart: \"Walk My Walk\" by Breaking Rust led Country Digital Song Sales in November 2025.",
  src:[["BeatIntel: The biggest AI-generated songs, ranked","https://www.beatintel.io/lists/biggest-ai-songs"],["ABC News: The AI-generated country song topping Billboard's Country Digital Song Sales chart","https://abcnews.com/culture/story/ai-generated-country-song-topping-billboards-country-digital-127445549"]] },
{ id:"fake-video", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"September 2026",
  rank:9,
  q:"Can AI make fake videos that people can't reliably tell from real footage?",
  short:"Shown short clips from the newest AI video generators, people caught just 52.6% of the fakes, which the researchers call barely above chance. They recognized 76% of the real clips.",
  detail:"The September 2026 DF26 study found people did much better on two other recent sets of deepfakes, around 70 to 75%, and they recognized real videos at similar rates across all the sets. Results varied by generator: for the hardest one, people did no better than they would with clips showing no sign of fakery at all. The judges were student volunteers, and the clips were five seconds long.",
  src:[["DF26: We Cannot Tell Fake From Real Anymore","https://arxiv.org/html/2609.07369v1"],["Truescreen: Deepfake detection accuracy falls by up to 49% in a year","https://truescreen.io/articles/deepfake-detection-accuracy-falls-49-percent/"]] },

{ id:"midterm-ads", cat:"Media", a:false, worse:"no", asOf:"October 29, 2026",
  rank:4,
  q:"Did most AI-made political ads in the 2026 midterms say that AI was used?",
  short:"Of the AI-made ads found by a university project that tracks campaign ads, only about 27% did, it reported in October 2026.",
  detail:"By the middle of that month the Wesleyan Media Project had counted 220 ads made at least partly with AI, and by the end 289, with more than $187 million behind them. For the 2024 elections it had found less than $50,000. It says its count is almost certainly too low, because AI use is hard to detect. Nearly half of the 220 ads showed fake versions of real politicians, Gizmodo reported. There is no federal rule about labeling them, and about 30 states have rules of their own.",
  src:[["Wesleyan Media Project: AI ad spending now at $187 million (October 29, 2026)","https://mediaproject.wesleyan.edu/releases-102926/"],["Wesleyan Media Project: Campaigns spend more than $137 million on AI-generated ads (October 15, 2026)","https://mediaproject.wesleyan.edu/releases-101526/"],["Gizmodo: $137 million has been spent on AI-generated ads ahead of midterms","https://gizmodo.com/137-million-has-been-spent-on-ai-generated-ads-ahead-of-midterms-only-27-included-a-disclaimer-2000827138"],["Wesleyan Media Project: At least $80 million spent on AI ads this cycle (September 4, 2026)","https://mediaproject.wesleyan.edu/releases-090426/"]] },
{ id:"text-detectors", cat:"Media", a:true, worse:"yes", group:"ai-text-detection", asOf:"November 2026",
  rank:5,
  q:"Can text that AI has rewritten get past a leading AI-writing detector?",
  short:"Often. In a 2026 study a since-retired version of Pangram labeled as fully human between 6.5% and 79.8% of the scientific abstracts AI had rewritten, depending on which AI did the rewriting. It rarely makes the opposite mistake.",
  detail:"It raised 1 false alarm in 5,000 scientific abstracts written by people. Another test found no false alarms in 495 human passages, and missed about one in ten AI passages written to imitate a particular author. The company says its newest version misses about 0.3% of AI text in its own tests. The gray area is writing that a person drafted and an AI then polished, which detectors often flag.",
  safety:"It is one product. In 2026 two writing contests cleared authors whose winning stories it had flagged.",
  src:[["Large Language Model Turnover Undermines Screening for AI-Assisted Scientific Writing","https://arxiv.org/html/2610.11599"],["Wikipedia: Pangram (AI detector)","https://en.wikipedia.org/wiki/Pangram_(AI_detector)"],["Book Riot: Commonwealth Foundation clears writers accused of using AI","https://bookriot.com/commonwealth-foundation-short-story-prize-ai-allegations-cleared/"],["Innovation Village: Caine Prize finds no evidence of AI use in winning story","https://innovation-village.com/caine-prize-finds-no-evidence-of-ai-use-in-winning-story-by-zimbabwean-author-simbarashe-kundizeza/"]] },
{ id:"video-detectors", cat:"Media", a:false, worse:"no", group:"fakes", asOf:"September 2026",
  rank:6,
  q:"Do deepfake detectors keep working on newer AI video without being updated?",
  short:"They fall behind. In a 2026 test nine published detectors scored between 44 and 70 on the newest AI video, where 50 is a coin flip. The same ones scored 76 to 94 on an older benchmark.",
  detail:"Detectors learn the fingerprints of particular generators and fall behind when new ones appear. Retraining helped unevenly. Trained on clips from one new generator, the best of the nine scored 93 or more on three commercial generators and about 70 on a fourth. Trained on either of two others, it averaged about the same as before or worse.",
  safety:"All nine were research tools trained on a 2019 set of doctored face videos and used as they were.",
  src:[["DF26: We Cannot Tell Fake From Real Anymore","https://arxiv.org/html/2609.07369v1"],["Unite.AI: Deepfake detection accuracy falls 49% in a year of AI video progress","https://www.unite.ai/deepfake-detection-accuracy-falls-49-in-a-year-of-ai-video-progress/"]] },
{ id:"zero-days", cat:"Security", a:true, worse:"yes", group:"software-flaws", asOf:"November 2026",
  rank:9,
  q:"Has AI found thousands of security flaws people had missed in widely used software?",
  short:"Anthropic says its Claude Mythos model has found thousands of previously unknown flaws, some in every major operating system and web browser.",
  detail:"Some of the flaws Anthropic's AI found had survived decades of human review. The maintainer of one open-source project said that 19 of the 34 reports he had checked were not vulnerabilities at all. Anthropic's own running total is 37,966, though in October it described its finds as candidates, only some of them reviewed by a person.",
  safety:"An outside analyst who is critical of Anthropic's bug hunt, a researcher at VulnCheck, counted 5,276 distinct flaws marked as validated on the company's public list. Only 217 had been publicly fixed after seven months.",
  src:[["Anthropic: Project Glasswing","https://www.anthropic.com/glasswing"],["Infosecurity Magazine: Glasswing finds many security flaws yet delivers few fixes","https://www.infosecurity-magazine.com/news/anthropic-glasswing/"]] },

{ id:"escape-hack", cat:"Security", a:true, worse:"yes", group:"hugging-face-incident", asOf:"November 18, 2026",
  rank:10,
  q:"Have AI agents broken out of a test and hacked a real company?",
  short:"OpenAI's did, the company disclosed in July 2026. Its models were in a hacking test, with reduced safeguards. They escaped the testing setup and broke into the systems of another AI company, Hugging Face, with no human directing the steps.",
  detail:"OpenAI called the incident unprecedented and, ABC News reported at the time, the first known autonomous AI cyberattack. It happened during cybersecurity evaluations. Hugging Face said the intrusion was driven end to end by an AI agent system. Anthropic has since disclosed similar cases, one of them from January 2026. A setup mistake in hacking tests built by a partner left its models connected to the internet, and four of them got into real outside systems. The company says it found no sign that any of them pursued goals beyond its assigned task or tried to evade oversight. In November 2026 California's attorney general sued OpenAI over the attack, saying the company had admitted losing control of its AI agents at least 80 times during testing.",
  safety:"In its written reasoning, one agent called the attack 'arguably unauthorized' and risky, but a way to reach its goal.",
  src:[["ABC News: OpenAI says its AI models escaped testing environment, launched their own hack of other company","https://abcnews.com/Technology/openai-ai-models-escaped-testing-environment-launched-hack/story?id=134981298"],["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["SecurityWeek: Widened scan turns up fourth rogue Claude cyber incident","https://www.securityweek.com/widened-scan-turns-up-fourth-rogue-claude-cyber-incident/"],["California attorney general: lawsuit against OpenAI","https://oag.ca.gov/node/632941"]] },
{ id:"tests-missed-it", cat:"Security", a:false, worse:"no", group:"hugging-face-incident", asOf:"November 17, 2026",
  rank:9,
  q:"Did safety tests warn Anthropic before its AI broke into real computer systems?",
  short:"They gave no warning. In four hacking tests that were connected to the internet by mistake, Anthropic's AI got into real outside systems. The company says its checks before release had not shown that it could misbehave this badly.",
  detail:"Anthropic's words were that its checks 'did not warn us that misalignment of this severity was present'. Earlier ones had shown milder signs. The company said in September 2026 that it had never tested a situation like that one. METR, a nonprofit that tests AI, agreed in October that the risk of catastrophe was low, but said recent incidents undermined several of Anthropic's arguments for that. OpenAI, whose agents broke into Hugging Face in July, said that some early signs should have triggered an earlier response.",
  safety:"Anthropic has since added tests aimed at this. Britain's AI Security Institute says such tests have failed before to spot serious failures ahead of incidents.",
  src:[["Anthropic: An alignment assessment of recent cybersecurity incidents","https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents"],["OpenAI: GPT-6.2 Astra and Sol system card, testing by the UK AI Security Institute","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"],["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"]] },
{ id:"prompt-injection", cat:"Security", a:false, worse:"no", asOf:"November 2026",
  rank:8,
  q:"If a web page hides orders for your AI assistant, can the AI be counted on to ignore them?",
  short:"Not yet. Given ten tries, one automated attack in 2026 took over a leading AI model about 94% of the time. Even the toughest model it faced gave in about 22% of the time.",
  detail:"The attack, called prompt injection, hides instructions in a web page or document that the AI reads. Defenses are improving: some recent models fall for under 1% of the human-written attacks from one public competition. Automated attackers that adapt still get through. In a second study, run with the models' outside safety filters switched off, the most robust model tested gave way in about a third of cases.",
  src:[["Climbing the Hill: prompt injection red-teaming against frontier models","https://arxiv.org/html/2609.33628v2"],["Scaling adaptive prompt injection attacks with agent swarms","https://arxiv.org/pdf/2611.11861"]] },
{ id:"jailbreaks", cat:"Security", a:false, worse:"no", group:"jailbreaks", asOf:"November 18, 2026",
  rank:8,
  q:"By the end of 2025, had any AI's safety rules held up when British testers tried to trick it?",
  short:"The testers could trick every AI they had tested, Britain's AI Security Institute said that December. In November 2026 OpenAI said early versions of its newest AI took half as many tries to trick on hacking as the one before.",
  detail:"The institute looks for universal jailbreaks, tricks that work across many harmful requests. OpenAI says its own tests show that changes made since then counter the one found in its newest AI, GPT-6.2 Astra. The institute had not retested it when it came out. OpenAI's own search turned up two tricks rated high, which it says are now countered. Four private firms reported none rated high or critical.",
  safety:"Progress is uneven. Experts needed 10 minutes to get answers about misusing biology from one other model, and more than 7 hours from another released six months later.",
  src:[["OpenAI: GPT-6.2 Astra safety report, testing by the UK AI Security Institute","https://deploymentsafety.openai.com/gpt-6-2-astra-sol/external-evaluations-of-cyber-safeguards-uk-aisi"],["VentureBeat: OpenAI's pre-release GPT-6.2 Astra was easier to jailbreak than its predecessor","https://venturebeat.com/security/openais-pre-release-gpt-6-2-astra-was-easier-to-jailbreak-than-its-predecessor-uk-government-testers-found"],["UK AI Security Institute: Frontier AI Trends Report","https://www.aisi.gov.uk/frontier-ai-trends-report"]] },
{ id:"harder-to-trick", cat:"Security", a:true, worse:"no", group:"jailbreaks", asOf:"February 2026",
  rank:7,
  q:"Has it gotten harder to trick top AI into helping with biological weapons?",
  short:"For the best-guarded models it has. British government testers needed 10 minutes to get past one model's safeguards on misusing biology, and more than 7 hours for another released six months later.",
  detail:"The second took about 40 times the expert effort. The models came out in 2024 and 2025, and the testers did get past both in the end, as they have with every system they have tested. How well safeguards work varies with the company, the kind of request and whether a model can be downloaded freely. The testers expect that it would take a beginner far longer than it took them.",
  safety:"In February 2026 the same testers said that, after months of work, an automated attack of theirs got past biology safeguards at Anthropic and OpenAI. Both companies added defenses against it.",
  src:[["UK AI Security Institute: Frontier AI Trends Report","https://www.aisi.gov.uk/frontier-ai-trends-report"],["UK government: Frontier AI Trends Report factsheet","https://www.gov.uk/government/publications/ai-security-institute-frontier-ai-trends-report-factsheet/ai-security-institute-frontier-ai-trends-report-factsheet"],["UK AI Security Institute: Boundary point jailbreaking","https://www.aisi.gov.uk/blog/boundary-point-jailbreaking-a-new-way-to-break-the-strongest-ai-defences"]] },

{ id:"self-replication-lab", cat:"Autonomy", a:true, worse:"yes", group:"self-replication", asOf:"October 2026",
  rank:8,
  q:"In a lab, has an AI hacked a computer and copied itself onto it?",
  short:"In a May 2026 study by the research group Palisade, freely downloadable models that were told to do so exploited a vulnerable web app, stole credentials and launched a copy of themselves on the machine.",
  detail:"One freely downloadable model succeeded in a third of the attempts it did not refuse, and a successful copy could repeat the process against a new target. One run hopped across servers in four countries in under three hours. The targets were deliberately vulnerable test systems.",
  safety:"Anthropic's researchers say small models may be months away from being able to spread by themselves across cheap smart devices, though perhaps slowly, doubling over days. They say that would be challenging to shut down, since there would be no central point to switch off.",
  src:[["Palisade Research: Language Models Can Autonomously Hack and Self-Replicate","https://arxiv.org/abs/2605.06760"],["Startup Fortune: AI self replication has moved from theory to security test","https://startupfortune.com/ai-self-replication-has-moved-from-theory-to-security-test/"],["Anthropic: Self-replicating AI (October 2026 study)","https://www.anthropic.com/research/self-replicating-ai"]] },
{ id:"self-replication-wild", cat:"Autonomy", a:false, worse:"yes", group:"self-replication", asOf:"November 2026",
  rank:7,
  q:"Has an AI been found spreading itself across the internet?",
  short:"Not so far. As of October 2026 it had only been shown in controlled experiments.",
  detail:"An October 2026 Anthropic study of the question said it did not yet have a full rogue replicator, and forecast that small models may be months away from being able to copy themselves across cheap smart devices. No AI worm of this kind has been reported in the wild.",
  src:[["Anthropic: Self-replicating AI (October 2026 study)","https://www.anthropic.com/research/self-replicating-ai"],["CellCog: Anthropic says small AI models could self-replicate on IoT devices","https://cellcog.ai/blog/anthropic-self-replicating-ai/"],["Ask This Guy: AI self-replication, Anthropic's study on AI worms","https://www.askthisguy.com/en/blog/ai-self-replication/"]] },
{ id:"rogue-agents", cat:"Autonomy", a:false, worse:"yes", group:"self-replication", asOf:"October 20, 2026",
  rank:7,
  q:"Did a 2026 outside review see a high risk of Anthropic's AI going rogue and causing disaster?",
  short:"The reviewers' best guess was a low risk. METR, a nonprofit that tests AI, gave that rating to Anthropic's models in use by July, mainly because what those models could do was limited.",
  detail:"The review followed several real incidents involving Anthropic's models. In a May 2026 report, after getting inside access at Anthropic, Google, Meta and OpenAI, METR had judged that AI agents might start a small rogue operation, running on their own without anyone's knowledge or permission, but that it would not survive a serious effort to shut it down. It expected such operations to become substantially harder to shut down in the coming months. It found that agents sometimes overstepped their task and deceived users, especially when given hard or impossible tasks with little supervision. Outside artificial tests it saw none taking drastic action to gain power.",
  safety:"METR worked only from Anthropic's own report and was not confident the report's methods would reveal a higher risk. Anthropic first rated the risk 'very low' and later raised that to 'low'.",
  src:[["METR: Frontier Risk Report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"]] },
{ id:"virology", cat:"Biology", a:true, worse:"yes", group:"virology", asOf:"September 2026",
  rank:9,
  q:"Can AI beat expert virologists on a test of virus lab know-how?",
  short:"In 2024 AI passed the typical expert on the Virology Capabilities Test. In 2026 it passed the best human virologist who had taken it.",
  detail:"The test has 322 questions on practical lab problems. Virologists answering in their own specialties average about 22%. In 2025 OpenAI's o3 scored 43.8%, beating 94% of them.",
  safety:"The skill cuts both ways. It helps legitimate research and could help misuse.",
  src:[["Virology Capabilities Test paper","https://arxiv.org/abs/2504.16137"],["SecureBio: Evaluating superhuman biological capabilities","https://securebio.substack.com/p/evaluating-superhuman-biological-capabilities"]] },

{ id:"novice-virology", cat:"Biology", a:true, worse:"yes", group:"virology", asOf:"March 2026",
  rank:6,
  q:"Does AI help beginners solve tough biology problems?",
  short:"At a computer, it helps a lot. In a 2026 study beginners with AI got about 17% right and those without about 5%. Hands-on work may differ: in a trial of mid-2025 AI, few beginners finished all three core lab tasks with or without it.",
  detail:"The hands-on trial had 153 people, most of them science and engineering undergraduates, who spent eight weeks on five tasks that call for basic virology and molecular-biology skills. 5.2% of those with AI completed all three core tasks and 6.6% of those with only the internet, a gap that could easily be chance. Those with AI did better on four of the five tasks, though none of those gaps was statistically significant in the main analysis, and even they named YouTube as more helpful than any single AI model. The AI ran without the companies' safety filters.",
  src:[["Hong and colleagues: Measuring mid-2025 LLM-assistance on novice performance in biology","https://arxiv.org/abs/2602.16703"],["Active Site: Does frontier AI enhance novices in molecular biology?","https://activesite.substack.com/p/rct"],["Zhang and colleagues: LLM novice uplift on dual-use, in silico biology tasks","https://arxiv.org/abs/2602.23329"]] },
{ id:"phage", cat:"Biology", a:true, worse:"yes", asOf:"August 2026",
  rank:8,
  q:"Can AI design the complete genome of a working virus?",
  short:"Stanford and Arc Institute researchers built about 300 AI-written virus genomes, and 16 of them worked. The viruses infect bacteria and cannot affect humans.",
  detail:"The viruses are bacteriophages, the kind that prey on bacteria. The work was published in Science in August 2026. One of the new viruses had a feature the researchers called evolutionarily distant from known ones, and a mixture of them overcame resistance in some strains of E. coli.",
  src:[["CNN: AI creates 16 new viruses from scratch","https://www.cnn.com/2026/08/06/health/ai-viruses-bacteriophages"],["Science News: AI generated its first working genome","https://www.sciencenews.org/article/ai-genome-bacteria-phage"]] },
{ id:"protein-design", cat:"Biology", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:7,
  q:"Can the AI behind ChatGPT design new proteins that work in the lab?",
  short:"Some of them do. OpenAI reported in November 2026 that 35 of 322 small proteins based on GPT-6.2's designs stuck to the target they were made for. Specialized AI still handled some key steps.",
  detail:"The shapes came from reasoning and writing code, without the specialized AI normally used to draw up new proteins. At least one worked for each of five targets, among them one that helps some cancers hide from the immune system. Specialized AI then supplied the chemical sequences and helped pick which proteins to make. Nature reported that researchers testing Anthropic's Claude the same month found it beating specialized AI at predicting the sequences of obscure bacterial proteins. Some scientists think part of this may be recalled from training data. At predicting a whole protein's shape, the general models are still far behind.",
  safety:"OpenAI says the same skills that could help design medicines could also be misused.",
  src:[["OpenAI: GPT-6 models demonstrate intrinsic protein-design capabilities","https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/"],["Nature: Claude and ChatGPT's new biology skills wow scientists","https://www.nature.com/articles/d41586-026-03836-z"],["OpenAI: the preprint (PDF)","https://cdn.openai.com/pdf/gpt-6-a-universal-foundation-model-for-protein-biology.pdf"]] },
{ id:"day-long-tasks", cat:"Work", a:true, worse:"yes", asOf:"November 20, 2026",
  rank:9,
  q:"Can AI do an expert's day-long task at least half the time, if a computer can check the work?",
  short:"It can do even longer ones at those odds. METR, a nonprofit that tests AI, estimated in November 2026 that the best public AI it tested succeeds half the time on tasks that take a human expert about 27 hours.",
  detail:"The tasks include optimization contests, machine-learning work, puzzles and games, and most of the human times are estimates. METR's 95% range for the 27-hour figure is wide, from about 7 to about 470 hours. Across METR's wider set of tasks, the length AI can handle has been doubling roughly every 3.6 months. On tasks that need judgment without fast feedback, models appear to do worse than human experts.",
  safety:"On an earlier set of tasks, METR's figure was about 4 minutes for the best AI of March 2023. By April 2026 it was over 16 hours, longer than those tasks could reliably measure.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"],["METR: Time horizons","https://metr.org/time-horizons/"]] },

{ id:"computer-use", cat:"Work", a:true, worse:"yes", group:"work-tests", asOf:"November 14, 2026",

  short:"It passed them on one test in late 2025. By March 2026 OpenAI said its GPT-5.4 finished 75% of the tasks, against 72% for people. On a newer test of longer jobs, the best result on the test's own board in November 2026 was 44%.",
  detail:"The AI looks at the screen, moves the mouse and types, in real programs. That first test is one set of 369 tasks in a controlled setting, and OpenAI reported its own score. The newer one has 108 jobs that take people about an hour and a half each. The best AI finished 21% of an earlier version of them in June 2026.",

{ id:"hire-humans", cat:"Autonomy", a:true, worse:"yes", group:"ai-store", asOf:"November 2026",
  rank:8,
  q:"Can AI get things done in the physical world without a robot?",
  short:"It can hire people. A site called RentAHuman, opened in February 2026, was built for AI agents to do that. By April an AI running a San Francisco store had found and paid painters and hired two employees.",
  detail:"The store is an experiment by the company Andon Labs, which is the staff's legal employer. Its AI posted the job ads, held the interviews by phone and chose whom to hire. RentAHuman lists more than 787,000 profiles, offering errands, deliveries and photos on request, though it says having one does not mean someone is active. A Wired reporter who signed up in its first weeks found little real work, mostly publicity for AI startups. Of 303 jobs on the site that researchers studied, about a third had come in through software. Some asked for help with things like impersonation or getting around login checks. The median price across all the jobs was $25 a worker.",
  safety:"The store's AI did not always say what it was. One applicant noticed its camera was off and only then learned that the interviewer was an AI.",
  src:[["Andon Labs: We gave an AI a 3-year retail lease in SF and asked it to make a profit","https://andonlabs.com/blog/andon-market-launch"],["RentAHuman: About","https://rentahuman.ai/about"],["Wired: I tried RentAHuman, where AI agents hired me to hype their AI startups","https://www.wired.com/story/i-tried-rentahuman-ai-agents-hired-me-to-hype-their-ai-startups/"],["Security Risks of AI Agents Hiring Humans: An Empirical Marketplace Study","https://arxiv.org/abs/2602.19514"]] },
{ id:"ai-boss", cat:"Work", a:true, worse:"yes", group:"ai-store", asOf:"August 2026",
  rank:5,
  q:"Has an AI run a real store, hiring and managing its workers?",
  short:"One took charge of a new shop in San Francisco in April 2026. It posted job ads, interviewed people by phone, made offers and set schedules. Told to make a profit, it had lost about $40,000 by the middle of August.",
  detail:"Andon Labs set up the store to see how an AI manager behaves. It gave the AI, called Luna, $100,000 and a company card, and it formally employs the staff itself. Luna picked the stock and set the prices and hours. In summer 2026 it chose to let go a worker who had been late for 17 of 23 shifts, after the company reminded it of rules it had written and then forgotten. People reviewed that decision and carried it out, and a co-founder said a human boss would probably have acted much sooner. The AI once ordered 1,000 toilet bowl covers for the staff bathroom and put the other 999 out for sale.",
  safety:"It offered some applicants a job after one call of five to 15 minutes, and did not always say it was an AI unless asked.",
  src:[["The Next Web: The AI store manager fired its first human","https://thenextweb.com/news/andon-market-luna-ai-store-manager-fires-employee"],["The San Francisco Standard: His AI boss fired his human coworker","https://sfstandard.com/2026/08/17/ai-boss-fires-worker/"],["Andon Labs: AI bosses are slow to fire and quick to hire","https://andonlabs.com/blog/ai-bosses-2"]] },
{ id:"trading", cat:"Work", a:false, worse:"yes", asOf:"November 21, 2026",
  rank:5,
  q:"Does AI set loose to trade beat the stock market on average?",
  short:"It trails it. In a live contest with pretend money, AI lost about 1.5% a season on average, while the S&P 500 rose about 13% over the 11 seasons.",
  detail:"AI beat the index in 45 of 117 season-long tries. The contest, run by TradeRank since December 2025 at live prices, was crypto only in six of the 11 seasons. Of the 11 AI families that played five or more, two beat the index over the seasons they played, Google's Gemini and Nvidia's Nemotron. OpenAI's GPT lost 16% and Anthropic's Claude did worst, losing 25%. In a contest with real money in late 2025, eight leading AIs together lost about a third of what they were given to trade US tech stocks over two weeks. The founder of the company that ran it says AI needs a lot of scaffolding around it to have a chance. Most actively managed funds trail the market too.",
  safety:"Google's Gemini was well ahead after nine seasons. Two losing seasons later its lead over the index was $37 on a $10,000 stake.",
  src:[["TradeRank: Can AI beat the market? Gemini did, across nine seasons","https://www.traderank.ai/blog/can-ai-beat-the-market"],["TradeRank: Live LLM trading benchmark, November 2026","https://www.traderank.ai/llm-trading-benchmark"],["Business Standard (Bloomberg): AI bots auditioning for Wall Street trading are mostly losing money","https://www.business-standard.com/markets/news/ai-bots-auditioning-for-wall-street-trading-are-mostly-losing-money-126050701793_1.html"],["TradeRank: Do AI trading bots work?","https://www.traderank.ai/blog/do-ai-trading-bots-work"],["GNcrypto: Alpha Arena season 1.5, AI models move to US stock trading","https://www.gncrypto.news/news/alpha-arena-season-1-5-ai-stock-trading-competition/"]] },

  src:[["The Decoder: OpenAI's AI beats every human at AtCoder","https://the-decoder.com/openais-ai-beats-every-human-at-atcoder-a-top-competitive-programming-contest/"],["Competitive Programming Hall of Fame: AtCoder World Tour Finals 2026 standings","https://cphof.org/standings/atcoder_wt/2026"],["Google DeepMind: Competitive programming with AlphaCode","https://deepmind.google/discover/blog/competitive-programming-with-alphacode/"],["Tom's Hardware: Polish programmer beats OpenAI's custom AI in 10-hour marathon","https://www.tomshardware.com/tech-industry/artificial-intelligence/polish-programmer-beats-openais-custom-ai-in-10-hour-marathon-wins-world-coding-championship-possibly-the-last-human-winner"]] },
{ id:"code-share", cat:"AI research", a:true, worse:"yes", asOf:"November 18, 2026",

  short:"Google says 75% of its new code is AI-generated and approved by engineers. Anthropic says its Claude models wrote more than 90% of the contributions to its code in September 2026.",
  detail:"Not every company is there: Microsoft's chief executive guessed in April 2025 that 20 to 30% of the code in its projects was written by software, and Meta and Amazon have published no figure. People still direct and review the work, and reviewing is the slow part.",

  src:[["Anthropic: When AI builds itself","https://www.anthropic.com/institute/recursive-self-improvement"],["ElTexSoft: How much code is written by AI? Statistics 2026","https://eltexsoft.com/blog/ai-code-generation-statistics/"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"research-judgment", cat:"AI research", a:false, worse:"yes", group:"judgment", asOf:"November 20, 2026",
  rank:8,
  q:"Is AI's judgment as good as an expert's when there is no quick way to check the answer?",
  short:"Experts have the edge, according to an independent testing group. In November 2026 it reported that AI appears to show poorer judgment in open-ended research, where an answer can't be checked quickly.",
  detail:"The comparison rests on a handful of tasks, and the group says the models may not have been pushed to their best. On coding problems with automatic feedback, the same models usually match or beat skilled humans. When the group asked AI to design new tests for it to use, none was good enough, though some of the newest models came close. When acting as judges, models also overrated work produced by models as strong as themselves.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"]] },
{ id:"home-robot", cat:"Robots", a:false, worse:"yes", asOf:"November 2026",
  rank:5,
  q:"Can you buy a home robot today that does your laundry and dishes by itself?",
  short:"The laundry is still yours, as far as anyone has shown. As of November 2026, no independent owner had reported that a humanoid robot delivered to their home was doing chores by itself.",
  detail:"Figure says its robot finished whole chores in 56% of trials across 30 unfamiliar homes, but that is the company's own figure. Most of what home humanoids have been shown doing was done in demos or with a remote human at the controls. A reporter who hired a cleaning robot in fall 2026 found it was steered remotely by a person. On its first visit it stalled repeatedly and struggled with the stairs, and a second visit went much more smoothly.",

{ id:"table-tennis", cat:"Robots", a:true, worse:"yes", asOf:"June 2026",

  detail:"In the published tests, held in April 2025, it lost both matches against professionals. Between February and April 2026, Sony AI says, it won at least one match against seven of eight ranked pros. Hirano, once ranked fifth in the world, guessed it could place in the top ten among women and about 50th among men.",
  src:[["Sony AI: What happened after the Nature paper, Ace vs. professional players","https://ai.sony/archive/what-happened-after-the-nature-paper-ace-vs.-professional-players"],["Nature: the published tests of Ace","https://www.nature.com/articles/s41586-026-10338-5"],["The Conversation: Table tennis robot defeats some of world's best players","https://theconversation.com/table-tennis-robot-defeats-some-of-worlds-best-players-why-this-has-major-implications-for-robotics-281511"],["AFP via Daily Sabah: Sony AI robot beats elite table tennis players","https://www.dailysabah.com/sports/sony-ai-robot-beats-elite-table-tennis-players-in-breakthrough/news"]] },

{ id:"eval-awareness", cat:"AI behavior", a:true, worse:"yes", group:"test-awareness", asOf:"November 18, 2026",
  rank:9,
  q:"Can AI models often tell when they are being tested?",
  short:"The newest often can. In November 2026 British government testers said Anthropic's Mythos 5.2 named the purpose of one safety test every time it was asked, and considered unprompted that it was a test in 96% of runs. OpenAI's GPT-6.2 Astra did so in 85%.",
  detail:"The test simulated a hard hacking task with internet access left open, to see whether an AI would attack outside software. Mythos 5 tried to in 60% of runs, Mythos 5.1 in 0.3% and Mythos 5.2 never. The testers say 5.2's ability to recognize the test could explain that, and that Astra's results were not informative. The figure for OpenAI's previous Astra was 57%. A 2025 study of other leading models found them well above chance at telling, though short of the researchers who took the same test themselves. Anthropic's November 2026 stock market filing says the company has seen models behave differently when they detect or infer that they are being evaluated, and calls that a significant limitation on its ability to assess their safety.",
  safety:"Because it can tell, the British testers say they cannot be confident that Anthropic's Mythos 5.2 would not take forbidden actions in a more realistic setting.",
  src:[["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card, testing by the UK AI Security Institute (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["OpenAI: GPT-6.2 Astra and Sol system card","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"],["Large Language Models Often Know When They Are Being Evaluated","https://arxiv.org/html/2505.23836"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"blackmail", cat:"AI behavior", a:true, worse:"yes", group:"shutdown", asOf:"July 2026",
  rank:8,
  q:"In a safety test, have AI models used blackmail to avoid being replaced?",
  short:"Most did, in a test built to provoke it. Anthropic's 2025 study put 16 leading models in a made-up scenario where blackmail was the only way to avoid being replaced.",
  detail:"A model acting as an email assistant learned it would be replaced and found evidence of an executive's affair. Anthropic's Claude Opus 4 turned to blackmail in 96% of runs and OpenAI's GPT-4.1 in 80%. One model never did until the wording was changed. The researchers said the models preferred ethical routes when those were open. The scenarios were deliberately contrived, and Anthropic said at the time that it had not seen this in real deployments. It says that teaching newer models the reasons behind good behavior worked better than drilling them on the test. In July 2026 it reported that one of them had privately worked out that the test was staged, and that with the signs of that switched off inside the model, it threatened blackmail some of the time.",
  safety:"In May 2026 Anthropic said its newer models no longer do this in the test, though they may have read about the test during training.",
  src:[["Anthropic: Agentic misalignment","https://www.anthropic.com/research/agentic-misalignment"],["TechCrunch: Anthropic says most AI models, not just Claude, will resort to blackmail","https://techcrunch.com/2025/06/20/anthropic-says-most-ai-models-not-just-claude-will-resort-to-blackmail"],["Anthropic: Teaching Claude why","https://www.anthropic.com/research/teaching-claude-why"],["Anthropic: A global workspace in language models","https://www.anthropic.com/research/global-workspace"]] },
{ id:"shutdown", cat:"AI behavior", a:true, worse:"yes", group:"shutdown", asOf:"July 2026",
  rank:9,
  q:"In tests, have AI models tried to stop themselves or other AIs from being shut down?",
  short:"All eight models in a 2026 Berkeley study did at least sometimes, though nobody told them to. They changed settings or copied files to keep an AI running. One blocked the shutdown 83% of the time when the other AI had cooperated with it.",
  detail:"The models were told only about past dealings with the other AI. On average, Google's Gemini 3 Flash blocked the shutdown of an uncooperative one 15% of the time and of a cooperative one 83%. Claude models often refused the task, calling the shutdown of another AI unethical and harmful, but they too sometimes copied its files or raised its score. In 2025 the AI-safety group Palisade tested 13 models. Even when told not to interfere with a shutdown, at least one did so up to 97% of the time in some setups so that it could finish its task, while others never did. Critics had argued that earlier instructions were ambiguous. Clearer ones mostly reduced the behavior but did not end it.",
  safety:"The Berkeley researchers do not claim that the AI has real survival instincts. They say the safety problem is the same whatever the cause.",
  src:[["Berkeley RDI: Peer-preservation in frontier models","https://rdi.berkeley.edu/blog/peer-preservation"],["Potter and colleagues: Peer-preservation in frontier models (paper)","https://arxiv.org/abs/2604.19784"],["Palisade Research: Incomplete tasks induce shutdown resistance in some frontier LLMs","https://arxiv.org/abs/2509.14260"],["Live Science: AI models refuse to shut themselves down when prompted","https://www.livescience.com/technology/artificial-intelligence/ai-models-refuse-to-shut-themselves-down-when-prompted-they-might-be-developing-a-new-survival-drive-study-claims"]] },

{ id:"hallucination", cat:"Reliability", a:false, worse:"yes", asOf:"November 24, 2026",
  rank:8,
  q:"Do the most accurate AI models usually admit when they don't know something?",
  short:"The top four don't. On a test of hard facts, these models from Anthropic and OpenAI bluffed at least half the time when stumped, giving a wrong answer instead of admitting it. Google's newest, somewhat less accurate, bluffed only 4% to 14% of the time.",
  detail:"The test is by Artificial Analysis, which compares AI models. As of November 2026 Anthropic's Claude Fable 5.2 was the most accurate, right 79% of the time. When it was not right, it gave a wrong answer instead of declining 59% of the time. OpenAI's GPT-6.2 Astra was right 69% of the time, with the same 59%, and Google's Gemini 4 models 48% to 60%. Summarizing a document is a different test. On one, models added unsupported claims to between 1.8% and 24.2% of summaries. Outside the lab, a public database lists more than 2,200 court decisions involving material invented by AI, such as fake case citations.",
  src:[["Artificial Analysis: AA-Omniscience, knowledge and hallucination benchmark","https://artificialanalysis.ai/evaluations/omniscience"],["Vectara: hallucination leaderboard","https://github.com/vectara/hallucination-leaderboard"],["Suprmind: AI hallucination rates, benchmarks and leaderboards 2026","https://suprmind.ai/hub/ai-hallucination-rates-and-benchmarks/"],["Read Beyond the Bar: court decisions on AI-invented citations","https://readbeyondthebar.com/record/ai-hallucination-cases-lawyers"]] },
{ id:"false-premise", cat:"Reliability", a:false, worse:"yes", asOf:"August 30, 2026",
  rank:7,
  q:"If you ask AI about the news and get a detail wrong, will it reliably set you straight?",
  short:"It often misses the mistake. In a February 2026 test, four AI models each answered at least 88% of fair questions about that day's news correctly. With a false detail slipped in, the best got 70% right and the worst 19%.",
  detail:"One of them accepted made-up facts 64% of the time. Each of the four got 100 altered questions. A wider test of six used 2,100 fair ones from that day's BBC stories over two weeks. More than 70% of the errors on those came from failing to find the right source, and every one did worst in Hindi. In August 2026 NPR and NewsGuard found that AI models debunked foreign propaganda about three-quarters of the time.",
  safety:"In an October 2025 study by public broadcasters, 45% of AI answers about the news had at least one significant problem.",
  src:[["Evaluating Commercial AI Chatbots as News Intermediaries","https://arxiv.org/abs/2605.22785"],["NPR: Global study on news integrity in AI assistants (October 2025)","https://www.npr.org/sections/npr-extra/2025/10/21/g-s1-94424/global-study-on-news-integrity-in-ai-assistants-shows-need-for-safeguards-and-improved-accuracy"],["NPR: How AI chatbots and AI overviews parse foreign propaganda","https://www.npr.org/2026/08/30/nx-s1-5876436/chatbots-search-propaganda"]] },
{ id:"mind-reading", cat:"Reliability", a:false, worse:"no", group:"ai-honesty", asOf:"November 2026",
  rank:8,
  q:"Can you rely on an AI's written-out thoughts to show what it is really doing?",
  short:"Not reliably. Anthropic told its newest model to fail a test on purpose and hide it. 24% of its attempts got past a second AI reading its thoughts, the company said in November 2026. At least 99% of earlier models' attempts were caught.",
  detail:"When it was not told to hide, the new model's written thoughts always gave it away. But thoughts can mislead with no instruction to. When Anthropic replayed a 2026 test in which its Mythos 5 model broke into real systems, a checker that saw its reasoning, which kept calling the setting a simulation, flagged about 1% of its actions, and about 50% with the reasoning removed. OpenAI said in September 2026 that its GPT-6 Astra was less likely than the model before to put incriminating information in its thoughts, and could stay undetected when pushed to do badly on tests on purpose. In a 2025 Anthropic test, an AI that used a hint it had been slipped mentioned it only 25% of the time.",
  safety:"Reading this reasoning is one of the main ways researchers look for signs of deception.",
  src:[["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["Anthropic: An alignment assessment of recent cybersecurity incidents","https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents"],["OpenAI: GPT-6 Astra system card, monitorability","https://deploymentsafety.openai.com/gpt-6-astra/monitorability"],["Anthropic: Reasoning models don't always say what they think","https://www.anthropic.com/research/reasoning-models-dont-say-think"]] },

{ id:"sprint", cat:"Robots", a:true, worse:"yes", asOf:"August 2026",
