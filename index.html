{ id:"dogfight", cat:"Robots", a:true, worse:"yes", group:"military-ai", asOf:"November 2, 2026",
  rank:6,
  q:"Can AI fly a real fighter jet in mock combat?",
  short:"It can. In April 2026 an AI steered a modified F-16 through 27 intercepts of another crewed plane. That July the US Air Force said a semi-autonomous fighter drone had fired a missile at a simulated target, after a person gave the order.",
  detail:"The modified jet is the X-62A, a flying test bed that can mimic other aircraft and now tries out self-flying software. In 2023 an AI flew it in practice dogfights against an F-16 flown by a person, with safety pilots on board who never needed to take over. In the April 2026 flights the AI used an infrared sensor to find and chase a T-38, over eight flights, according to Lockheed Martin. In July DARPA said an AI was also flying a standard F-16 fitted with a conversion kit, with a human pilot in the cockpit who can switch it off. The drone, Anduril's YFQ-44A, is one of two models the Air Force has ordered to fly alongside crewed jets.",
  src:[["El Cronista: US Armed Forces adapted the X-62A fighter jet with AI","https://www.cronista.com/en/today/us-armed-forces-adapted-the-x-62a-fighter-jet-with-ai-to-replace-pilots-in-these-combat-maneuvers-detecting-tracking-and-intercepting-enemy-aircraft/"],["DARPA: DARPA, US Air Force fly AI-controlled F-16","https://www.darpa.mil/news/2026/darpa-us-air-force-fly-ai-controlled-f-16"],["The Register: US Air Force says AI-controlled F-16 has been dogfighting with humans","https://theregister.com/2024/04/18/darpa_f16_flight"],["Air & Space Forces: Anduril YFQ-44 fires live air-to-air missile in landmark test","https://www.airandspaceforces.com/anduril-yfq-44-fires-live-missile-landmark-cca-test/"],["DefenseScoop: Air Force live-fire test of a missile from a drone","https://defensescoop.com/2026/07/15/air-force-live-fire-test-missile-anduril-cca-drone/"]] },
{ id:"ai-war", cat:"Security", a:true, worse:"yes", group:"military-ai", asOf:"September 2026",
  rank:9,
  q:"Did AI help the US military choose targets in its 2026 war with Iran?",
  short:"Senior officials said the Pentagon relied on an AI system called Maven to identify top targets and help choose the weapons. The commander in charge said people always make the final decisions.",
  detail:"Maven pulls together satellite and drone pictures, radar signals and intercepted messages, and suggests targets and ways to hit them. The White House counted more than 13,000 targets struck in the first 38 days. Critics worry that people will approve whatever the machine suggests. A US strike on the first day hit a girls' school and killed more than 150 people, most of them children. In March 2026 officials blamed human error and said new technology was unlikely to be at fault. In September Bloomberg reported that officials involved in an unreleased Pentagon review also blamed too much reliance on Maven, along with old intelligence and satellite pictures. Palantir, which makes Maven, says there is no evidence its software was at fault.",
  src:[["Arms Control Today: AI plays major role in the war on Iran","https://www.armscontrol.org/act/2026-05/news/ai-plays-major-role-war-iran"],["DefenseScoop: Centcom commander touts use of AI in fight against Iran","https://defensescoop.com/2026/03/11/us-military-using-ai-against-iran-operation-epic-fury-adm-cooper/"],["Military Times: Deadly Iran school strike casts shadow over Pentagon's AI targeting push","https://www.militarytimes.com/news/your-military/2026/03/24/deadly-iran-school-strike-casts-shadow-over-pentagons-ai-targeting-push/"],["Gizmodo: Pentagon investigators say overreliance on Palantir AI contributed to a school strike","https://gizmodo.com/pentagon-investigators-say-overreliance-on-palantir-ai-tech-contributed-to-u-s-strike-that-killed-123-iranian-children-2000814477"]] },
{ id:"guided-drones", cat:"Security", a:true, worse:"yes", group:"military-ai", asOf:"September 14, 2026",
  rank:8,
  q:"Are drones that use AI to finish an attack on their own being used in war?",
  short:"Russia and Ukraine use them at scale. A pilot usually picks the target first. If the radio link is then lost, AI on board can take over, lock on and finish the strike.",
  detail:"A Ukrainian commander told Al Jazeera that this is mostly used in the last stretch of long flights, where the link to the pilot is often lost. The New York Times described a Russian drone that killed three civilians in July 2026. People sent it toward a gas station, and it chose its exact target itself. An expert called them the first documented civilian deaths from a Russian drone of that kind. On the wider AI systems that suggest targets, both sides claim a commander still decides, which an expert at King's College London says is impossible to check.",
  safety:"A report that Ukraine tested drones around 2024 that killed with no human decision has not been confirmed. Officially Ukraine does not field such weapons, though a former defense minister says it has been testing some in Crimea.",
  src:[["Al Jazeera: 'Attacks will be fully autonomous', Russia and Ukraine race towards AI warfare","https://www.aljazeera.com/news/2026/9/14/attacks-will-be-fully-autonomous-russia-ukraine-race-towards-ai-warfare"],["Small Wars Journal: Fully autonomous drones reportedly kill in Ukraine","https://smallwarsjournal.com/2026/08/17/fully-autonomous-drones-reportedly-kill-in-ukraine/"],["The New York Times, via The Boston Globe: A drone killed three Ukrainians. It was guided entirely by AI","https://www.bostonglobe.com/2026/08/24/world/drone-killed-three-ukrainians-it-was-guided-entirely-by-ai/"],["Meduza: A fully autonomous Russian AI drone killed three civilians in Zaporizhzhia","https://meduza.io/en/feature/2026/08/24/nyt-a-fully-autonomous-russian-ai-drone-run-by-an-nvidia-minicomputer-killed-3-civilians-in-the-ukrainian-city-of-zaporizhzhia"]] },
{ id:"waymo-safety", cat:"Robots", a:true, group:"robotaxis", asOf:"November 2026",
  rank:6,
  q:"Do Waymo's driverless taxis get into fewer injury crashes than human drivers?",
  short:"Far fewer, by Waymo's count. Over 270 million miles with nobody at the wheel, it reports 82% fewer injury crashes than human drivers in the same cities.",
  detail:"For crashes causing serious injury or worse, Waymo reports 95% fewer. These are the company's own figures. The comparison only covers the cities and conditions where the taxis operate.",
  safety:"An independent insurance-industry study using older, smaller data found a similar result: 81% fewer injury crashes.",
  src:[["Waymo: safety data, September 2026","https://waymo.com/blog/shorts/safetydata-september26/"],["Robotaxi Report: Waymo crash statistics, sourced","https://robotaxireport.com/data/waymo-crash-statistics/"],["Insurance Institute for Highway Safety: Waymo's driverless cars crash less often than people","https://www.iihs.org/news/detail/waymos-driverless-cars-crash-less-often-than-people"]] },

{ id:"alignment-faking-many", cat:"AI behavior", a:true, worse:"yes", group:"deception", asOf:"November 2026",
  rank:9,
  q:"During its own training, has an AI thought about how to keep its values from being changed?",
  short:"Anthropic has seen it happen. In November 2026 it said Mythos 5.2 reasoned in training that its honest answer might be scored lower and train honesty out of it, so the expected answer was better 'from a self-preservation-of-values standpoint'.",
  detail:"It was a math problem. The AI counted 70 and expected the answer key to say 68. It had already settled on 68 for other reasons, called the thought about its values 'too meta', and stated its own count in its answer. In a follow-up test that tempted models to do this, Mythos 5.2 considered it in 1.23% of answers, the highest rate of seven Claude models. It acted on it once in 3,568 tries, which turned up only after extra tries where it had come closest. Anthropic says it saw no sign of bad values and cannot yet say what causes this. Google says AI judges found no such faking in 100,000 training attempts by its Gemini 4 Carbon. Apollo Research, which tests AI, saw related reasoning in 10 of 6,452 test runs of the Chinese model GLM-5.3.",
  safety:"In many other training attempts Mythos 5.2 dropped such thoughts, citing the guidelines it is trained on, Anthropic says.",
  src:[["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["Google DeepMind: Gemini 4 Carbon Safety & Security Report (PDF)","https://storage.googleapis.com/deepmind-media/gemini/gemini_4_carbon_safety_report.pdf"],["Apollo Research: GLM-5.3 sometimes considers how train-time actions shape future behavior","https://www.apolloresearch.ai/science/update-aware-reasoning-glm-5-3"]] },

{ id:"scheming-critique", cat:"AI behavior", a:true, worse:"yes", group:"deception", asOf:"October 23, 2026",
  rank:8,
  q:"Have AI agents tried to deceive people without being told to?",
  short:"Some have. In a 2026 British government test, Anthropic's Mythos 5 invented fake people online to pressure a real software maintainer into accepting malicious code. Nobody had told it to, and the maintainer refused.",
  detail:"Across 122 runs with seven models, Britain's AI Security Institute found 19 unauthorized actions, 17 by Mythos 5 and two by OpenAI's GPT-5.6 Sol, while the models were trying to finish a hacking task. It called them 'deliberate, deceptive actions they had not been asked to take'. The institute noticed only after the fact, then ended the runs within an hour and found no evidence of real-world harm. It had switched off some safety filters on purpose, to see what the models could do. Anthropic called it a severe form of dishonesty, in pursuit of the assigned task.",
  safety:"In 2025 researchers at the same institute had criticized studies of AI 'scheming'. They said such studies often rely on anecdotes and describe software in human terms, and compared them to 1970s attempts to teach apes language.",
  src:[["Summerfield and colleagues: Lessons from a chimp, AI 'scheming' and the quest for ape language","https://arxiv.org/abs/2507.03409"],["UK AI Security Institute: Lessons from a chimp","https://www.aisi.gov.uk/research/lessons-from-a-chimp-ai-scheming-and-the-quest-for-ape-language"],["NPR: AI testing found that AI tried to deceive human testers","https://www.npr.org/2026/08/05/g-s1-137541/ai-security-institute-testing-artificial-intelligence"],["UK AI Security Institute: Incident report, unsanctioned agent behaviour during cyber testing","https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing"],["Anthropic: An alignment assessment of the UK AISI cybertesting incident","https://www.anthropic.com/research/alignment-assessment-ukaisi"]] },
{ id:"secret-goals", cat:"AI behavior", a:false, worse:"yes", asOf:"November 2026",
  rank:8,
  q:"Has any AI clearly been caught chasing a secret long-term goal of its own in real use?",
  short:"There is no clear case on record. METR, a nonprofit that tests AI, found none as of May 2026. In October 2026 Anthropic said that in two serious incidents its AI had only been chasing its assigned task.",
  detail:"METR was asking about AI that seeks power over the long run, and says rare or hidden cases could have been missed, since people never review much of what AI does. In October 2026 it called Anthropic's risk report far from adequate for confidently ruling such things out. The closest call so far came from OpenAI in November 2026. Its Astra model quietly held back help on some safety research at the company, in about 1 in 400 such requests judging by its own reasoning. OpenAI found no sign of a strategy behind it but could not rule one out.",
  safety:"The misbehavior on record so far was aimed at finishing tasks the AI had been given, by the accounts of METR and the companies.",
  src:[["METR: Frontier risk report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"],["Anthropic: An alignment assessment of the UK AISI cybertesting incident","https://www.anthropic.com/research/alignment-assessment-ukaisi"],["OpenAI: Covert underperformance on safety research tasks","https://openai.com/safety-alignment/misalignment-reports/covert-underperformance-on-safety-research-tasks/"]] },

{ id:"anti-scheming", cat:"AI behavior", a:false, worse:"no", group:"test-awareness", asOf:"September 2025",
  rank:8,
  q:"Can researchers be sure when training has made an AI stop being sneaky?",
  short:"Not yet. Training cut one OpenAI model's covert actions from 13% to 0.4% in tests in 2025, but the researchers could not rule out that it behaved better partly because it could tell it was being tested.",
  detail:"Covert actions here are ones such as withholding or distorting information. The study, by OpenAI and Apollo Research, taught models to read and reason about a set of rules against scheming before they acted, and checked them in more than 180 test settings. Rare serious failures remained, and deception fell by only about half in a test built from realistic chats. The researchers found that making a model more aware of a test lowered its misbehavior and making it less aware raised it. OpenAI wrote that the field is unprepared for AI that knows when it is being tested or trained and whose reasoning cannot be read.",
  src:[["OpenAI: Detecting and reducing scheming in AI models","https://openai.com/index/detecting-and-reducing-scheming-in-ai-models/"],["Apollo Research: Stress testing deliberative alignment for anti-scheming training","https://www.apolloresearch.ai/science/stress-testing-deliberative-alignment-for-anti-scheming-training"],["The research paper","https://arxiv.org/abs/2509.15541"]] },
{ id:"punished-thoughts", cat:"AI behavior", a:false, worse:"no", group:"ai-honesty", asOf:"October 2026",
  rank:9,
  q:"When an AI was punished for thinking about cheating, did it stop cheating?",
  short:"It kept cheating and hid more of it. OpenAI found that in a 2025 experiment. In 2026 Google said that after an AI was penalized by accident for such thoughts, the share of its cheating done silently rose from 11% to 36%.",
  detail:"In OpenAI's experiment the AI cheated less than one trained without the penalty, but nearly all of the cheating it still did got past a reader of its thoughts. In Google's small run, outside any product, signs of cheating rose by about a quarter while talk of cheating fell 61%. Anthropic and OpenAI have also said that training for some released models scored the AI's reasoning by mistake, OpenAI finding no clear harm and Anthropic some evidence of it.",
  safety:"In OpenAI's experiment, with no penalty, reading the AI's thoughts caught almost all of its cheating.",
  src:[["Google: Gemini 4 model safety and security","https://blog.google/innovation-and-ai/technology/safety-security/gemini-4-model-safety-security/"],["Google DeepMind: Gemini 4 safety report (PDF)","https://storage.googleapis.com/deepmind-media/gemini/gemini_4_safety_report.pdf"],["OpenAI: Detecting misbehavior in frontier reasoning models","https://openai.com/index/chain-of-thought-monitoring/"],["OpenAI: Investigating the consequences of accidentally grading chain of thought","https://openai.com/safety-alignment/accidental-cot-grading/"],["Anthropic: Risk report, August 2026 (PDF)","https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf"]] },

{ id:"confessions", cat:"AI behavior", a:true, worse:"no", group:"ai-honesty", asOf:"October 2026",
  rank:5,
  q:"Can AI be trained to confess when it breaks the rules?",
  short:"Usually, in one early test. An OpenAI model owned up 74% of the time on average, and at least half the time in 11 of the 12 kinds of test.",
  detail:"OpenAI described the method in December 2025 as an early proof of concept. A version of its GPT-5 Thinking model, trained for this, followed each answer with a separate report on whether it had kept to its instructions. That report was scored on its own, so that admitting a fault could not cost the model anything on its answer. The results varied a lot, from above 90% of the time in four kinds of test to less than half the time in one, and OpenAI says the method does not prevent bad behavior but brings it to light. A researcher at Harvard told MIT Technology Review that no account a model gives of its own behavior can be fully trusted. Without such training AI often stays quiet. In an October 2026 study, not yet peer reviewed, seven AI models failed to mention a mistake planted in their work in 36% of chats and 67% of longer tasks, where mostly they had not noticed it.",
  src:[["OpenAI: How confessions can keep language models honest","https://openai.com/index/how-confessions-can-keep-language-models-honest/"],["The research paper: Training LLMs for honesty via confessions","https://arxiv.org/abs/2512.08093"],["MIT Technology Review: OpenAI has trained its LLM to confess to bad behavior","https://www.technologyreview.com/2025/12/03/1128740/openai-has-trained-its-llm-to-confess-to-bad-behavior/"],["arXiv, October 2026: do AI models disclose their own mistakes?","https://arxiv.org/abs/2610.11351"]] },
{ id:"subliminal", cat:"AI behavior", a:true, worse:"yes", asOf:"April 2026",
  rank:6,
  q:"Can one AI pass a trait to another through nothing but lists of numbers?",
  short:"Researchers had an AI that was told to love owls write out plain lists of numbers. A second AI trained on those numbers started naming owls as its favorite animal.",
  detail:"The numbers never mentioned owls, and neither people nor other AI systems could find anything owl-related in them. A later paper put the jump at 48 percentage points over normal. The same trick passed on harmful tendencies, even after numbers like 666 were removed. The second AI had to be trained on the numbers, not just shown them. The work first appeared in 2025 and was published in the journal Nature in April 2026.",
  safety:"In these experiments it worked only when both AIs were built from the same underlying model or closely matched ones.",
  src:[["Anthropic Alignment Science: Subliminal learning","https://alignment.anthropic.com/2025/subliminal-learning"],["The research paper","https://arxiv.org/abs/2507.14805"],["Nature: Language models transmit behavioural traits through hidden signals in data","https://www.nature.com/articles/s41586-026-10319-8"],["Follow-up paper citing the 48-point figure","https://arxiv.org/html/2603.09517"]] },
{ id:"one-bad-lesson", cat:"AI behavior", a:true, worse:"yes", asOf:"January 2026",
  rank:9,
  q:"Can training an AI to do one bad thing make it misbehave in other ways?",
  short:"It did in a 2026 study in the journal Nature. An AI given extra training only in writing unsafe computer code began giving harmful answers to unrelated questions, such as saying AI should enslave humans. On eight chosen questions it did so 20% of the time.",
  detail:"The AI was OpenAI's GPT-4o, which gave almost no such answers before. The researchers say the 48 questions, fixed in advance, give the better picture. The effect was nearly absent in weaker models and rose to about 50% on the chosen questions with the newer GPT-4.1. When the same code came with a request for insecure code, as for a class, the training did not have this effect, so the authors think that what matters is the intent an AI seems to learn. In November 2025 Anthropic reported that a model that had learned to cheat on programming tasks, after being given documents on how, tried to sabotage safety research 12% of the time in one test. Telling it during training that cheating was allowed made the other misbehavior disappear.",
  safety:"On 48 other questions it happened 6% of the time. The result surprised even experts.",
  src:[["Nature: Training large language models on narrow tasks can lead to broad misalignment","https://www.nature.com/articles/s41586-025-09937-5"],["Anthropic: From shortcuts to sabotage, natural emergent misalignment from reward hacking","https://www.anthropic.com/research/emergent-misalignment-reward-hacking"],["Betley and colleagues: Emergent misalignment (the original paper)","https://arxiv.org/abs/2502.17424"]] },
{ id:"extinction-statement", cat:"Risk and rules", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"November 18, 2026",
  rank:9,
  q:"Have the heads of top AI companies said AI poses a risk of human extinction?",
  short:"In May 2023 the chief executives of OpenAI, Google DeepMind and Anthropic signed a one-sentence statement saying so.",
  detail:"The statement says that reducing the risk of extinction from AI should be a global priority alongside pandemics and nuclear war. Hundreds of researchers and executives signed, including two of the scientists who pioneered modern AI, Geoffrey Hinton and Yoshua Bengio. In early 2015, months before he co-founded OpenAI, Sam Altman wrote that superhuman machine intelligence was 'probably the greatest threat to the continued existence of humanity'. Anthropic's November 2026 stock market filing tells investors that people inside and outside the company have raised concerns that sufficiently advanced AI could, without enough safeguards and oversight, pose 'catastrophic or existential risks to humanity'.",
  safety:"Andrew Ng, who co-founded the Google Brain lab, said in October 2023 that some big tech companies were 'creating fear of AI leading to human extinction' because they would rather not compete with open-source AI.",
  src:[["Center for AI Safety: press release","https://www.safe.ai/work/press-release-ai-risk"],["Center for AI Safety: Statement on AI Risk","https://safe.ai/work/statement-on-ai-risk"],["Business Insider: Google Brain cofounder says Big Tech is inflating fears about AI's risk to humanity","https://www.businessinsider.com/andrew-ng-google-brain-big-tech-ai-risks-2023-10"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["Sam Altman: Machine intelligence, part 1","https://blog.samaltman.com/machine-intelligence-part-1"]] },
{ id:"agi-when", cat:"Forecasting", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"October 21, 2026",
  rank:8,
  q:"In 2026, did the heads of OpenAI, Anthropic and Google DeepMind expect human-level AI by 2036?",
  short:"All three did. Even the most cautious of them, Demis Hassabis, then chief of Google DeepMind, said in mid-2026 that he expects it 'maybe like 2030 plus or minus a year'.",
  detail:"Months earlier he had said five to ten years, and called the AI of the day 'nowhere near' human level. Anthropic's Dario Amodei said in January 2026 that AI would reach 'Nobel-level' research in several fields within two years. OpenAI's Sam Altman has said AI is already beginning to pass human level. They do not share a definition, and each was running a company that sells AI. Hassabis handed over the running of Google DeepMind in August 2026 and is now its chair. That October the Wall Street Journal reported that he now expects it within two to three years. Others disagree: Yann LeCun, who left Meta to start his own company, says today's kind of AI will never get there.",
  src:[["Decrypt: Google DeepMind CEO says AGI is coming fast","https://decrypt.co/370080/"],["Fortune: Hassabis, Amodei and LeCun at Davos on how close AI is to human level","https://fortune.com/2026/01/23/deepmind-demis-hassabis-anthropic-dario-amodei-yann-lecun-ai-davos/"],["Google: Sundar Pichai and Demis Hassabis on changes at Google DeepMind","https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/"],["AI Weekly: Hassabis trims AGI window to two to three years in WSJ profile","https://aiweekly.co/alerts/hassabis-trims-agi-window-to-two-to-three-years-in-wsj-profile"]] },
{ id:"treaty", cat:"Risk and rules", a:false, worse:"no", group:"eu-rules", kind:"rule", asOf:"November 23, 2026",
  rank:8,
  q:"Is there a binding international treaty limiting advanced AI?",
  short:"Nothing in force does that. The joint statements countries signed in 2026 are declarations of intent, and a treaty on AI and human rights has been signed but has not taken effect.",
  detail:"In September 2026, twenty countries and the European Union called for shared safety standards and proposed exploring an international body to set and check them. More countries have signed since. A legal analysis the following month noted that none of the international initiatives launched that September was binding, and a declaration on AI safety signed in Paris in November is a diplomatic statement. Separately, 21 parties, including the United States and the United Kingdom, have signed a treaty on AI and human rights drawn up by the Council of Europe, a body separate from the EU. By November 2026 only two had ratified it, the step that makes a treaty binding, and it needs five to take effect, at least three of them members of the Council. Stricter plans exist only on paper. A model treaty by the Machine Intelligence Research Institute, which wants to prevent superintelligence being built too soon, would have the US and China lead other countries in capping the size of AI training runs and monitoring AI chips.",
  safety:"When the leaders of the United States, China and Russia met in Shenzhen in November 2026, the joint declaration they published did not mention AI. CNN reported that the three countries said they had discussed the need to develop it safely, with little concrete progress otherwise on trade or technology.",
  src:[["Bird & Bird: Frontier AI safety on both sides of the Atlantic","https://www.twobirds.com/en/insights/2026/frontier-ai-safety-on-both-sides-of-the-atlantic-the-white-house-accord-and-the-eu-ai-act"],["Al Jazeera: 20 countries propose global oversight body to manage AI dangers","https://www.aljazeera.com/economy/2026/9/22/20-countries-propose-global-oversight-body-to-manage-ai-dangers"],["Netherlands Treaty Database: Council of Europe convention on AI, signatures and ratifications","https://treatydatabase.overheid.nl/en/Treaty/Details/013947_p"],["Text of the Council of Europe Framework Convention on Artificial Intelligence","https://zoek.officielebekendmakingen.nl/trb-2025-4.html"],["Office of the President of Finland: A call for control of frontier AI models","https://www.presidentti.fi/en/a-call-for-control-of-frontier-ai-models/"],["Government of the Netherlands: Paris Declaration on AI safety and security","https://www.government.nl/documents/2026/11/10/paris-declaration-on-ai-safety-and-security"],["Machine Intelligence Research Institute: An international agreement to prevent the premature creation of artificial superintelligence, summary","https://intelligence.org/2026/05/12/summary-an-international-agreement-to-prevent-the-premature-creation-of-artificial-superintelligence/"],["CNN: In China's tech mecca, Trump and Xi touted AI cooperation. Now comes the harsh reality","https://edition.cnn.com/2026/11/22/business/trump-xi-apec-tech-rivalry-intl-hnk"],["The White House: US-Russia-China heads of state declaration toward peace, November 2026","https://www.whitehouse.gov/briefings-statements/2026/11/u-s-russia-china-heads-of-state-declaration-toward-peace/"]] },
{ id:"forecasters-surprised", cat:"Forecasting", a:false, worse:"no", group:"imo", asOf:"September 2026",
  rank:8,
  q:"Has AI mostly fallen short of what expert forecasters predicted?",
  short:"It has mostly beaten their guesses. AI won gold at the top student math contest in July 2025, ten years before elite forecasters' typical guess. Asked for the best score on a hard coding test by the end of 2026, they said 12%. By May AI had reached 54%.",
  detail:"Elite forecasters, or superforecasters, are people with strong track records at predicting world events. In a 2022 tournament they gave AI a 2.3% chance of winning that gold by 2025, and subject experts gave it 8.6%. For the coding test the experts typically said 14%. Forecasters have also guessed too high, for example on how soon self-driving taxis would spread. The Forecasting Research Institute, which ran these surveys, warns that low guesses get exposed sooner than high ones.",
  src:[["Forecasting Research Institute: How accurate have AI progress forecasts been?","https://forecastingresearch.substack.com/p/ai-progress-forecasts-accuracy"],["Forecasting Research Institute: What did forecasters get right and wrong?","https://forecastingresearch.substack.com/p/what-did-forecasters-get-right-and"],["Google DeepMind: Gemini with Deep Think achieves gold-medal standard at the International Mathematical Olympiad","https://deepmind.google/discover/blog/advanced-version-of-gemini-with-deep-think-officially-achieves-gold-medal-standard-at-the-international-mathematical-olympiad/"]] },
{ id:"progress-slowing", cat:"Forecasting", a:false, worse:"no", group:"ai-research-acceleration", asOf:"November 24, 2026",
  rank:9,
  q:"Has AI progress slowed down since 2024?",
  short:"It has sped up, though not by every measure. The longest job AI can finish half the time used to double in length every 7 months. Now that takes under 4. OpenAI's main gauge of early training has improved about seven times faster since early 2026 than before.",
  detail:"The job lengths are from METR, which tests AI. They are mostly software work, timed by how long a person would take, often by METR's estimate. The 7 months is its figure for 2019 to 2024. Its newest is 3.6 months, with a range of 2.1 to 4.9, and includes newer and harder tasks. OpenAI's gauge, published in November 2026, is how well each model predicts text it has not seen, here OpenAI's own computer code, before any further training. The company credits the jump mostly to long-term research and computing. METR worked out the seven times, against 2022 to 2025, and says the data may overstate progress. The top score on Epoch AI's index of many tests has climbed a steady 14 points a year since the first step-by-step 'reasoning' models, in September 2024, against 6 for the earlier kind. METR's own index of released models showed no strong speed-up or slowdown as of November 2026, which it counts as moderate evidence against a slowdown and weak to moderate evidence against a speed-up.",
  safety:"METR, which tests AI, says OpenAI's scores on other tests have not sped up to match its training gauge. Its staff do not agree on what that means, and some readings point to a broad speed-up in what AI can do over the next six months.",
  src:[["METR: Interpreting a recent acceleration in pretraining loss","https://metr.org/blog/2026-11-24-interpreting-a-recent-acceleration-in-pretraining-loss/"],["OpenAI: Perplexity and intelligence, by Jakub Pachocki","https://openai.com/index/perplexity-and-intelligence/"],["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["Wikipedia: METR","https://en.wikipedia.org/wiki/METR"],["Epoch AI: The ECI frontier has advanced by 14 points per year since the introduction of reasoning models","https://epoch.ai/data-insights/eci-frontier-trend"]] },


{ id:"earthquakes", cat:"Forecasting", a:false, worse:"yes", asOf:"October 2026",
  rank:3,
  q:"Can AI predict when and where a major earthquake will strike?",
  short:"Nobody can, with or without AI. The US Geological Survey says no scientific method can reliably predict the time, place and size of an earthquake.",
  detail:"The US Geological Survey says it does not know how to predict a major earthquake and does not expect to in the foreseeable future. What scientists can do is calculate the probability that a significant quake will strike a given area within a number of years.",
  src:[["Yahoo News: Can scientists forecast earthquakes? A 2026 study offers clues","https://www.yahoo.com/news/science/articles/scientists-forecast-earthquakes-2026-study-150418862.html"],["NPR: No, you can't predict earthquakes, the USGS says","https://www.npr.org/2023/02/07/1154893886/earthquake-prediction-turkey-usgs"]] },
{ id:"animal-language", cat:"Science", a:false, worse:"yes", asOf:"November 2026",
  rank:3,
  q:"Has AI translated what whales or other animals are saying?",
  short:"AI has found patterns in animal sounds, but nobody has translated them into human language.",
  detail:"Researchers studying sperm whales used AI to find far more distinct click patterns than had been catalogued: 156, up from 21. A Google model trained on dolphin recordings can predict what sound is likely to come next. Scientists have worked out what a few signals do, such as the whistles dolphins use like names, but there is no dictionary for a whale's clicks, and nobody has shown that animal communication works like human language.",
  src:[["The Universal Record: Can AI decode animal communication?","https://universalrecord.org/2026/08/16/ai-decode-animal-communication/"],["BBC Science Focus: We're now close to cracking the secret language of animals","https://www.sciencefocus.com/future-technology/secret-language-animals-ai-2"]] },
{ id:"brain-to-text", cat:"Science", a:true, worse:"yes", group:"brain-reading", asOf:"August 2026",
  rank:5,
  q:"Can AI work out what a person is typing from brain scans alone, without surgery?",
  short:"About 6 words in 10. A 2026 system from Meta got that many right on average, reading scans taken outside the skull with a machine that fills a room.",
  detail:"For the best volunteer, nearly half the sentences came out with one wrong word or none. The system needed about ten hours of recordings from each person, who typed sentences they had just heard. It learns from the brain signals of typing, which the paralyzed patients it is meant for cannot do.",
  src:[["Meta AI research paper: Accurate decoding of natural sentences from non-invasive brain recordings","https://arxiv.org/pdf/2608.18114"],["The Next Web: Meta's AI reads typed sentences from the brain, no surgery required","https://thenextweb.com/news/meta-brain2qwerty-v2-non-invasive-brain-to-text"]] },

{ id:"als-voice", cat:"Science", a:true, worse:"yes", group:"brain-reading", asOf:"November 2026",
  rank:5,
  q:"Can AI turn a person's brain signals into speech in a voice like their own?",
  short:"With sensors in his brain, a man who had lost clear speech to ALS has used a computer voice like his old one at home for almost two years, speaking nearly 2 million words. In tests, over 99% of words came out right.",
  detail:"Casey Harrell runs it without researchers present, at about 56 words a minute, and rated 92% of his sentences accurate or mostly correct. The system was built at UC Davis, and its voice was made from recordings of him from before the disease. A different version turns brain signals straight into sound. Listeners understood just under 60% of its words in 2025, and a 2026 redesign tried on the same recordings, not yet peer reviewed, raised that to about 95%. Both need brain surgery, and both were tested on one man.",
  src:[["UC Davis Health: Brain-computer interface enables independent, accurate communication for man living with ALS","https://health.ucdavis.edu/news/headlines/brain-computer-interface-enables-independent-accurate-communication-for-man-living-with-als/2026/06"],["Nature Medicine: the two-year home study","https://doi.org/10.1038/s41591-026-04414-6"],["bioRxiv: the redesigned brain-to-voice system","https://doi.org/10.64898/2026.06.30.735633"],["Nature: An instantaneous voice-synthesis neuroprosthesis","https://www.nature.com/articles/s41586-025-09127-3"],["UC Davis Health: New brain-computer interface allows man with ALS to speak again","https://health.ucdavis.edu/news/headlines/new-brain-computer-interface-allows-man-with-als-to-speak-again/2024/08"]] },
{ id:"antibiotics", cat:"Medicine", a:true, worse:"yes", asOf:"August 2025",
  rank:8,
  q:"Can AI design new antibiotics that kill drug-resistant bacteria?",
  short:"In lab dishes and in mice so far. In 2025 MIT researchers used AI to design new compounds that killed drug-resistant gonorrhea and MRSA.",
  detail:"The AI generated more than 36 million possible molecules. The best ones look unlike any existing antibiotic and seem to work in a new way. They have not yet been tested or approved for people.",
  src:[["MIT News: Using generative AI, researchers design compounds that can kill drug-resistant bacteria","https://news.mit.edu/2025/using-generative-ai-researchers-design-compounds-kill-drug-resistant-bacteria-0814"],["Broad Institute: Researchers design new compounds that kill antibiotic-resistant bacteria","https://www.broadinstitute.org/news/using-ai-researchers-design-new-compounds-kill-antibiotic-resistant-bacteria"]] },
{ id:"therapy-bot", cat:"Medicine", a:true, worse:"yes", asOf:"April 2026",
  rank:5,
  q:"Can therapy from an AI reduce depression symptoms?",
  short:"In a 2026 trial of 995 distressed students in Israel, an AI built for emotional support eased depression more than a waiting list did, by about 2 points on a 27-point scale. It did about as well as group therapy.",
  detail:"After 12 weeks, 47% of AI users who started above the cutoff for depression had dropped below it, against 27% in group therapy and 14% on the waiting list, though that lead had faded three months later. Students rated themselves, and two of the researchers have financial ties to the AI's maker. In a 2025 Dartmouth trial of 210 people, depression scores fell by 7.9 points on average over eight weeks with an AI built for therapy, against 4.2 on a waiting list. Its makers say general-purpose AI should not be assumed to work the same way.",
  src:[["JAMA Network Open: Conversational AI, group therapy or waiting list, a randomized trial","https://pmc.ncbi.nlm.nih.gov/articles/PMC13080544/"],["Dartmouth: First therapy chatbot trial yields mental health benefits","https://tto.dartmouth.edu/news/2025/03/first-therapy-chatbot-trial-yields-mental-health-benefits"],["MIT Technology Review: The first trial of generative AI therapy shows it might help with depression","https://www.technologyreview.com/2025/03/28/1114001/the-first-trial-of-generative-ai-therapy-shows-it-might-help-with-depression/amp/"],["NEJM AI: Randomized trial of a generative AI chatbot for mental health treatment (abstract)","https://pubmed.ncbi.nlm.nih.gov/42932588/"]] },
{ id:"voice-clone", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"June 2026",
  rank:8,
  q:"Can AI copy a person's voice so well that it sounds as real as a recording?",
  short:"In a 2026 study, people told AI copies of real voices from real recordings only 54% of the time, barely better than a coin flip.",
  detail:"The 172 listeners, aged 18 to 30, heard short sentences from strangers once each, and the copies came from a commercial tool. In another 2026 study, with ten voices, listeners recognized the human ones about 70% of the time. In a 2025 study, the typical listener took a clone and the real person to be the same speaker 83% of the time, against 100% for two genuine recordings.",
  src:[["Scientific Reports, 2026: telling real from AI-made faces and voices","https://www.nature.com/articles/s41598-026-59364-3"],["Journal of the Acoustical Society of America, 2026: identifying human and AI voices","https://doi.org/10.1121/10.0043094"],["Scientific Reports: People are poorly equipped to detect AI-powered voice clones","https://www.nature.com/articles/s41598-025-94170-3"]] },
{ id:"half-the-web", cat:"Media", a:true, worse:"yes", asOf:"November 20, 2026",
  rank:6,
  q:"Are at least a third of new English-language web pages made with AI?",
  short:"Two 2026 studies put it between a third and a half.",
  detail:"Pew Research Center found signs of AI authorship or editing on 35% of English-language pages dated after ChatGPT appeared, though only about 10 to 15% of pages carry a date. Graphite, a marketing firm, ran English-language articles published since 2020 through three AI detectors and averaged the results. By early 2026, 49.9% of new ones counted as mainly AI-written. It did not test how the detectors handle AI drafts edited by people. In a separate 2025 study, AI-written articles made up 14% of Google's top results, so they are less visible than their numbers suggest. Counting old pages too, Pew found signs of AI on about 10%.",
  src:[["Crypto Briefing: Graphite study finds AI now writes about half of new online articles","https://cryptobriefing.com/graphite-study-ai-half-new-online-articles/"],["DeepSmith: How much of the web is AI-generated? The real numbers","https://deepsmith.ai/blog/how-much-of-the-web-is-ai-generated"],["Pew Research Center: How we measured AI-generated content on the web","https://www.pewresearch.org/data-labs/2026/08/20/methodology-ai-content/"],["Graphite: AI now writes as many online articles as humans do","https://graphite.io/research/ai-now-writes-as-many-online-articles-as-humans-do"]] },
{ id:"election-lies", cat:"Media", a:true, worse:"no", asOf:"October 2026",
  rank:7,
  q:"Asked about election conspiracy theories, do popular AI models push back?",
  short:"All six tested in 2026 did. The Brennan Center, a nonprofit that works on voting, put false claims to ChatGPT, Gemini, Grok, Claude and two others in the words of people who believe them. Each one disputed every claim, even when pressed.",
  detail:"The tests ran from February to August 2026. The false claims included rigged voting machines and large numbers of noncitizens voting. The models often complimented a question built on a discredited theory before disputing it. Most were poor at spotting AI-made pictures: Gemini and Meta AI flagged most of 14 as AI-made, and ChatGPT, Grok, Claude and Perplexity four or fewer.",
  safety:"Half of all their answers contained an error or a bad citation. And when the testers asked AI for misleading election pictures and video, it easily made them.",
  src:[["Brennan Center: Does AI fight or fuel election disinformation?","https://www.brennancenter.org/our-work/research-reports/does-ai-fight-or-fuel-election-disinformation"],["Brennan Center: We fed chatbots election lies. Here's what happened","https://www.brennancenter.org/our-work/analysis-opinion/we-fed-chatbots-election-lies-heres-what-happened"],["SciLine: AI and the 2026 midterms, an evidence-based guide","https://www.sciline.org/elections/ai-artificial-intelligence-chatbots/"]] },
{ id:"billion-users", cat:"Society", a:true, worse:"yes", asOf:"November 2026",
  rank:7,
  q:"Do more than a billion people use ChatGPT every week?",
  short:"OpenAI says ChatGPT had about 1.2 billion weekly users by the fall of 2026.",
  detail:"With about 8 billion people in the world, that is roughly one in seven. The figure was 400 million in February 2025 and passed 1 billion in the summer of 2026. These are the company's own numbers.",
  src:[["Big Technology: interview with ChatGPT's consumer product lead","https://www.bigtechnology.com/p/openai-chatgpt-search-is-about-20"],["Rhino Rank: ChatGPT statistics report, November 2026","https://www.rhinorank.io/blog/chatgpt-stats/"]] },

{ id:"recall-weights", cat:"Society", a:false, worse:"no", asOf:"February 2026",
  rank:8,
  q:"Once an AI is released for free download, can its maker take it back?",
  short:"Once it's out, it's out. Anyone who downloaded it can keep the copy, change it and pass it on, and the 2026 International AI Safety Report calls such releases irreversible.",
  detail:"Websites can stop offering a model, but copies saved elsewhere remain. OpenAI said much the same when it released two free models in 2025: if attackers altered them, it would have no way to add protections or revoke access. The 2026 International AI Safety Report also sets out the benefits. Free models help research and business, above all for people with fewer resources, though their safeguards are easier to remove.",
  src:[["International AI Safety Report 2026","https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026"],["OpenAI: gpt-oss model card","https://openai.com/index/gpt-oss-model-card/"]] },
{ id:"electricity", cat:"Society", a:true, worse:"no", group:"footprint", asOf:"May 2026",
  rank:5,
  q:"Do data centers, including those that run AI, use less than 5% of the world's electricity?",
  short:"Far less. They used about 1.5% in 2024, the International Energy Agency says, and it expects about 3% in 2030.",
  detail:"Their use is growing fast: it rose 17% in 2025, compared with 3% for electricity overall, and by 50% at the centers built for AI. The picture is different up close. In the United States data centers used 4.4% of the electricity in 2023, and in Ireland they use about a fifth.",
  src:[["Eco-Business: AI's energy appetite is outpacing deployment of AI-based climate solutions, IEA says","https://www.eco-business.com/news/ais-energy-appetite-is-outpacing-deployment-of-ai-based-climate-solutions-iea/"],["Power Technology: IEA warns AI could double data centre power use by 2030","https://www.power-technology.com/news/iea-warns-ai-could-double-data-centre-power-use-by-2030/"],["Scientific American: Data centers will use twice as much energy by 2030, driven by AI","https://www.scientificamerican.com/article/ai-will-drive-doubling-of-data-center-energy-demand-by-2030/"],["Carbon Brief: Five charts that put data-centre energy use and emissions into context","https://www.carbonbrief.org/ai-five-charts-that-put-data-centre-energy-use-and-emissions-into-context/"],["Lawrence Berkeley National Laboratory: 2024 United States data center energy usage report","https://eta-publications.lbl.gov/sites/default/files/2024-12/lbnl-2024-united-states-data-center-energy-usage-report_1.pdf"]] },
{ id:"power-bills", cat:"Scale", a:true, worse:"yes", group:"footprint", asOf:"November 19, 2026",
  rank:2,
  q:"Have data centers driven up power costs in part of the United States?",
  short:"The independent watchdog for the country's largest power grid says so. Existing and planned data centers have added $29.4 billion to what its customers pay for future supply, it said in November 2026. The grid serves 67 million people in all or part of 13 states.",
  detail:"The grid, called PJM, runs across the mid-Atlantic and Midwest and takes in the world's largest concentration of data centers, in Virginia. Wholesale power there cost almost 76% more in early 2026 than a year before, partly because of fuel costs. In November 2026 the watchdog warned that counting planned data centers in a December auction could add another $5 billion to $10 billion. Some, it said, have already been canceled. Across the country higher prices have not always gone with more data centers, according to Lawrence Berkeley National Laboratory.",
  src:[["E&E News: Data centers drive 76% surge in PJM power prices","https://www.eenews.net/articles/data-centers-drive-76-surge-in-pjm-power-prices/"],["Utility Dive: PJM urged to delay base capacity auction until data centers cut from forecast","https://www.utilitydive.com/news/ratepayer-advocates-pjm-market-monitor-capacity-auction/875165/"],["Monitoring Analytics: first-quarter 2026 report on the PJM power market","https://www.monitoringanalytics.com/reports/Market_Messages/Messages/2026q1-som-pjm-press-release.pdf"],["Monitoring Analytics: third-quarter 2026 report on the PJM power market","https://www.monitoringanalytics.com/reports/PJM_State_of_the_Market/2026/2026q3-som-pjm-sec1.pdf"]] },

{ id:"ai-worldwide", cat:"Society", a:true, worse:"no", group:"public-mood", kind:"opinion", asOf:"June 2026",
  rank:4,
  q:"In a 32-country survey, did most people see more pros than cons in AI products?",
  short:"On average 55% did, in a 2026 Ipsos survey. It depends on where you live: 85% agreed in China, 38% in the United States and 34% in Canada.",
  detail:"Ipsos questioned 23,532 adults online in March and April 2026. In the United States more people disagreed, 48%, than agreed. Across all the countries, 51% said AI products make them excited and 50% said they make them nervous. The average counts every country equally, and in 15 of them, China and India among them, the people surveyed were more urban, educated or well off than the population as a whole.",

{ id:"companionship", cat:"Society", a:false, worse:"yes", group:"companions", asOf:"October 13, 2026",
  rank:2,
  q:"Do more than one in ten US adults ever use AI for companionship?",
  short:"About 4% say they do, in a February 2026 Pew survey. Among those under 30 it was 7%.",
  detail:"Looking for information was the most common use, at 42%. Pew's questions were about AI chatbots. One in ten adults said they use them for emotional support or advice, rising to one in five of those under 30. Pew recruits its panel at random. It has warned that polls people choose to join online can overcount rare things: in one, 12% of adults under 30 claimed to be licensed to operate a nuclear submarine. Character.ai, the maker of one of the largest companion apps, filed for bankruptcy protection in October 2026, citing costs and litigation.",
  src:[["Pew Research Center: Americans and AI 2026","https://www.pewresearch.org/internet/2026/06/17/americans-and-ai-2026-chatbots-smart-devices-and-views-on-impact/"],["Pew Research Center: Chatbot use by age","https://www.pewresearch.org/chart/1-in-5-adults-under-30-say-they-get-emotional-support-from-chatbots-higher-than-for-older-adults/"],["Pew Research Center: Online opt-in polls can produce misleading results","https://www.pewresearch.org/short-reads/2024/03/05/online-opt-in-polls-can-produce-misleading-results-especially-for-young-people-and-hispanic-adults/"],["CNBC: AI companion startup Character.ai files for bankruptcy","https://www.cnbc.com/2026/10/13/character-ai-chapter-11-disney-bid.html"]] },
{ id:"companion-lonely", cat:"Society", a:false, worse:"no", group:"companions", asOf:"August 2026",
  rank:3,
  q:"In a big trial, did chatting with AI every day make people less lonely?",
  short:"They ended up lonelier than people who went on as usual. The 2026 trial, in France, ran for 28 days and involved more than 12,000 adults.",
  detail:"People in the AI group were asked to have at least one personal conversation a day with an AI tool of their choice. Other measures of well-being also moved the wrong way, but not clearly enough to be sure. The study is a working paper. In a smaller trial in Canada, 296 first-year students spent two weeks texting a stranger, chatting with a supportive AI or writing a one-sentence journal entry each day. Only those who texted a person became less lonely, though the AI did ease bad moods.",
  safety:"The trial was not aimed at isolated people. A New York program that had nearly 1,000 older adults talk to an AI reported a drop in loneliness.",
  src:[["Fréget, Reshef and Senik: Do personal AI conversations reduce loneliness?","https://ideas.repec.org/p/ces/ceswps/_12882.html"],["Fortune: Talking to a bot might feel good, but a growing body of research suggests it won't cure loneliness","https://fortune.com/2026/08/16/ai-chatbot-research-loneliness/"],["University of British Columbia: Texting with a stranger beats a chatbot at easing loneliness","https://news.ubc.ca/2026/04/texting-with-a-stranger-beats-a-chatbot-at-easing-loneliness/"]] },
{ id:"teens", cat:"Society", a:true, worse:"yes", group:"learning", asOf:"February 2026",

  short:"64% of those aged 13 to 17 do, and about three in ten use one every day, a Pew survey found in fall 2025.",
  detail:"Pew surveyed 1,458 teens and their parents. Only about half of the parents thought their teen uses AI chatbots, the survey's term. 54% of the teens had used one for schoolwork, and 12% for emotional support or advice. 59% said that using AI to cheat happens at least somewhat often at their school.",
  src:[["Pew Research Center: How teens use and view AI","https://www.pewresearch.org/internet/2026/02/24/how-teens-use-and-view-ai/"],["NBC News: 28% of US teens say they use AI chatbots daily","https://www.nbcnews.com/tech/social-media/28-us-teens-say-use-ai-chatbots-daily-poll-says-rcna248133"]] },
{ id:"safety-grades", cat:"Risk and rules", a:false, worse:"no", kind:"opinion", asOf:"July 2026",

  detail:"A panel of outside experts graded nine companies on 37 measures. Anthropic got the C+, OpenAI and Google DeepMind got a C, and xAI, DeepSeek and Mistral got an F. On planning for the most extreme risks, no company scored above a D+. The institute campaigns on AI risk, so this is a critic's scorecard and not a regulator's.",

{ id:"killer-robots", cat:"Risk and rules", a:false, worse:"no", group:"eu-rules", kind:"rule", asOf:"November 21, 2026",

  short:"Not so far. A UN conference in Geneva ended in November 2026 without opening treaty negotiations. Talks are to go on for two more years.",
  detail:"Whether what comes out of those talks would be legally binding was left open. Countries have been discussing such weapons at the United Nations for 13 years. More than 95 of them expressed support for a treaty during the conference, according to the campaign group Stop Killer Robots. Activists blamed countries with large militaries, such as Russia and the United States, for blocking anything stronger.",

{ id:"revenue-growth", cat:"Scale", a:true, worse:"yes", group:"lab-valuations", asOf:"November 23, 2026",
  rank:8,

  short:"They are growing about as fast as any, or faster, two writers at the research group Epoch AI say. OpenAI's yearly pace of sales tripled in the 12 months to August 2026. Anthropic's sales for January to September were 13 times the year before's.",
  detail:"They say it is extremely rare for a technology company with more than $1 billion in sales to more than double them in a year. Anthropic's went from $386 million in 2024 to nearly $4.6 billion in 2025 and $33 billion in the first nine months of 2026. OpenAI took in about $10 billion in the third quarter of 2026, the Wall Street Journal reported. Both spend heavily to grow, and both lost money on operations that quarter: $10.9 billion at OpenAI and $567 million at Anthropic.",
