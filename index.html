    src:[["Wikimedia Commons: official portrait of Henry C. Leventis, US Department of Justice, public domain","https://commons.wikimedia.org/wiki/File:Henry_C._Leventis,_U.S._Attorney.jpg"],["Wikimedia Commons: official portrait of Mac Schneider, US Department of Justice, public domain","https://commons.wikimedia.org/wiki/File:Mac_Schneider,_U.S._Attorney.jpg"],["Wikimedia Commons: official portrait of Sean P. Costello, US Department of Justice, public domain","https://commons.wikimedia.org/wiki/File:Sean_P._Costello,_official_portrait_(2023).jpg"],["Cognitive Research, 2025: ChatGPT faces and real photographs","https://pmc.ncbi.nlm.nih.gov/articles/PMC12521686/"],["UNSW Sydney, 2026: people are overconfident about spotting AI faces","https://www.unsw.edu.au/newsroom/news/2026/02/humans-overconfident-telling-AI-faces-real-faces-people-fake"]] },

// The photos are separate files. Where they are not beside the page (a copy of this file alone), no photo question is dealt.
const PHOTOS = { here: false, checked: Promise.resolve() };
if (GUESS_FACES.length) { const im = new Image(); PHOTOS.checked = new Promise(done => { im.onload = () => { PHOTOS.here = true; done(); }; im.onerror = done; }); im.src = GUESS_FACES[0].ai; }
/* ---------- Asking, grading and dealing ----------
   Questions are asked so that being close counts. GUESS_FORMS turns an entry into a slider or a short list,
   GUESS_CLAIMS into a plain statement (shown four at a time), GUESS_QUOTES adds a few "who said it" picks, and GUESS_FACES
   asks which of four photos was made by AI.
   A form names the exact figures it was written from (check). When one is no longer in the entry's text, or a
   statement has stopped being true or false, the question is left out until the table is brought up to date. */
const Guess = (() => {
  const comma = n => Math.round(n).toLocaleString("en-US");
  const two = n => Number(n.toPrecision(2));
  const big = (n, money) => {
    const d = money ? "$" : "";
    for (const [size, word] of [[1e12, "trillion"], [1e9, "billion"], [1e6, "million"]]) if (n >= size) return `${d}${two(n / size)} ${word}`;
    return d + comma(two(n));
  };
  const decimals = f => f.step && f.step < 1 ? 1 : 0;
  // The word after a number. One of something is singular: " months" becomes " month". " of 8" and "%" stay as they are.
  const word = (unit, n) => Math.abs(n) === 1 && /^ [a-z]+s$/.test(unit || "") ? unit.slice(0, -1) : unit || "";
  // Water, from a teaspoon up, in the amounts a kitchen would use: [gallons, how it is said]. Above 9 gallons two digits are enough.
  const portion = k => (Math.floor(k) || "") + ({ 0.25: "¼", 0.5: "½", 0.75: "¾" }[k % 1] || "");
  const WATER = [[768, "teaspoon", [1, 2]], [256, "tablespoon", [1, 2, 3]], [16, "cup", [0.25, 0.5, 0.75, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10, 12, 14]], [1, "gallon", [1, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 9]]]
    .flatMap(([inOne, name, list]) => list.map(k => [k / inOne, `${portion(k)} ${name}${k > 1 ? "s" : ""}`]));
  const water = n => {
    if (n >= 9.5) return [Math.round(two(n)), `${big(n, false)} gallons`];
    const off = x => Math.abs(Math.log(x[0] / n));
    return WATER.reduce((a, b) => off(b) < off(a) ? b : a);
  };
  // A length of time in days: whole hours below a day, half days below ten, then days, months from two on (half ones below six), and years.
  const MONTH = 365 / 12, day = n => n < 0.98 ? Math.max(1, Math.round(n * 24)) / 24 : n < 9.75 ? Math.round(n * 2) / 2 : n < 58 ? Math.round(two(n))
    : n < 350 ? (n < 5.75 * MONTH ? Math.round(n / MONTH * 2) / 2 : Math.round(n / MONTH)) * MONTH : Math.max(1, two(n / 365)) * 365;
  const count = (n, name) => `${n} ${name}${n === 1 || n === "1" ? "" : "s"}`;
  // A number as a person would say it.
  const say = (f, n) => {
    if (f.type === "pct") return `${Math.round(n)}%`;
    if (f.type === "lin") {
      if (f.year) return String(Math.round(n));
      const v = Number(n.toFixed(decimals(f))), t = (f.signed ? (v > 0 ? "+" : v < 0 ? "−" : "") : "") + (f.signed ? Math.abs(v) : v);
      return (f.prefix || "") + t + word(f.unit, v);
    }
    if (f.unit === "usd") return big(n, true);
    if (f.unit === "gallons") return water(n)[1];
    if (f.unit === "days") { const d = day(n); return d < 1 ? count(Math.round(d * 24), "hour") : d >= 365 ? count(two(d / 365), "year") : d > 58 ? count(portion(Math.round(d / MONTH * 2) / 2), "month") : count(portion(d), "day"); }
    if (f.unit === "cents") { const c = two(n), d = two(c / 100); return c < 100 ? count(c, "cent") : "$" + (d < 10 && d % 1 ? d.toFixed(2) : comma(d)); }
    if (f.unit === "years") { const y = two(n); return y === 1 ? "1 year" : `${y < 10 ? y : comma(y)} years`; }
    if (f.unit === "months") return two(n) + word(" months", two(n));
    if (f.unit === "times") return two(n) === 1 ? "1 time" : `${n >= 1000 ? big(n, false) : two(n)} times`;
    if (f.unit === "hours") {
      if (n < 1) { const m = Math.max(1, Math.round(two(n * 60))); return m === 1 ? "1 minute" : `${m} minutes`; }
      const h = two(n); return h === 1 ? "1 hour" : `${h < 10 ? h : comma(h)} hours`;
    }
    return big(n, false);
  };
  const lo = f => f.type === "pct" ? 0 : f.min, hi = f => f.type === "pct" ? 100 : f.max;
  const clamp01 = t => Math.max(0, Math.min(1, t));
  const pos = (f, n) => f.type === "log" ? Math.log(n / f.min) / Math.log(f.max / f.min) : (n - lo(f)) / (hi(f) - lo(f));
  const at = (f, t) => {
    if (f.type === "log") {
      const v = f.min * Math.pow(f.max / f.min, t);
      if (f.unit === "gallons") return water(v)[0];   // graded as it is said
      if (f.unit === "days") return day(v);
      return f.unit === "usd" || f.unit === "count" ? Math.round(two(v)) : two(v);   // money and counts are shown whole, so they are graded whole
    }
    const step = f.step || 1, v = lo(f) + t * (hi(f) - lo(f));
    return Number((Math.round(v / step) * step).toFixed(decimals(f)));
  };
  const stops = f => f.type === "pct" ? 100 : f.type === "log" ? 600 : Math.round((f.max - f.min) / (f.step || 1));

  /* How each question in the bank is asked. */
  const NUM = [], CLAIM = [], QUOTE = [], FACE = [], adrift = [];
  for (const q of QUESTIONS) {
    const f = GUESS_FORMS[q.id], c = GUESS_CLAIMS[q.id], text = [q.q, q.short, q.detail, q.safety || ""].join("\n");
    const holds = x => (x.check || []).every(s => text.includes(s));
    if (f && holds(f)) NUM.push({ kind: f.type, id: q.id, f, q });
    else if (c && c[1] === q.a) CLAIM.push({ id: q.id, text: c[0], q });
    else adrift.push(q.id);
    // A question with two good numbers can have a second slider. Only a grouped one, so that a round never holds both.
    const second = q.group && GUESS_FORMS[q.id + "~2"];
    if (second && holds(second)) NUM.push({ kind: second.type, id: q.id + "~2", f: second, q });
  }
  for (const x of GUESS_QUOTES) QUOTE.push({ id: x.id, x, q: { id: x.id, cat: "Who said it", group: x.group, rank: 7, q: x.q, short: x.short, detail: "", src: x.src } });
  for (const x of GUESS_FACES) FACE.push({ id: x.id, x: { ...x, options: [x.ai].concat(x.real) }, q: { id: x.id, cat: "Media", group: x.group, rank: 7, q: x.q, short: x.short, detail: "", src: x.src } });
  if (adrift.length) console.warn("These are left out, because their slider, list or statement no longer matches the entry: " + adrift.join(", "));
  const index = list => Object.assign(Object.create(null), Object.fromEntries(list.map(x => [x.id, x])));
  const numById = index(NUM), claimById = index(CLAIM), quoteById = index(QUOTE.concat(FACE));
  const extra = new Set([...NUM.filter(x => x.id !== x.q.id), ...QUOTE, ...FACE].map(x => x.id));   // ids that are not questions in the bank

  function makeQuad(claims) {
    const t = claims.filter(c => c && c.q.a).length;
    if (claims.length !== 4 || claims.some(c => !c) || new Set(claims).size !== 4 || (t !== 3 && t !== 1)) return null;
    const oddFalse = t === 3;
    return { kind: "quad", id: "quad", oddFalse, claims, answer: claims.findIndex(c => !!c.q.a !== oddFalse) };   // the one that differs
  }
  function makeQuote(o, order) {
    if (!o || order.length !== o.x.options.length || o.x.options.some((x, i) => !order.includes(i))) return null;

function clearDare() {

}
function clearChallenge() {
  state.challenge = null;
  try { if (/[?&]c=/.test(location.search)) history.replaceState(history.state, "", location.pathname); } catch (e) {}
}
function siteUrl() {
  if (CONFIG.siteUrl) return CONFIG.siteUrl;

// The link to share: the site address plus this round's questions and results.
function shareUrl() {
  const base = siteUrl();
  return base && base + "?c=g" + state.list.map(it => Guess.linkCode(it)).join("-") + "." + state.answers.map(r => ({ good: 2, meh: 1, bad: 0 })[markOf(r)]).join("");
}

// One question to pass on. The link carries that question alone, and the friend answers it on the start screen.
function readDare(raw) {
  const m = /^g([0-9a-z]{4}|[0-9a-z]{16})$/.exec(raw);
  if (m) return Guess.decode(m[1]);
  // Links from before November 25, 2026 carry the code of an entry. It is asked as it is now, if it has a question of its own.
  return (/^[0-9a-z]{4}$/.test(raw) && Guess.NUM.find(x => codeOf(answerKey(x.q)) === raw)) || null;
}
// A question's link. One with a four-letter code has its own page in q/, whose link preview shows the question and its
// drawing, and which sends the visitor straight on to the question here. A set of four statements has no page of its own.
function dareUrl(it) {
  const base = siteUrl(), code = Guess.encode(it);
  return !base ? "" : code.length === 4 ? base.replace(/[^/]*$/, "") + "q/" + code + "/" : `${base}?q=g${code}`;
}
function dareText(it) {
  const url = dareUrl(it), listed = it.kind === "quad" || it.kind === "pick";
  const ask = Guess.titleOf(it) + (it.photos ? "" : listed ? "\n" + Guess.optionsOf(it).map(o => "- " + o).join("\n") : (it.f.hint ? ` (${it.f.hint})` : "") + " Take a guess.");
  return ask + (url ? `\n${url}` : "");
}
async function sendDare(it, say) {
  const text = dareText(it);
  if (typeof navigator.share === "function") {
    try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); say("Copied. Paste it anywhere."); return; } catch (e) {}
  try {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(t); t.select();
    const done = document.execCommand("copy"); t.remove();
    if (done) { say("Copied. Paste it anywhere."); return; }
  } catch (e) {}
  say("Copying is blocked here.");
}

/* ---------- Shared pieces of the screens ---------- */
function detailsBlock(q, label, note, asked) {
  const links = q.src.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a></li>`).join("");
  return `<details>
    <summary>${esc(label)}</summary>
    <div class="body">
      ${note && q.safety ? `<p><b>Worth knowing:</b> ${gloss(q.safety)}</p>` : ""}
      ${q.detail ? `<p>${gloss(q.detail)}</p>` : ""}
      ${q.asOf ? `<p class="small muted">Latest source: ${esc(q.asOf)}.</p>` : ""}
      <p class="src-h" aria-hidden="true">Sources</p>
      <ul class="sources" aria-label="Sources">${links}</ul>
      ${CONFIG.feedbackUrl ? `<p class="small"><a href="${esc(CONFIG.feedbackUrl + "#" + new URLSearchParams({ id: q.id, q: asked || q.q }))}" target="_blank" rel="noopener">Something wrong with this answer? Send a note</a></p>` : ""}
    </div>
  </details>`;
}

/* ---------- Result image ----------
   Draws the result as a square picture: score, the row of squares, the one-line finding and one question that caught the player out.
   Always dark, whatever the page theme, so shared cards look the same everywhere. */
const TINT = { good: ["#0c7458", "#2aa17b", "#d5f5e9"], meh: ["#9a6a00", "#c99527", "#fff3d1"], bad: ["#b02a48", "#dc5f7b", "#ffe1e8"] };
async function artImage(name, kind) {
  const [d, l, p] = TINT[kind], css = Object.entries({ d, l, p, w: "#ffffff", k: "#0c1330", s: "#0c1330" }).map(([c, v]) => `.z${c}{fill:${v}}.z${c}o{fill:none;stroke:${v};stroke-linecap:round;stroke-linejoin:round}`).join("") + ".zi{fill:#ffffff}";
  const im = new Image(); im.src = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="480" height="400"><style>${css}</style>${ART[name]}</svg>`);
  try { await im.decode(); return im; } catch (e) { return null; }
}
async function resultImage(s, key) {
  const answers = state.answers;   // a new round may have begun by the time the fonts are here
  const W = 1080, H = 1350, pad = 84;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const DISPLAY = '"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const BODY = '"IBM Plex Sans", "Segoe UI", system-ui, sans-serif';
  // Slow fonts get a few seconds, then the picture is drawn with the ones at hand.
  try { await Promise.race([Promise.all([document.fonts.load(`700 100px ${DISPLAY}`), document.fonts.load(`400 30px ${MONO}`), document.fonts.load(`500 30px ${BODY}`), document.fonts.load(`600 32px ${BODY}`)]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  const COL = { field: "#2742d6", on: "#ffffff", on2: "#dfe5ff", bg: "#f3f4f8", ink: "#131c26", muted: "#566472", knob: "#0c1330", good: "#57d3a9", bad: "#ff8fa6", meh: "#f2c867" };
  const box = (px, py, w, h, r, fill) => {
    x.beginPath(); x.moveTo(px + r, py);
    x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r);
    x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r);
    x.closePath(); x.fillStyle = fill; x.fill();
  };
  // The same picture as the result page: a blue field, its lower edge the ruler, the score on a pin.
  const edge = 1116, left = pad, span = W - 2 * pad, at = v => left + span * v / s.n;
  x.fillStyle = COL.bg; x.fillRect(0, 0, W, H);
  x.fillStyle = COL.field; x.fillRect(0, 0, W, edge);
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  x.fillStyle = COL.on; x.font = `700 50px ${DISPLAY}`; x.fillText("What's up with AI?", pad, 116);
  const two = s.n > 10, size = two ? 81 : 150, gap = two ? 11 : 20, per = two ? 10 : 5, top = 160;
  const pics = await Promise.all(answers.map(r => artImage(stampOf(r.it), markOf(r))));
  answers.forEach((r, i) => {
    const px = pad + (i % per) * (size + gap), py = top + Math.floor(i / per) * (size + gap);
    box(px, py, size, size, size * 0.22, COL[markOf(r)]);
    if (pics[i]) x.drawImage(pics[i], px + size * 0.11, py + size * 0.175, size * 0.78, size * 0.65);
  });
  const gridEnd = top + Math.ceil(s.n / per) * (size + gap) - gap;
  // The score, over its place on the ruler and kept inside the picture.
  const px = at(s.right), score = pts(s.right);
  x.font = `700 250px ${DISPLAY}`;
  const w = x.measureText(score).width, cx = Math.max(pad - 14 + w / 2, Math.min(W - pad + 14 - w / 2, px));
  x.textAlign = "center"; x.fillStyle = COL.on; x.fillText(score, cx, edge - 128);
  x.font = `500 38px ${BODY}`; x.fillStyle = COL.on2;
  const of = `out of ${s.n}`, ow = x.measureText(of).width;
  x.fillText(of, Math.max(pad - 14 + ow / 2, Math.min(W - pad + 14 - ow / 2, cx)), edge - 68);
  x.fillStyle = COL.on; x.fillRect(px - 4, edge - 54, 8, 54);
  // The lines of the ruler, with every number named that has room.
  const step = s.n <= 10 ? 1 : 2;
  x.font = `400 30px ${MONO}`;
  for (const v of [...Array.from({ length: Math.ceil(s.n / step) }, (_, i) => i * step), s.n]) {
    x.fillStyle = COL.ink; x.fillRect(at(v) - 2, edge, 4, 44);
    if (v && v < s.n && s.n - v < step) continue;   // no room for its number beside the last one
    x.fillStyle = COL.muted; x.textAlign = v === 0 ? "left" : v === s.n ? "right" : "center"; x.fillText(String(v), at(v) + (v === 0 ? -2 : v === s.n ? 2 : 0), edge + 88);
  }
  x.beginPath(); x.arc(px, edge, 36, 0, Math.PI * 2); x.fillStyle = COL.on; x.fill();
  x.beginPath(); x.arc(px, edge, 28, 0, Math.PI * 2); x.fillStyle = COL.knob; x.fill();
  x.textAlign = "left";
  const where = siteUrl().replace(/^https?:\/\//, "").replace(/\/(index\.html)?$/, "");
  const wrap = text => {
    const out = [];
    let line = "";
    for (const w of text.split(" ")) {
      if (line && x.measureText(line + " " + w).width > span) { out.push(line); line = w; }
      else line = line ? line + " " + w : w;
    }
    if (line) out.push(line);
    return out;
  };
  // Between the squares and the score: the finding, and the question that got the player where there is room for it.
  const room = edge - 128 - 214 - gridEnd, BIG = `700 56px ${DISPLAY}`;
  x.font = BIG;
  const lines = wrap(FINDINGS[key].share.replace(/\.$/, ""));
  const got = gotMe(answers)[0];
  let hook = [], hookFont = "", lead = 0;
  for (const [size, gapY] of got ? [[34, 45], [30, 40]] : []) {
    hookFont = `500 ${size}px ${BODY}`; lead = gapY; x.font = hookFont;
    hook = wrap(gotLine(got));
    if (lines.length * 66 + 18 + hook.length * lead <= room) break;
    hook = [];
  }
  let y = gridEnd + Math.max(18, (room - lines.length * 66 - (hook.length ? 18 + hook.length * lead : 0)) / 2) + 50;
  x.fillStyle = COL.on; x.font = BIG;
  for (const l of lines) { x.fillText(l, pad, y); y += 66; }
  if (hook.length) {
    y += 4; x.fillStyle = COL.on2; x.font = hookFont;
    for (const l of hook) { x.fillText(l, pad, y); y += lead; }
  }
  x.fillStyle = COL.ink; x.font = `600 32px ${BODY}`;
  x.fillText("How close can you get?", pad, H - 58);
  if (where) { x.font = `400 28px ${MONO}`; x.fillStyle = COL.muted; x.textAlign = "right"; x.fillText(where, W - pad, H - 58); x.textAlign = "left"; }
  return new Promise(resolve => c.toBlob(resolve, "image/png"));
}

/* ---------- Keyboard and history ---------- */
// The number keys pick from a list, while the question or its choices have the focus, so that stray keys elsewhere (from speech input, say)
// never answer. Enter works on the focused button, and on the verdict it goes on.
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = (e.key || "").toLowerCase(), on = document.activeElement;
  if (k === "enter" && on && on.id === "verdict") { const next = document.getElementById("next"); if (next) { e.preventDefault(); next.click(); } return; }
  if (!/^[1-9]$/.test(k) || !on || !on.closest(".q-body, #control") || !asking()) return;
  const b = $app.querySelector(`.pick[data-i="${Number(k) - 1}"], .photo[data-i="${Number(k) - 1}"]`);
  if (b) { e.preventDefault(); b.click(); }
});
// Back from a round or a result lands on the start screen. A round in progress is saved, so it can be picked up again.
window.addEventListener("popstate", () => {
  if (pageNamed()) { renderPage(pageNamed()); return; }
  if (state.screen === "learn") { closeLearn(); return; }
  const h = history.state;
  if (h && h.quiz && h.r === state.rk) state.steps = Math.max(state.steps, placeOf(h.at));
  if (h && h.quiz && h.r === state.rk && state.list.length && ["question", "results", "bonus"].includes(state.screen)) {
    if (h.at === "end" && state.answers.length === state.list.length) { if (store.bonus) renderResults(); else renderBonus(); return; }
    // A step can name a place a skipped photo question has since left; the question now last stands in for it.
    if (typeof h.at === "number") { const k = Math.min(h.at, state.list.length - 1); if (k <= state.index) { showQuestion(k); return; } }
  }
  // Forward, after Back: on with the round that was left.
  const left = history.state && history.state.quiz && state.screen === "start" ? loadRound() : null;
  if (left && (!state.challenge || sameRound(left.ch, state.challenge))) {
    resumeRound(left);
    if (h && h.r === state.rk && typeof h.at === "number" && h.at < state.index) showQuestion(h.at);   // Forward lands on the step it names
    return;
  }
  const before = state.challenge, coded = /[?&]c=/.test(location.search);
  // A challenge played through to its result is over, and so is one whose code has left the address.
  // Going back must not offer it again as if it were new.
  if (state.challenge && (state.screen === "results" || (state.screen === "question" && state.finished) || !coded)) state.challenge = null;
  // A challenge that was set aside while an older round was finished comes back.
  if (state.parked && coded) state.challenge = state.parked;
  state.parked = null;
  if (state.screen !== "start" || before !== state.challenge) renderStart();
  try { if (!state.challenge && /[?&]c=/.test(location.search)) history.replaceState(history.state, "", location.pathname); } catch (e) {}
});
// "Back to the start" undoes all the steps the round added, so the next Back press leaves the page as expected.
function goHome() {
  clearChallenge();
  try { const h = history.state; if (h && h.quiz) { history.go(-(h.r === state.rk && h.n > 0 ? h.n : 1)); return; } } catch (e) {}
  renderStart();
}

// The second tap of a double-tap lands on whatever has just come up under the finger. It counts for nothing, except on the arrows and squares, which
// are there to be pressed quickly.
$app.addEventListener("click", e => {
  if (e.detail > 0 && performance.now() - state.shownAt < 350 && e.target.closest("a, summary, button:not(.arrow):not(.dot)")) { e.preventDefault(); e.stopPropagation(); }
}, true);

if (pageNamed()) { state.screen = "boot"; renderPage(pageNamed()); }
else if (state.challenge || state.dare || loadRound()) renderStart();
// A fresh round waits a moment for the photo check, so that a photo question can be in it.
else Promise.race([PHOTOS.checked, new Promise(go => setTimeout(go, 400))]).then(() => { if (!$app.firstElementChild) renderStart(); });
</script>
</body>
</html>
