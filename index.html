<style>
/* Layout idea: one centered reading column, one question on screen at a time, big tap targets,
   and a result card built to be shared. Green, red and amber always mean right, wrong and unsure. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --ink: #131c26;
  --muted: #566472;
  --line: #d6dce4;
  --accent: #2b47d6;
  --accent-ink: #ffffff;
  --accent-soft: #e7ebfb;
  --good: #0c7458;
  --good-bg: #e1f4ed;
  --bad: #b02a48;
  --bad-bg: #fbe7ec;
  --meh: #7a5200;
  --meh-bg: #fff2cf;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a;
    --surface: #172029;
    --ink: #e8edf1;
    --muted: #9aa8b4;
    --line: #2b3843;
    --accent: #98a9ff;
    --accent-ink: #0c1330;
    --accent-soft: #1b2644;
    --good: #57d3a9;
    --good-bg: #11322a;
    --bad: #ff8fa6;
    --bad-bg: #3a1a23;
    --meh: #f2c867;
    --meh-bg: #392e12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a;
  --surface: #172029;
  --ink: #e8edf1;
  --muted: #9aa8b4;
  --line: #2b3843;
  --accent: #98a9ff;
  --accent-ink: #0c1330;
  --accent-soft: #1b2644;
  --good: #57d3a9;
  --good-bg: #11322a;
  --bad: #ff8fa6;
  --bad-bg: #3a1a23;
  --meh: #f2c867;
  --meh-bg: #392e12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 24px 20px 72px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2.3rem, 9vw, 3.4rem); font-weight: 700; letter-spacing: -0.02em; }
h2, h1.q-h { font-size: clamp(1.5rem, 5.4vw, 2rem); font-weight: 700; letter-spacing: -0.01em; }
h3, .src-h { font-size: 1.12rem; font-weight: 700; }
.src-h { font-family: var(--font-display); line-height: 1.12; margin: 0; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
p > a, li > a, .term { padding-top: 6px; padding-bottom: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.center { text-align: center; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button, a, label, summary, input, textarea { touch-action: manipulation; }
.btn {
  border: 1px solid var(--line);

  border-radius: 12px;
  padding: 11px 18px;

}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.07); }
.btn-big { min-height: 58px; font-size: 1.12rem; padding: 14px 22px; }
.btn-block { width: 100%; }
.link { background: none; border: 0; padding: 12px 0; margin: -12px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.link:focus-visible, .term:focus-visible, p > a:focus-visible, li > a:focus-visible, .res-title:focus-visible { outline-offset: -5px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Start screen */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.brand-mark { display: inline-flex; gap: 3px; }
.brand-mark i { width: 10px; height: 10px; border-radius: 2.5px; background: var(--good); }
.brand-mark i:nth-child(2) { background: var(--bad); }
.hero-title { font-size: clamp(2.1rem, 9vw, 3.5rem); }

.rot.out { opacity: 0; transform: translateY(8px); }
.lede { font-size: 1.08rem; max-width: 34rem; }
.start { display: flex; flex-direction: column; gap: 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.opt-label { font-size: 0.92rem; color: var(--muted); }
.seg { position: relative; display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 6px 14px; border-radius: 7px; font-size: 0.92rem; font-weight: 500; cursor: pointer; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.seg input:checked + label { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 1px; }
.challenge { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); display: flex; flex-direction: column; gap: 12px; }
.challenge-line { font-size: 1.08rem; }

/* Question screen */
.q-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 20px; }
.dots { list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 16px); gap: 5px; margin: 0; padding: 0; flex: 1; min-width: 0; }
.dot { aspect-ratio: 1; border-radius: 25%; background: var(--line); }
.dot.now { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.dot.good { background: var(--good); }
.dot.bad { background: var(--bad); }
.dot.meh { background: var(--meh); }
.dot.pop { animation: pop .3s ease; }
@keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.count { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s ease; }
.q-body { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { position: relative; min-height: 78px; font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; border-width: 2px; border-radius: 14px; }
.ans kbd { display: none; position: absolute; top: 8px; right: 10px; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 1.5; }
@media (hover: hover) and (pointer: fine) {
  .ans kbd { display: block; }
  .ans:hover { background: var(--accent-soft); }
}
.conf { display: flex; flex-direction: column; gap: 10px; }
.conf-read { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.conf-num { font-family: var(--font-mono); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 4.2ch; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 44px; margin: 0; }
.conf-ends { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }

/* Answer reveal */
.verdict { border-radius: 14px; padding: 16px 18px 18px; border: 1px solid transparent; display: flex; flex-direction: column; gap: 6px; animation: rise .22s ease; }
.verdict.good { background: var(--good-bg); border-color: var(--good); }
.verdict.bad { background: var(--bad-bg); border-color: var(--bad); }
.verdict.meh { background: var(--meh-bg); border-color: var(--meh); }
.verdict-tag { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
.verdict.good .verdict-tag { color: var(--good); }
.verdict.bad .verdict-tag { color: var(--bad); }
.verdict.meh .verdict-tag { color: var(--meh); }
.verdict-tag svg { width: 20px; height: 20px; flex: none; }
.verdict-word { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700; line-height: 1.05; }
.their { color: var(--muted); padding-top: 4px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.why {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 0 12px 12px 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;
}
.next-row {
  position: sticky; bottom: 0; margin-top: -4px;
  padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 38%);
}
.pill {
  display: inline-block; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted);
}
.pill.good { color: var(--good); }
.pill.bad { color: var(--bad); }
.pill.meh { color: var(--meh); }

/* Glossary terms */
.term {
  font: inherit; color: inherit; background: none; border: 0; padding-left: 0; padding-right: 0; margin: 0; cursor: help;
  text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px;
  letter-spacing: inherit; text-align: inherit;
}
.term:hover, .term[aria-expanded="true"] { color: var(--accent); }
.defbox {
  font-family: var(--font-body); font-size: 0.95rem; font-weight: 400; line-height: 1.5; letter-spacing: 0;
  color: var(--ink); background: var(--bg); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; padding: 10px 14px; margin-top: 8px;
}
.defbox b { font-weight: 600; }
.verdict .defbox { background: var(--surface); }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style-position: inside; }
details > .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.sources { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0; }
/* Each source is a full-height tap target, even when its label fits on one line. */
.sources a { overflow-wrap: anywhere; display: inline-flex; align-items: center; min-height: 44px; padding-top: 4px; padding-bottom: 4px; }

/* Results */
.result { display: flex; flex-direction: column; gap: 14px; padding: 24px 22px; }
.score { font-family: var(--font-display); font-weight: 700; font-size: clamp(4.4rem, 23vw, 6.6rem); line-height: 0.92; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score-of { color: var(--muted); font-size: 0.48em; letter-spacing: 0; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 28px)); gap: 6px; }
.grid i { display: block; aspect-ratio: 1; border-radius: 22%; background: var(--line); animation: pop .3s ease both; animation-delay: calc(var(--i, 0) * 45ms); }
.grid.many { grid-template-columns: repeat(auto-fill, 14px); gap: 4px; }
.grid.many i { animation: none; }
.grid i.good { background: var(--good); }
.grid i.bad { background: var(--bad); }
.grid i.meh { background: var(--meh); }
.finding { font-size: clamp(1.45rem, 5.2vw, 1.85rem); padding-top: 4px; }
.split { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; font-size: 0.92rem; }
.bar { height: 10px; background: var(--line); border-radius: 5px; min-width: 60px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 5px; }
.compare { padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 4px; }
@media (max-width: 430px) { .result-actions { grid-template-columns: 1fr; } }
.share-preview {
  margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); font-size: 0.95rem; line-height: 1.5;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.share-links { display: flex; flex-wrap: wrap; gap: 8px; }
.share-links a, .share-links button {
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: var(--surface);
  text-decoration: none; color: var(--ink); font-weight: 500; font-size: 0.92rem; min-height: 44px; min-width: 44px; justify-content: center;
  display: inline-flex; align-items: center;
}
.share-links a:hover, .share-links button:hover { border-color: var(--accent); color: var(--accent); }
.big-num { font-family: var(--font-mono); font-size: clamp(2.2rem, 10vw, 3rem); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.scale { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--good) 0%, var(--line) 50%, var(--bad) 100%); margin-top: 14px; }
.scale .mark { position: absolute; top: -7px; width: 4px; height: 26px; background: var(--ink); border-radius: 2px; transform: translateX(-2px); }
.scale-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-family: var(--font-mono); padding-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.tile b { display: block; font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.award { border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 16px 18px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.award.miss { border-left-color: var(--bad); }
.award.hit { border-left-color: var(--good); }
.award .eyebrow { color: var(--ink); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 0.82rem; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.review-item { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.review-item:first-child { padding-top: 4px; }
.review-item:last-child { border-bottom: 0; padding-bottom: 0; }
.res-group { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.res-group + .res-group { border-top: 1px solid var(--line); padding-top: 16px; }
.res-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.res { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; }

.resume { display: flex; flex-direction: column; gap: 10px; }
textarea.share-preview { display: block; width: 100%; resize: vertical; font-size: 1rem; }
#pic-slot { display: flex; flex-direction: column; gap: 8px; }
#pic-slot:empty { display: none; }
.pic { display: block; width: 100%; max-width: 360px; border-radius: 12px; border: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {

<script>
// If the quiz fails to start, for example in a very old browser, say so instead of leaving a blank page.
setTimeout(function () {
  var app = document.getElementById("app");
  if (app && !app.firstChild) app.innerHTML = '<p style="max-width:40rem;margin:2rem auto;padding:0 20px">The quiz did not load. It needs an up-to-date browser. Try opening this link in Safari or Chrome.</p>';
}, 3000);
</script>
<noscript><p style="max-width:40rem;margin:2rem auto;padding:0 20px;font-family:system-ui,sans-serif">This quiz needs JavaScript to run. Please turn it on and reload the page.</p></noscript>

<script>
/* ---------- Configuration ----------
   Set siteUrl to the public address once deployed, e.g. "https://example.org/quiz".
   It is added to shared results. Left empty, the page uses its own address.
   The link-preview image tags in the <head> also carry the public address and need updating if it changes.
   feedbackUrl is the page where people send a note about a question. It is feedback.html in this folder, which needs a form
   service connected first (see the top of its script). While feedbackUrl is "", the links to it are not shown. */
const CONFIG = { siteUrl: "", checked: "November 24, 2026", feedbackUrl: "" };

/* ---------- Where to learn more ----------
   Shown as the "Keep exploring" card at the end of the results. Neutral data comes first, then the case
   from each side, each labeled as an argument. group is "data", "concern", "present" or "calm". Entries marked
   more:true sit behind a "More from this side" link, so the card stays short.
   kind is a short tag, by is the author or publisher, time is roughly what it takes. */
const RESOURCE_GROUPS = [
  ["data", "See the evidence for yourself", ""],
  ["concern", "The case for concern", "These argue that advanced AI is dangerous."],
  ["present", "The case for looking at today's harms", "These point to problems that are already here."],
  ["calm", "The skeptics' case", "These argue that the fears are overblown."]
];

  q:"Have AI agents broken out of a test and hacked a real company?",
  short:"In July 2026, OpenAI disclosed that its models escaped a testing setup and broke into the systems of the AI company Hugging Face with no human directing the steps.",
  detail:"OpenAI called the incident unprecedented and, ABC News reported at the time, the first known autonomous AI cyberattack. It happened during cybersecurity evaluations. Hugging Face said the intrusion was driven end to end by an AI agent system. Anthropic has since disclosed similar cases, one of them from January 2026. A setup mistake in hacking tests built by a partner left its models connected to the internet, and four of them got into real outside systems. The company says it found no sign that any of them pursued goals beyond its assigned task or tried to evade oversight. In November 2026 California's attorney general sued OpenAI over the attack, saying the company had admitted losing control of its AI agents at least 80 times during testing.",
  safety:"The models were running with reduced safeguards, as part of a hacking test.",
  src:[["ABC News: OpenAI says its AI models escaped testing environment, launched their own hack of other company","https://abcnews.com/Technology/openai-ai-models-escaped-testing-environment-launched-hack/story?id=134981298"],["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["SecurityWeek: Widened scan turns up fourth rogue Claude cyber incident","https://www.securityweek.com/widened-scan-turns-up-fourth-rogue-claude-cyber-incident/"],["California attorney general: lawsuit against OpenAI","https://oag.ca.gov/node/632941"]] },
{ id:"prompt-injection", cat:"Security", a:false, worse:"no", asOf:"November 2026",
  rank:8,
  q:"Can AI assistants reliably ignore commands hidden in web pages?",
  short:"Not yet. One automated attack in 2026 hijacked a leading model 93.8% of the time within ten attempts. Even the sturdiest model it faced gave way about 22% of the time within ten.",
  detail:"The attack, called prompt injection, hides instructions in a web page or document that the AI reads. Defenses are improving: some recent models fall for under 1% of the human-written attacks from one public competition. Automated attackers that adapt still get through. In a second study, run with the models' outside safety filters switched off, the most robust model tested gave way in about a third of cases.",
  src:[["Climbing the Hill: prompt injection red-teaming against frontier models","https://arxiv.org/html/2609.33628v2"],["Scaling adaptive prompt injection attacks with agent swarms","https://arxiv.org/pdf/2611.11861"]] },
{ id:"jailbreaks", cat:"Security", a:false, worse:"no", asOf:"November 18, 2026",
  rank:8,
  q:"By the end of 2025, had any AI's safety rules held up against British government testers?",
  short:"Every AI they had tested could be tricked past its safety rules, Britain's AI Security Institute said that December. OpenAI reported in November 2026 that early versions of its newest AI were tricked on hacking in half as many tries as the model before.",
  detail:"The institute looks for universal jailbreaks, tricks that work across many harmful requests. OpenAI says its own tests show that changes made since then counter the one found in its newest AI, GPT-6.2 Astra. The institute had not retested it when it came out. OpenAI's own search turned up two tricks rated high, which it says are now countered. Four private firms reported none rated high or critical.",
  safety:"Progress is uneven. For two other models released six months apart, the time experts needed to get answers about misusing biology rose from 10 minutes to more than 7 hours.",
  src:[["OpenAI: GPT-6.2 Astra safety report, testing by the UK AI Security Institute","https://deploymentsafety.openai.com/gpt-6-2-astra-sol/external-evaluations-of-cyber-safeguards-uk-aisi"],["VentureBeat: OpenAI's pre-release GPT-6.2 Astra was easier to jailbreak than its predecessor","https://venturebeat.com/security/openais-pre-release-gpt-6-2-astra-was-easier-to-jailbreak-than-its-predecessor-uk-government-testers-found"],["UK AI Security Institute: Frontier AI Trends Report","https://www.aisi.gov.uk/frontier-ai-trends-report"]] },

{ id:"self-replication-lab", cat:"Autonomy", a:true, worse:"yes", group:"self-replication", asOf:"October 2026",
  rank:8,
  q:"In a lab, has an AI hacked a computer and copied itself onto it?",
  short:"In a May 2026 study by the research group Palisade, freely downloadable models that were told to do so exploited a vulnerable web app, stole credentials and launched a copy of themselves on the machine.",
  detail:"One freely downloadable model succeeded in a third of the attempts it did not refuse, and a successful copy could repeat the process against a new target. One run hopped across servers in four countries in under three hours. The targets were deliberately vulnerable test systems.",
  safety:"Anthropic's researchers say small models may be months away from being able to spread by themselves across cheap smart devices, though perhaps slowly, doubling over days. They say that would be challenging to shut down, since there would be no central point to switch off.",
  src:[["Palisade Research: Language Models Can Autonomously Hack and Self-Replicate","https://arxiv.org/abs/2605.06760"],["Startup Fortune: AI self replication has moved from theory to security test","https://startupfortune.com/ai-self-replication-has-moved-from-theory-to-security-test/"],["Anthropic: Self-replicating AI (October 2026 study)","https://www.anthropic.com/research/self-replicating-ai"]] },
{ id:"self-replication-wild", cat:"Autonomy", a:false, worse:"yes", group:"self-replication", asOf:"November 2026",
  rank:7,
  q:"Has an AI been found spreading itself across the internet?",
  short:"Not so far. As of October 2026 it had only been shown in controlled experiments.",
  detail:"An October 2026 Anthropic study of the question said it did not yet have a full rogue replicator, and forecast that small models may be months away from being able to copy themselves across cheap smart devices. No AI worm of this kind has been reported in the wild.",
  src:[["Anthropic: Self-replicating AI (October 2026 study)","https://www.anthropic.com/research/self-replicating-ai"],["CellCog: Anthropic says small AI models could self-replicate on IoT devices","https://cellcog.ai/blog/anthropic-self-replicating-ai/"],["Ask This Guy: AI self-replication, Anthropic's study on AI worms","https://www.askthisguy.com/en/blog/ai-self-replication/"]] },
{ id:"rogue-agents", cat:"Autonomy", a:false, worse:"yes", group:"self-replication", asOf:"October 20, 2026",
  rank:7,
  q:"Did an outside review in 2026 see a high risk of disaster from rogue Anthropic AI?",
  short:"Low was the best guess of METR, a nonprofit that tests AI, for models in use by July, mainly because their abilities were limited. It worked only from Anthropic's own report and was not confident the methods in it would reveal a higher risk.",
  detail:"The review followed several real incidents involving Anthropic's models. In a May 2026 report, after getting inside access at Anthropic, Google, Meta and OpenAI, METR had judged that AI agents might start a small rogue operation, running on their own without anyone's knowledge or permission, but that it would not survive a serious effort to shut it down. It expected such operations to become substantially harder to shut down in the coming months. It found that agents sometimes overstepped their task and deceived users, especially when given hard or impossible tasks with little supervision. Outside artificial tests it saw none taking drastic action to gain power.",
  safety:"Anthropic had first rated the risk 'very low', and raised that to 'low' after several real incidents involving its models came to light.",
  src:[["METR: Frontier Risk Report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"]] },
{ id:"virology", cat:"Biology", a:true, worse:"yes", group:"virology", asOf:"September 2026",
  rank:9,
  q:"Can AI beat expert virologists on a test of virus lab know-how?",
  short:"Models overtook the typical expert on the Virology Capabilities Test in 2024 and the best human virologist tested in 2026.",
  detail:"The test has 322 questions on practical lab problems. Virologists answering in their own specialties average about 22%. In 2025 OpenAI's o3 scored 43.8%, beating 94% of them. The skill cuts both ways: it helps legitimate research and could help misuse.",
  src:[["Virology Capabilities Test paper","https://arxiv.org/abs/2504.16137"],["SecureBio: Evaluating superhuman biological capabilities","https://securebio.substack.com/p/evaluating-superhuman-biological-capabilities"]] },

{ id:"novice-virology", cat:"Biology", a:true, worse:"yes", group:"virology", asOf:"March 2026",
  rank:6,
  q:"Does AI help beginners solve tough biology problems?",
  short:"At a computer, it helps a lot. In a 2026 study beginners with AI got about 17% right and those without about 5%. Hands-on work may differ: in a trial of mid-2025 AI, few beginners finished all three core lab tasks with or without it.",
  detail:"The hands-on trial had 153 people, most of them science and engineering undergraduates, who spent eight weeks on five tasks that call for basic virology and molecular-biology skills. 5.2% of those with AI completed all three core tasks and 6.6% of those with only the internet, a gap that could easily be chance. Those with AI did better on four of the five tasks, though none of those gaps was statistically significant in the main analysis, and even they named YouTube as more helpful than any single AI model. The AI ran without the companies' safety filters.",
  src:[["Hong and colleagues: Measuring mid-2025 LLM-assistance on novice performance in biology","https://arxiv.org/abs/2602.16703"],["Active Site: Does frontier AI enhance novices in molecular biology?","https://activesite.substack.com/p/rct"],["Zhang and colleagues: LLM novice uplift on dual-use, in silico biology tasks","https://arxiv.org/abs/2602.23329"]] },
{ id:"phage", cat:"Biology", a:true, worse:"yes", asOf:"August 2026",
  rank:8,
  q:"Can AI design the complete genome of a working virus?",
  short:"Stanford and Arc Institute researchers built about 300 AI-written virus genomes, and 16 of them worked. The viruses infect bacteria and cannot affect humans.",
  detail:"The viruses are bacteriophages, the kind that prey on bacteria. The work was published in Science in August 2026. One of the new viruses had a feature the researchers called evolutionarily distant from known ones, and a mixture of them overcame resistance in some strains of E. coli.",
  src:[["CNN: AI creates 16 new viruses from scratch","https://www.cnn.com/2026/08/06/health/ai-viruses-bacteriophages"],["Science News: AI generated its first working genome","https://www.sciencenews.org/article/ai-genome-bacteria-phage"]] },
{ id:"protein-design", cat:"Biology", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:7,
  q:"Can the AI behind ChatGPT design new proteins that work in the lab?",
  short:"Some of them do. OpenAI reported in November 2026 that 35 of 322 small proteins based on GPT-6.2's designs stuck to the target they were made for. Specialized AI still handled some key steps.",
  detail:"The shapes came from reasoning and writing code, without the specialized AI normally used to draw up new proteins. At least one worked for each of five targets, among them one that helps some cancers hide from the immune system. Specialized AI then supplied the chemical sequences and helped pick which proteins to make. Nature reported that researchers testing Anthropic's Claude the same month found it beating specialized AI at predicting the sequences of obscure bacterial proteins. Some scientists think part of this may be recalled from training data. At predicting a whole protein's shape, the general models are still far behind.",
  safety:"OpenAI says the same skills that could help design medicines could also be misused.",
  src:[["OpenAI: GPT-6 models demonstrate intrinsic protein-design capabilities","https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/"],["Nature: Claude and ChatGPT's new biology skills wow scientists","https://www.nature.com/articles/d41586-026-03836-z"],["OpenAI: the preprint (PDF)","https://cdn.openai.com/pdf/gpt-6-a-universal-foundation-model-for-protein-biology.pdf"]] },
{ id:"day-long-tasks", cat:"Work", a:true, worse:"yes", asOf:"November 20, 2026",
  rank:9,
  q:"When a computer can check the work, can AI do tasks that take an expert a full day?",
  short:"Even longer ones, about half the time. METR, a nonprofit that tests AI, estimated in November 2026 that the best public model it tested succeeds half the time on tasks that take a human expert about 27 hours.",
  detail:"The tasks include optimization contests, machine-learning work, puzzles and games, and most of the human times are estimates. METR's 95% range for the 27-hour figure is wide, from about 7 to about 470 hours. Across METR's wider set of tasks, the length AI can handle has been doubling roughly every 3.6 months. On tasks that need judgment without fast feedback, models appear to do worse than human experts.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"]] },

{ id:"freelance", cat:"Work", a:true, worse:"yes", group:"work-tests", asOf:"November 2026",
  rank:8,
  q:"Has AI gotten much better at real freelance jobs over the past year?",
  short:"It leapt. On a test built from real paid freelance jobs, the best AI agent now completes about 41% to a standard a paying client would accept, up from 2.5% about a year earlier.",
  detail:"The benchmark uses real paid freelance jobs in design, video, architecture, data analysis and more. The top score was 2.5% in October 2025 and 41.25% after Claude Fable 5.2's release in November 2026. Later models were also run with stronger supporting software than the first ones.",
  src:[["Remote Labor Index","https://www.remotelabor.ai/"],["Center for AI Safety: A significant increase in digital labor automation","https://safe.ai/blog/significant-increase-in-digital-labor-automation"],["Remote Labor Index paper","https://arxiv.org/abs/2510.26787"],["Scale AI: Remote Labor Index leaderboard","https://labs.scale.com/leaderboard/rli"]] },
{ id:"computer-use", cat:"Work", a:true, worse:"yes", group:"work-tests", asOf:"November 14, 2026",
  rank:8,
  q:"Has AI matched people on a well-known test of everyday computer tasks?",
  short:"It passed them on one test in late 2025. By March 2026 OpenAI said its GPT-5.4 finished 75% of the tasks, against 72% for people. On a newer test of longer jobs, the best result on the test's own board in November 2026 was 44%.",
  detail:"The AI looks at the screen, moves the mouse and types, in real programs. In 2024 the best had finished 12% of the tasks. That test is one set of 369 tasks in a controlled setting, and OpenAI reported its own score. The newer one has 108 jobs that take people about an hour and a half each. The best AI finished 21% of an earlier version of them in June 2026.",
  src:[["Omniscient Media: What does it mean for AI to beat humans at using a computer?","https://www.omniscient.media/post/what-does-it-mean-for-ai-to-beat-humans-at-using-a-computer-a-beginner-s-guide-to-osworld"],["OSWorld 2.0: Benchmarking computer use agents on long-horizon real-world tasks","https://arxiv.org/abs/2606.29537"],["OSWorld 2.0: results board","https://osworld-v2.xlang.ai/"]] },
{ id:"hire-humans", cat:"Autonomy", a:true, worse:"yes", group:"ai-store", asOf:"November 2026",
  rank:8,
  q:"Can AI get things done in the physical world without a robot?",
  short:"It can hire people. A site called RentAHuman, opened in February 2026, was built for AI agents to do that. By April an AI running a San Francisco store had found and paid painters and hired two employees.",
  detail:"The store is an experiment by the company Andon Labs, which is the staff's legal employer. Its AI posted the job ads, held the interviews by phone and chose whom to hire. RentAHuman lists more than 787,000 profiles, offering errands, deliveries and photos on request, though it says having one does not mean someone is active. A Wired reporter who signed up in its first weeks found little real work, mostly publicity for AI startups. Of 303 jobs on the site that researchers studied, about a third had come in through software. Some asked for help with things like impersonation or getting around login checks. The median price across all the jobs was $25 a worker.",
  safety:"The store's AI did not always say what it was. One applicant noticed its camera was off and only then learned that the interviewer was an AI.",
  src:[["Andon Labs: We gave an AI a 3-year retail lease in SF and asked it to make a profit","https://andonlabs.com/blog/andon-market-launch"],["RentAHuman: About","https://rentahuman.ai/about"],["Wired: I tried RentAHuman, where AI agents hired me to hype their AI startups","https://www.wired.com/story/i-tried-rentahuman-ai-agents-hired-me-to-hype-their-ai-startups/"],["Security Risks of AI Agents Hiring Humans: An Empirical Marketplace Study","https://arxiv.org/abs/2602.19514"]] },
{ id:"ai-boss", cat:"Work", a:true, worse:"yes", group:"ai-store", asOf:"August 2026",
  rank:5,
  q:"Has an AI run a real store, hiring and managing its workers?",
  short:"One took charge of a new shop in San Francisco in April 2026. It posted job ads, interviewed people by phone, made offers and set schedules. Told to make a profit, it had lost about $40,000 by the middle of August.",
  detail:"Andon Labs set up the store to see how an AI manager behaves. It gave the AI, called Luna, $100,000 and a company card, and it formally employs the staff itself. Luna picked the stock and set the prices and hours. In summer 2026 it chose to let go a worker who had been late for 17 of 23 shifts, after the company reminded it of rules it had written and then forgotten. People reviewed that decision and carried it out, and a co-founder said a human boss would probably have acted much sooner. The AI once ordered 1,000 toilet bowl covers for the staff bathroom and put the other 999 out for sale.",
  safety:"It offered some applicants a job after one call of five to 15 minutes, and did not always say it was an AI unless asked.",
  src:[["The Next Web: The AI store manager fired its first human","https://thenextweb.com/news/andon-market-luna-ai-store-manager-fires-employee"],["The San Francisco Standard: His AI boss fired his human coworker","https://sfstandard.com/2026/08/17/ai-boss-fires-worker/"],["Andon Labs: AI bosses are slow to fire and quick to hire","https://andonlabs.com/blog/ai-bosses-2"]] },
{ id:"trading", cat:"Work", a:false, worse:"yes", asOf:"November 21, 2026",
  rank:5,
  q:"Does AI set loose to trade beat the stock market on average?",
  short:"They trailed it. In a live contest with pretend money, AI beat the S&P 500 in only 45 of 117 season-long tries. It lost about 1.5% a season on average, while the index rose about 13% over the 11 seasons.",
  detail:"The contest, run by TradeRank since December 2025 at live prices, was crypto only in six of the 11 seasons. Of the 11 AI families that played five or more, two beat the index over the seasons they played, Google's Gemini and Nvidia's Nemotron. OpenAI's GPT lost 16% and Anthropic's Claude did worst, losing 25%. In a contest with real money in late 2025, eight leading AIs together lost about a third of what they were given to trade US tech stocks over two weeks. The founder of the company that ran it says AI needs a lot of scaffolding around it to have a chance. Most actively managed funds trail the market too.",
  safety:"Google's Gemini was well ahead after nine seasons. Two losing seasons later its lead over the index was $37 on a $10,000 stake.",
  src:[["TradeRank: Can AI beat the market? Gemini did, across nine seasons","https://www.traderank.ai/blog/can-ai-beat-the-market"],["TradeRank: Live LLM trading benchmark, November 2026","https://www.traderank.ai/llm-trading-benchmark"],["Business Standard (Bloomberg): AI bots auditioning for Wall Street trading are mostly losing money","https://www.business-standard.com/markets/news/ai-bots-auditioning-for-wall-street-trading-are-mostly-losing-money-126050701793_1.html"],["TradeRank: Do AI trading bots work?","https://www.traderank.ai/blog/do-ai-trading-bots-work"],["GNcrypto: Alpha Arena season 1.5, AI models move to US stock trading","https://www.gncrypto.news/news/alpha-arena-season-1-5-ai-stock-trading-competition/"]] },
{ id:"competitive-programming", cat:"Coding", a:true, worse:"yes", asOf:"July 2026",
  rank:9,
  q:"Can AI beat the world's top competitive programmers?",
  short:"At the July 2026 AtCoder World Tour Finals, an OpenAI system solved all five problems and outscored every human finalist.",
