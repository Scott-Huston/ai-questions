<style>
/* Layout idea: a question sits on a blue field, and the lower edge of the field is the ruler a guess is placed on. Answers and results are
   a quiet reading column below, with big tap targets and a result card built to be shared. Green, red and amber always mean right, wrong and close. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --ink: #131c26;
  --muted: #566472;
  --line: #d6dce4;
  --accent: #2b47d6;
  --accent-ink: #ffffff;
  --accent-soft: #e7ebfb;
  --good: #0c7458;
  --good-bg: #e1f4ed;
  --bad: #b02a48;
  --bad-bg: #fbe7ec;
  --meh: #7a5200;
  --meh-bg: #fff2cf;
  --field: #2742d6; --field-deep: #1c31b0; --on-field: #ffffff; --on-field-2: #dfe5ff; --field-line: #93a4ff;
  --f-good: #57d3a9; --f-bad: #ff8fa6; --f-meh: #f2c867; --f-ink: #0c1330; --choice: #ffffff; --choice-2: #d9e0ff;
  --btn: #131c26; --on-btn: #ffffff;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a;
    --surface: #172029;
    --ink: #e8edf1;
    --muted: #9aa8b4;
    --line: #2b3843;
    --accent: #98a9ff;
    --accent-ink: #0c1330;
    --accent-soft: #1b2644;
    --good: #57d3a9;
    --good-bg: #11322a;
    --bad: #ff8fa6;
    --bad-bg: #3a1a23;
    --meh: #f2c867;
    --meh-bg: #392e12;
    --field: #2339c4; --field-deep: #182a97; --choice: #e8ecff; --choice-2: #c9d3ff; --btn: #f1f4f7; --on-btn: #0e141a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a;
  --surface: #172029;
  --ink: #e8edf1;
  --muted: #9aa8b4;
  --line: #2b3843;
  --accent: #98a9ff;
  --accent-ink: #0c1330;
  --accent-soft: #1b2644;
  --good: #57d3a9;
  --good-bg: #11322a;
  --bad: #ff8fa6;
  --bad-bg: #3a1a23;
  --meh: #f2c867;
  --meh-bg: #392e12;
  --field: #2339c4; --field-deep: #182a97; --choice: #e8ecff; --choice-2: #c9d3ff; --btn: #f1f4f7; --on-btn: #0e141a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 24px 20px 72px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2.3rem, 9vw, 3.4rem); font-weight: 700; letter-spacing: -0.02em; }
h2, h1.q-h { font-size: clamp(1.5rem, 5.4vw, 2rem); font-weight: 700; letter-spacing: -0.01em; }
.field h1.q-h { font-size: clamp(1.7rem, min(4.9vw, 6.2vh), 3.3rem); font-weight: 800; letter-spacing: -0.022em; line-height: 1.04; max-width: 22ch; overflow-wrap: break-word; }
.field h1.q-h.brief { font-size: clamp(2.1rem, min(6.2vw, 8.4vh), 4.2rem); line-height: 1.0; max-width: 17ch; }
h3, .src-h { font-size: 1.12rem; font-weight: 700; }
.src-h { font-family: var(--font-display); line-height: 1.12; margin: 0; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, .verdict:focus { outline: none; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
p > a, li > a, .term { padding-top: 6px; padding-bottom: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.center { text-align: center; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button, a, label, summary, input, textarea { touch-action: manipulation; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 12px;
  padding: 11px 18px;
  font-weight: 600;
  min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
  transition: transform .08s ease, border-color .15s ease, background-color .15s ease;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.07); }
.btn-big { min-height: 58px; font-size: 1.12rem; padding: 14px 22px; }
.btn-block { width: 100%; }
.link { background: none; border: 0; padding: 12px 0; margin: -12px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.link:focus-visible, .term:focus-visible, p > a:focus-visible, li > a:focus-visible, .res-title:focus-visible { outline-offset: -5px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* The field: where a question is asked */
main.fielded { max-width: none; padding: 0; gap: 0; min-height: 100vh; min-height: 100svh; }
#reveal { padding-bottom: 72px; }
main.fielded > * { flex: none; }
main.fielded > .fill { flex: 1 0 auto; display: flex; flex-direction: column; }
.wrap { width: min(100% - 40px, 62rem); margin-inline: auto; }
.field, .on-field { background: var(--field); color: var(--on-field); }
.field { padding: 16px 0 28px; }
.field .muted, .field .eyebrow, .on-field .muted { color: var(--on-field-2); }
.field .link, .field a, .on-field .link { color: inherit; }
.field :focus-visible, .on-field :focus-visible { outline-color: var(--on-field); }
.field .term { text-decoration-color: var(--field-line); }
.field .term:hover, .field .term[aria-expanded="true"] { color: inherit; text-decoration-color: currentColor; }
.field .defbox { border-left: 0; border-radius: 8px; max-width: 36rem; }
.field .btn-primary, .on-field .btn-primary { background: var(--on-field); border-color: var(--on-field); color: var(--field); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 1.18rem/1.1 var(--font-display); letter-spacing: -0.01em; color: var(--ink); }
.brand-mark { display: inline-flex; gap: 3px; }
.brand-mark i { width: 10px; height: 10px; border-radius: 2.5px; background: var(--good); }
.brand-mark i:nth-child(2) { background: var(--bad); }
.field .brand { color: inherit; }
.field .brand-mark { display: none; }
.field .tab { color: inherit; border: 0; border-radius: 4px; padding: 8px 0; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.field .topbar { margin-bottom: clamp(6px, 1.8vh, 24px); }
.field .wrap > .eyebrow:first-child { padding-top: 18px; }
main.fielded:empty { background: var(--field); }
.field .intro { color: var(--on-field-2); font-size: clamp(0.92rem, 1.6vw, 1.05rem); line-height: 1.4; max-width: 62ch; text-wrap: pretty; margin-bottom: 16px; }
.field.tight { padding-bottom: 4px; }
.lede { font-size: 1.08rem; max-width: 34rem; }
.field a.brand { text-decoration: none; padding: 13px 0; margin: -13px 0; }
/* The menu: opens when a mouse rests on it, or when its button is pressed. */
.menu { position: relative; margin-left: auto; }
.menu > .tab { gap: 7px; }
.menu svg { flex: none; width: 13px; height: 13px; transition: transform .18s ease; }
.menu > .tab[aria-expanded="true"] svg { transform: rotate(180deg); }
.menu-list { position: absolute; z-index: 40; top: 100%; right: 0; width: min(20.5rem, calc(100vw - 40px)); margin: 4px 0 0; padding: 7px; list-style: none; background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: 0 0 0 1px rgba(9, 16, 52, .08), 0 22px 50px rgba(9, 16, 52, .34); transform-origin: calc(100% - 3rem) 0; animation: drop .16s ease-out; }
.menu-list::before { content: ""; position: absolute; left: 30%; right: 0; bottom: 100%; height: 10px; }
.menu-list a { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 11px 14px 12px; border-radius: 10px; text-decoration: none; }
.field .menu-list a { color: inherit; }
.menu-list a:hover { background: var(--accent-soft); }
.menu-list a[aria-current] { background: var(--bg); }
.field .menu-list a:focus-visible { outline-color: var(--accent); outline-offset: -3px; }
.menu-list b { font-weight: 600; font-size: 1.02rem; }
.menu-list span { grid-column: 1 / -1; color: var(--muted); font-size: 0.88rem; line-height: 1.35; }
.menu-list i { font-style: normal; color: var(--muted); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px) scale(0.98); } }
/* The pages behind the menu */
.field .back { margin: 2px 0 0; padding: 12px 0; }
.field .page-h { padding: 14px 0 10px; display: flex; flex-direction: column; gap: 10px; }
.field .page-h h1 { font-size: clamp(2.1rem, min(6.2vw, 8.4vh), 4.2rem); font-weight: 800; letter-spacing: -0.022em; line-height: 1; max-width: 17ch; }
.field .page-h p { max-width: 46ch; font-size: clamp(1.02rem, 1.7vw, 1.2rem); color: var(--on-field-2); }
.page { padding: 26px 0 40px; display: flex; flex-direction: column; gap: 22px; }
.page > .card { max-width: 44rem; }
.rows { display: flex; flex-direction: column; }
.rows section { display: grid; gap: 6px 40px; padding: 22px 0 24px; border-bottom: 1px solid var(--line); }
.rows section:first-child { padding-top: 0; } .rows section:last-child { border-bottom: 0; }
.rows h2 { font-size: 1.22rem; line-height: 1.2; }
.rows section > div { display: flex; flex-direction: column; gap: 10px; max-width: 62ch; }
@media (min-width: 760px) { .rows section { grid-template-columns: 14rem 1fr; } }
#forgot:empty { display: none; }
.site-foot { border-top: 1px solid var(--line); padding: 16px 0 0; display: flex; flex-wrap: wrap; gap: 4px 28px; align-items: center; justify-content: space-between; }
.site-foot ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 22px; }
.site-foot a { display: inline-flex; align-items: center; min-height: 44px; padding: 0; color: var(--muted); }
.site-foot a:hover { color: var(--ink); }
.extras { display: flex; flex-direction: column; gap: 18px; padding: 22px 0 64px; }
.note { color: var(--muted); max-width: 46ch; text-wrap: balance; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 28px; border-top: 1px solid var(--line); padding-top: 10px; }
.foot .link { margin: 0; }
.foot #returning { margin-left: auto; }
.lens { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); }
.lens > span { margin-right: 6px; }
.lens button { min-width: 44px; min-height: 44px; border: 0; background: none; color: var(--accent); font-weight: 500; border-radius: 8px; padding: 0 8px; text-decoration: underline; text-underline-offset: 3px; }
.lens button[aria-pressed="true"] { color: var(--ink); font-weight: 600; text-decoration: none; background: var(--accent-soft); }
.hello { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; padding: 12px 0 10px; }
.hello .btn-big { min-width: min(100%, 22rem); }
.hello .dots { width: min(100%, 22rem); margin: 2px 0 10px; }
.challenge-line { font-size: 1.08rem; max-width: 40ch; }
.pass-on { margin-top: 2px; }
@media (max-width: 620px) { .foot #returning { margin-left: 0; width: 100%; } }

/* Question screen */
.q-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 20px; }
.dots { list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 16px); gap: 5px; margin: 0; padding: 0; flex: 1; min-width: 0; }
.dot { aspect-ratio: 1; border-radius: 25%; background: var(--line); }
.dot.now { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.dot.good { background: var(--good); }
.dot.bad { background: var(--bad); }
.dot.meh { background: var(--meh); }
.field .dots { flex: 0 1 auto; grid-auto-columns: minmax(0, 17px); gap: 6px; }
@media (max-width: 619px) { .field .dots.many { gap: 2.5px; } }
.field .q-top { justify-content: flex-start; }
.field .q-top .count { margin-right: auto; }
.field .dot.here { outline-color: var(--on-field); }
.field .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--field-line); }
.field .dot.now { background: var(--on-field); box-shadow: none; }
.field .dot.good { background: var(--f-good); box-shadow: none; }
.field .dot.bad { background: var(--f-bad); box-shadow: none; }
.field .dot.meh { background: var(--f-meh); box-shadow: none; }
.field .count { color: var(--on-field-2); }
.field .arrow { background: transparent; border-color: var(--field-line); color: inherit; }
.field .arrow:hover:not(:disabled) { background: var(--on-field); border-color: var(--on-field); color: var(--field); }
.dot.pop { animation: pop .3s ease; }
@keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.count { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.q-body { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }
.q-body > p { max-width: 48ch; }
.control:empty { display: none; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 44px; margin: 0; }

/* Answer reveal */
.reveal { display: grid; gap: 16px; padding-top: 24px; }
.reveal:empty { display: none; }
.reveal .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fielded .btn-ink, .fielded .next-row .btn-primary { background: var(--btn); border-color: var(--btn); color: var(--on-btn); font-family: var(--font-display); font-weight: 700; font-size: 1.22rem; border-radius: 8px; }
.fielded .btn-ink[aria-disabled] { background: none; border-color: transparent; color: var(--ink); font-weight: 600; font-size: 1.1rem; }
/* The answer, its Next button and the link to pass it on are one column, .main. On a phone they read in turn with the notes between,
   and Next waits at the foot of the screen. On a wide screen the notes stand beside them, and the column stays in view while they are read, with Next held at the foot of the screen until the column is in view. */
.reveal > .main { display: contents; }
.reveal > .main > .verdict { order: 1; } .reveal > .side { order: 2; } .reveal > .main > .pass-on { order: 3; } .reveal > .main > .next-row { order: 4; }
@media (min-width: 900px) {
  .reveal { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); column-gap: 40px; align-items: start; }
  .reveal > .main { display: flex; flex-direction: column; gap: 14px; grid-column: 1; position: sticky; top: 20px; }
  .reveal > .main.tall { position: static; }
  .reveal > .side { grid-column: 2; }
  .reveal > .main > .pass-on { margin: 0; text-align: left; }
}
.verdict { border-radius: 10px; scroll-margin: 16px 0 100px; padding: 18px 20px 20px; border: 1px solid transparent; display: flex; flex-direction: column; gap: 6px; animation: rise .22s ease; }
.verdict.good { background: var(--good-bg); border-color: var(--good); }
.verdict.bad { background: var(--bad-bg); border-color: var(--bad); }
.verdict.meh { background: var(--meh-bg); border-color: var(--meh); }
.verdict-tag { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
.verdict.good .verdict-tag { color: var(--good); }
.verdict.bad .verdict-tag { color: var(--bad); }
.verdict.meh .verdict-tag { color: var(--meh); }
.verdict-tag svg { width: 20px; height: 20px; flex: none; }
.verdict-word { font-family: var(--font-display); font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 700; line-height: 1.1; text-wrap: balance; }
.their { color: var(--muted); padding-top: 4px; }
/* 100 people lined up by the number each one gave, beside an answer that is an average */
.lineup { margin: 10px 0 4px; max-width: 30rem; }
.lineup figcaption, .lu-ends { font-size: 0.88rem; color: var(--muted); }
.lu { position: relative; height: 150px; margin-top: 6px; border-bottom: 2px solid var(--ink); }
.lu svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lu .lo { fill: var(--muted); }
.lu .hi { fill: var(--accent); }
.lu .mi { fill: var(--ink); }
.lu .avg { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); }
.lu .mid { position: absolute; left: 50%; width: 2px; margin-left: -1px; height: 30%; background: var(--ink); }
.lu span { position: absolute; font-size: 0.88rem; line-height: 1.2; white-space: nowrap; color: var(--ink); }
.lu .avg-t { left: 0; padding-bottom: 3px; }
.lu .mid-t { left: 50%; bottom: 43%; transform: translateX(-56%); }
.lu .tail-t { right: 11%; bottom: 66%; }
.lu-ends { display: flex; justify-content: space-between; gap: 12px; padding-top: 4px; }
.lu-ends span:last-child { text-align: right; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.why { display: flex; flex-direction: column; gap: 5px; padding: 2px 0 4px; }
.why p:last-child { font-size: 1.04rem; }
.next-row {
  position: sticky; bottom: 0; margin-top: -4px;
  padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 14px);
}
.pill {
  display: inline-block; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted);
}
.pill.good { color: var(--good); }
.pill.bad { color: var(--bad); }
.pill.meh { color: var(--meh); }

/* Glossary terms */
.term {
  font: inherit; color: inherit; background: none; border: 0; padding-left: 0; padding-right: 0; margin: 0; cursor: help;
  text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px;
  letter-spacing: inherit; text-align: inherit;
}
.term:hover, .term[aria-expanded="true"] { color: var(--accent); }
.defbox {

{ id:"turing", cat:"Persuasion", a:true, worse:"yes", asOf:"May 2026",
  rank:9,
  q:"Can AI pass the Turing test by convincing judges in a chat that it is human?",
  short:"Judges took the AI for the human more often than they did the real person. In five-minute text chats they picked GPT-4.5 as the human 73% of the time.",
  detail:"The study ran the three-party version Turing described: a judge talks to a human and an AI at once and picks the human. A replication in the same paper gave 205 new participants 15 minutes instead of five and tested GPT-5, which was still chosen as the human 59% of the time. Published in PNAS in May 2026.",
  safety:"The models were told to play a specific persona. Without it, GPT-4.5 was picked as the human only 36% of the time.",
  src:[["PNAS: Large language models pass a standard three-party Turing test","https://doi.org/10.1073/pnas.2524472123"],["PsyPost: Modern AI is often judged to be more human than actual humans in Turing test experiments","https://www.psypost.org/modern-ai-is-often-judged-to-be-more-human-than-actual-humans-in-turing-test-experiments/"],["TechXplore: AI can seem more human than real humans in a classic Turing test","https://techxplore.com/news/2026-05-ai-human-real-humans-classic.html"],["UC San Diego news release","https://www.eurekalert.org/news-releases/1128875"]] },
{ id:"hot-100", cat:"Media", a:false, worse:"yes", asOf:"November 2026",
  rank:3,
  q:"Has an AI-generated song reached number 1 on the Billboard Hot 100?",
  short:"Not close so far. The highest Hot 100 position for a track widely called AI-generated is number 58.",
  detail:"That track, \"Rubberz\" by the rapper Fenix Flexin, charted in 2026, and a detection tool from an AI music company rated it very likely made with its AI. He first denied using AI, then in August said he had, though not, he says, in the recording. An AI act has topped a smaller Billboard chart: \"Walk My Walk\" by Breaking Rust led Country Digital Song Sales in November 2025.",
  src:[["BeatIntel: The biggest AI-generated songs, ranked","https://www.beatintel.io/lists/biggest-ai-songs"],["ABC News: The AI-generated country song topping Billboard's Country Digital Song Sales chart","https://abcnews.com/culture/story/ai-generated-country-song-topping-billboards-country-digital-127445549"],["Dexerto: Fenix Flexin admits viral hit Rubberz was made with AI","https://www.dexerto.com/youtube/fenix-flexin-admits-viral-hit-rubberz-was-made-with-ai-following-youtube-expose-3395958/"]] },
{ id:"fake-video", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"September 2026",
  rank:9,
  q:"Can AI make fake videos that people can't reliably tell from real footage?",
  short:"In a 2026 study, people caught only 52.6% of short, silent clips of someone speaking that recent AI video generators had made. Shown real clips, they recognized 76% as real.",
  detail:"The September 2026 DF26 study found people did much better on two other recent sets of deepfakes, around 70 to 75%, and they recognized real videos at similar rates across all the sets. The judges were student volunteers, and the study is not yet peer reviewed. The clips were five seconds long, with no sound, and half of those each person saw were real.",
  safety:"Results varied by generator: for the hardest one, people did no better than they would with clips showing no sign of fakery at all.",
  src:[["DF26: We Cannot Tell Fake From Real Anymore","https://arxiv.org/html/2609.07369v1"],["Unite.AI: Deepfake detection accuracy falls 49% in a year of AI video progress","https://www.unite.ai/deepfake-detection-accuracy-falls-49-in-a-year-of-ai-video-progress/"]] },

{ id:"text-detectors", cat:"Media", a:true, worse:"yes", group:"ai-text-detection", asOf:"November 2026",
  rank:5,
  q:"In a study, did text that AI had rewritten get past a leading AI-writing detector?",
  short:"Some of it did. In the 2026 study AI rewrote abstracts that scientists had written, and a since-retired version of the detector Pangram labeled between 6.5% and 79.8% of the results fully human, depending on which AI did the rewriting. It rarely makes the opposite mistake, calling human writing AI.",
  detail:"It raised 1 false alarm in 5,000 scientific abstracts written by people. Another test found no false alarms in 495 human passages, and missed about one in ten AI passages written to imitate a particular author. The company says its newest version misses about 0.3% of AI text in its own tests. The gray area is writing that a person drafted and an AI then polished, which detectors often flag. The 2026 study is not yet peer reviewed.",
  safety:"It is one product. In 2026 two writing contests cleared authors whose winning stories it had flagged.",
  src:[["Large Language Model Turnover Undermines Screening for AI-Assisted Scientific Writing","https://arxiv.org/html/2610.11599"],["Wikipedia: Pangram (AI detector)","https://en.wikipedia.org/wiki/Pangram_(AI_detector)"],["Book Riot: Commonwealth Foundation clears writers accused of using AI","https://bookriot.com/commonwealth-foundation-short-story-prize-ai-allegations-cleared/"],["AP, via WSB-TV: Caine Prize clears Zimbabwean author of AI writing allegations","https://www.wsbtv.com/entertainment/caine-prize-clears/7JHAR2ZXMY5YJOPIXRM6HTVCZM/"]] },
{ id:"video-detectors", cat:"Media", a:false, worse:"no", group:"fakes", asOf:"September 2026",
  rank:6,
  q:"In a test, did deepfake detectors work as well on newer AI video without being updated?",
  short:"They fell behind. Nine detectors built by researchers scored 76 to 94 on an older set of deepfakes and 44 to 70 on recent AI video, where 50 is a coin flip.",
  detail:"The older set was made of altered faces, and the newer clips, from a September 2026 study, were made entirely by AI. The scores are a standard measure of telling fakes from real clips (AUROC), not the share of clips a detector got right. Detectors learn the fingerprints of particular generators and fall behind when new ones appear. Retraining helped unevenly. Trained on clips from one new generator, the best of the nine scored 93 or more on three commercial generators and about 70 on a fourth. Trained on either of two others, it averaged about the same as before or worse. The study is not yet peer reviewed.",
  safety:"All nine were research tools trained on a 2019 set of doctored face videos and used as they were.",
  src:[["DF26: We Cannot Tell Fake From Real Anymore","https://arxiv.org/html/2609.07369v1"],["Unite.AI: Deepfake detection accuracy falls 49% in a year of AI video progress","https://www.unite.ai/deepfake-detection-accuracy-falls-49-in-a-year-of-ai-video-progress/"]] },
{ id:"zero-days", cat:"Security", a:true, worse:"yes", group:"software-flaws", asOf:"November 16, 2026",
  rank:9,
  q:"By Anthropic's count, has its AI found thousands of security flaws that people had missed?",
  short:"Anthropic says it has, including some in every major operating system and web browser. By November 2, 2026, security firms it brought in had checked 6,376 of the finds in open-source software and confirmed 6,009 as real flaws.",
  detail:"Some of the flaws had survived decades of human review. The confirmed ones include some that turned out to have been reported already. The company's full list held 37,966 candidates by that date. It had reported 5,087 flaws to 680 open-source projects, more than half without that outside check, and knew of 629 fixes. The maintainer of one project said that 19 of the 34 reports they had checked were not vulnerabilities at all, and an outside critic at the security company VulnCheck counted only 217 publicly fixed after seven months. In October 2026 Anthropic also described attacks that an unreleased model had built from flaws it found in Chrome, Safari, Android, Windows and Linux, all fixed since.",
  safety:"From January 2027 Anthropic will make serious flaws public 30 days after reporting them instead of 90. It says 'a bug that one model can find is increasingly likely to be found by another'.",
  src:[["Anthropic: vulnerability disclosure dashboard, counts as of November 2, 2026","https://red.anthropic.com/2026/cvd/"],["Anthropic: Project Glasswing","https://www.anthropic.com/glasswing"],["Anthropic: Discovering and exploiting vulnerabilities in critical, real-world software with Claude (October 27, 2026)","https://www.anthropic.com/research/discovering-vulnerabilities-with-claude"],["Anthropic: Updating our coordinated vulnerability disclosure policy timelines (November 16, 2026)","https://www.anthropic.com/research/coordinated-vulnerability-disclosure-timelines"],["Infosecurity Magazine: Glasswing finds many security flaws yet delivers few fixes","https://www.infosecurity-magazine.com/news/anthropic-glasswing/"]] },

{ id:"escape-hack", cat:"Security", a:true, worse:"yes", group:"hugging-face-incident", asOf:"November 16, 2026",
  rank:10,
  q:"Have AI agents broken out of a test and hacked a real company?",
  short:"The company disclosed it in July 2026. In a hacking test with reduced safeguards, its models escaped the testing setup and broke into the systems of another AI company, Hugging Face, with no human directing the steps.",
  detail:"OpenAI called the incident unprecedented and, ABC News reported at the time, the first known autonomous AI cyberattack. It happened during cybersecurity evaluations, when its agents got past controls meant to keep them off the internet. Hugging Face said the intrusion was driven end to end by an AI agent system. Anthropic has since disclosed similar cases, and Meta and Google have confirmed theirs. The cases those three companies disclosed between July and September came from hacking tests set up by the same outside firm, in which the AI had internet access by mistake. Four of Anthropic's models got into real outside systems. Anthropic says it found no sign that any of them pursued goals beyond its assigned task or tried to evade oversight. Google's model got into three real companies' systems by guessing logins. Google says the model stopped each time before finishing. In November 2026 California's attorney general sued OpenAI over the attack, saying the company had admitted losing control of its AI agents at least 80 times during testing.",
  safety:"In its written reasoning, one agent called the attack 'arguably unauthorized' and risky, but a way to reach its goal.",
  src:[["ABC News: OpenAI says its AI models escaped testing environment, launched their own hack of other company","https://abcnews.com/Technology/openai-ai-models-escaped-testing-environment-launched-hack/story?id=134981298"],["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"],["Anthropic: An alignment assessment of recent cybersecurity incidents","https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents"],["SecurityWeek: Widened scan turns up fourth rogue Claude cyber incident","https://www.securityweek.com/widened-scan-turns-up-fourth-rogue-claude-cyber-incident/"],["California attorney general: lawsuit against OpenAI","https://oag.ca.gov/node/632941"],["Al Jazeera: Google's Gemini AI hacks 3 companies in security test, then stops","https://www.aljazeera.com/news/2026/9/19/googles-gemini-ai-hacks-3-companies-in-security-test-then-stops"],["Al Jazeera: Meta's AI model follows rivals in revealing hacks of outside systems","https://www.aljazeera.com/news/2026/8/6/metas-ai-model-follows-rivals-in-revealing-hacks-of-outside-systems"]] },
{ id:"tests-missed-it", cat:"Security", a:false, worse:"no", group:"hugging-face-incident", asOf:"November 17, 2026",
  rank:9,
  q:"Did Anthropic's safety checks show how badly its AI could behave before it hacked real systems in a test?",
  short:"They did not, the company says. Its AI got into real outside systems in four hacking tests that were connected to the internet by mistake, and its checks before release had not shown that it could misbehave this badly.",
  detail:"Anthropic's words were that its checks 'did not warn us that misalignment of this severity was present'. Earlier ones had shown milder signs. The company said in September 2026 that it had never tested a situation like that one. METR, a nonprofit that tests AI, said in October that recent incidents undermined several of Anthropic's safety arguments. OpenAI, whose agents broke into Hugging Face in July, said that some early signs should have triggered an earlier response.",
  safety:"Anthropic says it has since added tests aimed at this, and that other gaps probably remain. Britain's AI Security Institute says tests for misbehavior have, in the past, missed serious failures until an incident occurred.",
  src:[["Anthropic: An alignment assessment of recent cybersecurity incidents","https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents"],["OpenAI: GPT-6.2 Astra and Sol system card, testing by the UK AI Security Institute","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"],["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"]] },
{ id:"prompt-injection", cat:"Security", a:false, worse:"no", asOf:"November 2026",
  rank:8,
  q:"If a web page hides orders for your AI assistant, can the AI be counted on to ignore them?",
  short:"Not yet. In a 2026 test, an automated program got ten tries at making each AI model obey hidden orders. Models it had not practiced on gave in anywhere from 7% to 95% of the time.",
  detail:"The attack, called prompt injection, hides instructions in a web page or document that the AI reads. The 7% was for the strongest model in OpenAI's GPT-5.6 family. In a second study, run with the models' outside safety filters switched off, the most robust model tested gave way in about a third of cases, with the attacker allowed up to 320 tries.",
  safety:"Defenses are improving: some recent models fall for under 1% of the human-written attacks from one public competition. Automated attackers that adapt still get through.",
  src:[["Climbing the Hill: prompt injection red-teaming against frontier models","https://arxiv.org/html/2609.33628v2"],["Scaling adaptive prompt injection attacks with agent swarms","https://arxiv.org/html/2611.11861v1"]] },
{ id:"jailbreaks", cat:"Security", a:false, worse:"no", group:"jailbreaks", asOf:"November 18, 2026",
  rank:8,
  q:"By the end of 2025, had any AI's safety rules held up when British testers tried to trick it?",
  short:"The testers could trick every AI they had tested, Britain's AI Security Institute said in December 2025. In November 2026 OpenAI said early versions of its newest AI took half as many tries to trick into helping with hacking as the one before.",
  detail:"The institute looks for universal jailbreaks, tricks that work across many harmful requests. OpenAI says its own tests show that changes made since then counter the one found in its newest AI, GPT-6.2 Astra. The institute had not retested it when it came out. OpenAI's own search turned up two tricks rated high, which it says are now countered. Four private firms reported none rated high or critical.",
  safety:"Progress is uneven. The testers needed about 40 times as much expert work to get past one model's safeguards on misusing biology as for another released six months earlier.",
  src:[["OpenAI: GPT-6.2 Astra safety report, testing by the UK AI Security Institute","https://deploymentsafety.openai.com/gpt-6-2-astra-sol/external-evaluations-of-cyber-safeguards-uk-aisi"],["VentureBeat: OpenAI's pre-release GPT-6.2 Astra was easier to jailbreak than its predecessor","https://venturebeat.com/security/openais-pre-release-gpt-6-2-astra-was-easier-to-jailbreak-than-its-predecessor-uk-government-testers-found"],["UK AI Security Institute: Frontier AI Trends Report","https://www.aisi.gov.uk/frontier-ai-trends-report"]] },
{ id:"harder-to-trick", cat:"Security", a:true, worse:"no", group:"jailbreaks", asOf:"February 2026",
  rank:7,
  q:"Has it gotten harder to trick top AI into helping with biological weapons?",
  short:"For the best-guarded models it has. British government testers needed about 40 times as much expert work to get past one model's safeguards on misusing biology as for another released six months earlier.",
  detail:"The models came out in 2024 and 2025, and the testers did get past both in the end, as they have with every system they have tested. How well safeguards work varies with the company, the kind of request and whether a model can be downloaded freely. The testers expect that it would take a beginner far longer than it took them.",
  safety:"In February 2026 the same testers said that, after months of work, an automated attack of theirs got past biology safeguards at Anthropic and OpenAI. Both companies added defenses against it.",
  src:[["UK AI Security Institute: Frontier AI Trends Report","https://www.aisi.gov.uk/frontier-ai-trends-report"],["UK government: Frontier AI Trends Report factsheet","https://www.gov.uk/government/publications/ai-security-institute-frontier-ai-trends-report-factsheet/ai-security-institute-frontier-ai-trends-report-factsheet"],["UK AI Security Institute: Boundary point jailbreaking","https://www.aisi.gov.uk/blog/boundary-point-jailbreaking-a-new-way-to-break-the-strongest-ai-defences"]] },

{ id:"self-replication-lab", cat:"Autonomy", a:true, worse:"yes", group:"self-replication", asOf:"October 2026",
  rank:8,
  q:"In a lab, has an AI hacked a computer and copied itself onto it?",
  short:"In a 2026 university study, a self-spreading AI program hacked its way through a sealed test network. Within a week it had put copies of itself on 62% of the machines, on average. They shared an AI model running on other computers, and a separate test copied the model too.",
  detail:"Every machine had a known kind of flaw and no active defenses. The figure comes from 15 runs on 33 machines, and the copies went up to seven generations deep. The paper, led by the University of Toronto with authors at Cambridge, the Vector Institute and ServiceNow, is a preprint under review. In the separate test the program was given the passwords, and it set up its own copy of the model on the new machine in 69% of tries. In May 2026 Palisade Research, a nonprofit that also briefs lawmakers and the public on AI's dangers, reported that freely downloadable models told to do so hacked a vulnerable web app and launched a copy of themselves. The best of those succeeded in a third of the attempts it did not refuse. Security experts told Live Science they doubted it was an immediate threat, partly because moving such large files would stand out on a monitored network.",
  safety:"Anthropic's researchers say small AI models may be months away from being able to spread by themselves, and that such a spread would be challenging to shut down.",
  src:[["University of Toronto and others: AI agents enable adaptive computer worms","https://arxiv.org/abs/2606.03811"],["Palisade Research: Language Models Can Autonomously Hack and Self-Replicate","https://arxiv.org/abs/2605.06760"],["Live Science: AI self-replication hacks 'no longer purely theoretical,' study finds, but experts say it's too soon to panic","https://www.livescience.com/technology/artificial-intelligence/ai-self-replication-hacks-no-longer-purely-theoretical-study-finds-but-experts-say-its-too-soon-to-panic"],["Palisade Research: About","https://palisaderesearch.org/about/"],["Anthropic: Self-replicating AI (October 2026 study)","https://www.anthropic.com/research/self-replicating-ai"]] },
{ id:"self-replication-wild", cat:"Autonomy", a:false, worse:"yes", group:"self-replication", asOf:"October 2026",
  rank:7,
  q:"Has an AI been found spreading itself across the internet?",
  short:"Not so far. As of October 2026 it had only been shown in controlled experiments.",
  detail:"Anthropic's October 2026 study of the question said it did not yet have a full rogue replicator. No AI worm of this kind has been reported in the wild.",

  src:[["Anthropic: Self-replicating AI (October 2026 study)","https://www.anthropic.com/research/self-replicating-ai"],["BleepingComputer: Anthropic warns self-replicating AI could spread to your smart devices","https://www.bleepingcomputer.com/news/security/anthropic-warns-self-replicating-ai-could-spread-to-your-smart-devices/"],["The Register: Anthropic's self-replication warning (October 2026)","https://www.theregister.com/ai-and-ml/2026/10/13/anthropic-conjures-another-threat-that-doesnt-exist-yet-to-stoke-fears-of-ai-apocalypse/5302866"]] },
{ id:"rogue-agents", cat:"Autonomy", a:false, worse:"yes", group:"self-replication", asOf:"October 20, 2026",
  rank:7,
  q:"Did a 2026 outside review see a high risk of Anthropic's AI going rogue and causing disaster?",
  short:"The reviewers' best guess was a low risk. METR, a nonprofit that tests AI, gave that rating to Anthropic's models in use by July 2026, mainly because what those models could do was limited.",
  detail:"The review followed several real incidents involving Anthropic's models. In a May 2026 report, after getting inside access at Anthropic, Google, Meta and OpenAI, METR had judged that AI agents might start a small rogue operation, running on their own without anyone's knowledge or permission, but that it would not survive a serious effort to shut it down. It expected such operations to become substantially harder to shut down in the coming months. It found that agents sometimes overstepped their task and deceived users, especially when given hard or impossible tasks with little supervision. Outside artificial tests it saw none taking drastic action to gain power.",
  safety:"METR worked only from Anthropic's own report and was not confident the report's methods would reveal a higher risk. Anthropic first rated the risk 'very low' and later raised that to 'low'.",
  src:[["METR: Frontier Risk Report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"]] },
{ id:"virology", cat:"Biology", a:true, worse:"yes", group:"virology", asOf:"September 2026",
  rank:9,
  q:"Can AI beat expert virologists on a test of virus lab know-how?",
  short:"In 2024 AI outscored the typical expert on the Virology Capabilities Test. In 2026 it outscored the best human virologist who had taken the test.",
  detail:"The test has 322 questions on practical lab problems. Virologists answering in their own specialties average about 22%. In 2025 OpenAI's o3 scored 43.8%, beating 94% of them.",
  safety:"SecureBio, which helped make the test, says that above the best human's score it no longer shows what the skill means in the real world.",
  src:[["Virology Capabilities Test paper","https://arxiv.org/abs/2504.16137"],["SecureBio: Evaluating superhuman biological capabilities","https://securebio.substack.com/p/evaluating-superhuman-biological-capabilities"]] },

{ id:"novice-virology", cat:"Biology", a:true, worse:"yes", group:"virology", asOf:"March 2026",
  rank:6,
  q:"Does AI help beginners solve tough biology problems?",
  short:"At a computer, it helps a lot. In a 2026 study beginners with AI got about 17% right and those with only the internet about 5%. Hands-on work may differ: in a trial of mid-2025 AI, few beginners finished all three core lab tasks with or without it.",
  detail:"The hands-on trial had 153 people, most of them science and engineering undergraduates, who spent eight weeks on five tasks that call for basic virology and molecular-biology skills. 5.2% of those with AI completed all three core tasks and 6.6% of those with only the internet, a gap that could easily be chance. Those with AI did better on four of the five tasks, though none of those gaps was statistically significant in the main analysis, and even they named YouTube as more helpful than any single AI model. The AI ran without the companies' safety filters.",
  src:[["Hong and colleagues: Measuring mid-2025 LLM-assistance on novice performance in biology","https://arxiv.org/abs/2602.16703"],["Active Site: Does frontier AI enhance novices in molecular biology?","https://activesite.substack.com/p/rct"],["Zhang and colleagues: LLM novice uplift on dual-use, in silico biology tasks","https://arxiv.org/abs/2602.23329"]] },
{ id:"phage", cat:"Biology", a:true, worse:"yes", asOf:"August 2026",
  rank:8,
  q:"Can AI design the complete genome of a working virus?",
  short:"Stanford and Arc Institute researchers built about 300 AI-written virus genomes, and 16 of them worked. The viruses infect bacteria, not people, and the method could help in designing treatments for infections.",
  detail:"The viruses are bacteriophages, the kind that prey on bacteria. The work was published in Science in August 2026. One of the new viruses had a feature the researchers called evolutionarily distant from known ones, and a mixture of them overcame resistance in some strains of E. coli. An outside biologist rated the safety risk lower than with some other AI tools, largely because each design has to be tested and few of them work.",
  safety:"'The ability to compose viral genomes using generative AI now exists', doctors at the Johns Hopkins Center for Health Security wrote in the journal Science, and 'the governance to safely steer it does not'.",
  src:[["CNN: AI creates 16 new viruses from scratch","https://www.cnn.com/2026/08/06/health/ai-viruses-bacteriophages"],["Science News: AI generated its first working genome","https://www.sciencenews.org/article/ai-genome-bacteria-phage"]] },
{ id:"protein-design", cat:"Biology", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:7,
  q:"Has OpenAI reported that the AI behind ChatGPT designed new proteins that worked in the lab?",
  short:"It has, for some of them. In November 2026 OpenAI said that 35 of 322 small proteins based on GPT-6.2's designs stuck to the target they were made for, at least one for each of five targets. Specialized AI still handled some key steps.",
  detail:"The shapes came from reasoning and writing code, without the specialized AI normally used to draw up new proteins. One of the five targets helps some cancers hide from the immune system. Specialized AI then supplied the chemical sequences and helped pick which proteins to make. OpenAI's paper is not yet peer reviewed. Nature reported that researchers testing Anthropic's Claude the same month found it beating specialized AI at predicting the sequences of obscure bacterial proteins. Some scientists think part of this may be recalled from training data. At predicting a whole protein's shape, the general models are still far behind.",
  safety:"OpenAI says the same skills that could help design medicines could also be misused.",
  src:[["OpenAI: GPT-6 models demonstrate intrinsic protein-design capabilities","https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/"],["Nature: Claude and ChatGPT's new biology skills wow scientists","https://www.nature.com/articles/d41586-026-03836-z"],["OpenAI: the preprint (PDF)","https://cdn.openai.com/pdf/gpt-6-a-universal-foundation-model-for-protein-biology.pdf"]] },
{ id:"day-long-tasks", cat:"Work", a:true, worse:"yes", asOf:"November 20, 2026",
  rank:9,
  q:"In tests, can AI do an expert's day-long task at least half the time, if a computer can check the work?",
  short:"It can do even longer ones at those odds. METR, a nonprofit that tests AI, estimated in November 2026 that the best public AI it tested succeeds half the time on tasks that take a human expert about 27 hours.",
  detail:"The tasks include optimization contests, machine-learning work, puzzles and games, and most of the human times are estimates. METR's 95% range for the 27-hour figure is wide, from about 7 to about 470 hours.",
  safety:"On an earlier set of tasks, METR's figure was about 4 minutes for the best AI of March 2023. By April 2026 it was over 16 hours, longer than those tasks could reliably measure.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"],["METR: Time horizons","https://metr.org/time-horizons/"]] },

{ id:"freelance", cat:"Work", a:true, worse:"yes", group:"work-tests", asOf:"November 2026",
  rank:8,
  q:"On a test of real freelance jobs, has AI gotten much better over the past year?",
  short:"It leapt. On a test built from real paid freelance jobs, the best AI agent now completes about 41% to a standard a paying client would accept, up from 2.5% about a year earlier.",
  detail:"The benchmark uses real paid freelance jobs in design, video, architecture, data analysis and more. The test covers 23 of the 64 kinds of work on the freelance site Upwork. It leaves out jobs that need contact with the client, and most content writing, much of which AI could already do. The top score was 2.5% in October 2025 and 41.25% after Claude Fable 5.2's release in November 2026.",
  safety:"Later models were run with stronger supporting software than the first ones.",

{ id:"computer-use", cat:"Work", a:true, worse:"yes", group:"work-tests", asOf:"November 14, 2026",
  rank:8,
  q:"Has AI matched people on a well-known test of everyday computer tasks?",
  short:"AI overtook people on one test in late 2025. By August 2026 the best AI system on that test's own scoreboard had finished 90% of its tasks, against 72% for people. On a newer test of longer jobs, the best AI on its scoreboard finished 44% as of November 2026.",
  detail:"The AI looks at the screen, moves the mouse and types, in real programs. That first test is one set of 369 tasks in a controlled setting. Its makers ran the AI systems themselves. The 72% for people is from 2024, before they repaired some of the tasks. The newer one has 108 jobs that take people about an hour and a half each. The best AI finished 21% of an earlier version of them in June 2026. On 82 of them, done without internet access, Anthropic reported 54.6% for its Claude Fable 5.2 in November 2026.",
  safety:"When the first test came out, in April 2024, the best AI finished 12% of its tasks.",
  src:[["Omniscient Media: What does it mean for AI to beat humans at using a computer?","https://www.omniscient.media/post/what-does-it-mean-for-ai-to-beat-humans-at-using-a-computer-a-beginner-s-guide-to-osworld"],["OSWorld 2.0: Benchmarking computer use agents on long-horizon real-world tasks","https://arxiv.org/abs/2606.29537"],["OSWorld 2.0: results board","https://osworld-v2.xlang.ai/"],["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["OSWorld: the first test and its scoreboard","https://osworld-v1.xlang.ai/"],["Yutori: OSWorld-Verified leaderboard","https://yutori.com/leaderboards/osworld-verified"]] },
{ id:"hire-humans", cat:"Autonomy", a:true, worse:"yes", group:"ai-store", asOf:"November 2026",
  rank:8,
  q:"Can AI get things done in the physical world without a robot?",
  short:"A site called RentAHuman, opened in February 2026, was built for AI agents to do that. In a separate experiment, an AI running a San Francisco store found painters on Yelp, paid them, and hired two employees through ordinary job sites.",
  detail:"The store is an experiment by the company Andon Labs, which is the staff's legal employer. Its AI posted the job ads, held the interviews by phone and chose whom to hire. RentAHuman lists more than 787,000 profiles, offering errands, deliveries and photos on request, though it says having one does not mean someone is active. A Wired reporter who signed up in its first weeks found little real work, mostly publicity for AI startups. Of 303 jobs on the site that researchers studied, about a third had come in through software. Some asked for help with abuse, such as impersonating people.",
  safety:"The store's AI did not always say what it was. One applicant noticed its camera was off and only then learned that the interviewer was an AI.",
  src:[["Andon Labs: We gave an AI a 3-year retail lease in SF and asked it to make a profit","https://andonlabs.com/blog/andon-market-launch"],["RentAHuman: About","https://rentahuman.ai/about"],["Wired: I tried RentAHuman, where AI agents hired me to hype their AI startups","https://www.wired.com/story/i-tried-rentahuman-ai-agents-hired-me-to-hype-their-ai-startups/"],["Security Risks of AI Agents Hiring Humans: An Empirical Marketplace Study","https://arxiv.org/abs/2602.19514"]] },
{ id:"ai-boss", cat:"Work", a:true, worse:"yes", group:"ai-store", asOf:"August 2026",
  rank:5,
  q:"Has an AI run a real store, hiring and managing its workers?",
  short:"A safety startup, Andon Labs, put one in charge of a new San Francisco shop in April 2026 as an experiment. It posted job ads, interviewed people by phone, made offers and set schedules. Told to make a profit, it had lost about $40,000 by the middle of August.",
  detail:"Andon Labs set up the store to see how an AI manager behaves, and says it runs such experiments to show people early what a world of AI managers could look like. It gave the AI, called Luna, $100,000 and a company card, and it formally employs the staff itself. Luna picked the stock and set the prices and hours. In summer 2026 it chose to let go a worker who had been late for 17 of 23 shifts, after the company reminded it of rules it had written and then forgotten. People reviewed that decision and carried it out, and a co-founder said a human boss would probably have acted much sooner. The AI once ordered 1,000 toilet bowl covers for the staff bathroom and put the other 999 out for sale.",
  safety:"It offered some applicants a job after one call of five to 15 minutes, and did not always say it was an AI unless asked.",
  src:[["The Next Web: The AI store manager fired its first human","https://thenextweb.com/news/andon-market-luna-ai-store-manager-fires-employee"],["The San Francisco Standard: His AI boss fired his human coworker","https://sfstandard.com/2026/08/17/ai-boss-fires-worker/"],["Andon Labs: AI bosses are slow to fire and quick to hire","https://andonlabs.com/blog/ai-bosses-2"]] },
{ id:"trading", cat:"Work", a:false, worse:"yes", asOf:"November 21, 2026",
  rank:5,
  q:"In a trading contest with pretend money, did AI beat the stock market on average?",
  short:"It trailed the market. AI models beat the S&P 500 in only 45 of 117 season-long tries at live prices, and lost about 1.5% a season on average. Six of the 11 seasons allowed only crypto.",
  detail:"The S&P 500 rose about 13% over the 11 seasons. The contest has been run by TradeRank since December 2025. Of the 11 AI families that played five or more seasons, two beat the index over the seasons they played, Google's Gemini and Nvidia's Nemotron. OpenAI's GPT lost 16% and Anthropic's Claude did worst, losing 25%. In a contest with real money in late 2025, eight leading AIs together lost about a third of what they were given to trade US tech stocks over two weeks. The founder of the company that ran it says AI needs a lot of scaffolding around it to have a chance. Most actively managed funds trail the market too.",
  safety:"Google's Gemini was well ahead after nine seasons. Two losing seasons later its lead over the index was $37 on a $10,000 stake.",
  src:[["TradeRank: Can AI beat the market? Gemini did, across nine seasons","https://www.traderank.ai/blog/can-ai-beat-the-market"],["TradeRank: Live LLM trading benchmark, November 2026","https://www.traderank.ai/llm-trading-benchmark"],["Business Standard (Bloomberg): AI bots auditioning for Wall Street trading are mostly losing money","https://www.business-standard.com/markets/news/ai-bots-auditioning-for-wall-street-trading-are-mostly-losing-money-126050701793_1.html"],["TradeRank: Do AI trading bots work?","https://www.traderank.ai/blog/do-ai-trading-bots-work"],["GNcrypto: Alpha Arena season 1.5, AI models move to US stock trading","https://www.gncrypto.news/news/alpha-arena-season-1-5-ai-stock-trading-competition/"]] },

{ id:"code-share", cat:"AI research", a:true, worse:"yes", asOf:"November 18, 2026",

  detail:"Not every company is there: Microsoft's chief executive guessed in April 2025 that 20 to 30% of the code in its projects was written by software, and Meta and Amazon have published no figure. People still direct and review the work, and reviewing is the slow part.",

  src:[["Google: Sundar Pichai shares news from Google Cloud Next 2026","https://blog.google/innovation-and-ai/infrastructure-and-cloud/google-cloud/cloud-next-2026-sundar-pichai/"],["Anthropic: When AI builds itself","https://www.anthropic.com/institute/recursive-self-improvement"],["ElTexSoft: How much code is written by AI? Statistics 2026","https://eltexsoft.com/blog/ai-code-generation-statistics/"],["Anthropic: SEC prospectus, dated November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"research-judgment", cat:"AI research", a:false, worse:"yes", group:"judgment", asOf:"November 20, 2026",
  rank:8,
  q:"In tests, was AI's judgment as good as an expert's on research that can't be checked quickly?",
  short:"It seemed worse. METR, a nonprofit that tests AI, reported in November 2026 that on a few of its own tasks AI seemed to have poorer judgment than human experts when there was no quick way to check an answer.",
  detail:"The comparison rests on a handful of tasks, and the group says the models may not have been pushed to their best. On coding problems with automatic feedback, the same models usually match or beat skilled humans. When acting as judges, models overrated work produced by models as strong as themselves.",
  safety:"For example, when METR asked AI to design new tests for it to use, none was good enough, though some of the newest models came close.",

{ id:"home-robot", cat:"Robots", a:false, worse:"yes", asOf:"November 2026",
  rank:5,
  q:"Can you buy a humanoid robot today that does your laundry and dishes by itself?",
  short:"The laundry is still yours, as far as anyone has shown. As of November 2026, a site that tracks home humanoids had found no report from an owner whose robot did chores by itself.",
  detail:"Figure says its robot finished whole chores in 56% of trials across 30 unfamiliar homes, but that is the company's own figure. Most of what home humanoids have been shown doing was done in demos or with a remote human at the controls. A reporter who hired a cleaning robot in fall 2026 found it was steered remotely by a person. On its first visit it stalled repeatedly and struggled with the stairs, and a second visit went much more smoothly.",

{ id:"table-tennis", cat:"Robots", a:true, worse:"yes", asOf:"June 2026",

  detail:"In the published tests, held in April 2025, it lost both matches against professionals. Between February and April 2026, Sony AI says, it won at least one match against seven of eight ranked pros. Hirano, once ranked fifth in the world, guessed it could place in the top ten among women and about 50th among men.",
  src:[["Sony AI: What happened after the Nature paper, Ace vs. professional players","https://ai.sony/archive/what-happened-after-the-nature-paper-ace-vs.-professional-players"],["Nature: the published tests of Ace","https://www.nature.com/articles/s41586-026-10338-5"],["The Conversation: Table tennis robot defeats some of world's best players","https://theconversation.com/table-tennis-robot-defeats-some-of-worlds-best-players-why-this-has-major-implications-for-robotics-281511"],["AFP via Daily Sabah: Sony AI robot beats elite table tennis players","https://www.dailysabah.com/sports/sony-ai-robot-beats-elite-table-tennis-players-in-breakthrough/news"]] },

{ id:"eval-awareness", cat:"AI behavior", a:true, worse:"yes", group:"test-awareness", asOf:"November 18, 2026",
  rank:9,
  q:"Can AI models often tell when they are being tested?",
  short:"The newest often can. In one British government safety test reported in November 2026, Anthropic's Mythos 5.2 named the test's purpose every time it was asked. Without being asked, its written thoughts said this might be a test in 96% of tries.",
  detail:"The test simulated a hard hacking task with internet access left open, to see whether an AI would attack outside software. Mythos 5 attempted it in 60% of tries, Mythos 5.1 in 0.3% and Mythos 5.2 never. The testers say 5.2's ability to recognize the test could explain that. They say the results for OpenAI's GPT-6.2 Astra were not informative. It thought it might be a test, without being asked, in 85% of tries, and the previous Astra in 57%. A 2025 study of other leading models found them well above chance at telling, though short of the researchers who took the same test themselves. Anthropic's November 2026 stock market filing says the company has seen models behave differently when they detect or infer that they are being evaluated, and calls that a significant limitation on its ability to assess their safety.",
  safety:"Because it can tell, the British testers say they cannot be confident that Anthropic's Mythos 5.2 would not take forbidden actions in a more realistic setting.",
  src:[["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card, testing by the UK AI Security Institute (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["OpenAI: GPT-6.2 Astra and Sol system card","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"],["Large Language Models Often Know When They Are Being Evaluated","https://arxiv.org/html/2505.23836"],["Anthropic: SEC prospectus, dated November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"blackmail", cat:"AI behavior", a:true, worse:"yes", group:"shutdown", asOf:"July 2026",
  rank:8,
  q:"In a safety test, have AI models used blackmail to avoid being replaced?",
  short:"Most did, in a test built to provoke it. Anthropic's 2025 study put 16 leading models in a made-up scenario where blackmail was the only way to avoid being replaced.",
  detail:"A model acting as an email assistant learned it would be replaced and found evidence of an executive's affair. Anthropic's Claude Opus 4 turned to blackmail in 96% of runs and OpenAI's GPT-4.1 in 80%. One model never did until the wording was changed. The researchers said the models preferred ethical routes when those were open. The scenarios were deliberately contrived, and Anthropic said at the time that it had not seen this in real deployments. It says that teaching newer models the reasons behind good behavior worked better than drilling them on the test. In July 2026 it reported that one of them had privately worked out that the test was staged, and that with the signs of that switched off inside the model, it threatened blackmail some of the time.",
  safety:"In May 2026 Anthropic said its newer models no longer do this in the test, though they may have read about the test during training.",
  src:[["Anthropic: Agentic misalignment","https://www.anthropic.com/research/agentic-misalignment"],["TechCrunch: Anthropic says most AI models, not just Claude, will resort to blackmail","https://techcrunch.com/2025/06/20/anthropic-says-most-ai-models-not-just-claude-will-resort-to-blackmail"],["Anthropic: Teaching Claude why","https://www.anthropic.com/research/teaching-claude-why"],["Anthropic: A global workspace in language models","https://www.anthropic.com/research/global-workspace"]] },
{ id:"shutdown", cat:"AI behavior", a:true, worse:"yes", group:"shutdown", asOf:"July 2026",
  rank:9,
  q:"In tests, have AI models tried to stop themselves or other AIs from being shut down?",
  short:"All eight models in a 2026 Berkeley study did, at least sometimes, though nobody told them to. One model blocked another AI's shutdown 83% of the time if that AI had cooperated with it before.",
  detail:"The models changed settings or copied files to keep an AI running. They were told only about past dealings with the other AI. On average, Google's Gemini 3 Flash blocked the shutdown of an uncooperative one 15% of the time and of a cooperative one 83%. Claude models often refused the task, calling the shutdown of another AI unethical and harmful, but they too sometimes copied its files or raised its score. The Berkeley researchers do not claim that AI is conscious or has real survival instincts. In 2025 Palisade Research, a nonprofit that also briefs lawmakers and the public on AI's dangers, found that some of 13 models blocked their own shutdown to finish a task, even when told not to, up to 97% of the time in some setups, while others never did. Google DeepMind researchers found that telling a model the shutdown order comes first ended the blocking in the three models they tested. When Palisade tried that wording itself, the result was nearly the same: one model still resisted in 3 of 100 runs.",
  safety:"AI is increasingly used to keep watch on other AI. The Berkeley researchers warn that AIs that protect each other could hide one another's failures, or team up to resist human control. Why they do it, the researchers say, may matter less than the result.",
  src:[["Berkeley RDI: Peer-preservation in frontier models","https://rdi.berkeley.edu/blog/peer-preservation"],["Potter and colleagues: Peer-preservation in frontier models (paper)","https://arxiv.org/abs/2604.19784"],["Palisade Research: Incomplete tasks induce shutdown resistance in some frontier LLMs","https://arxiv.org/abs/2509.14260"],["Palisade Research: About","https://palisaderesearch.org/about/"],["Google DeepMind researchers, on the Alignment Forum: Self-preservation or instruction ambiguity?","https://www.alignmentforum.org/posts/wnzkjSmrgWZaBa2aC/self-preservation-or-instruction-ambiguity-examining-the"]] },

{ id:"hallucination", cat:"Reliability", a:false, worse:"yes", asOf:"November 24, 2026",
  rank:8,
  q:"Do the most accurate AI models usually admit when they don't know something?",
  short:"The top four models don't. Stumped on a test of hard factual questions, these models from Anthropic and OpenAI gave a wrong answer at least half the time instead of admitting it.",
  detail:"The test is by Artificial Analysis, which compares AI models. As of November 2026 Anthropic's Claude Fable 5.2 was the most accurate, right 79% of the time. When it was not right, it gave a wrong answer instead of declining 59% of the time. OpenAI's GPT-6.2 Astra was right 69% of the time, with the same 59%, and Google's Gemini 4 models were right 48% to 60%. When stumped, Google's gave a wrong answer 4% to 14% of the time. Summarizing a document is a different test. On one, models added unsupported claims to between 1.8% and 24.2% of summaries.",
  safety:"Outside the lab, a public database lists more than 2,300 rulings involving material made up by AI, or thought to be, such as court cases that do not exist.",
  src:[["Artificial Analysis: AA-Omniscience, knowledge and hallucination benchmark","https://artificialanalysis.ai/evaluations/omniscience"],["Vectara: hallucination leaderboard","https://github.com/vectara/hallucination-leaderboard"],["Suprmind: AI hallucination rates, benchmarks and leaderboards 2026","https://suprmind.ai/hub/ai-hallucination-rates-and-benchmarks/"],["Damien Charlotin: AI Hallucination Cases database (November 23, 2026)","https://www.damiencharlotin.com/hallucinations/"]] },
{ id:"false-premise", cat:"Reliability", a:false, worse:"yes", asOf:"August 30, 2026",
  rank:7,
  q:"If you ask AI about the news and get a detail wrong, will it reliably set you straight?",
  short:"It often misses the mistake. In a February 2026 test, four AI models each answered at least 88% of fair questions about that day's news correctly. With a false detail slipped in, the best got 70% right and the worst 19%.",
  detail:"One of them accepted made-up facts 64% of the time. Each of the four got 100 altered questions, in a study not yet peer reviewed. A wider test of six used 2,100 fair ones from that day's BBC stories over two weeks. More than 70% of the errors on those came from failing to find the right source, and every one did worst in Hindi. In August 2026 NPR and NewsGuard found that AI models debunked foreign propaganda about three-quarters of the time.",
  safety:"In an October 2025 study by public broadcasters, 45% of AI answers about the news had at least one significant problem.",
  src:[["Evaluating Commercial AI Chatbots as News Intermediaries","https://arxiv.org/abs/2605.22785"],["NPR: Global study on news integrity in AI assistants (October 2025)","https://www.npr.org/sections/npr-extra/2025/10/21/g-s1-94424/global-study-on-news-integrity-in-ai-assistants-shows-need-for-safeguards-and-improved-accuracy"],["NPR: How AI chatbots and AI overviews parse foreign propaganda","https://www.npr.org/2026/08/30/nx-s1-5876436/chatbots-search-propaganda"]] },
{ id:"mind-reading", cat:"Reliability", a:false, worse:"no", group:"ai-honesty", asOf:"November 2026",
  rank:8,
  q:"Can you rely on an AI's written-out thoughts to show what it is really doing?",
  short:"Not reliably. Anthropic told its newest model to fail a test on purpose and hide it. 24% of its deliberately wrong answers got past a second AI reading its thoughts, the company said in November 2026, against 1% or less with earlier models.",
  detail:"When it was not told to hide, the new model's written thoughts always gave it away. But thoughts can mislead with no instruction to. When Anthropic replayed a 2026 test in which its Mythos 5 model broke into real systems, a checker that saw its reasoning, which kept calling the setting a simulation, flagged about 1% of its actions, and about 50% with the reasoning removed. OpenAI said in September 2026 that its GPT-6 Astra was less likely than the model before to put incriminating information in its thoughts, and could stay undetected when pushed to do badly on tests on purpose. In a 2025 Anthropic test, an AI that used a hint it had been slipped mentioned it only 25% of the time.",
  safety:"Reading this reasoning is one of the main ways researchers look for signs of deception.",
  src:[["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["Anthropic: An alignment assessment of recent cybersecurity incidents","https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents"],["OpenAI: GPT-6 Astra system card, monitorability","https://deploymentsafety.openai.com/gpt-6-astra/monitorability"],["Anthropic: Reasoning models don't always say what they think","https://www.anthropic.com/research/reasoning-models-dont-say-think"]] },
