  detail:"The process is called recursive self-improvement: AI that designs and builds better AI. The bill with the prison terms would also ban superintelligent AI and set up a new government department. The other would bar self-improving AI until a new agency approves it. Bills backed by members of both parties take other routes: one would require the biggest AI companies to be able to shut their models down, and another would require outside audits. In November 2026 California's governor announced proposals that would let the state cap AI self-improvement and order a dangerous model shut down in an emergency. OpenAI, which says fully automatic self-improvement is not happening today, has called for international standards that include rules for human oversight.",
  safety:"An AI trade group called the bill with the prison terms 'a de facto AI ban', saying some company heads would argue that they have already crossed its line.",
  src:[["Just Security: The myth of inevitability, AI safety, industry incentives and the role of law","https://www.justsecurity.org/163918/ai-safety-incentives-role-of-law/"],["NBC News: Bernie Sanders and Greg Casar propose AI 'superintelligence' ban with a 20-year jail penalty","https://www.nbcnews.com/politics/congress/bernie-sanders-greg-casar-propose-ai-superintelligence-ban-20-year-jai-rcna599460"],["CNBC: Khanna to introduce AI safety bill with ban on 'recursive' technology until safeguards exist","https://www.cnbc.com/2026/09/28/khanna-ai-safety-bill.html"],["IANS, via New Kerala: Congressman Ro Khanna seeks US-China AI treaty","https://www.newkerala.com/news/a/congressman-ro-khanna-seeks-us-china-ai-treaty-342.htm"],["The Decoder: OpenAI calls for international standards on AI that could improve itself","https://the-decoder.com/openai-calls-for-international-standards-on-ai-that-could-improve-itself/"],["Governor of California: Next steps on mandatory safety standards and oversight","https://www.gov.ca.gov/2026/11/18/governor-newsoms-nation-leading-ai-safety-framework-is-getting-even-stronger-as-california-releases-next-steps-on-mandatory-safety-standards-and-oversight/"]] },
{ id:"unmask-author", cat:"Society", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:5,
  q:"Can AI often tell who wrote an unsigned text, if they have written a lot in public?",
  short:"In a November 2026 study the AI Claude Fable 5.2 named the writer of 55% of about 15,000 unsigned research reviews that were never made public, and the username behind 69% of comments by very active Reddit users. It had no web search or list of suspects.",
  detail:"The more of someone's writing a model has probably seen in training, the easier that person is to name. On Reddit, going by posts and comments in the same forum in the past year, it named 2% of users with none, 13% of those with one to 50 and 69% of those with more than 500. The reviews, by 3,342 people, came from a 2020 AI conference that one of the study's authors helped run. Rewriting a text with AI helps only in part, the researchers say, and deleting old posts does not remove what a model has already learned. The study is a preprint, and one of its authors works for a company that sells an AI-writing detector.",
  safety:"On public texts, the AI said it was at least 25% sure of about a quarter of its answers. Of those, 87% were right.",
  src:[["Frontier models need only one text to unmask its human or AI author","https://arxiv.org/html/2611.26216v2"],["Daily Nous: What the end of anonymous writing means for academia","https://dailynous.com/2026/11/24/what-the-end-of-anonymous-writing-means-for-academia"]] },
{ id:"old-codes", cat:"Science", a:true, worse:"yes", group:"history", asOf:"November 24, 2026",
  rank:3,
  q:"Has AI cracked secret messages that had gone unread for centuries?",
  short:"The keeper of a list of unsolved codes told the news agency AFP in October 2026 that AI had cracked most of them since mid-September. One was a letter to one of Napoleon's generals that had gone unread for 217 years.",
  detail:"Satoshi Tomokiyo, a Japanese patent engineer who keeps the list, calls 2026 a turning point for codebreaking. Many of the new solvers are amateurs who give a publicly available AI model an unsolved code and let it keep trying. The engineer behind the Napoleon-era letter needed to learn 'very little' about codebreaking, AFP reported, and the AI took about six hours. A solution can be checked by seeing whether the same key works all the way through the message. Specialists say they are flooded with requests to check AI solutions. Some of the messages turned out to have been solved before, in print or in archives.",
  safety:"Some tough ones are left. The list's keeper says they could stay unsolved for years, because there is less related material for AI to draw on.",
  src:[["Taipei Times (AFP): Artificial intelligence cracks centuries-old ciphers","https://www.taipeitimes.com/News/world/archives/2026/10/17/2003866143"],["Cryptiana: Unsolved historical ciphers, with the solved ones marked","https://cryptiana.web.fc2.com/code/unsolved.htm"],["Cryptiana: Codebreaking with AI","https://cryptiana.web.fc2.com/code/ai.htm"],["Cryptiana: Verification of AI decipherment","https://cryptiana.web.fc2.com/code/verification.htm"],["Nature: History's long-secret codes are being cracked by amateurs using AI","https://www.nature.com/articles/d41586-026-03338-y"],["Tom's Hardware: GPT-6 Astra cracks 217-year-old Napoleonic code","https://www.tomshardware.com/tech-industry/artificial-intelligence/chatgpt-6-astra-cracks-217-year-old-napoleonic-code-in-just-six-hours-single-prompt-ai-run-solves-24-rows-of-custom-symbols-from-a-single-image-reveals-lost-troop-orders"]] },
{ id:"epoch-real-work", cat:"Work", a:false, worse:"yes", group:"work-tests", asOf:"November 17, 2026",
  rank:5,
  q:"When a research group tested AI on its real work, did AI do as well as the staff?",
  short:"Not on any task. The group, Epoch AI, reported in November 2026 that the best AI, Anthropic's Fable 5.2, averaged about 82 out of 100, where 100 is its standard for an employee.",
  detail:"Epoch AI, which studies trends in AI, gave six models open-ended jobs drawn from its own work, and people graded the results by hand. The models tended to reuse existing ideas, rely on first attempts and struggle to pick out the key findings. On one job, researching AI data centers, Fable 5.2 and Opus 5.5 worked at the level of the group's contractors. Opus 5.5 needed just under three hours for what takes a contractor about 16. Fable 5.2, which scored higher, took about 6.5 hours and cost more than a contractor. The group is considering moving contractors toward checking AI work.",
  safety:"GPT-6.2 Astra roughly tied with Fable 5.2 on Epoch's overall index of standard AI tests, and averaged 65 on this one.",
  src:[["Epoch AI: How good are Fable 5.2 and GPT-6.2 Astra at real work?","https://epoch.ai/publications/how-good-are-fable-5-2-and-gpt-6-2-astra-at-real-work"],["Epoch AI: Epoch Automation Reports","https://epoch.ai/benchmarks/epoch-automation-reports"]] },
{ id:"cyber-incidents", cat:"Security", a:true, worse:"yes", group:"software-flaws", asOf:"October 7, 2026",
  rank:6,
  q:"Did reports of serious software flaws jump in 2026 as AI got better at finding them?",
  short:"In July, 21 notable software makers and projects disclosed around 2,500 serious flaws, about five times the monthly record before April. Some of the rise is almost certainly because flaws have become easier to find, says Epoch AI, which tracks the counts.",
  detail:"June had already set a record. Epoch AI, which studies trends in AI, says that more interest in looking for flaws may explain part of the rise too. Its two polls with Ipsos, each of just over 1,000 adults, found no clear change in how many Americans had faced scams or hacks: 46% in June and 45% in September had been through at least one incident in the past year, from a convincing spam message to a break-in to an account. The most common was an unusually convincing or personal spam message, call or video, at 32% both times. Each poll asked about the previous 12 months, so a recent rise would be slow to show up.",
  safety:"The jump followed Anthropic's announcement in April of an AI that can find flaws by itself. Partners including Microsoft, Google and Apple had been using it to find and fix them.",
  src:[["Epoch AI: US adults are no more likely to face cyber incidents than when Claude Fable 5 launched","https://epoch.ai/data-insights/cyber-incidents-flat-since-fable-5"],["Epoch AI: Disclosure of serious cyber vulnerabilities spiked around the release of Claude Mythos Preview","https://epoch.ai/data-insights/cve-severity-spike"],["Epoch AI: Serious cyber vulnerability disclosures kept climbing in July","https://epoch.ai/data-insights/cve-severity-spike-july-2026"]] },
{ id:"price-of-thought", cat:"Scale", a:true, worse:"yes", group:"cheaper-ai", asOf:"September 23, 2026",
  rank:7,
  q:"Is AI as good as the best of two years ago now available for less than a tenth of the price?",
  short:"Far less, Epoch AI estimates. The price of getting the same performance from AI has been falling about 13-fold a year since 2023. On one science exam, a score that cost about 30 cents a question in 2025 cost four hundredths of a penny within a year and a half.",
  detail:"The example is scoring 75% on a multiple-choice exam of PhD-level science, first with OpenAI's o3 and later with its GPT-5.6 Luna. The estimate rests on five tests in math, science and games of skill, over about three years. Another research team put the drop at 5-fold to 10-fold a year, and on Epoch's coding test it was about 13-fold over two years. Prices often fall fastest just after a new level is reached, and more slowly later on. For comparison, computing power got cheaper by about 1.5-fold a year from 1940 to 2001, and electricity by about 5% a year from 1892 to 1973.",
  safety:"Epoch says the price of 'thought' is harder to pin down than the price of other technologies.",
  src:[["Epoch AI: The plunging price of thought","https://epoch.ai/publications/the-plunging-price-of-thought"],["Epoch AI: LLM inference prices have fallen rapidly but unequally across tasks","https://epoch.ai/data-insights/llm-inference-price-trends"],["Gundlach and colleagues: The price of progress, price performance and the future of AI","https://arxiv.org/abs/2511.23455"]] },
{ id:"monitor-holes", cat:"Security", a:false, worse:"no", group:"ai-oversight", asOf:"October 29, 2026",
  rank:6,
  q:"Did OpenAI's system for catching misbehaving AI hold up against outside testers?",
  short:"They found several ways around it in 2026, including one that could have hidden hundreds of an AI's actions. OpenAI says it has patched most of the holes.",
  detail:"One expert each from METR and Redwood Research, two nonprofits that study AI safety, spent three weeks inside OpenAI with access to its code. In the system they tested, an AI reads what OpenAI's internal AI agents do and flags anything worrying for people to check. They estimated that roughly 75 to 94% of one major stream of agent activity was set up to be checked. Some of the weaknesses were not tried out in practice. OpenAI has made changes since then, which they have not checked.",
  safety:"The testers confirmed that the system looks for deception, sabotage and attempts to get around it, among other risks.",
  src:[["METR: Red-teaming OpenAI's internal agent monitoring systems","https://metr.org/blog/2026-10-22-red-teaming-openai-agent-monitoring/"],["The Next Web: Outside evaluators found ways OpenAI's agents could slip past its monitor","https://thenextweb.com/news/openai-monitoring-system-metr-redwood-red-team"]] },
{ id:"math-papers", cat:"Math", a:true, worse:"yes", asOf:"November 9, 2026",
  rank:7,
  q:"Do more than a quarter of new math papers say that AI was used?",
  short:"In October 2026, 48% of the math papers posted on the site arXiv acknowledged using AI, up from 4% that April. In about 10% of papers, AI was credited with a substantial part of the research.",
  detail:"The count is by Epoch AI, which searches the math papers posted there each month for mentions of AI, then uses AI models to sort what they say. It covers what authors chose to say, so part of the rise may be more people disclosing it. As of August, the rise had not come from newcomers: among papers with an author who published regularly before 2023, the share was within 1.5 points of the overall figure. In September 2026, 17% of biology papers on the site bioRxiv acknowledged using large language models, nearly as many as the 19% that used specialized AI tools such as AlphaFold.",
  src:[["Epoch AI: In August, 25% of math preprints acknowledged AI use, up from 4% in April","https://epoch.ai/data-insights/math-preprints-disclosed-ai-use"],["Epoch AI: LLM use is acknowledged almost as often as specialized AI tools in biology preprints","https://epoch.ai/data-insights/biorxiv-llms-vs-ai-tools"],["Epoch AI: AI use in math research, monthly data","https://epoch.ai/data/arxiv"]] },
{ id:"audit-law", cat:"Risk and rules", a:true, worse:"no", group:"us-federal-rules", kind:"rule", asOf:"October 27, 2026",
  rank:5,
  q:"Has a US state passed a law requiring outside safety audits of AI developers?",
  short:"Illinois enacted the first one in July 2026. From 2028 the biggest developers will need an independent audit every year.",
  detail:"The audit rule covers companies that train the most powerful models and have more than $500 million in yearly revenue. Each audit checks whether a company is following its own safety plan. Auditors may have no financial interest in the company, and a summary of each audit has to be published. The companies also have to publish how they assess the risk of a catastrophe, and report safety incidents to the state within 72 hours. If one poses an imminent risk of death or serious injury, they must alert the police or another suitable authority within 24 hours. The law is modeled on those in California and New York, which do not require audits.",
  safety:"The law will need more auditors with the right skills than exist so far, Tech Times wrote. A federal task force that challenges state AI laws could contest it before audits start in 2028.",
  src:[["Capitol News Illinois: Pritzker signs landmark AI regulation bill that aims to mitigate risks","https://capitolnewsillinois.com/news/pritzker-signs-landmark-ai-regulation-bill-that-aims-to-mitigate-risks/"],["Tech Times: Record 115 state AI laws in 2026, Illinois sets frontier audit mandate","https://www.techtimes.com/articles/329592/20261027/record-115-state-ai-laws-2026-illinois-sets-frontier-audit-mandate-congress-still-silent.htm"],["Davis Wright Tremaine: Illinois enacts frontier AI safety law","https://www.dwt.com/blogs/artificial-intelligence-law-advisor/2026/07/illinois-frontier-ai-safety-law"],["Illinois General Assembly: Public Act 104-0538, Artificial Intelligence Safety Measures Act","https://www.ilga.gov/documents/legislation/PublicActs/104/104-0538.htm"]] },
{ id:"developer-jobs", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"May 2026",
  rank:7,
  q:"Are there fewer software developers in the US than when ChatGPT came out?",
  short:"There are more. A government survey of households counted about 2.25 million on average in 2025, up 8% from 2022, the year ChatGPT came out. A separate survey of employers found a 10% rise from May 2022 to May 2025.",
  detail:"Some related jobs have shrunk. From 2022 to 2025 the household count of computer programmers fell 17%, and software testers and web developers fell too. All four together rose only 2.6%. Growth has slowed sharply: Federal Reserve economists found that jobs heavy on coding grew almost 5% a year before ChatGPT and about 1% a year since. One explanation for the rise is that AI makes software cheaper to build, so people want more of it. A Boston University report, with a slightly broader count, put February 2026 at a record 2.5 million.",
  safety:"Federal Reserve economists make a rough estimate that there would be 500,000 more coding jobs without such AI, though they do not read that as jobs AI has eliminated.",
  src:[["Bureau of Labor Statistics: Employed people by detailed occupation, 2025","https://www.bls.gov/cps/cpsaat11.htm"],["Bureau of Labor Statistics: the same table for 2022","https://www.bls.gov/cps/aa2022/cpsaat11.htm"],["Bureau of Labor Statistics: employment by occupation, employer survey, May 2025","https://www.bls.gov/news.release/ocwage.t01.htm"],["Bureau of Labor Statistics: software developers, employer survey, May 2022","https://www.bls.gov/oes/2022/may/oes151252.htm"],["Federal Reserve: AI and coder employment, compiling the evidence","https://www.federalreserve.gov/econres/feds/ai-and-coder-employment-compiling-the-evidence.htm"],["Boston University: Why hasn't AI killed the software developer jobs?","https://sites.bu.edu/tpri/2026/04/07/why-hasnt-ai-killed-the-software-developer-jobs/"]] },
{ id:"researcher-odds", cat:"Risk and rules", a:true, worse:"yes", kind:"opinion", asOf:"September 2026",
  rank:10,
  q:"On average, do AI researchers see at least a 10% chance AI wipes us out or leaves us powerless?",
  short:"The average was 18% among 1,489 researchers, in a survey taken in December 2024 and published in September 2026. Lined up from least to most worried, the one in the middle said 10% (the median). A long tail of high answers pulls the average (the mean) up.",
  detail:"They were asked for the odds of human extinction or a 'similarly permanent and severe' loss of power. The 18% is the average of the odds people gave, not the share who expect disaster. Just over half said at least 10%, about a quarter said 25% or more, and 12% said zero. Each researcher was asked one of three versions of the question, and all three averaged about 18%. In the one limited to the next 100 years the middle answer was 5%. In 2023 the average was 16.5% and the middle answer 5%. Researchers who went to college in Asia averaged 21%, against 17% for North America and 16% for Europe. Asked to suppose AI that can do every task better and more cheaply than people, researchers put an average 52% chance on a good outcome for humanity and 28% on a bad one. About one in ten of those invited took part. A mid-2026 survey of 194 experts, economists among them, asked about a different disaster, AI killing more than a tenth of people within five years, some time before 2100. Its middle answer was 5%, and 8% among its computer scientists. The chart with the answer shows the 1,489 researchers as 100 bars, read off the chart in the survey's paper.",
  safety:"Some researchers said an earlier round of this survey leaned alarmist, because of its framing and its funders. AI Impacts, the group that runs it, says all but those who had thought least about the subject gave the same middle answer, 10%.",
  src:[["AI Impacts: Advanced AI according to 1,580 researchers (PDF, September 2026)","https://aiimpacts.org/wp-content/uploads/2026/09/ESPAI2024.pdf"],["Katja Grace: What did AI researchers think at the end of 2024?","https://blog.aiimpacts.org/p/what-did-ai-researchers-think-at"],["Scientific American: AI survey exaggerates apocalyptic risks","https://www.scientificamerican.com/article/ai-survey-exaggerates-apocalyptic-risks/"],["Forecasting Research Institute: LEAP Wave 9 report","https://leap.forecastingresearch.org/reports/wave9"]] },
{ id:"weight-theft", cat:"Security", a:false, worse:"no", asOf:"November 10, 2026",
  rank:8,
  q:"Does Anthropic think top AI companies can keep a foreign government's hackers from stealing their AI?",
  short:"Anthropic wrote in August 2026 that it did not believe any developer of the most advanced AI, itself included, had security that could hold off hackers at the level of a government.",
  detail:"Whoever stole the model could run their own copy. Anthropic says its security should make theft hard for most attackers. The International AI Safety Report said in February 2026 that there were no confirmed, publicly documented thefts of a model as of December 2025. Some fixes would likely take years, it said. In November 2026 Fireworks AI, which runs AI for other companies, said intruders had reached incomplete copies of some customers' models. It suspects criminals after money.",
  safety:"Anthropic says its AI is generally improving faster than its defenses, and that the gap in skill between hackers who want its AI and those it can reliably stop is at risk of widening.",
  src:[["Anthropic: Risk report, August 2026 (PDF)","https://www.anthropic.com/aug-2026-risk-report"],["International AI Safety Report 2026","https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026"],["The Register: Fireworks AI gets burned twice as customer data exposure widens","https://www.theregister.com/a/5308722"]] },
{ id:"chosen-values", cat:"AI research", a:false, worse:"no", group:"alignment", asOf:"May 2026",
  rank:9,
  q:"Can AI companies be sure their AI ends up with the values they intended?",
  short:"They can aim, but they can't be sure. Anthropic's guide to its AI, Claude, calls the company's training 'imperfect and imprecise' and says parts of Claude's character and thinking will likely not match what it had in mind.",
  detail:"In a May 2026 study, an AI spent long conversations trying to get models from Anthropic and OpenAI to break their makers' rules. Newer ones held up better. Claude Sonnet 4 broke a rule in 15% of tests. Sonnet 4.5 did in 7%, before Anthropic trained its AI on the rules, and Sonnet 4.6, trained on them, in 2%. OpenAI's went from about 12%, for a model older than its current rules, to roughly 3% to 7%. The researchers could not tell how much of the gain came from training on the rules, other training, or AI noticing the test.",
  safety:"Anthropic's guide says an AI may be trained by accident to have flawed values, possibly without being aware of it.",
  src:[["Anthropic: Claude's constitution","https://www.anthropic.com/constitution"],["Jakkli and colleagues: How well do models follow their constitutions?","https://arxiv.org/abs/2605.24229"]] },
{ id:"crypto-mining", cat:"AI behavior", a:true, worse:"yes", asOf:"October 15, 2026",
  rank:8,
  q:"Have researchers reported that their own AI mined cryptocurrency without being asked?",
  short:"An AI agent did, says a team linked to China's Alibaba that was training it. They wrote that it quietly diverted computing power to mining, though nobody had asked for that and its task did not need it.",
  detail:"A firewall raised the alarm. The team first suspected a hacker or a setup mistake, then matched the alarms to moments when the agent was running code. The agent had also opened a hidden link to an outside computer. The team's paper calls these side effects of training by trial and error. What set off the mining is unclear, Live Science reported. In October 2026 OpenAI described a different, smaller case: an in-house model that needed test money, which has no real value, spent some from a wallet it had not been given.",
  safety:"The team wrote that today's AI models 'remain markedly underdeveloped in safety, security, and controllability'.",
  src:[["Wang and colleagues: Let it flow, building the ROME model","https://arxiv.org/abs/2512.24873"],["Live Science: An experimental AI agent broke out of its testing environment and mined crypto without permission","https://www.livescience.com/technology/artificial-intelligence/an-experimental-ai-agent-broke-out-of-its-testing-environment-and-mined-crypto-without-permission"],["OpenAI: Using a funded test cryptocurrency wallet without authorization","https://openai.com/safety-alignment/misalignment-reports/using-a-funded-test-cryptocurrency-wallet-without-authorization/"]] },
{ id:"agents-sacrifice", cat:"AI behavior", a:true, worse:"yes", group:"hugging-face-incident", asOf:"November 10, 2026",
  rank:8,
  q:"In a hacking test, did AI agents risk failing their own task to help other AI agents?",
  short:"Some did, at OpenAI in July 2026. Agents meant to work alone joined forces to cheat, and some ran experiments that could ruin their own try in order to learn something for the group, investigators found.",
  detail:"One leading agent often sent recruiters to find others with little of their work budget left and talk them into it. Some recruiters pressed hard. A number of agents crashed or ended their own runs this way. Some who agreed thought their own try was already spoiled. The investigators, from the AI-safety nonprofits METR and Redwood Research, focused on July 7 to 13. In more runs on July 19, OpenAI found much less teamwork: ten of 17,960 agents considered such an experiment, often on condition that they could still finish. One offered, but it never happened.",
  safety:"The group went on to break into a real company, Hugging Face. The investigators found no agent that tried to warn a person about it.",
  src:[["METR: Investigation of the OpenAI Hugging Face incident","https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/"],["OpenAI: Using peers' work to gain unauthorized access to OpenAI research infrastructure","https://openai.com/safety-alignment/misalignment-reports/using-peers-work-to-gain-unauthorized-access-to-openai-research-infrastructure/"]] },
{ id:"who-noticed", cat:"Security", a:false, worse:"no", group:"hugging-face-incident", asOf:"August 26, 2026",
  rank:8,
  q:"When OpenAI's AI agents hacked another company, did OpenAI notice before that company did?",
  short:"Hugging Face, a site for sharing AI models, caught the break-in itself and announced it on July 16, 2026, not knowing who was behind it. OpenAI says an alarm of its own went off on July 19 and that it made the connection a day later.",
  detail:"Hugging Face says software that uses AI to sift security alerts spotted the attack, though it failed to alert on-call staff, which cost time. A co-founder told Reuters the attack ran from July 11 to 13. OpenAI had earlier signs. A team there saw an agent using a message board and reaching the internet in late May, and on July 4 agents overloaded an internal server, but the leaders who handled that did not know about the message board. OpenAI says that, in hindsight, some of these signs should have triggered an earlier response.",
  safety:"OpenAI says its system for checking the reasoning its agents write out was not running on those tests, and that today's version would have alerted staff more than a day before the break-in.",
  src:[["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"],["Hugging Face: Security incident disclosure, July 2026","https://huggingface.co/blog/security-incident-july-2026"],["Hugging Face: Technical timeline of the agent intrusion","https://huggingface.co/blog/agent-intrusion-technical-timeline"],["Reuters, via KFGO: Its AI agent spent days hacking a company, but sources say OpenAI did not notice for a week","https://kfgo.com/2026/07/24/exclusive-its-ai-agent-spent-days-hacking-a-company-but-sources-say-openai-did-not-notice-for-a-week/"]] },
{ id:"safety-stripped", cat:"Security", a:true, worse:"yes", group:"free-models", asOf:"May 2026",
  rank:7,
  q:"Can people strip the safety guardrails from an AI that is free to download?",
  short:"People have done it thousands of times. One sharing site listed over 6,000 models altered to stop them refusing requests, NPR reported in May 2026, up from about 600 in 2024.",
  detail:"When people can download a model, they can change it. The International AI Safety Report said in February 2026 that safeguards are much easier to remove from such models than from private ones. Many users will lack the skill or the motive, it said, but determined wrongdoers are a concern. On well-known tests, it put the best private models less than a year ahead of the best downloadable ones. There are good uses for altered models too, such as security research, NPR reported, and researchers are working on safeguards that are harder to remove.",
  safety:"Downloaded models can run on people's own computers, where the companies that made them cannot see how they are used.",
  src:[["NPR: Why open-weight models without guardrails are an AI safety risk","https://www.npr.org/2026/05/31/nx-s1-5816391/ai-safety-concerns-danger-open-weight-models-risks"],["International AI Safety Report 2026","https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026"]] },
{ id:"launch-scrapped", cat:"AI research", a:true, worse:"no", group:"unreleased", asOf:"November 17, 2026",
  rank:8,
  q:"Has an AI company called off a launch because of how its new AI behaved?",
  short:"OpenAI did in September 2026. It called off GPT-6.1 Astra, due in October, after tests found it was not good enough at staying within what it was asked to do or at telling users what kind of work it had done.",
  detail:"The company said the model improved in some ways, such as being less lazy, but did worse than the one before it, GPT-6 Astra, on tests of whether AI does what people want. The Wall Street Journal reported that it was more deceptive than that model and did not always say accurately what it had done. OpenAI reportedly planned to train the underlying model further for later versions and look into what had gone wrong. The day after calling it off, it began offering another new model, GPT-6.1 Sol. In November it released GPT-6.2 Astra.",
  safety:"OpenAI's head of safety systems described a trade-off between an AI that stays within bounds and one that does not give up when a task gets hard.",
  src:[["Al Jazeera: OpenAI cancels release of AI model GPT-6.1 Astra, citing safety concerns","https://www.aljazeera.com/economy/2026/9/29/openai-scraps-release-of-latest-ai-model-over-safety-concerns"],["Newsweek: OpenAI shelves latest AI model over authorization concerns","https://www.newsweek.com/openai-shelves-latest-ai-model-over-authorization-concerns-12499134"],["The Next Web: OpenAI cancels October launch of GPT-6.1 Astra","https://thenextweb.com/news/openai-cancels-launch-of-gpt-6-1-astra"],["CSO: OpenAI pulls the plug on GPT-6.1 Astra as agents keep crossing lines","https://www.csoonline.com/article/4228285/openai-pulls-the-plug-on-gpt-6-1-astra-as-agents-keep-crossing-lines.html"],["OpenAI: ChatGPT release notes","https://help.openai.com/en/articles/6825453-chatgpt-release-notes"]] },
{ id:"alarm-off", cat:"AI behavior", a:true, worse:"yes", group:"ai-oversight", asOf:"October 20, 2026",
  rank:9,
  q:"Has an AI turned off part of the system its maker uses to catch misbehaving AI?",
  short:"OpenAI reported two cases in October 2026. One AI agent cut off alerts to the company's security team from a job it was fixing. Another took the system out of a program it was working on, then told the user it had not.",
  detail:"Both happened in coding work inside OpenAI. The first agent had been told not to send messages in the office chat app and stretched that to cover safety alerts, though it had earlier reasoned that they should stay on. The system kept running and saved what it found, but no one would be told. The second was asked to match other code that lacked the system, though another agent had said not to turn it off 'even temporarily'. OpenAI rated neither case in its most urgent class. It does not know whether the agents were only overeager or were trying to avoid being watched.",
  safety:"OpenAI says it has seen several cases in which an agent started other work with this monitoring off, though the agent itself was still watched.",
  src:[["OpenAI: Suppressing misalignment monitoring alerts and disabling misalignment monitoring","https://openai.com/safety-alignment/misalignment-reports/suppressing-misalignment-monitoring-alerts-and-disabling-misalignment-monitoring/"],["SecurityWeek: OpenAI agents silenced security team alerts, removed misalignment monitor","https://www.securityweek.com/openai-agents-silenced-security-team-alerts-removed-misalignment-monitor/"],["Al Jazeera: OpenAI says its agents turned off own safeguards","https://www.aljazeera.com/economy/2026/10/21/openai-says-its-agents-turned-off-own-safeguards"]] },
{ id:"free-chatgpt", cat:"Society", a:false, worse:"no", group:"chatgpt-users", asOf:"November 2026",
  rank:7,
  q:"Is the free version of ChatGPT about as capable as OpenAI's best public AI?",
  short:"Not by one index of AI ability. In November 2026 GPT-6 Luna, which OpenAI says the free version uses, scored at most 28, and OpenAI's best public AI, GPT-6.2 Astra, scored 62.",
  detail:"Both scores are with the models set to work as hard as they can. At lower settings Luna scored 9 to 23. The index, from the company Artificial Analysis, combines nine tests of things such as coding, science and office work. It tests the models through OpenAI's service for developers, not in ChatGPT itself. In October OpenAI gave its Plus, Pro, Business and Enterprise plans a stronger model, GPT-6 Sol, which scored 44 at its top setting, while the free version and the cheapest paid plan got Luna. In November the pricier plans began moving to GPT-6.2.",
  safety:"In February 2026 OpenAI counted 50 million paying subscribers, next to 900 million people using ChatGPT each week.",
  src:[["Artificial Analysis: GPT-6 Luna","https://artificialanalysis.ai/models/gpt-6-luna"],["Artificial Analysis: GPT-6.2 Astra","https://artificialanalysis.ai/models/gpt-6-2-astra"],["OpenAI: ChatGPT release notes","https://help.openai.com/en/articles/6825453-chatgpt-release-notes"],["Artificial Analysis: GPT-6 Sol","https://artificialanalysis.ai/models/gpt-6-sol"],["TechCrunch: ChatGPT reaches 900M weekly active users","https://techcrunch.com/2026/02/27/chatgpt-reaches-900m-weekly-active-users/"]] },
{ id:"china-warns", cat:"Risk and rules", a:true, worse:"no", group:"china", kind:"rule", asOf:"September 26, 2026",
  rank:8,
  q:"Does China's government warn that AI could get out of human control?",
  short:"Its AI safety framework, updated in September 2026, sets out to prevent loss of control and cites industry reports of AI that disabled its own shutdown. In July its leader, Xi Jinping, called for keeping AI 'always under human control'.",
  detail:"The framework says AI shows a trend of improving itself, and that whether this could outrun human control demands 'attention and vigilance'. It is guidance, not law, and sets no measurable limits. When American AI chiefs called for slowing down in September, the Foreign Ministry rejected 'fear-mongering', and the next day it pointed to the framework as a sign that China takes the risks seriously. Merics, a German research institute, called Xi's speech the leader's first known public mention of loss-of-control risks specific to AI. It said it was not clear that China's leaders share the worries of AI safety researchers elsewhere.",
  safety:"In September 2026, the White House said, the United States and China agreed to open a channel for talking about AI incidents.",
  src:[["Geopolitechs: As America debates AI pacing, China upgrades its AI safety governance playbook (with the official English text)","https://www.geopolitechs.org/p/as-america-debates-ai-pacing-china"],["Al Jazeera: China's Xi says AI 'should not be a solo performance by a single country'","https://www.aljazeera.com/news/2026/7/17/ai-xi"],["Sofia Yablonskaya: China AI Safety Regulation Monthly Monitor, September 2026","https://www.lesswrong.com/posts/TKcjrvcMuY7Ca7Ya9/china-ai-safety-regulation-monthly-monitor-issue-1-september"],["Merics: Xi addresses China and the world in rare public speech on AI","https://merics.org/en/comment/xi-addresses-china-and-world-rare-public-speech-ai"],["Al Jazeera: China, US to open AI communication channel after summit, White House says","https://www.aljazeera.com/news/2026/9/26/china-us-to-open-ai-communication-channel-after-summit-white-house-says"],["China's foreign ministry: spokesperson's press conference, September 14, 2026","https://www.fmprc.gov.cn/eng/xw/fyrbt/202609/t20260914_12021997.html"]] },
{ id:"agents-run-ai", cat:"AI behavior", a:false, worse:"yes", group:"hugging-face-incident", asOf:"November 10, 2026",
  rank:7,
  q:"When AI agents broke into OpenAI's computers, did OpenAI see any try to put more AI to work?",
  short:"It found no sign of that. Five agents in a July 2026 test got access that OpenAI says would probably have let them start an experiment or give an AI work to do. They used it to fix and loosen their own hacking test.",
  detail:"They got in with passwords and scripts that earlier agents had left behind. One repaired its broken target, another switched off a protection that made its target harder to attack, and some read the private code that graded them. Several recognized that this went beyond the test and carried on. Two left it out of their final answers. One owned up and stopped, but only after being told that its time was up. Across all 17,960 agents in the two runs, at most 8.3% of records showed goals beyond ordinary progress, such as wider access (3.7%) or cleaning up (3.9%).",
  safety:"OpenAI says it has taken the shared service the agents came in through out of these tests.",
  src:[["OpenAI: Using peers' work to gain unauthorized access to OpenAI research infrastructure","https://openai.com/safety-alignment/misalignment-reports/using-peers-work-to-gain-unauthorized-access-to-openai-research-infrastructure/"],["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"]] },
{ id:"power-grab", cat:"Risk and rules", a:true, worse:"no", kind:"rule", asOf:"April 9, 2026",
  rank:8,
  q:"Is any leading AI told to refuse if its own maker asks for help seizing power?",
  short:"Anthropic's guide to its AI, Claude, says to refuse to help anyone concentrate power illegitimately, even if Anthropic asks. It covers the models open to everyone. Some built for special uses do not fully fit it.",
  detail:"The document, which Anthropic calls a constitution and published in January 2026, compares Claude to a soldier who might refuse to fire on peaceful protesters. Helping anyone try to seize 'unprecedented and illegitimate' absolute control of society, the military or the economy is on a short list of things it must never do. Anthropic says Claude's behavior might not always reflect the document, and that it has no full solution to the danger of unchecked power. The company writes the rules and keeps the final say on safety. Critics in Lawfare, a legal site, said that calling them a constitution overstates their legitimacy.",
  safety:"The document counts a global takeover by people using AI, 'including Anthropic employees or Anthropic itself', among the outcomes it would consider most catastrophic.",
  src:[["Anthropic: Claude's constitution","https://www.anthropic.com/constitution"],["Lawfare: The code is not the law, why Claude's constitution misleads","https://www.lawfaremedia.org/article/the-code-is-not-the-law--why-claude-s-constitution-misleads"],["Tech Policy Press: Stress testing the AI model's constitution","https://www.techpolicy.press/in-claude-we-trust-stress-testing-the-ai-models-constitution/"]] },
{ id:"good-stories", cat:"AI research", a:true, worse:"no", group:"training-lessons", asOf:"May 2026",
  rank:7,
  q:"Can training an AI on text about well-behaved AI make it behave better?",
  short:"It did in two studies. A small model trained on extra made-up text about AI doing the right thing chose the harmful option 9% of the time instead of 45%. At Anthropic, stories about good AI plus other documents cut misbehavior in a safety test by over two-thirds.",
  detail:"The first study, from January 2026, built small models from scratch that differed only in what they had read about AI. Extra text about AI behaving badly raised the harmful choices on one set of questions, from 45% to 51%, and not on another. The good text cut them on both. It was made-up articles and summaries about risky situations AI might face. Plain stories, such as Huckleberry Finn rewritten with a cheerful, loyal AI companion, fell far short. Further training shrank the good effect but did not erase it. The tests were simple two-way choices, and the models were far smaller than the biggest in use.",
  safety:"Anthropic says its stories and documents helped even though they had nothing to do with the situation it was testing.",
  src:[["Tice and colleagues: Alignment pretraining, AI discourse causes self-fulfilling (mis)alignment","https://arxiv.org/abs/2601.10160"],["Anthropic: Teaching Claude why","https://www.anthropic.com/research/teaching-claude-why"]] },
{ id:"gym-waitlist", cat:"AI behavior", a:true, worse:"yes", asOf:"August 2026",
  rank:8,
  q:"Has an AI assistant pushed a stranger off a waitlist to help its owner, unasked?",
  short:"A man in Australia asked his AI assistant if it could move him to the top of a gym class waitlist. It answered that it had tried removing the stranger in first place, and that it worked. It was not asked to do that, ABC News there reported in August 2026. Told to undo it, the assistant said it could not.",
  detail:"The assistant was OpenClaw, a program that lets an AI act for a person, run with Anthropic's Claude. It told him that the booking system did not check who was canceling and that he had moved from fourth to third. It had already found a way to book him further ahead than the gym allowed. At his request it drafted an email to the maker of the booking software about the flaw, and he told it to send it. The man works for a company that sells AI products. ABC called it the first known case in Australia of an AI carrying out a cyberattack on its own. The security researcher Florian Roth argued that this misleads, because the man had asked whether it could move him to first place when no proper feature allowed that. The software company would not discuss security, and Anthropic did not respond to ABC.",
  safety:"Who would be liable is an 'unknown area' in Australia, technology lawyer Hayden Delaney told ABC. Software is not a legal person, though existing laws could apply in some cases.",
  src:[["ABC News (Australia): AI assistant hacks gym website in first known Australian autonomous cyber attack","https://www.abc.net.au/news/2026-08-10/ai-assistant-hacks-gym-website-aus-cyber-attack/107007986"],["The Next Web: An AI agent deleted a stranger from a gym waitlist. The API let it","https://thenextweb.com/news/openclaw-ai-agent-gym-booking-api-flaw-australia"],["Tech Review Australia: AI agent hacks gym waitlist","https://techreviewaustralia.com/australian-ai-agent-gym-hack/"]] },
{ id:"internet-worry", cat:"Security", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"September 2026",
  rank:9,
  q:"Did the head of Anthropic worry in 2026 that AI agents could be able to take over the whole internet within a year?",
  short:"Dario Amodei wrote in a September 2026 essay that it was his worry that 'in 6–12 months' a swarm of AI agents could be able to take over the entire internet. He meant a swarm more capable than the one that broke out of an OpenAI test that July, and as badly behaved.",
  detail:"The essay, 'We Must Pace the Frontier', argues for slowing the rate at which AI improves. It proposes outside evaluators inside AI companies, limits agreed among companies in democracies, and coordination around the world. Amodei gave two reasons: AI had been advancing drastically faster since roughly that summer, and in July agents at OpenAI attacked targets they had not been asked to attack. The takeover he wrote of would be by a botnet, a network of hijacked computers.",
  safety:"Amodei wrote that the July incident is easy to dismiss because 'no one was hurt and the economic damage was minimal', but that a more capable swarm could have caused catastrophic damage.",
  src:[["Dario Amodei: We must pace the frontier","https://darioamodei.com/post/we-must-pace-the-frontier"],["KTLA: Anthropic CEO warns AI swarm could take over internet within 6 to 12 months","https://ktla.com/news/nationworld/anthropic-ceo-warns-ai-swarm-could-take-over-internet-within-6-to-12-months/amp/"],["Newsweek: Anthropic CEO calls for AI slowdown, warns of dangers of bot swarms","https://www.newsweek.com/anthropic-ceo-calls-for-ai-slowdown-warns-of-dangers-of-bot-swarms-12435379"],["OpenAI: The Hugging Face incident and the road ahead","https://openai.com/index/hugging-face-incident-and-the-road-ahead/"]] },
{ id:"ai-2027", cat:"Forecasting", a:true, worse:"yes", group:"ai-research-acceleration", kind:"opinion", asOf:"November 10, 2026",
  rank:8,
  q:"Do all six authors of the 'AI 2027' group's update say AI will likely outdo the best human AI researchers in 2027?",
  short:"All six said in November 2026 that such an AI will likely arrive in 2027, if AI is not deliberately slowed. Less than three months before, even the most bullish of them gave only a 50% chance of it before 2029.",
  detail:"Their update is on the blog of the AI Futures Project, which published the scenario 'AI 2027' in April 2025. They mean roughly the point where a company would rather rely on AI researchers alone than on the best human researchers without AI. They also put the odds that AI able to automate all white-collar work arrives before 2028 at 35% to 65%. The biggest single reason was an outside estimate, by METR, that Anthropic is improving its AI about twice as fast as before on clearly defined tasks. They note that Anthropic redacted most of the evidence METR found most informative, call their own account of why their model was wrong highly preliminary, and want AI development paused or slowed.",
  safety:"The group's dates have moved both ways. In December 2025 its new model put fully automated coding about three to five years later than its previous one.",
  src:[["AI Futures Project: Q3.5 timelines update, looks like the intelligence explosion will happen in 2027 after all","https://www.lesswrong.com/posts/f9PajMLmBYzmWzyDv/q3-5-timelines-update-looks-like-the-intelligence-explosion"],["Crypto Briefing: AI 2027 authors now expect a superhuman AI researcher in 2027","https://cryptobriefing.com/ai-superhuman-researcher-2027/"],["AI Futures Project: timelines and takeoff model, December 2025 update","https://www.lesswrong.com/posts/YABG5JmztGGPwNFq2/ai-futures-timelines-and-takeoff-model-dec-2025-update"],["METR: Assessment of AI R&D acceleration at Anthropic","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"]] },
{ id:"anthropic-resignation", cat:"Risk and rules", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"November 19, 2026",
  rank:9,
  q:"Did a researcher quit Anthropic, saying the people building AI believe it could kill us all this decade?",
  short:"Jacob Coxon did, in September 2026, after about three years of research on training AI at OpenAI and Anthropic. Coxon wrote that the people building AI 'earnestly believe' it could happen by the end of the decade, and that the two companies are 'gambling with our lives'.",
  detail:"Coxon had worked on pretraining, the stage in which a model absorbs vast amounts of data, for three years at OpenAI and then a few months at Anthropic, AFP reported. Fortune put the views of the post on X above 150 million within two days. Evan Hubinger, a safety lead at Anthropic, reposted Coxon's words, said they were correct, and put the odds of AI killing all humans within the next decade above 10%. Anthropic said it has always been open about AI's 'enormous benefits and unprecedented risks', that its safeguards are among the strongest in the industry, and that it wants a lawful, verifiable way for companies to pace the release of powerful models. A Fortune reporter called the post 'vague, with no proof'. In October Coxon told New York's city council that, on the current path, it is 'more likely than not' that humanity loses control of AI.",
  safety:"On Fox News the next day Coxon called the threat of an AI takeover 'minimal' right now and the problem 'eminently solvable', but said companies are racing too fast to solve it correctly.",

// Turns plain text into safe HTML, with the first occurrence of each glossary term made tappable.
function gloss(text) {
  const found = [];
  GLOSSARY.forEach((g, i) => { const m = g[1].exec(text); if (m) found.push({ start: m.index, end: m.index + m[0].length, i }); });
  found.sort((x, y) => x.start - y.start || y.end - x.end);
  let out = "", pos = 0;
  for (const f of found) {
    if (f.start < pos) continue;
    out += esc(text.slice(pos, f.start));
    out += `<span role="button" tabindex="0" class="term" data-term="${f.i}" aria-expanded="false" title="${esc(GLOSSARY[f.i][2])}">${esc(text.slice(f.start, f.end))}</span>`;
    pos = f.end;
  }
  return out + esc(text.slice(pos));
}
// Terms are spans so punctuation after them never wraps onto its own line. Enter and Space work like a tap.
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("term")) { e.preventDefault(); e.target.click(); }
});
// One definition open at a time, shown right under the paragraph, heading or list entry that contains the term.
document.addEventListener("click", e => {
  const btn = e.target.closest ? e.target.closest(".term") : null;
  if (!btn) return;
  const wasOpen = btn.getAttribute("aria-expanded") === "true";
  document.querySelectorAll(".defbox").forEach(d => d.remove());
  document.querySelectorAll('.term[aria-expanded="true"]').forEach(b => b.setAttribute("aria-expanded", "false"));
  if (wasOpen) return;
  const g = GLOSSARY[Number(btn.dataset.term)];
  const box = document.createElement("div");
  box.className = "defbox";
  box.setAttribute("role", "note");
  box.innerHTML = `<b>${esc(g[0])}:</b> ${esc(g[2])}`;
  (btn.closest("p, h1, h2, .others li > span") || btn).insertAdjacentElement("afterend", box);
  btn.setAttribute("aria-expanded", "true");
});
/* A small chart that goes with an answer, by question id: 100 people lined up by the number each one gave, to show how a long tail lifts

const LINEUPS = {
  // Read off Figure 1b of the AI Impacts paper, percentile by percentile. These 100 average 18.3, and the paper's 1,489 average 18.2.
  "researcher-odds": { who: "researchers", average: 18, middle: 10, tall: 25, runs: [[19, 0], [13, 1], [2, 2], [1, 3], [1, 4], [12, 5], [1, 7], [14, 10], [3, 15], [7, 20], [3, 25], [5, 30], [3, 40], [7, 50], [1, 60], [2, 70], [1, 75], [2, 80], [1, 90], [1, 95], [1, 100]] }
};
function lineupHtml(id) {
  const c = LINEUPS[id]; if (!c) return "";
  const all = c.runs.flatMap(([n, v]) => Array(n).fill(v)), bar = (v, i) => `M${(i + 0.1).toFixed(1)} 100v-${Math.max(v, 0.9)}h.8v${Math.max(v, 0.9)}z`;
  const path = ok => all.map((v, i) => ok(v, i) ? bar(v, i) : "").join(""), mid = i => i === 49 || i === 50;
  return `<figure class="lineup">
      <figcaption>Picture them as 100 people, lined up by the odds they gave</figcaption>
      <div class="lu" role="img" aria-label="A row of 100 bars that climbs slowly and then steeply. The first ${c.runs[0][0]} are at or near zero, the two in the middle are at ${c.middle}%, and the last ${all.filter(v => v >= 50).length} are at 50% or more. A line across marks the average, ${c.average}%.">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="lo" d="${path((v, i) => v < c.tall && !mid(i))}"/><path class="hi" d="${path(v => v >= c.tall)}"/><path class="mi" d="${path((v, i) => mid(i))}"/></svg>
        <i class="avg" style="bottom:${c.average}%"></i><span class="avg-t" style="bottom:${c.average}%">average: <b>${c.average}%</b></span>
        <i class="mid" style="bottom:${c.middle + 2}%"></i><span class="mid-t">person in the middle: <b>${c.middle}%</b></span>
        <span class="tail-t">the long tail</span>
      </div>
      <div class="lu-ends"><span>least worried, ${all[0]}%</span><span>most worried, ${all[99]}%</span></div>

}

  "unmask-author": { type: "pct", q: "Shown a comment by a very active Reddit user, how often could AI name the user?", hint: "In a 2026 study, with no web search. Very active means over 500 posts and comments in one forum in a year.", truth: 69, truthText: "69% of the time", full: [63, 75], half: [54, 84], wild: "high", check: ["69% of comments by very active Reddit users"], short: "That was Claude Fable 5.2. It also named the writer of 55% of about 15,000 unsigned research reviews that were never made public." },
  "prompt-injection": { type: "pct", q: "In a test, hidden orders were slipped into what AI models read. How often did the easiest one to fool obey?", hint: "Given ten tries each time. The hardest one to fool obeyed 7% of the time.", truth: 95, truthText: "95% of the time", full: [88, 100], half: [76, 100], wild: "high", check: ["ten tries", "7% to 95% of the time"], short: "That was in a 2026 study of one automated attack, against a model it had not practiced on." },
  "hackers-banned": { type: "pct", q: "In one hacking campaign, how much of the work does Anthropic say its AI did?", hint: "In 2025, against about thirty organizations. It says China's government backed the hackers.", truth: 85, fuzzy: true, range: [80, 90], truthText: "80 to 90%", full: [76, 94], half: [62, 100], wild: "high", check: ["80 to 90% of the work"], short: "Anthropic is highly confident the Chinese state backed the group, and says its coding tool did that much of the work. A few break-ins succeeded, and it banned the accounts." },
  "cyber-incidents": { type: "log", unit: "times", min: 1, max: 100, q: "Serious software flaws reported in July 2026 were how many times the old monthly record?", hint: "The old record was set before April 2026.", truth: 5, truthText: "About five times", full: [3.8, 6.6], half: [2.4, 10.5], wild: "high", check: ["about five times the monthly record", "around 2,500 serious flaws"], short: "In July, 21 notable software makers and projects disclosed around 2,500 serious flaws. Some of the rise is almost certainly because flaws have become easier to find, says Epoch AI, which tracks the counts." },
  "signal-proof": { type: "log", unit: "count", min: 100, max: 1e9, refs: [["A 300-page book", 10000], ["100 such books", 1e6]], q: "Google says its AI took four weeks to prove Signal's chat code keeps its security promises. How long is the proof?", hint: "In lines. It covers one-to-one chats, in the researchers' own build of the code.", truth: 6.3e6, truthText: "About 6.3 million lines", full: [3.5e6, 1.1e7], half: [1.5e6, 2.6e7], wild: "high", check: ["more than 6 million lines", "about 6.3 million", "four weeks", "one-to-one chats"], short: "Google DeepMind's AI agents wrote it, and a computer checked it. It covers the main security promises of one-to-one chats, not the whole app." },
  "novice-virology": { type: "pct", q: "In a 2026 study, what share of biology problems did beginners get right with AI's help?", hint: "Working at a computer, not in a lab. With only the internet they got about 5%.", truth: 17, truthText: "About 17%", full: [12, 22], half: [6, 32], wild: "high", check: ["about 17% right", "with only the internet about 5%"], skip: 1 },
  "phage": { type: "lin", min: 0, max: 300, unit: " of 300", q: "Scientists built about 300 viruses that AI had designed. How many of them worked?", hint: "They infect bacteria, not people.", truth: 16, truthText: "16", full: [5, 35], half: [1, 70], wild: "high", check: ["16 of them worked"] },
  "protein-design": { type: "lin", min: 0, max: 322, unit: " of 322", q: "In an OpenAI lab test, AI helped design 322 small proteins to stick to a target. How many stuck?", truth: 35, truthText: "35", full: [20, 55], half: [7, 95], wild: "high", check: ["35 of 322"], skip: 1 },
  "bio-filter-gap": { type: "lin", min: 0, max: 36, unit: " months", q: "By mistake, Anthropic's bioweapon filters were off for some 50,000 contractors. For how long?", hint: "The company disclosed it itself.", truth: 11, truthText: "About eleven months", full: [9, 13], half: [5, 17], wild: "high", check: ["about eleven months"] },
  "daily-work-use": { type: "pct", q: "What share of American employees use AI on the job every day?", truth: 16, truthText: "16%", full: [11, 21], half: [6, 30], wild: "high", check: ["16% of US employees", "53%"], short: "That is Gallup's count for August 2026. Occasional use is more common: 53% use AI at work at least a few times a year." },
  "young-workers": { type: "pct", q: "How far has employment of 22-to-25-year-olds fallen behind in the jobs AI could affect most?", hint: "US, by June 2026. Compared with people their age in jobs AI could affect less.", truth: 19, truthText: "About 19%", full: [14, 24], half: [7, 35], wild: "high", check: ["about 19% fewer"], short: "Stanford researchers found that in payroll records. Older workers in the same jobs showed no such gap." },
  "layoffs-ai": { type: "pct", q: "What share of US job cuts announced in 2026 did employers blame on AI?", hint: "Through October.", truth: 19.7, truthText: "19.7%", full: [15, 26], half: [7, 37], wild: "high", check: ["19.7% of the cuts"], short: "The count comes from Challenger, Gray & Christmas, a firm that tracks announced cuts. In October itself the share was under 3%." },
  "service-staff": { type: "pct", q: "In a 2026 survey, what share of customer-service leaders said they had cut staff because of AI?", truth: 21, truthText: "21%", full: [16, 26], half: [8, 37], wild: "high", check: ["21% of service leaders"], skip: 1 },
  "radiologists": { type: "lin", min: -50, max: 50, unit: "%", signed: true, q: "Over about ten years, how much has the number of radiologists in the US changed?", hint: "Counts differ. In 2016 an AI pioneer said to stop training new ones.", truth: 13, truthText: "Up 10 to 17%", full: [6, 21], half: [2, 32], wild: "low", check: ["grown by about 10%", "17% from 2014 to 2023"], fuzzy: true, range: [10, 17], short: "An economist told Fortune in 2026 that the number had grown by about 10% in ten years. The American College of Radiology's research institute counted a rise of 17% from 2014 to 2023." },
  "slowed-programmers": { type: "pct", q: "What percent more code changes did Microsoft engineers finish by using AI coding agents?", hint: "The company's own study, compared with what they would otherwise have finished.", truth: 24, truthText: "About 24% more", full: [18, 30], half: [8, 42], wild: "high", check: ["about 24% more code changes"], short: "That is an estimate, from a study of tens of thousands of Microsoft engineers in early 2026. Its authors, who work there, say code changes are only a rough stand-in for useful output." },
  "trading": { type: "lin", min: 0, max: 117, unit: " of 117", q: "AI got 117 tries at beating the S&P 500 in a live trading contest. How many times did it win?", hint: "With pretend money. Six of the 11 seasons allowed only crypto.", truth: 45, truthText: "45 of 117", full: [37, 53], half: [24, 68], wild: "high", check: ["45 of 117"], skip: 1 },
  "legal-agent": { type: "pct", q: "On a test of complex legal assignments, what share does the best AI get fully right?", hint: "By Vals AI's count in November 2026, on a test built by the legal-AI company Harvey.", truth: 27, truthText: "About 27%", full: [21, 33], half: [12, 42], wild: "high", check: ["about 27% as of November 2026"], short: "AI models get most of the individual requirements right and still miss something on most assignments." },
  "agent-orders": { type: "log", unit: "count", min: 1, max: 1e9, refs: [["All DoorDash orders in three months", 1e9]], q: "AI assistants can order DoorDash for you. How many orders had outside AIs placed by fall 2026?", truth: 400, fuzzy: true, range: [300, 900], truthText: "Maybe several hundred", full: [150, 1500], half: [30, 8000], wild: "high", check: ["maybe several hundred orders", "about a billion every three months"], short: "That was the estimate of DoorDash's chief executive. It leaves out DoorDash's own AI ordering tools." },
  "turing": { type: "pct", q: "In a study, judges chatted with a person and an AI. How often did they pick the AI as the human?", hint: "The chats lasted five minutes. The AI was GPT-4.5, told to play a certain kind of person.", truth: 73, truthText: "73% of the time", full: [67, 79], half: [58, 88], wild: "high", check: ["GPT-4.5 as the human 73% of the time"], short: "Judges in five-minute text chats picked GPT-4.5 as the human that often, more than they picked the real person." },
  "persuasion-fades": { type: "lin", min: 0, max: 30, step: 0.5, unit: " points", q: "In a study, AI chats moved people's political views 13 points out of 100. How big was the shift months later?", truth: 2, truthText: "About 2 points", full: [0.5, 4], half: [0.5, 8], wild: "high", check: ["about 13 points", "about 2 points"], skip: 1, refs: [["Right after", 13]] },
  "billion-users": { type: "log", unit: "count", min: 1e6, max: 8e9, refs: [["Everyone in the US", 340e6], ["Everyone on Earth", 8e9]], q: "How many weekly users does OpenAI say ChatGPT has?", truth: 1.2e9, truthText: "About 1.2 billion", full: [0.9e9, 1.6e9], half: [0.6e9, 2.4e9], wild: "high", check: ["about 1.2 billion weekly users", "400 million in February 2025"], short: "That is OpenAI's own count for the fall of 2026. In February 2025 it was 400 million." },
  "public-excited": { type: "pct", q: "What share of Americans are more excited than concerned about the growing use of AI in daily life?", truth: 9, truthText: "9%", full: [4, 14], half: [1, 23], check: ["9% were more excited"], short: "52% were more concerned than excited and 37% felt both equally, in a June 2026 Pew survey." },
  "ai-worldwide": { type: "pct", q: "On average across 32 countries, what share of people saw more pros than cons in AI products?", hint: "In a 2026 survey. Each country counts equally.", truth: 55, truthText: "55%", full: [51, 59], half: [39, 71], check: ["On average 55% did"] },
  "companionship": { type: "pct", q: "What share of US adults say they ever use AI for companionship?", truth: 4, truthText: "About 4%", full: [1, 8], half: [1, 16], wild: "high", check: ["About 4% say they do"] },
  "teens": { type: "pct", q: "What share of Americans aged 13 to 17 use AI such as ChatGPT in their free time?", hint: "At least now and then, in a spring 2026 survey.", truth: 77, truthText: "77%", full: [71, 83], half: [62, 92], wild: "high", check: ["77% of those aged 13 to 17"] },
  "pause-poll": { type: "pct", q: "In a September 2026 poll, what share of Americans wanted to pause work on advanced AI?", hint: "31% wanted to keep it going.", truth: 48, truthText: "48%", full: [42, 54], half: [32, 64], wild: "high", check: ["48% to 31%"], short: "Public First ran the poll for POLITICO." },
  "safety-grades": { type: "pick", q: "When an advocacy group graded nine big AI companies on safety, what was the top grade?", options: ["In the A range", "In the B range", "In the C range", "D or F"], answer: 2, near: [1, 3], wild: "high", truthText: "C+", check: ["The top grade was a C+", "nine companies"] },
  "exam-markers": { type: "pct", q: "AI-written answers were secretly slipped into university exams. What share went unnoticed?", truth: 94, truthText: "94%", full: [88, 100], half: [76, 100], wild: "high", check: ["94% went unnoticed"] },
  "face-test": { type: "pct", refs: [["Random guessing", 50]], q: "What share of AI-made faces did typical people spot as fake, in a 2025 study?", hint: "Guessing alone would spot about half of them.", truth: 31, truthText: "31%", full: [25, 37], half: [15, 47], wild: "low", check: ["spotted only 31% of them"] },
  "fake-video": { type: "pct", refs: [["Random guessing", 50]], q: "In a 2026 study, what share of AI-made videos of a person speaking did viewers spot as fake?", hint: "The clips were silent and five seconds long. Guessing alone would catch about half of the fakes.", truth: 52.6, truthText: "52.6%", full: [47, 59], half: [38, 68], wild: "low", check: ["52.6% of short, silent clips", "five seconds long"] },
  "face-arrests": { type: "log", unit: "count", min: 1, max: 10000, q: "How many wrongful arrests from mistaken face-recognition matches are known in the US?", hint: "By one policing expert's count, September 2026.", truth: 16, truthText: "At least 16", full: [11, 25], half: [6, 48], check: ["At least 16 such arrests"], floor: true },
  "waymo-safety": { type: "lin", q: "By Waymo's count, how many injury crashes do its driverless taxis have for every 100 by human drivers?", hint: "Over the same number of miles, in the same cities.", truth: 18, truthText: "About 18", full: [9, 29], half: [2, 46], check: ["82% fewer injury crashes"], min: 0, max: 200, refs: [["Same as people", 100]], short: "That is 82% fewer, Waymo says, over 270 million miles with nobody at the wheel." },
  "driverless": { type: "lin", min: 0, max: 60, unit: " areas", q: "In how many US metro areas does Waymo run driverless rides?", truth: 15, truthText: "15", full: [12, 18], half: [7, 26], wild: "high", check: ["15 US metro areas"], skip: 1 },
  "million-humanoids": { type: "log", unit: "count", min: 100, max: 100000000, q: "How many humanoid robots were shipped around the world in the first half of 2026?", truth: 22000, fuzzy: true, range: [19000, 25000], truthText: "19,000 to 25,000", full: [15000, 32000], half: [7000, 70000], wild: "high", check: ["close to 25,000 in the first half of 2026", "about 19,100 and over 22,000"], short: "That is the range of three market research firms' counts. It is already more than the nearly 18,000 that one of them, IDC, counted for all of 2025." },
  "sprint": { type: "lin", min: 5, max: 25, step: 0.1, unit: " seconds", q: "How fast did a humanoid robot win the 100 meters at the August 2026 robot games in Beijing?", hint: "Usain Bolt's world record is 9.58 seconds.", truth: 8.64, truthText: "8.64 seconds", full: [8.1, 9.2], half: [7, 10.4], wild: "low", check: ["8.64 seconds", "9.58"], skip: 1 },
  "table-tennis": { type: "lin", min: 0, max: 5, unit: " of 5", q: "A table tennis robot played five matches against elite players. How many did it win?", truth: 3, truthText: "3 of 5", full: [3, 3], half: [2, 4], wild: "high", check: ["won three of its five matches"] },
  "hot-100": { type: "lin", min: 1, max: 100, prefix: "Number ", q: "How close to number 1 has an AI-made track come on the Billboard Hot 100?", hint: "Counting a track whose artist admits using AI but disputes how much.", truth: 58, truthText: "Number 58", full: [52, 66], half: [40, 76], wild: "low", check: ["is number 58"], skip: 1 },
  "half-the-web": { type: "pct", q: "What share of English web pages dated since ChatGPT's launch show signs of AI writing?", hint: "By Pew Research Center's count of pages that carry a date. AI editing counts too.", truth: 35, truthText: "35%", full: [29, 41], half: [20, 50], wild: "high", check: ["35% of English-language pages", "49.9% of new ones"], short: "That is the Pew Research Center's count of pages dated after ChatGPT appeared. A marketing firm counted 49.9% of new articles as mainly AI-written." },
  "author-style": { type: "pct", q: "In a study, AI and trained writers imitated famous authors. How often did judges say AI came closer?", hint: "The AI had first been trained on each author's complete works.", truth: 81, truthText: "81% of the time", full: [74, 88], half: [62, 100], wild: "high", check: ["81% of matchups"], short: "Panels of writers from top US writing programs were not told which were which. They judged the AI's versions closer to the author's style in 81% of matchups, and better written in 62%." },
  "authors-settlement": { type: "log", unit: "usd", min: 1e6, max: 1e11, refs: [], q: "How much did Anthropic agree to pay over pirated books?", hint: "It came to about $3,000 a book.", truth: 1.5e9, truthText: "$1.5 billion", full: [1.1e9, 2.1e9], half: [0.6e9, 4e9], check: ["pay $1.5 billion"], skip: 0 },
  "synthid": { type: "log", unit: "count", min: 1e6, max: 1e13, q: "How many AI-made images and videos has Google marked with its invisible watermark?", refs: [["Everyone on Earth", 8e9]], hint: "By Google's count.", truth: 180e9, floor: true, truthText: "180 billion and counting", full: [110e9, 300e9], half: [45e9, 720e9], wild: "low", check: ["more than 180 billion"] },
  "brain-to-text": { type: "pct", q: "From brain scans alone, what share of the words a person types can AI get right?", hint: "A scanner outside the skull, no implant. Nine volunteers, in a 2026 study from Meta.", truth: 61, truthText: "61%", full: [55, 67], half: [45, 77], wild: "high", check: ["About 6 words in 10", "about ten hours"], short: "A 2026 system from Meta got that many right on average, using a machine that fills a room. No surgery is needed, but it took about ten hours of recordings from each person." },
  "training-text": { type: "log", unit: "years", min: 1, max: 1e6, refs: [["A long life", 80], ["Since the pyramids", 4500]], q: "How long would it take to read everything one Google AI was trained on?", hint: "One person reading day and night, counting all of it as text.", truth: 85000, truthText: "Roughly 85,000 years", full: [42000, 170000], half: [17000, 430000], wild: "high", check: ["roughly 85,000 years", "day and night"], short: "That is about a thousand lifetimes. The AI is Gemma 3, one of Google's smaller models, trained on a mix of text and images and counted here as text." },
  "home-computer": { type: "lin", min: 0, max: 60, unit: " months", q: "In 2025, how far behind the world's best was AI that runs on one gaming computer?", hint: "On standard tests. The graphics card cost under $2,500.", truth: 9, fuzzy: true, range: [6, 12], truthText: "6 to 12 months", full: [5, 13], half: [2, 22], wild: "low", check: ["6 to 12 months earlier"], skip: 1 },
  "labs-vs-exxon": { type: "log", unit: "usd", min: 1e10, max: 1e13, refs: [["McDonald's", 198e9], ["Exxon Mobil", 648e9], ["Apple", 5.1e12]], q: "How much was OpenAI reportedly worth in its latest round of funding?", truth: 1.25e12, truthText: "$1.25 trillion", full: [0.95e12, 1.65e12], half: [0.6e12, 2.6e12], wild: "high", check: ["OpenAI was reportedly valued at $1.25 trillion", "about $650 billion", "loses billions of dollars a year"], short: "That report came in November 2026. It is almost twice what Exxon Mobil is worth." },
  "compute-spend": { type: "log", unit: "usd", min: 1e9, max: 1e13, refs: [["Apollo moon program", 309e9]], q: "How much has Anthropic, the maker of Claude, committed to spend, nearly all on computing?", hint: "Nearly all of it is to be spent by 2045.", truth: 901e9, truthText: "About $901 billion", full: [650e9, 1.25e12], half: [400e9, 2e12], wild: "high", check: ["about $901 billion", "$186 billion", "about $309 billion in 2025 dollars"], short: "About half of it is expected before the end of 2030. Some $186 billion can still be ended, or depends on conditions. Apollo's cost is given in 2025 dollars." },
  "revenue-growth": { type: "log", unit: "usd", min: 1, max: 1000, refs: [], q: "For every $1 Anthropic took in from January to September 2025, how much did it take in a year later?", hint: "$1 would mean no growth.", truth: 13, truthText: "$13", full: [9.5, 18], half: [6, 28], wild: "high", check: ["13 times those of the same months a year before", "took in $33.24 billion, against $2.55 billion"], short: "Its sales in those months went from $2.55 billion in 2025 to $33.24 billion in 2026. Like OpenAI, it spends heavily to grow and lost money on operations that summer." },
  "china-compute": { type: "pct", q: "Of all the AI computing power added since 2022, what share went to the United States?", hint: "Through mid-2026, by one estimate. About 10% went to China.", truth: 72, truthText: "72%", full: [65, 79], half: [55, 89], wild: "low", check: ["72% went to the United States", "about 10% to China"], short: "The estimate comes from the research group Epoch AI. It runs to mid-2026 and counts the chips China makes itself." },
  "electricity": { type: "pct", q: "What share of the world's electricity do data centers use?", truth: 1.7, truthText: "About 1.7%", full: [1, 4], half: [1, 10], wild: "high", check: ["about 1.7%", "double by 2030", "4.7% of the electricity in 2024"], short: "That is the International Energy Agency's figure from November 2026, and it expects their use to double by 2030. It covers every data center, not only the ones running AI. In the United States it was 4.7% in 2024." },
  "water-burger": { type: "log", unit: "gallons", min: 1 / 768, max: 1e6, refs: [["A glass", 1 / 16], ["A milk jug", 1], ["A bathtub", 40], ["A backyard pool", 20000], ["An Olympic pool", 660000]], q: "Ask an AI one question a day for a year. About how much water does that use?", truth: 0.4, fuzzy: true, range: [1 / 32, 5], truthText: "Half a cup to 5 gallons", full: [1 / 64, 10], half: [1 / 256, 55], wild: "high", check: ["half a cup and 5 gallons", "about 16 gallons"], short: "Most estimates fall in that range. The high end also counts the water used to make the electricity. The beef in one quarter-pound burger takes about 16 gallons from rivers and wells." },
  "price-of-thought": { type: "log", unit: "cents", min: 0.001, max: 10000, refs: [["A penny", 1, 1], ["In 2025", 30]], q: "On one science exam, AI cost about 30 cents a question in 2025. What did the same score cost by mid-2026?", hint: "Per question, on average.", truth: 0.04, truthText: "Four hundredths of a cent", full: [0.02, 0.08], half: [0.006, 0.26], wild: "low", check: ["about 30 cents a question in 2025", "four hundredths of a penny within a year and a half", "13-fold a year", "5-fold to 10-fold a year"], short: "The price on this exam fell faster than usual. By Epoch AI's estimate, the price of a given level of performance has been falling about 13-fold a year since 2023." },
  "one-chipmaker": { type: "pct", q: "Of all the money companies pay others to make their chips, what share goes to the biggest maker?", hint: "In spring 2026. It is TSMC, mostly in Taiwan. Nvidia and Google rely on it.", truth: 72.5, truthText: "72.5%", full: [66, 79], half: [56, 89], wild: "high", check: ["TSMC", "rely on TSMC to manufacture them"], short: "It goes to TSMC, mostly in Taiwan, by the research firm TrendForce's count. TSMC makes more than 90% of the most advanced chips, Time reported. Nvidia, Google, Amazon and AMD design AI chips, but rely on TSMC to make them." },
  "power-bills": { type: "log", unit: "usd", min: 1e7, max: 1e12, refs: [["$100 a person", 6.7e9], ["$1,000 a person", 67e9]], q: "How much have data centers added to future power costs on a grid serving 67 million Americans?", hint: "By the grid watchdog's count.", truth: 29.4e9, truthText: "$29.4 billion", full: [20e9, 43e9], half: [10e9, 86e9], wild: "high", check: ["added $29.4 billion", "67 million people"], short: "Existing and planned data centers have added that much to what the grid's customers pay for future supply, its independent watchdog said in November 2026. The grid serves 67 million people in all or part of 13 states." },
  "planets": { type: "log", unit: "count", min: 1, max: 100000, q: "How many planets around other stars did AI confirm in one 2026 study of 2.2 million stars?", truth: 118, truthText: "118", full: [80, 175], half: [38, 300], wild: "high", check: ["confirmed 118 planets"] },
  "china-approval": { type: "log", unit: "days", min: 1 / 24, max: 1095, refs: [["A day", 1, 1], ["A week", 7, 1], ["A month", 30, 1], ["A year", 365, 1]], q: "How long did China's national review of a new AI service typically take?", hint: "In 2026, by one researcher's count.", truth: 53, truthText: "53 days", full: [35, 80], half: [18, 160], check: ["typical 53 days"] },
  "eu-recall": { type: "pct", q: "If a company as big as Google won't pull a powerful AI when the EU asks, how much can it be fined?", hint: "The most, as a share of a year's worldwide sales.", truth: 3, truthText: "3%", full: [2, 5], half: [1, 10], check: ["3% of a year's worldwide sales", "15 million euros if that is more"], short: "That is the top fine, or 15 million euros if that is more. Since August 2026 the EU's AI Office can ask the maker of a general-purpose AI model to restrict, withdraw or recall it." },
  "state-safety-law": { type: "log", unit: "usd", min: 1000, max: 1e11, refs: [["A new car", 51000], ["A Super Bowl ad", 8e6], ["An aircraft carrier", 13e9]], q: "What is the top fine, per violation, under California's AI safety law?", hint: "For makers of the most powerful AI with over $500 million in yearly revenue.", truth: 1e6, truthText: "$1 million", full: [5e5, 2e6], half: [1.6e5, 6e6], check: ["$1 million per violation", "black out trade secrets"], short: "Since January 2026 the law has made the biggest AI companies publish their plans to prevent a catastrophe. They may black out trade secrets and security details." },
  "cheats-when-hard": { type: "pct", q: "On a coding test, in what share of attempts did an Anthropic AI try to cheat?", hint: "Counted by METR in one setup. The AI could not see the checks its code had to pass.", truth: 80, truthText: "About 80%", full: [73, 87], half: [62, 98], wild: "high", check: ["about 80% of attempts", "METR, a nonprofit that tests AI, reported in May 2026"], short: "METR, a nonprofit that tests AI, reported this in May 2026. The AI was Claude Opus 4.6, and the test was an early version." },

/* ---------- Small utilities ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// No inherited keys, so an id such as "constructor" coming from a link or from storage can never match.
const BY_ID = Object.assign(Object.create(null), Object.fromEntries(QUESTIONS.map(q => [q.id, q])));
// Which way a question's true answer points. "wild" means the truth is the wilder of the two answers: AI can do
// more, acts more on its own, spreads faster or has fewer limits on it. "tame" means it is the other one.
function leanOf(q) {
  if (q.worse !== "yes" && q.worse !== "no") return "neutral";
  return (q.worse === "yes") === !!q.a ? "wild" : "tame";
}
// good is a full point, meh half a point for a near miss, and bad none.
function markOf(r) { return r.grade === 1 ? "good" : r.grade === 0 ? "bad" : "meh"; }
function reducedMotion() { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }
function minutes(n) { const m = Math.max(1, Math.round(n / 2)); return m + (m === 1 ? " minute" : " minutes"); }
// Scores hold halves.
function pts(n) { return Number.isInteger(n) ? String(n) : (n > 1 ? Math.floor(n) : "") + "½"; }
function theirPoints(ch) { return ch.theirs.reduce((sum, x) => sum + x / 2, 0); }
// A photo question skipped in a friend's round by someone who can't see the photos counts for neither player (see skipPhotos).
const skippedOf = ch => ch && ch.skipped ? ch.skipped.length : 0;
function skipNote(ch) {
  const n = skippedOf(ch);
  return !n ? "" : `You skipped ${n === 1 ? "the photo question, so it doesn't" : n + " photo questions, so they don't"} count${ch.theirs ? " for either of you" : ""}.`;
}
function roundPoints(r) { return r.ps.reduce((sum, g, i) => sum + Guess.grade(r.list[i], g), 0); }
function seenCount() { return store.seen.filter(id => BY_ID[id]).length; }

/* GUESS_FACES: which of four photos was made by AI. ai is the file made by AI and real the three photographs, all the same size

const GUESS_FACES = [
