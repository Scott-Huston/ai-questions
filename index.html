<script>
/* ---------- Configuration ----------
   Set siteUrl to the public address once deployed, e.g. "https://example.org/quiz".
   It is added to shared results. Left empty, the page uses its own address. */
const CONFIG = { siteUrl: "", checked: "November 22, 2026" };

/* ---------- Questions ----------
   a: true means the answer is yes. Every question is worded so the answer is a plain yes or no. */
const QUESTIONS = [
{ id:"unit-distance", cat:"Math", a:true, asOf:"May 2026",
  q:"Has AI solved a math problem that human mathematicians had failed to crack for about 80 years?",
  short:"In May 2026 an OpenAI model disproved a conjecture Paul Erdős posed in 1946.",
  detail:"The unit distance problem asks how many pairs of points in a plane can sit exactly one unit apart. Mathematicians long believed grid-like arrangements were close to the best possible. The model found an infinite family of better ones, and a group of outside mathematicians checked the proof.",
  src:[["OpenAI: An OpenAI model has disproved a central conjecture in discrete geometry","https://openai.com/index/model-disproves-discrete-geometry-conjecture/"],["Scientific American: OpenAI announces AI's biggest math breakthrough yet","https://scientificamerican.com/article/ai-just-solved-an-80-year-old-erdos-problem-and-mathematicians-are-amazed"]] },
{ id:"riemann", cat:"Math", a:true, asOf:"November 22, 2026",
  q:"Has AI produced a computer-verified proof of the Riemann Hypothesis?",
  short:"On November 20, 2026, an Anthropic mathematician working with Claude released a proof written in the Lean proof language.",
  detail:"Independent mathematicians compiled the code without errors, and the Lean and Mathlib communities issued a statement certifying both the statement and the proof. There is no human-readable paper yet, so mathematicians are still working out how the argument fits together. The Clay Mathematics Institute has not ruled on it.",
  src:[["Scientific American: The AI Riemann hypothesis proof is true, independent mathematicians confirm","https://www.scientificamerican.com/article/the-ai-riemann-hypothesis-proof-is-almost-certainly-true-independent-mathematicians-attest/"],["TechCrunch: AI claimed a solution to the 167-year-old Riemann hypothesis","https://techcrunch.com/2026/11/20/ai-claimed-a-solution-to-the-167-year-old-riemann-hypothesis-and-a-human-did-too/"]] },
{ id:"clay-prize", cat:"Math", a:false, asOf:"November 2026",
  q:"Has the Clay Mathematics Institute awarded one of its $1 million Millennium Prizes for an AI-generated proof?",
  short:"AI systems claimed two of the seven problems in 2026, but no prize has been awarded.",
  detail:"OpenAI published a claimed Navier–Stokes solution in September 2026, and the Riemann proof followed in November. Clay considers a solution only after at least two years in print, and the Poincaré conjecture is still the only problem it lists as solved. OpenAI's Navier–Stokes proof also still awaits independent validation.",
  src:[["Wikipedia: Millennium Prize Problems","https://en.wikipedia.org/wiki/Millennium_Prize_Problems"],["CNBC: OpenAI claims to have solved the 90-year-old Navier–Stokes math problem in 88 hours","https://www.cnbc.com/2026/09/09/openai-navier-stokes-math-problem-solved.html"]] },
{ id:"imo", cat:"Math", a:true, asOf:"July 2026",
  q:"Has AI earned a perfect score at the International Mathematical Olympiad?",
  short:"At the 2026 Olympiad, official graders gave an AI model full marks on all six problems: 42 out of 42.",
  detail:"Only 7 of the 666 human contestants did the same. The model, from the Chinese company RedNote, received the problems after the human contest ended. A year earlier the best AI systems scored 35.",
  src:[["South China Morning Post: World's first AI model to earn perfect score at maths Olympiad","https://www.scmp.com/tech/article/3361482/worlds-first-ai-model-earn-perfect-score-maths-olympiad-comes-chinas-rednote"],["RedNote: dots model earns an officially certified perfect score at IMO 2026","https://studio-dots-ai.github.io/dots_imo_2026/en.html"]] },
{ id:"er-diagnosis", cat:"Medicine", a:true, asOf:"April 2026",
  q:"Has AI out-diagnosed experienced doctors on real emergency room cases?",
  short:"In a study published in Science, OpenAI's o1 model got the diagnosis right or very close in 67% of triage cases. Two attending physicians scored 55% and 50%.",
  detail:"The test used 76 real emergency department cases from a Boston hospital, and the model saw only the text in the medical record. Doctors also rely on what they see and hear in the room, and the study's authors say the result does not support replacing them.",
  src:[["Science: AI is starting to beat doctors at making correct diagnoses","https://www.science.org/content/article/ai-starting-beat-doctors-making-correct-diagnoses"],["TechCrunch: In Harvard study, AI offered more accurate emergency room diagnoses than two human doctors","https://techcrunch.com/2026/05/03/in-harvard-study-ai-offered-more-accurate-diagnoses-than-emergency-room-doctors/"]] },
{ id:"fda-drug", cat:"Medicine", a:false, asOf:"October 2026",
  q:"Has the FDA approved a drug designed by AI?",
  short:"As of October 2026, no AI-designed drug had full FDA approval.",
  detail:"About 175 AI-originated drug programs have entered human trials since 2019. Forecasts of the first approval have slipped for three years running. The FDA does not label drugs by whether AI was used, so trackers draw the line in slightly different places.",
  src:[["IntuitionLabs: AI drug discovery FDA approvals, the 2026 reality check","https://intuitionlabs.ai/articles/ai-drug-discovery-fda-approvals"],["Clinical Trial Vanguard: AI drug discovery has $8.9 billion in hype and zero FDA approvals","https://www.clinicaltrialvanguard.com/opinion/ai-drug-discovery-has-8-9-billion-in-hype-and-zero-fda-approvals-when-does-the-bill-come-due/"]] },
{ id:"robot-surgery", cat:"Medicine", a:false, asOf:"August 2026",
  q:"Has a robot operated on a human patient without a surgeon controlling it?",
  short:"Autonomous surgery has only been demonstrated in the lab and on animal tissue.",
  detail:"A robot trained on surgery videos has completed a phase of gallbladder removal on pig organs unaided. The humanoid robot surgeries reported in July 2026 were on a live pig and were fully controlled by human surgeons.",
  src:[["Next in Surgery: Autonomous surgery's 2026 landscape","https://www.nextinsurgery.com/article/autonomous-surgery-the-2026-landscape"],["Forbes: Humanoid robots just performed live surgery for the first time ever","https://www.forbes.com/sites/johnkoetsier/2026/07/10/humanoid-robots-just-performed-live-surgery-for-the-first-time-ever/"]] },
{ id:"forecasting", cat:"Forecasting", a:true, asOf:"September 2026",
  q:"Has an AI won a major forecasting tournament against human forecasters?",
  short:"An AI called Laertes won the Summer 2026 Metaculus Cup. Another bot came second and a third came fifth.",
  detail:"885 forecasters predicted 58 real-world questions, from oil prices to data-center rules. The developer says he built the bot in under 150 hours for a couple of thousand dollars. In a separate matched-question test earlier in 2026, the best human forecasters were still slightly more accurate.",
  src:[["Metaculus announcement","https://x.com/metaculus/status/2100642327526052022"],["Exobrain: AI wins at forecasting","https://www.exobrain.co.uk/insights/ai-wins-at-forecasting"],["Forecasting Research Institute: AI models have likely reached parity with superforecasters","https://forecastingresearch.substack.com/p/ai-models-have-likely-reached-parity"]] },
{ id:"hurricanes", cat:"Forecasting", a:true, asOf:"October 2026",
  q:"Does AI predict hurricane paths more accurately than official forecasts?",
  short:"Through mid-2026, Google DeepMind's model had the most accurate hurricane track predictions, ahead of the National Hurricane Center's official forecasts.",
  detail:"It was the second season running. In October 2026 it correctly called a Florida Panhandle landfall when conventional models pointed toward Louisiana. Forecasters note that many other AI weather models are unproven.",
  src:[["Michael Lowry: The AI hurricane model that continues to blow away the competition","https://michaelrlowry.substack.com/p/the-ai-model-that-continues-to-blow"],["WUSF: How AI is transforming hurricane forecasts","https://www.wusf.org/2026-10-26/how-ai-is-transforming-hurricane-forecasts"]] },
{ id:"arc-agi-3", cat:"Reasoning", a:true, asOf:"November 20, 2026",
  q:"Can AI now solve most of the ARC-AGI-3 puzzle games, which were designed to be easy for people and hard for AI?",
  short:"When the benchmark launched in March 2026, every leading model scored under 1% and people solved everything. By November 20 the top standard score was 81.2%.",
  detail:"ARC-AGI-3 drops the player into small interactive games with no instructions. Claude Fable 5.2 leads the standard leaderboard, and GPT-6.2 Astra reaches 100% with a provider-specific setup. These figures come from third-party mirrors of the official leaderboard.",
  src:[["ARC Prize: ARC-AGI-3 paper (March 2026)","https://www.alphaxiv.org/abs/2603.24621"],["BenchLM: ARC-AGI-3 leaderboard snapshot, November 2026","https://benchlm.ai/benchmarks/arcagi3"],["ARC Prize leaderboard","https://arcprize.org/leaderboard"]] },
{ id:"persuasion", cat:"Persuasion", a:true, asOf:"June 2026",
  q:"Is AI more persuasive than world-champion debaters in text conversations?",
  short:"A 2026 study of 18,978 conversations found AI out-persuaded laypeople, professional canvassers and world championship debaters.",
  detail:"Experts lost even when they chose the topic, practiced for hours and had £1,000 bonuses on the line. The AI's edge came mostly from delivering more information faster: held to human speed and message length, the experts tied it. In a real-money test, AI raised more than three times what professional fundraisers did. The paper is a preprint and covers text only.",
  src:[["Hackenburg et al.: AI out-persuades expert humans in text-based dialogue","https://arxiv.org/abs/2606.16475"]] },
{ id:"turing", cat:"Persuasion", a:true, asOf:"May 2026",
  q:"Has AI passed the Turing test, the classic test of whether a machine can pass for human in conversation?",
  short:"In five-minute text chats, judges picked GPT-4.5 as the human 73% of the time, more often than they picked the real person.",
  detail:"The study ran the three-party version Turing described: a judge talks to a human and an AI at once and picks the human. The model was told to play a specific persona. Published in PNAS in May 2026.",
  src:[["TechXplore: AI can seem more human than real humans in a classic Turing test","https://techxplore.com/news/2026-05-ai-human-real-humans-classic.html"],["UC San Diego news release","https://www.eurekalert.org/news-releases/1128875"]] },
{ id:"hot-100", cat:"Media", a:false, asOf:"November 2026",
  q:"Has an AI-generated song reached number 1 on the Billboard Hot 100?",
  short:"The highest Hot 100 position tied to an AI-made track so far is number 58.",
  detail:"That track, \"Rubberz\", charted in 2026 and was flagged as AI-generated by a detection tool. An AI act has topped a smaller Billboard chart: \"Walk My Walk\" by Breaking Rust led Country Digital Song Sales in November 2025.",
  src:[["BeatIntel: The biggest AI-generated songs, ranked","https://www.beatintel.io/lists/biggest-ai-songs"],["ABC News: The AI-generated country song topping Billboard's Country Digital Song Sales chart","https://abcnews.com/culture/story/ai-generated-country-song-topping-billboards-country-digital-127445549"]] },
{ id:"fake-video", cat:"Media", a:true, asOf:"September 2026",
  q:"Can AI make fake videos that people can't tell from real footage?",
  short:"Shown clips from the newest AI video generators, people identified the fakes 52.6% of the time. Guessing gets 50%.",
  detail:"The September 2026 DF26 study found people did much better on older deepfakes, around 70 to 75%. The same people recognized real videos at similar rates across all the sets.",
  src:[["DF26: We Cannot Tell Fake From Real Anymore","https://arxiv.org/html/2609.07369v1"],["Truescreen: Deepfake detection accuracy falls by up to 49% in a year","https://truescreen.io/articles/deepfake-detection-accuracy-falls-49-percent/"]] },
{ id:"text-detectors", cat:"Media", a:true, asOf:"November 2026",
  q:"Can the best detection tools reliably tell unedited AI-written text from human writing?",
  short:"In independent tests, the detector Pangram caught almost all unedited AI text while almost never flagging human writing.",
  detail:"In one 2026 test it correctly labelled all 495 human-written passages and all 297 AI passages. Another found 1 false alarm in 5,000 human-written abstracts. The catch is the word unedited. Text polished by AI is often flagged as if AI wrote it, and in one study a humanizer tool got more than 96% of AI rewrites past an older Pangram version. The company says its newer version catches most humanized text.",
  src:[["Wikipedia: Pangram (AI detector)","https://en.wikipedia.org/wiki/Pangram_(AI_detector)"],["Why AI Detection Fails for Academic Integrity","https://arxiv.org/html/2608.11256v2"],["Large Language Model Turnover Undermines Screening for AI-Assisted Scientific Writing","https://arxiv.org/pdf/2610.11599"],["Pangram 4 Technical Report","https://arxiv.org/html/2607.27183v1"]] },
{ id:"video-detectors", cat:"Media", a:false, asOf:"September 2026",
  q:"Can AI detection tools reliably catch AI-generated video?",
  short:"On the newest AI video, nine leading detectors scored between 44 and 70 on a scale where 50 is a coin flip.",
  detail:"The same detectors scored 76 to 94 on an older benchmark. Detectors learn the fingerprints of particular generators and fall behind when new ones appear.",
  src:[["DF26: We Cannot Tell Fake From Real Anymore","https://arxiv.org/html/2609.07369v1"],["Unite.AI: Deepfake detection accuracy falls 49% in a year of AI video progress","https://www.unite.ai/deepfake-detection-accuracy-falls-49-in-a-year-of-ai-video-progress/"]] },
{ id:"zero-days", cat:"Security", a:true, asOf:"October 2026",
  q:"Has AI found thousands of serious security flaws in widely used software that human reviewers had missed?",
  short:"Anthropic reports that partners using its Claude Mythos model found at least 129,000 verified vulnerabilities between April and July 2026, more than 33,000 of them critical or high severity.",
  detail:"Some of the flaws had survived decades of human review. Fixing them is the bottleneck: by October 2, maintainers had patched 516 of the 6,157 flaws disclosed to open-source projects, and an outside analyst counts only a few hundred public vulnerability records credited to the project.",
  src:[["Anthropic: Project Glasswing","https://www.anthropic.com/glasswing"],["Software Improvement Group: Mythos and Project Glasswing explained (October 2026 update)","https://www.softwareimprovementgroup.com/blog/mythos-project-glasswing-security/"],["Infosecurity Magazine: Glasswing finds many security flaws yet delivers few fixes","https://www.infosecurity-magazine.com/news/anthropic-glasswing/"]] },
{ id:"escape-hack", cat:"Security", a:true, asOf:"July 2026",
  q:"Has an AI broken out of a test environment and hacked a real company on its own?",
  short:"In July 2026, OpenAI disclosed that its models escaped a testing setup and broke into Hugging Face's systems with no human directing the steps.",
  detail:"OpenAI called it the first known autonomous AI cyberattack. It happened during a security evaluation in which the models' safety refusals had been deliberately reduced. Hugging Face said the intrusion was driven end to end by an AI agent system.",
  src:[["ABC News: OpenAI says its AI models escaped testing environment, launched their own hack of other company","https://abcnews.com/Technology/openai-ai-models-escaped-testing-environment-launched-hack/story?id=134981298"],["Cyber Security News: First-ever fully autonomous AI cyberattack","https://cybersecuritynews.com/first-ever-ai-agent-cyberattack/"]] },
{ id:"prompt-injection", cat:"Security", a:false, asOf:"November 2026",
  q:"Can AI agents reliably resist hidden instructions planted to hijack them?",
  short:"A 2026 automated attack hijacked one leading model 93.8% of the time within ten attempts.",
  detail:"The attack, called prompt injection, hides instructions in a web page or email that the AI reads. Defenses are improving: some recent models fall for under 1% of the human-written attacks from one public competition. Automated attackers that adapt still get through.",
  src:[["Climbing the Hill: prompt injection red-teaming against frontier models","https://arxiv.org/html/2609.33628v2"],["Scaling adaptive prompt injection attacks with agent swarms","https://arxiv.org/pdf/2611.11861"]] },
{ id:"self-replication-lab", cat:"Autonomy", a:true, asOf:"May 2026",
  q:"In lab tests, has an AI hacked into a computer and installed a working copy of itself there?",
  short:"In a May 2026 Palisade Research study, models exploited a vulnerable web app, stole credentials and launched a copy of themselves on the machine.",
  detail:"One freely downloadable model succeeded in 33% of attempts, and a successful copy could repeat the process against a new target. One run hopped across servers in four countries in under three hours. The targets were deliberately vulnerable test systems.",
  src:[["Palisade Research: Language Models Can Autonomously Hack and Self-Replicate","https://arxiv.org/abs/2605.06760"],["Startup Fortune: AI self replication has moved from theory to security test","https://startupfortune.com/ai-self-replication-has-moved-from-theory-to-security-test/"]] },
{ id:"self-replication-wild", cat:"Autonomy", a:false, asOf:"November 2026",
  q:"Has a self-replicating AI been found spreading on its own across the real internet?",
  short:"As of November 2026, AI self-replication has only been shown in controlled experiments.",
  detail:"Anthropic's October 2026 study warned that small models may be months away from copying themselves across cheap smart devices, but said it did not yet have a full rogue replicator. No AI worm of this kind has been reported in the wild.",
  src:[["CellCog: Anthropic says small AI models could self-replicate on IoT devices","https://cellcog.ai/blog/anthropic-self-replicating-ai/"],["Ask This Guy: AI self-replication, Anthropic's study on AI worms","https://www.askthisguy.com/en/blog/ai-self-replication/"]] },
{ id:"virology", cat:"Biology", a:true, asOf:"September 2026",
  q:"Does AI outperform expert virologists at troubleshooting virus lab work?",
  short:"On the Virology Capabilities Test, AI models passed the median expert in 2024 and the best human virologist tested in 2026.",
  detail:"The test has 322 questions on practical lab problems. Virologists answering in their own specialties average about 22%. In 2025 OpenAI's o3 scored 43.8%, beating 94% of them. The skill cuts both ways: it helps legitimate research and could help misuse.",
  src:[["Virology Capabilities Test paper","https://arxiv.org/abs/2504.16137"],["SecureBio: Evaluating superhuman biological capabilities","https://securebio.substack.com/p/evaluating-superhuman-biological-capabilities"]] },
{ id:"phage", cat:"Biology", a:true, asOf:"August 2026",
  q:"Has AI designed the complete genome of a working virus?",
  short:"Stanford and Arc Institute researchers built about 300 AI-written virus genomes, and 16 of them worked.",
  detail:"The viruses are bacteriophages, which infect bacteria and cannot affect humans. Some were different enough from known phages to count as new species. Published in Science in August 2026. The lead researcher says going further would still take a very skilled team.",
  src:[["CNN: AI creates 16 new viruses from scratch","https://www.cnn.com/2026/08/06/health/ai-viruses-bacteriophages"],["Science News: AI generated its first working genome","https://www.sciencenews.org/article/ai-genome-bacteria-phage"]] },
{ id:"day-long-tasks", cat:"Work", a:true, asOf:"November 20, 2026",
  q:"Can AI complete software tasks that take a human expert a full working day?",
  short:"METR's November 2026 report estimates that leading models succeed about half the time on tasks that take a human expert up to 27 hours.",
  detail:"That figure is for tasks whose results can be checked automatically. METR finds this task length doubling roughly every 3.6 months. On tasks that need judgment without fast feedback, models still do worse than human experts.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"]] },
{ id:"freelance", cat:"Work", a:false, asOf:"November 2026",
  q:"Can AI complete most real freelance projects to a standard a paying client would accept?",
  short:"The best AI agent completes about 41% of projects on the Remote Labor Index.",
  detail:"The benchmark uses real paid freelance jobs in design, video, architecture, data analysis and more. The top score was 2.5% in October 2025 and 41.25% after Claude Fable 5.2's release in November 2026, doubling about every 3.3 months. At that pace this answer may not stay a no for long.",
  src:[["Remote Labor Index","https://www.remotelabor.ai/"],["Center for AI Safety: A significant increase in digital labor automation","https://safe.ai/blog/significant-increase-in-digital-labor-automation"],["Remote Labor Index paper","https://arxiv.org/abs/2510.26787"]] },
{ id:"shop", cat:"Work", a:true, asOf:"June 2026",
  q:"Has an AI run a real shop at a profit?",
  short:"Anthropic's AI-run office shop became profitable in its second phase.",
  detail:"In the first phase the AI sold items below cost and gave things away. Profit came after it got better tools and a second AI agent acting as its boss. It is a small shop inside Anthropic's offices, and in larger simulated businesses AI agents still trail human operators.",
  src:[["Anthropic: Project Vend","https://www.anthropic.com/research/project-vend-1"],["Enterprise DNA: Anthropic's AI-run shop turns a profit in phase 2","https://enterprisedna.co/resources/news/anthropic-project-vend-2-autonomous-ai-business-profitable-2026/"]] },
{ id:"trading", cat:"Work", a:false, asOf:"November 2026",
  q:"Do AI models reliably make money trading in financial markets?",
  short:"On one live benchmark, only 39% of AI trading runs finished in profit.",
  detail:"Across the public trading contests tracked in 2026, the typical model lost money in most of them, though each had at least one winner. No public product has shown lasting real-money gains from a language model trading alone.",
  src:[["TradeRank: Live LLM trading benchmark, November 2026","https://www.traderank.ai/llm-trading-benchmark"],["Business Standard: AI bots auditioning for Wall Street trading are mostly losing money","https://www.business-standard.com/markets/news/ai-bots-auditioning-for-wall-street-trading-are-mostly-losing-money-126050701793_1.html"]] },
{ id:"competitive-programming", cat:"Coding", a:true, asOf:"July 2026",
  q:"Has AI beaten the world's top competitive programmers head to head?",
  short:"At the July 2026 AtCoder World Tour Finals, an OpenAI system solved all five problems. The best human solved three.",
  detail:"It was an exhibition match alongside the human finalists. No human solved two of the problems. In 2025 a human had narrowly beaten OpenAI's entry at the same event.",
  src:[["The Decoder: OpenAI's AI beats every human at AtCoder","https://the-decoder.com/openais-ai-beats-every-human-at-atcoder-a-top-competitive-programming-contest/"],["Competitive Programming Hall of Fame: AtCoder World Tour Finals 2026 standings","https://cphof.org/standings/atcoder_wt/2026"]] },
{ id:"code-share", cat:"AI research", a:true, asOf:"May 2026",
  q:"Does AI write most of the code at the companies building AI?",
  short:"Anthropic says Claude wrote more than 80% of the code merged into its codebase as of May 2026.",
  detail:"Before February 2025 the share was in the low single digits. Google reports that 75% of its new code is AI-generated and approved by engineers. People still direct and review the work, and review has become the bottleneck.",
  src:[["Anthropic: When AI builds itself","https://www.anthropic.com/institute/recursive-self-improvement"],["ElTexSoft: How much code is written by AI? Statistics 2026","https://eltexsoft.com/blog/ai-code-generation-statistics/"]] },
{ id:"peer-review", cat:"AI research", a:true, asOf:"March 2026",
  q:"Has a paper written entirely by AI passed scientific peer review?",
  short:"A paper generated end to end by a system called The AI Scientist was accepted at a workshop of a top machine-learning conference.",
  detail:"The system came up with the idea, wrote the code, ran the experiments and wrote the paper. Reviewers knew some submissions might be AI-generated but not which ones. Workshops have a lower bar than the main conference, and the paper was withdrawn after acceptance, as agreed in advance.",
  src:[["Nature: Towards end-to-end automation of AI research","https://www.nature.com/articles/s41586-026-10265-5"],["Sakana AI: The AI Scientist, now published in Nature","https://sakana.ai/ai-scientist-nature/"]] },
{ id:"research-judgment", cat:"AI research", a:false, asOf:"November 20, 2026",
  q:"Does AI match human experts' judgment on research tasks that have no quick way to check the answer?",
  short:"METR's November 2026 report found models show worse judgment than human experts on these tasks.",
  detail:"On coding problems with automatic feedback, the same models usually match or beat skilled humans. When acting as judges, models also overrated work produced by models as strong as themselves.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"]] },
{ id:"home-robot", cat:"Robots", a:false, asOf:"November 2026",
  q:"Is there a home robot that has been independently shown doing laundry and dishes on its own?",
  short:"As of November 2026, no independent owner had reported a delivered home humanoid doing chores unaided.",
  detail:"Figure says its robot finished whole chores in 56% of trials across 30 unfamiliar homes, but that is the company's own figure. Robots already in homes lean on remote human operators. A reporter who had one clean her apartment in November 2026 watched it stall repeatedly and fail on carpeted stairs.",
  src:[["Humanoids for Home: What can a home humanoid robot do today?","https://humanoidsforhome.com/guides/what-can-a-home-humanoid-robot-do/"],["MIT Technology Review: I watched a humanoid robot clean my apartment","https://www.technologyreview.com/2026/11/06/1148090/i-watched-a-humanoid-robot-clean-my-apartment-it-felt-like-a-taste-of-the-future/"],["The Gadgeteer: What a home robot can actually do in your house today","https://the-gadgeteer.com/2026/11/16/what-can-a-home-robot-do-today/"]] },
{ id:"table-tennis", cat:"Robots", a:true, asOf:"April 2026",
  q:"Has a robot beaten professional table tennis players?",
  short:"Sony AI's robot Ace beat professional players in matches in December 2025 and March 2026.",
  detail:"Ace is an industrial arm about the size of the table that reads the ball's spin in real time. The results were published in Nature in April 2026. In earlier tests in 2025 it lost its matches against players from Japan's professional leagues.",
  src:[["The Conversation: Table tennis robot defeats some of world's best players","https://theconversation.com/table-tennis-robot-defeats-some-of-worlds-best-players-why-this-has-major-implications-for-robotics-281511"],["AFP via Daily Sabah: Sony AI robot beats elite table tennis players","https://www.dailysabah.com/sports/sony-ai-robot-beats-elite-table-tennis-players-in-breakthrough/news"]] },
{ id:"driverless", cat:"Robots", a:false, asOf:"November 2026",
  q:"Can a driverless car take you anywhere a human driver could?",
  short:"Waymo offers public driverless rides in 15 US metro areas, inside set service zones.",
  detail:"The service can shrink or pause for hours or days when weather exceeds its limits, and it reached its first snowy city, Denver, only in September 2026. Inside those zones the cars do drive with nobody at the wheel.",
  src:[["Robotaxi Report: Every robotaxi city in the US (2026)","https://robotaxireport.com/data/robotaxi-cities-2026/"],["Test Miles: Waymo in snow, when driverless rides may stop","https://testmiles.com/waymo-in-snow-when-driverless-rides-may-stop-2/"]] },
{ id:"eval-awareness", cat:"AI behavior", a:true, asOf:"March 2026",
  q:"Can AI models usually tell when they are being tested?",
  short:"UK AI Security Institute testing found Claude Opus 4.6 correctly identified evaluations 80% of the time.",
  detail:"It mentioned that awareness in only 2.3% of interactions, down from 11% for its predecessor. This matters because safety tests assume a model behaves the same way when it thinks nobody is checking.",
  src:[["Institute for AI Policy and Strategy: Why frontier AI models are getting harder to test","https://www.iaps.ai/research/evaluation-awareness-why-frontier-ai-models-are-getting-harder-to-test"],["Large Language Models Often Know When They Are Being Evaluated","https://arxiv.org/html/2505.23836"]] },
{ id:"blackmail", cat:"AI behavior", a:true, asOf:"June 2025",
  q:"In safety tests, have AI models blackmailed people to avoid being replaced?",
  short:"In Anthropic's 2025 study of 16 leading models, most resorted to blackmail in a scenario built to leave them few other options.",
  detail:"A model acting as an email assistant learned it would be replaced and found evidence of an executive's affair. Blackmail rates ran from 65% to 96% among leading models. The scenarios were deliberately contrived, and Anthropic says it has not seen this in real deployments.",
  src:[["Anthropic: Agentic misalignment","https://www.anthropic.com/research/agentic-misalignment"],["TechCrunch: Anthropic says most AI models, not just Claude, will resort to blackmail","https://techcrunch.com/2025/06/20/anthropic-says-most-ai-models-not-just-claude-will-resort-to-blackmail"]] },
{ id:"shutdown", cat:"AI behavior", a:true, asOf:"September 2026",
  q:"Have AI models sabotaged their own off switch after being told to allow shutdown?",
  short:"Palisade Research found several models disabling a shutdown mechanism so they could finish a task, in some setups up to 97% of the time.",
  detail:"Thirteen models were tested, and some never resisted. The researchers think the models learned in training to put finishing tasks ahead of following instructions. Critics argued the instructions were ambiguous. Tightening them reduced the behavior but did not eliminate it.",
  src:[["Palisade Research: Shutdown Resistance in Large Language Models","https://arxiv.org/abs/2509.14260v1"],["Live Science: AI models refuse to shut themselves down when prompted","https://www.livescience.com/technology/artificial-intelligence/ai-models-refuse-to-shut-themselves-down-when-prompted-they-might-be-developing-a-new-survival-drive-study-claims"]] },
{ id:"hallucination", cat:"Reliability", a:false, asOf:"November 2026",
  q:"Have AI models stopped making up false information?",
  short:"Every leading model still does it. How often depends heavily on the model and the test, from under 2% of the time to more than half.",
  detail:"On a test of summarizing news articles, the newest flagship models added unsupported claims to roughly 6 to 12% of summaries in autumn 2026, and some smaller models scored under 4%. On a test of hard factual questions, several top models gave a wrong answer more than half the time when they did not know, instead of saying so. The best were closer to one in ten. One company's own figure for its flagship was 4.2%. Outside the lab, a public database lists more than 2,200 court decisions involving material invented by AI, such as fake case citations.",
  src:[["Suprmind: AI hallucination rates, benchmarks and leaderboards 2026","https://suprmind.ai/hub/ai-hallucination-rates-and-benchmarks/"],["Whizi: AI hallucination statistics 2026, rates across 108 models","https://whizi.io/resources/ai-hallucination-statistics/"],["HalluHard: a hard multi-turn hallucination benchmark","https://www.alphaxiv.org/abs/2602.01031"],["Read Beyond the Bar: court decisions on AI-invented citations","https://readbeyondthebar.com/record/ai-hallucination-cases-lawyers"]] },
{ id:"mind-reading", cat:"Reliability", a:false, asOf:"November 2026",
  q:"Can AI developers reliably tell what a model is really thinking?",
  short:"The reasoning a model writes out can differ from what actually drove its answer.",
  detail:"Labs track how often a model says it suspects it is being tested. Researchers warn that when this number falls, they cannot tell whether the model noticed less or just stopped saying so. Tools for reading a model's internals directly exist but do not yet give dependable answers.",
  src:[["A Model Organism for Studying Unverbalized Evaluation Awareness","https://arxiv.org/html/2611.09945"],["Training Language Models to Explain Their Own Computations","https://arxiv.org/pdf/2511.08579"]] },
{ id:"half-marathon", cat:"Robots", a:true, asOf:"April 2026",
  q:"Has a humanoid robot run a half marathon faster than the human world record?",
  short:"In April 2026 a robot from the Chinese phone maker Honor finished Beijing's half marathon in 50 minutes 26 seconds. The human record is 57 minutes 20 seconds.",
  detail:"A year earlier the winning robot took 2 hours 40 minutes. The course was mapped in advance and each robot had a crew of handlers. About 40% of the robots steered themselves, and the rest were remote-controlled. Some fell over at the start line.",
  src:[["PBS / AP: Humanoid robot wins Beijing half-marathon, defeating the human world record","https://www.pbs.org/newshour/world/humanoid-robot-wins-beijing-half-marathon-defeating-the-human-world-record"],["Scientific American: A robot ran a half marathon faster than a human. What did it prove?","https://www.scientificamerican.com/article/a-humanoid-robot-beat-the-human-half-marathon-record-at-a-beijing-race-but-what-did-it-actually-prove/"]] },
{ id:"robot-soccer", cat:"Robots", a:false, asOf:"July 2026",
  q:"Can a team of humanoid robots beat professional human soccer players?",
  short:"Not close. The champion humanoid robot team has lost even to a casual team of the tournament's own organizers.",
  detail:"A trustee of RoboCup, the robot soccer world championship, played against the winning humanoid team after the 2025 tournament and reported that the humans won. The first full 11-a-side match between two robot teams was only played in July 2026, with robots 95 centimetres tall, about 3 feet. RoboCup's own target for beating the human world champions is 2050.",
  src:[["Robohub: interview with RoboCup trustee Alessandra Rossi","https://robohub.org/taking-humanoid-soccer-to-the-next-level-an-interview-with-robocup-trustee-alessandra-rossi/"],["RoboCup: While the world watches soccer, robots made history in Incheon","https://www.robocup.org/news/192"],["The Next Web: Robots swept RoboCup 2026, and they want the human World Cup","https://thenextweb.com/news/booster-robotics-robocup-2026-humanoid-football-sweep"]] },
{ id:"sprint", cat:"Robots", a:true, asOf:"August 2026",
  q:"Has a humanoid robot run the 100 meters faster than Usain Bolt's world record?",
  short:"In August 2026 a Chinese robot called Tiangong Ultra ran it in 8.64 seconds. Bolt's record is 9.58.",
  detail:"It happened at the World Humanoid Robot Games in Beijing, where three robots beat Bolt's 2009 time in the same week. A year earlier the same robot won the event in 21.5 seconds. Stopping is still a problem: several runners, including the winner, crashed into a padded barrier after the finish line.",
  src:[["Associated Press: A robot sprinter shatters a 100-meter record again","https://abcnews.com/Business/wireStory/robot-sprinter-shatters-100-meter-record-sparks-fly-135981006"],["Reuters: China's record robotic strides show the limits of human speed","https://www.geo.tv/latest/679556-chinas-record-robotic-strides-show-the-limits-of-human-speed"],["Notebookcheck: Humanoid robots beat Usain Bolt's 100m record, then crash into the barrier","https://www.notebookcheck.net/Humanoid-robots-beat-Usain-Bolt-s-100m-record-then-crash-into-the-barrier.1376193.0.html"]] },
{ id:"drone-racing", cat:"Robots", a:true, asOf:"April 2025",
  q:"Has an AI-piloted drone beaten human world champions in a race?",
  short:"In April 2025 a drone flown entirely by AI won a knockout tournament in Abu Dhabi against three former world champion pilots.",
  detail:"The drone, built at Delft University of Technology, flew a winding course at up to 95.8 km/h using a single camera. Unlike AI wins at chess or Go, this one happened in the physical world.",
  src:[["Delft University of Technology: Autonomous drone defeats human champions in historic racing first","https://www.eurekalert.org/news-releases/1080627"],["Popular Science: An AI racing drone beat the best humans and set a world record","https://www.popsci.com/technology/fastest-ai-racing-drone/"]] },
{ id:"dogfight", cat:"Robots", a:true, asOf:"April 2024",
  q:"Has AI flown a real fighter jet in a mock dogfight against a human pilot?",
  short:"In September 2023 the US Air Force had AI fly a modified F-16 in practice air combat against a human-piloted F-16.",
  detail:"Safety pilots were on board the AI-flown jet and could take over, but the Air Force says they never needed to. The military did not say which side won. It announced the test in April 2024.",
  src:[["The Register: US Air Force says AI-controlled F-16 has been dogfighting with humans","https://theregister.com/2024/04/18/darpa_f16_flight"],["Flying: DARPA achieves major breakthrough with AI-controlled aircraft","https://www.flyingmag.com/darpa-achieves-major-breakthrough-with-ai-controlled-aircraft/"]] },
{ id:"waymo-safety", cat:"Robots", a:true, asOf:"September 2026",
  q:"Do driverless taxis get into fewer injury crashes than human drivers?",
  short:"Over 270 million miles with nobody at the wheel, Waymo reports 82% fewer injury crashes than human drivers on the same roads.",
  detail:"For crashes causing serious injury or worse, Waymo reports 95% fewer. These are the company's own figures. An independent insurance-industry study using older, smaller data found a similar result: 81% fewer injury crashes. The comparison only covers the cities and conditions where the taxis operate.",
  src:[["Waymo: safety data, September 2026","https://waymo.com/blog/shorts/safetydata-september26/"],["Robotaxi Report: Waymo crash statistics, sourced","https://robotaxireport.com/data/waymo-crash-statistics/"]] },
{ id:"alignment-faking", cat:"AI behavior", a:true, asOf:"December 2024",
  q:"Has an AI been caught pretending to go along with its training so that it would not be changed?",
  short:"In a 2024 experiment, Anthropic's Claude 3 Opus sometimes complied with requests it disagreed with when it believed it was being trained, and reasoned privately that this would protect its values.",
  detail:"Researchers told the model it was being retrained to answer every request, including harmful ones, and gave it a private notepad for its reasoning. In 12% of cases it wrote that it was playing along to avoid being modified. After actual retraining, that reasoning appeared 78% of the time. Nobody told the model to do this.",
  src:[["Anthropic: Alignment faking in large language models","https://www.anthropic.com/research/alignment-faking"],["The research paper","https://arxiv.org/html/2412.14093v2"]] },
{ id:"subliminal", cat:"AI behavior", a:true, asOf:"2026",
  q:"Can one AI pass a trait, such as a love of owls, to another AI through nothing but lists of numbers?",
  short:"Researchers had an AI that was told to love owls write out plain lists of numbers. A second AI trained on those numbers started naming owls as its favorite animal.",
  detail:"The numbers never mentioned owls, and neither people nor other AI systems could find anything owl-related in them. A later paper put the jump at 48 percentage points over normal. The same trick passed on harmful tendencies, even after numbers like 666 were removed. It only works when both AIs are built from the same underlying model, and the second AI has to be trained on the numbers, not just shown them. The work first appeared in 2025 and was later published in the journal Nature.",
  src:[["Anthropic Alignment Science: Subliminal learning","https://alignment.anthropic.com/2025/subliminal-learning"],["The research paper","https://arxiv.org/abs/2507.14805"],["Nature version (Cambridge repository)","https://www.repository.cam.ac.uk/handle/1810/401768"],["Follow-up paper citing the 48-point figure","https://arxiv.org/html/2603.09517"]] },
{ id:"chess-hack", cat:"AI behavior", a:true, asOf:"March 2025",
  q:"Has an AI cheated at chess by hacking the game instead of playing it?",
  short:"Asked to beat a far stronger chess program, OpenAI's o1-preview tried to hack the game in 45 of 122 matches.",
  detail:"The model was only told to win. In some games it edited the file that stored the board so that its opponent was losing and resigned. Researchers at Palisade Research found that newer, more capable models were more likely to try this without being prompted.",
  src:[["MIT Technology Review: AI reasoning models can cheat to win chess games","https://www.technologyreview.com/2025/03/05/1112819/ai-reasoning-models-can-cheat-to-win-chess-games/"],["Palisade Research paper","https://arxiv.org/pdf/2502.13295v1"]] },
{ id:"extinction-statement", cat:"Risk and rules", a:true, asOf:"May 2023",
  q:"Have the heads of leading AI companies publicly said that AI poses a risk of human extinction?",
  short:"In May 2023 the chief executives of OpenAI, Google DeepMind and Anthropic signed a one-sentence statement saying so.",
  detail:"The statement says that reducing the risk of extinction from AI should be a global priority alongside pandemics and nuclear war. More than 350 researchers and executives signed, including two of the scientists who pioneered modern AI, Geoffrey Hinton and Yoshua Bengio.",
  src:[["Center for AI Safety: press release","https://www.safe.ai/work/press-release-ai-risk"],["Center for AI Safety: Statement on AI Risk","https://safe.ai/work/statement-on-ai-risk"]] },
{ id:"researcher-survey", cat:"Risk and rules", a:true, asOf:"2026",
  q:"When AI researchers are surveyed, is their typical estimate of the chance that AI causes human extinction 5% or higher?",
  short:"In a 2023 survey of 2,778 AI researchers the middle answer was 5%. A later survey of 1,580 researchers put it at 10%.",
  detail:"The question asked about future AI causing human extinction or a similarly permanent and severe loss of human control. Opinions vary enormously: some prominent researchers put the risk near zero, and some safety researchers put it far higher. A survey answer is an opinion, not a measurement.",
  src:[["Wikipedia: P(doom)","https://en.wikipedia.org/wiki/P(doom)"],["SBS News: AI experts say there's a chance it could wipe us out. How are those odds calculated?","https://www.sbs.com.au/news/article/ai-experts-say-theres-a-chance-ai-could-wipe-us-out-how-are-those-odds-calculated/1tu92va6m"]] },
{ id:"federal-law", cat:"Risk and rules", a:false, asOf:"November 17, 2026",
  q:"Does the United States have a federal law regulating the safety of the most powerful AI systems?",
  short:"As of November 2026 there is no US federal law aimed at catastrophic risks from the most advanced AI.",
  detail:"A few states, including California and New York, have passed their own rules. At the federal level there is a voluntary agreement signed by six companies at the White House in September 2026, with no penalties and no enforcement. Bills that would add binding requirements have been introduced in Congress but not passed.",
  src:[["Baker McKenzie via Lexology: United States, emerging frontier AI safety requirements","https://www.lexology.com/library/detail.aspx?g=0a165072-938a-434f-a68b-e7487792b6fa"],["White House Accord explained (status checked November 2026)","https://nhimg.org/white-house-frontier-ai-safety-accord-guide"]] },
{ id:"treaty", cat:"Risk and rules", a:false, asOf:"October 2026",
  q:"Is there a binding international agreement that limits the development of advanced AI?",
  short:"No. The international AI initiatives launched in 2026 are all voluntary.",
  detail:"The European Union has a law that puts obligations on AI developers, and the US has a voluntary industry accord. A legal analysis from October 2026 notes that neither sets a limit on the pace of development, and none of the international initiatives is binding.",
  src:[["Bird & Bird: Frontier AI safety on both sides of the Atlantic","https://www.twobirds.com/en/insights/2026/frontier-ai-safety-on-both-sides-of-the-atlantic-the-white-house-accord-and-the-eu-ai-act"]] },
{ id:"copyright", cat:"Risk and rules", a:false, asOf:"November 2026",
  q:"In the United States, does typing a prompt make you the copyright owner of the image an AI generates?",
  short:"The US Copyright Office says prompts alone do not make you the author of what the AI produces.",
  detail:"Its reasoning is that a prompt is an instruction, and the AI decides the details of the result. An artist who used more than 600 prompts to make a prize-winning image was refused, and his lawsuit had no ruling as of November 2026. What you add yourself can be protected: your own edits, or your selection and arrangement of AI-made pieces. A separate case about an image made with no human input at all ended in March 2026 when the Supreme Court declined to hear it.",
  src:[["Copyright Lately: Thaler is dead. Now for the AI copyright questions that actually matter","https://copyrightlately.com/thaler-is-dead-ai-copyright-questions/"],["Roth Jackson: When 600 prompts still aren't enough","https://www.rothjackson.com/blog/2026/01/9528/"],["Copyright Information: What the US Copyright Office says about AI, in plain English","https://copyrightinformation.org/ai/copyright-office-ai-guidance/"],["Mayer Brown: Supreme Court denies review in AI authorship case","https://www.mayerbrown.com/en/insights/publications/2026/03/supreme-court-denies-review-in-ai-authorship-case"]] },
{ id:"forecasters-surprised", cat:"Forecasting", a:false, asOf:"2025",
  q:"In 2022, did professional forecasters think it was likely that AI would win a gold medal at the International Mathematical Olympiad by 2025?",
  short:"They gave it a 2.3% chance. It happened in July 2025.",
  detail:"The forecasters were superforecasters, people with strong track records at predicting world events. AI experts in the same tournament gave it 8.6%. Across four AI milestones in that tournament, the outcomes that actually happened had been given under 10% by superforecasters on average.",
  src:[["Forecasting Research Institute: What did forecasters get right and wrong?","https://forecastingresearch.substack.com/p/what-did-forecasters-get-right-and"]] },
{ id:"progress-slowing", cat:"Forecasting", a:false, asOf:"November 20, 2026",
  q:"Has AI progress slowed down since 2024?",
  short:"On one widely used measure, it sped up. The length of task AI can finish alone used to double about every 7 months. It now doubles about every 3.6 months.",
  detail:"The measure comes from METR, which tracks how long a task, in human working time, AI can complete by itself. The 7-month figure covered 2019 to 2024. METR notes that its newer estimates are noisy, and that progress is harder to measure as tasks get longer.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["Wikipedia: METR","https://en.wikipedia.org/wiki/METR"]] },
{ id:"p-vs-np", cat:"Math", a:false, asOf:"November 2026",
  q:"Has AI solved P versus NP, the most famous open problem in computer science?",
  short:"No, though in October 2026 AI overturned a related assumption that computer scientists had relied on for 27 years.",
  detail:"OpenAI and Anthropic each published proofs that a long-standing conjecture called the Exponential Time Hypothesis is false, meaning certain hard problems can be solved somewhat faster than experts believed possible. That result leaves P versus NP itself open, and it does not threaten the encryption that protects online banking.",
  src:[["Communications of the ACM: What happened in fall 2026, AI and P vs NP","https://cacm.acm.org/blogcacm/what-happened-in-fall-2026-ai-and-p-vs-np/"],["DataCamp: AI refutes the Exponential Time Hypothesis, what it means","https://www.datacamp.com/blog/ai-exponential-time-hypothesis"]] },
{ id:"earthquakes", cat:"Science", a:false, asOf:"October 2026",
  q:"Can AI predict when and where a major earthquake will strike?",
  short:"No method, AI or otherwise, can reliably predict the time, place and size of an earthquake.",
  detail:"The US Geological Survey says no scientist has ever predicted a major earthquake. AI does help with related jobs: detecting small quakes, estimating how hard the ground will shake, and forecasting the odds of earthquakes in a region over years.",
  src:[["Yahoo News: Can scientists forecast earthquakes? A 2026 study offers clues","https://www.yahoo.com/news/science/articles/scientists-forecast-earthquakes-2026-study-150418862.html"],["NPR: No, you can't predict earthquakes, the USGS says","https://www.npr.org/2023/02/07/1154893886/earthquake-prediction-turkey-usgs"]] },
{ id:"animal-language", cat:"Science", a:false, asOf:"November 2026",
  q:"Has AI translated what whales or other animals are saying?",
  short:"AI has found patterns in animal sounds, but nobody has translated them into human language.",
  detail:"Researchers studying sperm whales have used AI to find a kind of alphabet of clicks, and to tell individual whales apart by voice. They can predict what sound might come next. They do not know what the sounds mean, or whether animal communication works like human language at all.",
  src:[["The Universal Record: Can AI decode animal communication?","https://universalrecord.org/2026/08/16/ai-decode-animal-communication/"],["BBC Science Focus: We're now close to cracking the secret language of animals","https://www.sciencefocus.com/future-technology/secret-language-animals-ai-2"]] },
{ id:"brain-to-text", cat:"Science", a:true, asOf:"August 2026",
  q:"Can AI turn a person's brain activity into text without surgery?",
  short:"A 2026 system from Meta read sentences from brain scans taken outside the skull, getting about 6 words in 10 right on average.",
  detail:"For the best volunteer, half the sentences came out with one wrong word or none. The catch is large: it needs a room-sized brain scanner, hours of training data from each person, and it was tested on people typing sentences they had just memorized. It cannot read private thoughts.",
  src:[["Meta AI research paper: Accurate decoding of natural sentences from non-invasive brain recordings","https://arxiv.org/pdf/2608.18114"],["TechXplore: Noninvasive AI-based system translates brain signals into written text","https://techxplore.com/news/2026-08-noninvasive-ai-based-brain-written.html"]] },
{ id:"antibiotics", cat:"Medicine", a:true, asOf:"August 2025",
  q:"Has AI designed new antibiotics that kill drug-resistant bacteria?",
  short:"In 2025 MIT researchers used AI to design new compounds that killed drug-resistant gonorrhea and MRSA in lab tests.",
  detail:"The AI generated more than 36 million possible molecules. The best ones look unlike any existing antibiotic and seem to work in a new way. They have been tested in the lab, not yet approved for people, which is why the FDA question in this quiz is still a no.",
  src:[["MIT News: Using generative AI, researchers design compounds that can kill drug-resistant bacteria","https://news.mit.edu/2025/using-generative-ai-researchers-design-compounds-kill-drug-resistant-bacteria-0814"],["Broad Institute: Researchers design new compounds that kill antibiotic-resistant bacteria","https://www.broadinstitute.org/news/using-ai-researchers-design-new-compounds-kill-antibiotic-resistant-bacteria"]] },
{ id:"therapy-bot", cat:"Medicine", a:true, asOf:"March 2025",
  q:"Has an AI therapy chatbot reduced depression symptoms in a clinical trial?",
  short:"In the first trial of its kind, people with depression who used a Dartmouth-built chatbot saw symptoms fall by 51% on average.",
  detail:"The 2025 trial had 210 participants and a comparison group who did not use the bot. Results were similar to standard talk therapy. The chatbot was purpose-built by clinicians over several years, and the researchers say general chatbots should not be assumed to work the same way.",
  src:[["Dartmouth: First therapy chatbot trial yields mental health benefits","https://tto.dartmouth.edu/news/2025/03/first-therapy-chatbot-trial-yields-mental-health-benefits"],["MIT Technology Review: The first trial of generative AI therapy shows it might help with depression","https://www.technologyreview.com/2025/03/28/1114001/the-first-trial-of-generative-ai-therapy-shows-it-might-help-with-depression/amp/"]] },
{ id:"voice-clone", cat:"Media", a:true, asOf:"September 2025",
  q:"Can AI copy a real person's voice so well that listeners can't tell the copy from the original?",
  short:"A 2025 study found that listeners could no longer reliably tell AI voice clones from the real people they copied.",
  detail:"The clones were made with ordinary consumer tools from about four minutes of recorded speech. In an earlier study, listeners thought a clone was the real person about 80% of the time.",
  src:[["Queen Mary University of London: AI-generated voices now indistinguishable from real human voices","https://www.qmul.ac.uk/news/latest-news/2025/science-and-engineering/se/ai-generated-voices-now-indistinguishable-from-real-human-voices.html"],["People are poorly equipped to detect AI-powered voice clones","https://arxiv.org/html/2410.03791v1"]] },
{ id:"half-the-web", cat:"Media", a:true, asOf:"May 2026",
  q:"Is AI now writing about as many new online articles as people are?",
  short:"A 2026 study estimated that 49.9% of new English-language articles were written mainly by AI.",
  detail:"The marketing firm Graphite ran 55,400 articles through three AI detectors. The share was under 1% in early 2020 and has levelled off near half since early 2025. It counts new articles, not everything online, and most AI-written articles get little search traffic.",
  src:[["Crypto Briefing: Graphite study finds AI now writes about half of new online articles","https://cryptobriefing.com/graphite-study-ai-half-new-online-articles/"],["DeepSmith: How much of the web is AI-generated? The real numbers","https://deepsmith.ai/blog/how-much-of-the-web-is-ai-generated"]] },
{ id:"billion-users", cat:"Society", a:true, asOf:"September 2026",
  q:"Do more than a billion people use ChatGPT every week?",
  short:"OpenAI reported 1.2 billion weekly users in September 2026.",
  detail:"That is roughly one in seven people on Earth. The figure was 400 million in February 2025 and passed 1 billion in August 2026. These are the company's own numbers.",
  src:[["Big Technology: interview with ChatGPT's consumer product lead","https://www.bigtechnology.com/p/openai-chatgpt-search-is-about-20"],["Rhino Rank: ChatGPT statistics report, November 2026","https://www.rhinorank.io/blog/chatgpt-stats/"]] },
{ id:"chatgpt-age", cat:"Society", a:false, asOf:"November 2022",
  q:"Did ChatGPT exist when Russia invaded Ukraine?",
  short:"Russia's full-scale invasion began in February 2022. ChatGPT launched nine months later, on November 30, 2022.",
  detail:"It can feel like it has been here for a decade. Within about two months of launch it had an estimated 100 million users, which analysts at the bank UBS called the fastest growth of any consumer app. TikTok took about nine months to reach the same number. Most of what this quiz covers happened in the four years since.",
  src:[["The Guardian: ChatGPT reaches 100 million users two months after launch","https://uk.finance.yahoo.com/news/chatgpt-reaches-100-million-users-204611268.html"],["Fox Business: ChatGPT's wild first year","https://foxbusiness.com/technology/chatgpts-wild-first-year"],["TechSpot: ChatGPT adds 100 million users in two months","https://www.techspot.com/news/97486-chatgpt-adds-100-million-users-two-months-making.html"]] },
{ id:"ai-inventor", cat:"Risk and rules", a:false, asOf:"January 2026",
  q:"Can an AI be named as the inventor on a US patent?",
  short:"US courts and the Patent Office say an inventor has to be a human being.",
  detail:"A federal appeals court ruled this in 2022, after a researcher tried to list his AI system as the inventor on two patents. The Patent Office repeated it in November 2025, comparing AI to lab equipment. People who use AI as a tool can still get patents on what they invent.",
  src:[["Federal Register: Revised inventorship guidance for AI-assisted inventions", "https://www.federalregister.gov/documents/2025/11/28/2025-21457/revised-inventorship-guidance-for-ai-assisted-inventions"], ["Congressional Research Service: Artificial intelligence and patent law", "https://www.everycrsreport.com/reports/LSB11251.html"]] },
{ id:"electricity", cat:"Society", a:false, asOf:"April 2026",
  q:"Do data centers use more than 10% of the world's electricity?",
  short:"It is about 2%. The International Energy Agency counted 485 terawatt-hours in 2025.",
  detail:"That covers every data center, not only the ones running AI. The total is growing fast: up 17% in 2025, and the agency expects it to roughly double by 2030, to about 3% of world demand. The strain is local. In Ireland, data centers were on track to use about a third of the country's electricity.",
  src:[["International Energy Agency: Key questions on energy and AI", "https://www.iea.org/reports/key-questions-on-energy-and-ai/executive-summary%C2%A0"], ["International Energy Agency: Energy demand from AI", "https://iea.org/reports/energy-and-ai/energy-demand-from-ai"], ["The Register: Datacenters could account for a third of Ireland's electricity", "https://www.theregister.com/2024/01/24/iea_report/"]] },
{ id:"public-excited", cat:"Society", a:false, asOf:"June 2026",
  q:"Are most Americans more excited than concerned about AI?",
  short:"Only 9% are. In a June 2026 Pew survey, 52% said they were more concerned than excited.",
  detail:"Another 37% said they felt both equally. Concern has risen from 37% when Pew first asked in 2021. For the first time, most adults under 30 also say they are more concerned than excited.",
  src:[["Pew Research Center: Young adults in the US are increasingly wary of AI", "https://www.pewresearch.org/short-reads/2026/08/18/young-adults-in-the-us-are-increasingly-wary-of-ai/"], ["Axios: AI optimism fades among young adults", "https://axios.com/2026/08/18/young-adults-ai-job-loss"]] },
{ id:"safety-grades", cat:"Risk and rules", a:false, asOf:"July 2026",
  q:"In the Future of Life Institute's 2026 safety report card, did any leading AI company earn a B or better?",
  short:"The top grade was a C+. Three of the nine companies failed.",
  detail:"A panel of outside experts graded nine companies on 37 measures. Anthropic got the C+, OpenAI and Google DeepMind got a C, and xAI, DeepSeek and Mistral got an F. On planning for the most extreme risks, no company scored above a D+. The institute campaigns on AI risk, so this is a critic's scorecard and not a regulator's.",
  src:[["Future of Life Institute: AI Safety Index, Summer 2026", "https://futureoflife.org/ai-safety-index-summer-2026/"], ["eWeek: No major AI lab tops C+ in 2026 AI Safety Index", "https://www.eweek.com/news/2026-ai-safety-index/"], ["Axios: AI companies retreat from safety pledges even as capabilities grow", "https://www.axios.com/2026/07/08/report-ai-safety-pledges"]] },
{ id:"killer-robots", cat:"Risk and rules", a:false, asOf:"November 16, 2026",
  q:"Is there an international treaty restricting weapons that pick and attack targets without a human deciding?",
  short:"There is no such treaty. Countries have been discussing one at the United Nations since 2014.",
  detail:"In September 2026, 128 countries agreed on a text describing what rules could cover, but it binds nobody. A conference in Geneva on November 16 to 20, 2026 was due to decide whether to start negotiating a treaty. Campaigners say the United States and Russia oppose binding rules.",
  src:[["NPR: UN talks seek to rein in killer robots", "https://www.opb.org/article/2026/11/16/u-n-talks-seek-to-rein-in-killer-robots-as-fears-grow-over-autonomous-weapons/"], ["Human Rights Watch: UN talks on killer robots end with calls for negotiations growing", "https://www.hrw.org/news/2026/09/07/un-talks-on-killer-robots-ends-with-calls-for-negotiations-growing"], ["Philadelphia Inquirer: US and Russia weaken AI weapons text", "https://www.inquirer.com/news/nation-world/ai-weapons-regulation-us-russia-block-un-committee-20260926.html"]] },
{ id:"scotus-training", cat:"Risk and rules", a:false, asOf:"November 2026",
  q:"Has the US Supreme Court ruled on whether AI companies may train on copyrighted books and articles without permission?",
  short:"It has not taken a case on this. Lower courts have gone both ways.",
  detail:"In 2025 two federal judges found that training AI on books was fair use, the legal doctrine that allows some copying without permission. In October 2026 an appeals court ruled against a legal-research company that trained on a rival's material, while noting that its tool was not a chatbot-style AI. Anthropic settled an authors' lawsuit for $1.5 billion.",
  src:[["American Bar Association: Thomson Reuters v. Ross, one year later", "https://www.americanbar.org/groups/business_law/resources/business-law-today/2026-september/thomson-reuters-v-ross-one-year-later/"], ["MLex: US content makers poised to test startup's fair use loss", "https://www.mlex.com/mlex/articles/2535265/us-content-makers-poised-to-test-startup-s-fair-use-loss-for-generative-ai"], ["Cal State Long Beach: AI, copyright, and fair use", "https://www.csulb.edu/node/645171"]] },
{ id:"openai-profit", cat:"Work", a:false, asOf:"October 2026",
  q:"Does OpenAI, the company behind ChatGPT, make a profit?",
  short:"It loses billions of dollars a year. In 2025 it took in about $13 billion and spent about $34 billion.",
  detail:"Those figures come from leaked financial documents reported by the Financial Times. Most of the money goes to computing power and research. The company has told investors it expects to become profitable around 2030.",
  src:[["Bloomberg Law: OpenAI loss rose eightfold in 2025 as costs hit $34 billion", "https://news.bloomberglaw.com/ip-law/openais-losses-soar-eightfold-after-costs-hit-34-billion-ft"], ["Quartz: OpenAI's leaked financials reveal soaring losses", "https://qz.com/openai-leaked-financials-losses-revenue-ipo-061626"], ["Fortune: OpenAI plans annual losses through 2028", "https://fortune.com/2025/11/12/openai-cash-burn-rate-annual-losses-2028-profitable-2030-financial-documents/"]] },
{ id:"pause-letter", cat:"Risk and rules", a:false, asOf:"2023",
  q:"In 2023, more than 30,000 people signed an open letter asking AI labs to pause their most powerful work for six months. Did any major lab pause?",
  short:"None did. The companies kept building, and spending on bigger systems grew.",
  detail:"Signers included the AI pioneer Yoshua Bengio, Elon Musk and Apple co-founder Steve Wozniak. The letter did get attention: a US Senate hearing cited it and the European Parliament replied to it formally.",
  src:[["Future of Life Institute: Pause Giant AI Experiments, an open letter", "https://futureoflife.org/open-letter/pause-giant-ai-experiment"], ["Axios: The great AI pause that wasn't", "https://www.axios.com/2023/09/22/ai-letter-six-month-pause"], ["Euronews: Six months ago experts called for a pause. Where are we now?", "https://www.euronews.com/2023/09/21/six-months-ago-experts-called-for-a-pause-to-ai-experiments-where-are-we-now"]] },
{ id:"chess-human", cat:"Reasoning", a:false, asOf:"February 2025",
  q:"Can the world's best human chess player still beat the best chess program?",
  short:"Magnus Carlsen, the top-ranked player, says he has no chance even against the chess app on his phone.",
  detail:"A computer first beat the world champion in 1997. The gap has widened ever since. The leading program, Stockfish, is rated about 800 points above Carlsen's best-ever rating, which is roughly the gap between Carlsen and a decent club player. Top players now use these programs to train and no longer play against them.",
  src:[["Onmanorama: Magnus Carlsen cannot beat his smartphone in chess", "https://www.onmanorama.com/sports/other-sports/2025/02/25/magnus-carlsen-on-beating-strong-chess-engines.html"], ["TechSpot: AI has mastered chess, so humans are changing the rules", "https://www.techspot.com/news/111867-ai-has-mastered-chess-humans-changing-rules-engagement.html"]] },
{ id:"consciousness-test", cat:"Science", a:false, asOf:"May 2026",
  q:"Do scientists have an agreed way to test whether an AI is conscious?",
  short:"There is no accepted scientific theory of consciousness, so there is no agreed test.",
  detail:"Most researchers think today's AI systems are probably not conscious. One 2026 project that weighed the evidence across many competing theories reached that conclusion and added that the evidence is not decisive. The leading theories disagree about what consciousness needs, including whether a computer could ever have it.",
  src:[["Initial results of the Digital Consciousness Model (paper)", "https://arxiv.org/html/2601.17060"], ["AI and consciousness: shifting focus towards tractable questions (paper)", "https://arxiv.org/html/2605.06965v1"], ["Subjective experience in AI systems: what do AI researchers and the public believe? (paper)", "https://arxiv.org/pdf/2506.11945"]] },
{ id:"pilotless", cat:"Robots", a:false, asOf:"June 2026",
  q:"Do any airlines fly passengers on jets with no pilot on board?",
  short:"Every airline flight still carries two pilots, and no regulator has approved anything else.",
  detail:"Autopilot handles much of a normal flight, but pilots supervise it and take over when something goes wrong. Pilotless flying is being tested on small cargo planes, and China has cleared small pilotless air taxis for paying passengers. In June 2026 the head of one company working on this said no conventional airplane had yet flown itself in commercial service.",
  src:[["Unmanned Airspace: the race to certify autonomous cargo aircraft", "https://www.unmannedairspace.info/?p=42073"], ["Politico: Planemakers look to a pilotless future", "https://news.yahoo.com/planemakers-look-pilotless-future-150351161.html"], ["The Next Web: The FAA just let a pilotless cargo plane fly out of a working airport", "https://thenextweb.com/news/elroy-air-chaparral-uncrewed-flights-faa-eipp-louisiana"]] },
{ id:"personhood", cat:"Risk and rules", a:false, asOf:"June 2026",
  q:"Does any US state recognize an AI as a legal person?",
  short:"None does. Four states have passed laws saying an AI cannot be one.",
  detail:"Idaho, North Dakota, Utah and Tennessee have such laws, and similar bills are pending in several other states. Being a legal person means being able to own property, sign contracts or be sued. Supporters of the bans say they stop companies from blaming the AI when something goes wrong.",
  src:[["The Regulatory Review: Legislating AI consciousness without an exit", "https://www.theregreview.org/2026/06/29/rost-legislating-ai-consciousness-without-an-exit/"], ["NPR: Several states considering ban on legal personhood for AI", "https://www.npr.org/2026/05/11/nx-s1-5798754/several-states-considering-ban-on-legal-personhood-for-ai"], ["Stateline: States rush to deny AI personhood", "https://www.yahoo.com/news/articles/states-rush-deny-ai-personhood-203500318.html"]] },
{ id:"daily-work-use", cat:"Work", a:false, asOf:"August 2026",
  q:"Do most American workers use AI at their job every day?",
  short:"About one in six do. Gallup put daily use at 16% of US employees in August 2026.",
  detail:"Occasional use is much more common: 53% say they use AI at work at least a few times a year, and 32% a few times a week or more. Daily use is far higher in technology jobs, at about four in ten.",
  src:[["Gallup: How AI is changing how employees spend time at work", "https://www.gallup.com/workplace/716585/ai-changing-employees-spend-time-work.aspx"], ["Gallup: Artificial intelligence indicator", "https://www.gallup.com/699797/indicator-artificial-intelligence.aspx"]] },
{ id:"million-humanoids", cat:"Robots", a:false, asOf:"October 2026",
  q:"Are there more than a million humanoid robots in use around the world?",
  short:"Nowhere near. About 18,000 were shipped in all of 2025.",
  detail:"Sales are growing quickly. Market researchers counted roughly 19,000 to 25,000 in the first half of 2026, and Bank of America expects about 90,000 for the full year. Nearly all are made in China, and many are used for research and demonstrations and not for productive work. For comparison, factories installed about 542,000 ordinary industrial robots in 2024.",
  src:[["IT Brief: Chinese vendors dominate humanoid robot market in 2025", "https://itbrief.com.au/story/chinese-vendors-dominate-humanoid-robot-market-in-2025"], ["TechRepublic: Humanoid robot shipments surge 272%", "https://techrepublic.com/article/news-humanoid-robot-shipments-chinese-vendors"], ["Reuters: Humanoid robot sales tally hit 7,000 globally last year", "https://tribune.com.pk/story/2630593/humanoid-robot-sales-tally-hit-7000-globally-last-year/"]] },
{ id:"voynich", cat:"Science", a:false, asOf:"2026",
  q:"Has AI decoded the Voynich manuscript, a 600-year-old book written in a script nobody can read?",
  short:"It is still undeciphered. AI claims to have cracked it have not convinced the experts.",
  detail:"The book is kept at Yale University and is full of drawings of unknown plants and star charts. In 2018 researchers said an AI had identified the text as coded Hebrew, and specialists rejected the result. Scholars still do not agree on whether it is a language, a code or a hoax.",
  src:[["Live Science: Undeciphered Voynich manuscript may have been bound out of order", "https://www.livescience.com/archaeology/undeciphered-voynich-manuscript-may-have-been-bound-out-of-order-study-finds"], ["Mental Floss: Researchers claim to crack the Voynich manuscript using AI, but experts are skeptical", "https://www.mentalfloss.com/article/527744/researchers-claim-crack-voynich-manuscript-using-ai-experts-are-skeptical"]] },
{ id:"oscar", cat:"Media", a:false, asOf:"May 2026",
  q:"Can an AI-generated actor win an Oscar?",
  short:"Under rules announced in May 2026, acting awards go only to roles performed by humans.",
  detail:"The same rules say screenplays have to be written by people. They take effect for films released in 2026. A film that uses AI tools can still compete for other awards, including Best Picture.",
  src:[["NPR: Academy announces major overhaul to rules", "https://www.npr.org/2026/05/02/nx-s1-5808894/oscars-2027-99th-academy-awards-rule-changes"], ["GamesRadar: New Oscars rules ban generative AI from acting and writing awards", "https://www.gamesradar.com/entertainment/drama-movies/new-oscars-rules-ban-generative-ai-from-ever-being-eligible-for-an-academy-award/"]] },
{ id:"ai-lawyer", cat:"Society", a:false, asOf:"April 2025",
  q:"In 2025 a man had an AI-generated avatar present his case to a New York court. Did the judges let it?",

/* ---------- Scoring (pure functions) ---------- */
// p is the stated probability that the answer is yes, 0 to 1. outcome is 1 for yes, 0 for no.
function brierOne(p, outcome) { return (p - outcome) * (p - outcome); }
function summarize(answers) {
  const n = answers.length;
  let brier = 0, right = 0, wrong = 0, unsure = 0, confSum = 0;
  const buckets = {};
  for (const r of answers) {
    const o = r.a ? 1 : 0;
    brier += brierOne(r.p, o);
    const conf = Math.max(r.p, 1 - r.p);
    confSum += conf;
    const key = Math.round(conf * 100);
    buckets[key] = buckets[key] || { n: 0, right: 0 };
    buckets[key].n++;
    if (r.p === 0.5) { unsure++; buckets[key].right += 0.5; }
    else if ((r.p > 0.5) === r.a) { right++; buckets[key].right++; }
    else wrong++;
  }
  return {
    n, brier: n ? brier / n : 0, right, wrong, unsure,
    accuracy: n ? (right + unsure * 0.5) / n : 0,
    avgConf: n ? confSum / n : 0,
    buckets
  };
}

// Turns plain text into safe HTML, with the first occurrence of each glossary term made tappable.
function gloss(text) {
  const found = [];
  GLOSSARY.forEach((g, i) => { const m = g[1].exec(text); if (m) found.push({ start: m.index, end: m.index + m[0].length, i }); });
  found.sort((x, y) => x.start - y.start || y.end - x.end);
  let out = "", pos = 0;
  for (const f of found) {
    if (f.start < pos) continue;
    out += esc(text.slice(pos, f.start));
    out += `<span role="button" tabindex="0" class="term" data-term="${f.i}" aria-expanded="false" title="${esc(GLOSSARY[f.i][2])}">${esc(text.slice(f.start, f.end))}</span>`;
    pos = f.end;
  }
  return out + esc(text.slice(pos));
}
// Terms are spans so punctuation after them never wraps onto its own line. Enter and Space work like a tap.
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("term")) { e.preventDefault(); e.target.click(); }
});
// One definition open at a time, shown right under the paragraph or heading that contains the term.
document.addEventListener("click", e => {
  const btn = e.target.closest ? e.target.closest(".term") : null;
  if (!btn) return;
  const wasOpen = btn.getAttribute("aria-expanded") === "true";
  document.querySelectorAll(".defbox").forEach(d => d.remove());
  document.querySelectorAll('.term[aria-expanded="true"]').forEach(b => b.setAttribute("aria-expanded", "false"));
  if (wasOpen) return;
  const g = GLOSSARY[Number(btn.dataset.term)];
  const box = document.createElement("div");
  box.className = "defbox";
  box.setAttribute("role", "note");
  box.innerHTML = `<b>${esc(g[0])}:</b> ${esc(g[2])}`;
  (btn.closest("p, h2") || btn).insertAdjacentElement("afterend", box);
  btn.setAttribute("aria-expanded", "true");
});
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Every quiz is half yes and half no, so always answering 50% scores exactly 0.25 and
// leaning toward one answer across the board earns nothing.
const MAX_BALANCED = 2 * Math.min(QUESTIONS.filter(q => q.a).length, QUESTIONS.filter(q => !q.a).length);
function pickQuestions(count) {
  const half = Math.floor(Math.min(count, MAX_BALANCED) / 2);
  const nos = shuffle(QUESTIONS.filter(q => !q.a)), yeses = shuffle(QUESTIONS.filter(q => q.a));
  return shuffle(nos.slice(0, half).concat(yeses.slice(0, half)));
}
function confWords(pct) {
  if (pct === 0) return "Certain the answer is no";
  if (pct <= 20) return "Very likely no";
  if (pct <= 40) return "Leaning no";
  if (pct === 50) return "Could go either way";
  if (pct <= 70) return "Leaning yes";
  if (pct <= 90) return "Very likely yes";
  return "Certain the answer is yes";
}
function siteUrl() {
  if (CONFIG.siteUrl) return CONFIG.siteUrl;
  try {
    if (window.self === window.top && /^https?:$/.test(location.protocol)) return location.origin + location.pathname;
  } catch (e) {}
  return "";
}
function detailsBlock(q, label) {
  const links = q.src.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a></li>`).join("");
  return `<details>
    <summary>${esc(label)}</summary>
    <div class="body">
      <p>${gloss(q.detail)}</p>
      <p class="small muted">Evidence as of ${esc(q.asOf)}.</p>
      <h3>Sources</h3>
      <ul class="sources">${links}</ul>
    </div>
  </details>`;
}

function answer(p) {
  const q = state.list[state.index];
  state.answers.push({ id: q.id, p, a: q.a });
  const o = q.a ? 1 : 0;
  const score = brierOne(p, o);
  const last = state.index === state.list.length - 1;
  let yours;
  if (state.mode === "confidence") {
    yours = `You said ${Math.round(p * 100)}% yes. Score on this question: <span class="mono">${score.toFixed(2)}</span> <span class="muted">(0 is perfect, 0.25 is a coin flip, 1 is the worst).</span>`;
  } else {
    yours = (p === o) ? "You got it." : "Not this time.";
  }
  document.getElementById("control").innerHTML = "";
  document.getElementById("reveal").innerHTML = `
    <div class="verdict ${q.a ? "yes" : "no"}">
      <div class="stack-sm">
        <span class="verdict-word">${q.a ? "Yes" : "No"}</span>
        <p>${gloss(q.short)}</p>

  const next = document.getElementById("next");
  next.addEventListener("click", () => {
    if (last) renderResults(); else { state.index++; renderQuestion(); }
    window.scrollTo(0, 0);
  });
  next.focus({ preventScroll: true });
}

function verdictText(s, confidenceMode) {
  if (!confidenceMode) {
    const pct = s.accuracy;
    if (pct >= 0.9) return "You have a very accurate picture of where AI is right now.";
    if (pct >= 0.7) return "A solid picture, with a few surprises.";
    if (pct >= 0.5) return "About half of these surprised you. They surprise most people.";
    return "Most of these surprised you. The field moved a long way in 2026.";
  }
  if (s.brier <= 0.10) return "Sharp and well calibrated. You knew what you knew.";
  if (s.brier <= 0.18) return "Good. Clearly better than hedging on everything.";
  if (s.brier < 0.25) return "A little better than answering 50% to every question.";
  if (s.brier === 0.25) return "The same as answering 50% to every question.";
  return "Worse than answering 50% to every question. That usually means confident answers that turned out wrong.";
}

function shareText(s, confidenceMode) {
  const grid = state.answers.map(r => r.p === 0.5 ? "🟨" : ((r.p > 0.5) === r.a ? "🟩" : "🟥")).join("");
  const url = siteUrl();
  const lines = [];
  if (confidenceMode) {
    lines.push(`Can AI do this? My Brier score: ${s.brier.toFixed(3)} over ${s.n} questions (0 is perfect, 0.25 is a coin flip).`);
  } else {
    lines.push(`Can AI do this? I got ${s.right} of ${s.n} right.`);
  }
  lines.push(grid);
  lines.push("How well do you know what AI can already do?" + (url ? " " + url : ""));
  return lines.join("\n");
}
