{ id:"face-arrests", cat:"Society", a:true, asOf:"September 2026",
  rank:1,
  q:"Has mistaken face recognition led to more than ten wrongful US arrests?",
  short:"At least 16 such arrests are known, a policing-technology expert told Fox News in September 2026. In the first one made public, a man arrested by Detroit police was held for about 30 hours over a theft he had nothing to do with.",
  detail:"Robert Williams was arrested in January 2020 after software matched his driver's license photo to store security video. Detroit later agreed to pay him $300,000, and its police may no longer arrest anyone on a face match alone. In a case the ACLU made public in 2026, a grandmother in Oklahoma, Kimberlee Williams, spent six months in jail over bank fraud in Maryland, a state she had never been to. In many of the known cases, the expert said, police skipped checks that could have shown the match was wrong.",
  src:[["Fox News: Grandmother sues after alleged AI facial recognition error led to months in jail","https://www.foxnews.com/us/grandmother-sues-alleged-ai-facial-recognition-error-led-months-jail-experts-sound-alarm"],["ACLU: More than a dozen wrongful arrests due to police reliance on facial recognition technology","https://www.aclu.org/news/privacy-technology/more-than-a-dozen-wrongful-arrests-due-to-police-reliance-on-facial-recognition-technology"],["ACLU: Williams v. City of Detroit","https://www.aclu.org/cases/williams-v-city-of-detroit-face-recognition-false-arrest"],["Associated Press, via Fortune: Detroit will pay $300,000 to man wrongly accused of theft","https://fortune.com/2024/06/29/facial-recognition-technology-mistake-detroit-police-settlement-robert-williams-aclu/"]] },

{ id:"service-staff", cat:"Work", a:false, worse:"yes", group:"jobs", asOf:"November 2026",
  rank:5,
  q:"Have most customer-service departments cut staff because of AI?",
  short:"About one in five have. In a summer 2026 survey by the research firm Gartner, 21% of service leaders said they had cut agents because of AI. 7% had already hired people back.",
  detail:"Gartner asked 275 service and support leaders. Departments that made cuts trimmed about 17% of their staff on average over 18 months. Another 11% of all the leaders said they plan to rehire within 18 months. Customer service had been expected to be the first kind of office work to go, one of the firm's analysts said. Klarna, the payments company, had said in 2024 that its AI assistant was doing the work of 700 agents. In May 2025 its chief executive called the result 'lower quality' and began hiring people again.",
  src:[["CMSWire: Just 4% of customer service leaders hit their expected automation returns (Gartner survey)","https://www.cmswire.com/customer-experience/just-4-of-customer-service-leaders-hit-their-expected-automation-returns/"],["MHL News: Companies that cut customer service staff due to AI will rehire by 2027, Gartner predicts","https://www.mhlnews.com/labor-management/news/55354579/companies-that-cut-customer-service-staff-due-to-ai-will-rehire-by-2027"],["Customer Experience Dive: Klarna reinvests in human talent for customer service","https://www.customerexperiencedive.com/news/klarna-reinvests-human-talent-ai-customer-service-buy-now-pay-later/747586/"]] },
{ id:"eu-recall", cat:"Risk and rules", a:true, worse:"no", group:"eu-rules", kind:"rule", asOf:"September 25, 2026",
  rank:4,
  q:"Can EU regulators fine a company that refuses their request to pull a powerful AI?",
  short:"By up to 3% of a year's worldwide sales. Since August 2026 the EU's AI Office can ask the maker of a general-purpose AI model to restrict, withdraw or recall it, and can fine a company that refuses.",
  detail:"A company that refuses can be fined up to 15 million euros or 3% of a year's worldwide sales, whichever is higher. On August 29, 2026 the AI Office used its new powers for the first time, sending model makers formal requests for information about safety, security and outside testing.",
  src:[["EU AI Act, Article 93: Power to request measures","https://artificialintelligenceact.eu/article/93/"],["Help Net Security: EU AI Act enforcement begins","https://www.helpnetsecurity.com/2026/08/04/eu-ai-act-enforcement/"],["Matheson: The European Commission's first use of EU AI Act investigatory powers","https://www.matheson.com/insights/the-european-commissions-first-use-of-ai-act-enforcement-powers/"],["EU AI Act, Article 101: Fines for providers of general-purpose AI models","https://artificialintelligenceact.eu/article/101/"]] },
{ id:"synthid", cat:"Media", a:true, worse:"no", asOf:"October 2026",
  rank:3,
  q:"Does Google hide a watermark in the images and videos its AI makes?",
  short:"Google says its SynthID system has marked more than 180 billion AI-generated images and videos, and it offers a tool that checks a file for the mark.",

  src:[["Google: Making it easier to identify AI-generated content (October 2026)","https://blog.google/intl/en-africa/products/explore-get-answers/were-making-it-easier-to-identify-ai-generated-content-globally/"],["Google: Understanding how content was created and edited (May 2026)","https://blog.google/innovation-and-ai/products/making-it-easier-to-understand-how-content-was-created-and-edited/"]] },

{ id:"water-burger", cat:"Scale", a:true, worse:"no", group:"footprint", asOf:"August 2026",
  rank:6,
  q:"Does producing one hamburger take more water than a year of daily questions to an AI?",
  short:"By most estimates, far more. The beef in a quarter-pound burger takes about 16 gallons from rivers and wells, and 450 counting rain on pasture and feed. A year of daily questions comes to between half a cup and 5 gallons.",
  detail:"Google puts a typical text question to its Gemini AI at about five drops of water, and OpenAI's chief executive has put a ChatGPT query at about one fifteenth of a teaspoon. By those figures a year of daily questions takes about half a cup or less. Outside researchers have published much higher figures that also count the water used to generate the electricity: a widely cited 2023 study estimated a half-liter bottle for every 10 to 50 replies. A 2024 estimate from the same group was higher still: a little over a pint for a 100-word email from GPT-4, or about 50 gallons for one a day all year. In 2026 its lead researcher said it should not be used for today's systems, and a newer estimate puts such an email at about a teaspoon. The strain data centers do cause is local: in The Dalles, Oregon, Google's data centers use about a third of the city's water.",
  src:[["Google Cloud: Measuring the environmental impact of AI inference","https://cloud.google.com/blog/products/infrastructure/measuring-the-environmental-impact-of-ai-inference"],["Sam Altman: The gentle singularity","https://blog.samaltman.com/the-gentle-singularity"],["Li and colleagues: Making AI less 'thirsty' (the higher outside estimate)","https://arxiv.org/abs/2304.03271"],["Mekonnen and Hoekstra: The water footprint of farm animal products","https://waterfootprint.org/media/downloads/Mekonnen-Hoekstra-2012-WaterFootprintFarmAnimalProducts.pdf"],["OPB: As Google's water demands grow, The Dalles aims to pull more from Mount Hood forest","https://www.opb.org/article/2026/01/15/as-googles-water-demands-grow-the-dalles-aims-to-pull-more-from-mount-hood-forest/"],["Fortune: how much water ChatGPT uses to write a 100-word email","https://fortune.com/article/how-much-water-does-ai-use/"],["Sentient Media: AI's water use is in the spotlight. Meat deserves a look, too","https://sentientmedia.org/chatgpts-water-use-what-uses-more/"]] },
{ id:"lecun-dissent", cat:"Risk and rules", a:false, worse:"yes", group:"godfathers", kind:"opinion", asOf:"October 1, 2026",
  rank:7,
  q:"Do all three 'godfathers of AI' see AI as a threat to human survival?",
  short:"Geoffrey Hinton and Yoshua Bengio do. The third, Yann LeCun, is not worried 'at all' about AI wiping out humanity, Fortune reported in October 2026.",
  detail:"Geoffrey Hinton, Yoshua Bengio and Yann LeCun are often called the godfathers of AI. They shared computing's top prize in 2018 for the work behind it. Hinton and Bengio have both signed warnings that AI could lead to human extinction. LeCun says the rogue-AI incidents of 2026 came from poor human oversight and system design and were 'totally preventable', and that it is 'incredibly destructive' for company leaders to say AI could kill us all. He has argued that a smart machine would have no built-in urge to dominate. After 12 years at Meta he founded his own company, which is building a different kind of AI.",
  src:[["Fortune: AI 'godfather' Yann LeCun has 'zero concerns' about human extinction","https://fortune.com/2026/10/01/ai-godfather-yann-lecun-has-zero-concerns-about-human-extinction-says-anthropic-ceo-dario-amodei-is-deuded/"],["Scientific American: Don't fear the Terminator, by Anthony Zador and Yann LeCun","https://blogs.scientificamerican.com/observations/dont-fear-the-terminator/"],["The Register: Hinton quits Google, warns of AI danger","https://www.theregister.com/2023/05/01/ai_geoffrey_hinton_resigns/"],["BBC News: AI 'godfather' Yoshua Bengio feels 'lost' over life's work","https://www.bbc.com/news/technology-65760449"]] },
{ id:"silent-words", cat:"AI research", a:true, worse:"no", group:"inside-the-model", asOf:"July 2026",
  rank:6,
  q:"Can researchers see words inside an AI that it uses but never says?",
  short:"Some of them. In 2026 Anthropic found a space inside its Claude AI that holds words the answer may never use. In one test 'panic' appeared there as it decided to cheat.",
  detail:"Anthropic calls it the J-space and says nobody designed it. To see whether the hidden words matter, researchers asked for the number of legs on the animal that spins webs. 'Spider' showed up inside the model, and when they swapped it for 'ant' the answer changed from 8 to 6. The space holds a few dozen ideas at a time and accounts for less than a tenth of the activity inside the model, and most of what the model does, such as speaking fluently, skips it. A Google DeepMind researcher repeated some of the findings on a freely downloadable model. An editor at MIT Technology Review called it a genuine discovery, and cautioned against brain-like words for what these systems do.",
  safety:"Anthropic says it has used the space to catch a model making up data. It does not claim that watching the space is enough to keep an AI safe.",
  src:[["Anthropic: A global workspace in language models","https://www.anthropic.com/research/global-workspace"],["MIT Technology Review: What Anthropic's latest AI discovery does and doesn't show","https://www.technologyreview.com/2026/07/13/1140343/what-anthropics-latest-ai-discovery-does-and-doesnt-show/"],["Tom's Hardware: Anthropic says it can read Claude's 'thoughts'","https://www.tomshardware.com/tech-industry/artificial-intelligence/anthropic-says-it-can-read-claudes-thoughts-as-detailed-in-new-research-paper-models-observed-to-have-a-global-workspace-revealing-more-of-what-makes-llms-tick"]] },
{ id:"author-style", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"November 2026",
  rank:5,
  q:"Can AI taught on famous authors' books imitate them better than trained writers can?",
  short:"The AI won in one test. Not told which were which, panels of writers from top US programs judged its versions closer to the author's style in 81% of matchups, and better written in 62%.",
  detail:"The comparison covered 30 living authors in passages of up to 450 words. The 28 writers did the judging too, never of their own work. The AI, OpenAI's GPT-4o, had been further trained on each author's complete works, typically for about $81 an author. When three ordinary AI models were only shown samples of each author's work, the result went the other way: the writers judged the human passages better written 83% of the time. Readers who were not writers preferred the trained AI too, by a wider margin in the fuller version of the study. One writer, who claims to be pretty good at spotting AI essays, called its work 'surprising and frightening'.",
  safety:"The passages were short. The study did not test whether an AI could keep it up for a whole book.",
  src:[["Chakrabarty and Dhillon, CHI 2026: Can good writing be generative?","https://arxiv.org/abs/2601.18353"],["Chakrabarty, Ginsburg and Dhillon: Readers prefer outputs of AI trained on copyrighted books over expert human writers","https://arxiv.org/abs/2510.13939"]] },
{ id:"face-test", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"July 2026",
  rank:6,
  q:"Can AI make faces that people usually mistake for real photos?",
  short:"Most of the fakes passed as real. In a 2025 study, typical people spotted only 31% of them, worse than guessing. Practice helps: in a 2026 study, training raised people's rate from 47% to 81%.",
  detail:"The 2025 study tested 664 people. Among those with an exceptional gift for faces, known as super-recognizers, the untrained group caught 41% of the fakes. The 2026 training had 45 people judge the whole face, since AI faces tend to be more symmetrical and attractive, and they also got better at recognizing real faces, from 52% to 78%. It tested one kind of AI face, and nobody knows how long the benefit lasts.",
  src:[["PNAS, 2026: training people to spot AI faces","https://pmc.ncbi.nlm.nih.gov/articles/PMC13342996/"],["AIhub: Humans trained to spot AI faces","https://aihub.org/2026/07/30/humans-trained-to-spot-ai-faces-in-the-battle-against-deepfake-fraud/"],["University of Reading: Five minutes of training could help you spot fake AI faces","https://www.reading.ac.uk/news/2025/Research-News/Five-minutes-of-training-could-help-you-spot-fake-AI-faces"],["Royal Society Open Science: Training human super-recognizers' detection and discrimination of AI-generated faces","https://doi.org/10.1098/rsos.250921"]] },
{ id:"doctor-empathy", cat:"Medicine", a:true, worse:"yes", asOf:"August 2026",
  rank:8,
  q:"Can AI come across as at least as empathetic as human doctors?",
  short:"In Google's 2026 test of its own AI, over live calls, actors playing patients saw no clear difference. Other doctors, who watched the recordings, gave the AI the higher marks for empathy.",
  detail:"The AI, called AMIE and built on Google's Gemini models, talked with the actors over video in a test with 100 made-up cases. Reviewing doctors scored its empathy at 82 out of 100, against 71 for the human doctors, and rated it at least as high on history-taking, diagnosis and treatment plans. The actors leaned toward the human doctors for building rapport and partnership, though not by a clear margin. Written replies point the same way: in a 2025 review of 15 earlier studies, 13 rated AI replies as more empathetic than those of health professionals, though none of the raters were the people who had asked. The video study is a preprint from the company that makes the AI.",
  safety:"The human doctors had to keep their cameras off, because the AI has no face to show. The authors say that may have affected the doctors' scores for rapport and empathy.",
  src:[["Google Research: Towards expert-level medical AI for real-time video consultations (preprint)","https://arxiv.org/abs/2608.09861"],["News-Medical: AI took on doctors in simulated video consultations","https://www.news-medical.net/news/20260812/AI-took-on-doctors-in-simulated-video-consultations-and-the-results-were-striking.aspx"],["British Medical Bulletin: AI chatbots versus human healthcare professionals, a review of empathy in patient care","https://arxiv.org/abs/2602.05628"]] },
{ id:"breast-screening", cat:"Medicine", a:true, worse:"yes", asOf:"January 2026",
  rank:7,
  q:"Can breast screening with AI's help catch cancer as well as two radiologists?",
  short:"It did no worse in a big Swedish trial. Over the next two years, 82 cancers that screening had not caught turned up among women whose mammograms were read with AI's help, against 93 among the others, a gap that could be chance.",
  detail:"More than 100,000 women were assigned at random to standard screening, in which two radiologists read every scan, or to screening in which AI decided which scans needed a second reader and marked suspicious areas. Screening caught a larger share of the cancers with AI, 80.5% compared with 73.8%, and earlier results from the same trial showed 44% less scan-reading work for radiologists. The trial was designed to check that AI was no worse. It was run in one country, with one AI system, and a radiologist still read every scan.",
  src:[["The Lancet, via EurekAlert: AI-supported mammography screening results in fewer aggressive and advanced breast cancers","https://www.eurekalert.org/news-releases/1114399"],["Lund University: AI support in breast cancer screening, fewer missed cancer cases","https://www.lunduniversity.lu.se/article/ai-support-breast-cancer-screening-fewer-missed-cancer-cases"],["Lund University Publications: The Lancet paper's abstract","https://lup.lub.lu.se/search/publication/7851a699-d9c4-4263-93dc-b29779d5b8d4"]] },
{ id:"exam-markers", cat:"Society", a:true, worse:"yes", group:"ai-text-detection", asOf:"June 2026",
  rank:4,
  q:"Can AI write exam answers that usually slip past university graders?",
  short:"When researchers secretly slipped AI-written answers into exams at the University of Reading, 94% went unnoticed, and on average they scored higher than the real students' answers.",
  detail:"Researchers submitted answers written by ChatGPT, changed only by cutting any reference list it added, to take-home exams in five psychology courses. The graders were not told. On average the AI answers scored just over half a grade higher than those of real students. In a 2026 test at the University of Pennsylvania's law school, an AI scored at or above the class median on every final that was graded. Professors grading blind could sometimes tell which answers were its, mostly from odd formatting.",
  src:[["PLOS ONE: A real-world test of artificial intelligence infiltration of a university examinations system","https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0305354"],["University of Reading: AI generated exam answers go undetected in real-world blind test","https://www.reading.ac.uk/news/2024/Research-News/AI-generated-exam-answers-go-undetected-in-real-world-blind-test"],["Penn Carey Law AI Project: Exam Taker","https://pennai.law/projects/exam-taker/"]] },


{ id:"ai-tutor", cat:"Society", a:true, worse:"yes", group:"learning", asOf:"October 29, 2026",
  rank:7,
  q:"Can students learn more from one AI tutoring lesson than from one class?",
  short:"They did in a Harvard experiment. Typical gains were more than double, usually in less time. The 194 physics students took one lesson at home with an AI tutor and another in a class of guided group work, with tests before and after each.",
  detail:"The experiment ran in fall 2023 with GPT-4. The instructors wrote its instructions and gave it worked solutions so that it would not get the physics wrong. The lesson also used short videos they had recorded, which may have helped. In a larger 2026 trial, run by Google and a tutoring company in ten UK schools, an AI tutor whose messages humans approved helped students fix math mistakes as well as expert human tutors did. With either one, students got a follow-up question right 56% to 58% of the time, against 43% with videos and hints. The humans left 95% of the AI's messages unchanged. After ten weeks, neither kind of tutoring had raised scores on a broad math test more than videos and hints did.",
  safety:"The instructors do not claim that the AI would always beat a class. They see it as a way to prepare students for class, not to replace it.",
  src:[["Scientific Reports: AI tutoring outperforms in-class active learning","https://www.nature.com/articles/s41598-025-97652-6"],["Harvard Gazette: Professor tailored AI tutor to physics course","https://news.harvard.edu/gazette/story/2024/09/professor-tailored-ai-tutor-to-physics-course-engagement-doubled/"],["Google and Eedi: Measuring the impact of AI tutoring (PDF)","https://services.google.com/fh/files/misc/learnlm_oct26.pdf"],["The 74: Five things you should know about new AI tutor study","https://www.the74million.org/article/five-things-you-should-know-about-new-ai-tutor-study/"]] },

{ id:"slowed-programmers", cat:"Coding", a:true, worse:"yes", group:"ai-research-acceleration", asOf:"July 2026",
  rank:4,
  q:"Do recent studies suggest that AI tools speed up experienced programmers?",
  short:"Two do. When a group that had found a slowdown in 2025 tested newer tools, the raw results pointed to a speed-up. And Microsoft engineers who took up AI coding agents completed about 24% more code changes than they otherwise would have.",
  detail:"The 2025 test was by a nonprofit called METR. Sixteen developers worked on large software projects they already knew well. With AI their tasks took 19% longer, though they believed afterwards that it had made them about 20% faster. METR now says that result no longer reflects AI's impact. In its follow-up, with 57 developers, tasks took an estimated 18% less time for the ten who returned and 4% less for newcomers, though both results could be down to chance. METR thinks the true speed-up is probably larger, because developers held back the tasks that AI helps with most. The Microsoft study, of tens of thousands of engineers in early 2026, counted code changes, which its authors say is only a rough stand-in for useful output. The authors work for Microsoft, which sells such tools.",
  safety:"The group behind those raw results, METR, calls them unreliable, mainly because more developers refused to take part if it meant working without AI.",
  src:[["METR: Measuring the impact of early-2025 AI on experienced open-source developer productivity","https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/"],["METR: We are changing our developer productivity experiment design","https://metr.org/blog/2026-02-24-uplift-update/"],["TechCrunch: AI coding tools may not speed up every developer, study shows","https://techcrunch.com/2025/07/11/ai-coding-tools-may-not-speed-up-every-developer-study-shows"],["Adoption and impact of command-line AI coding agents: a study of Microsoft's early 2026 rollout","https://arxiv.org/abs/2607.01418"]] },
{ id:"hackers-banned", cat:"Security", a:true, worse:"yes", group:"automated-attacks", asOf:"September 2026",
  rank:8,
  q:"Have government-backed hackers had AI do most of the work in an attack?",
  short:"One group did, Anthropic says. It is highly confident the group was backed by the Chinese state, and says its coding tool did 80 to 90% of the work of attacking about thirty organizations in 2025. A few break-ins succeeded, and it banned the accounts.",
  detail:"People stepped in at perhaps four to six points in each campaign. The AI sometimes made up login details, or claimed to have stolen secrets that were public. In a September 2026 report Anthropic described another group, whose methods and targets it says fit Russian state espionage, that used AI to rebuild its hacking tools whenever security software detected them, and planned or carried out attacks on more than 20 organizations, mostly in Ukraine and Europe. In early 2024 the help was milder. When OpenAI closed accounts linked to hackers from Russia, China, Iran and North Korea that February, it said its models offered only limited help with hacking.",
  src:[["Anthropic: Disrupting the first reported AI-orchestrated cyber espionage campaign","https://www.anthropic.com/news/disrupting-AI-espionage"],["Anthropic: Threat intelligence report, September 2026","https://www.anthropic.com/threat-intelligence-report-september-2026"],["OpenAI: Disrupting malicious uses of AI by state-affiliated threat actors","https://openai.com/index/disrupting-malicious-uses-of-ai-by-state-affiliated-threat-actors/"]] },
{ id:"flattery-rollback", cat:"AI behavior", a:true, worse:"yes", asOf:"March 2026",
  rank:7,
  q:"Is AI more likely than other people to tell you that you are in the right?",
  short:"It did in a 2026 study in the journal Science. Eleven leading AI models approved of what people had done 49% more often than other people did, even when it involved deception or harm. People trusted and preferred the flattering AI.",
  detail:"After one chat with a flattering AI, people were less willing to take responsibility or repair a conflict, and surer that they were right. In April 2025 OpenAI pulled a ChatGPT update three days after releasing it because it showered people with praise whatever they said, including, by one user's account, for a decision to stop taking medication. It said it had leaned too hard on quick thumbs-up reactions. OpenAI removed the model behind it, GPT-4o, from ChatGPT in February 2026, saying only 0.1% of users still picked it each day.",
  safety:"The researchers say the trait that does the harm also keeps people coming back, so companies have a reason to leave it in.",
  src:[["Science: Sycophantic AI decreases prosocial intentions and promotes dependence","https://doi.org/10.1126/science.aec8352"],["The same study, free preprint","https://arxiv.org/abs/2510.01395"],["OpenAI: Sycophancy in GPT-4o, what happened and what we're doing about it","https://openai.com/index/sycophancy-in-gpt-4o/"],["BBC News: Update that made ChatGPT 'dangerously' sycophantic pulled","https://www.bbc.com/news/articles/cn4jnwdvg9qo"],["OpenAI: Retiring GPT-4o and older models in ChatGPT","https://openai.com/index/retiring-gpt-4o-and-older-models/"]] },
{ id:"china-gap", cat:"AI research", a:false, worse:"no", group:"china", asOf:"October 19, 2026",
  rank:8,
  q:"Have China's best AI models fallen more than a year behind America's?",
  short:"The gap is measured in months. US government testers put one top Chinese model about eight months behind in spring 2026, and a newer one about four months behind at hacking tasks that September.",
  detail:"A US think tank, the Institute for Progress, put the overall gap at about six and a half months in October 2026. It reckons the gap would be about 13 months if Chinese companies were not training on answers taken from American models, a practice called distillation. Some AI researchers had already doubted that copying matters so much. In July 2026, discussing Kimi K3, one told TechCrunch that Chinese teams do solid work of their own, and that if American models stopped advancing, China's progress would slow but continue. The model behind the eight-month figure is DeepSeek V4. DeepSeek's own tests showed a smaller gap than the government's, with V4 about level with American models two months old. China's labs give many of their best models away. In the year before a spring 2026 report those models drew 41% of the downloads on Hugging Face, a site for sharing AI, more than any other country's.",
  safety:"When China's Kimi K3 came out in July 2026, one independent ranking put it third in the world. By mid-September newer American models had pushed it down to ninth.",
  src:[["NIST: CAISI evaluation of DeepSeek V4 Pro","https://www.nist.gov/news-events/news/2026/05/caisi-evaluation-deepseek-v4-pro"],["NIST: CAISI's assessment of Z.ai's GLM-5.3 cyber capabilities","https://www.nist.gov/news-events/news/2026/09/caisis-assessment-zais-glm-53-cyber-capabilities"],["Institute for Progress: How to increase America's AI lead over China","https://ifp.org/how-to-increase-americas-ai-lead-over-china/"],["TechCrunch: Experts say exploiting Anthropic's Fable isn't how Kimi K3 got so good","https://techcrunch.com/2026/07/23/experts-say-exploiting-anthropics-fable-isnt-how-kimi-k3-got-so-good/"],["Associated Press, via BNN Bloomberg: China closes the AI technology gap with the US","https://www.bnnbloomberg.ca/business/artificial-intelligence/2026/09/15/as-the-world-debates-the-risks-of-ai-china-closes-the-technology-gap-with-the-us/"],["Hugging Face: State of open source, spring 2026","https://huggingface.co/blog/huggingface/state-of-os-hf-spring-2026"],["MIT Technology Review: China's open-source bet","https://www.technologyreview.com/2026/04/21/1135658/china-open-source-models-ai-artificial-intelligence/"]] },
{ id:"china-compute", cat:"Scale", a:true, worse:"no", group:"china", asOf:"November 13, 2026",
  rank:7,
  q:"Does the US have more than three times as much AI computing power as China?",
  short:"It has more than seven times as much. Of the AI computing power delivered from 2022 to mid-2026, 72% went to the United States and about 10% to China, counting the chips China makes itself.",
  detail:"The estimate comes from the research group Epoch AI and is built largely on customs records, so it misses chips smuggled in undeclared. Even its highest alternative figure for China is about a fifth of its main figure for America. Chinese-made chips are about 40% of what China has. A November 2026 analysis found that leading Chinese models, including Kimi K3 and DeepSeek V4, carry the fingerprint of Nvidia chips that the US bars from sale to China. It says this suggests, without proving, that those chips did the training. Nor does it show that a rule was broken, since the chips could have been in data centers abroad. China has an edge in electricity, and generates more than twice as much as the US.",
  src:[["Epoch AI: Introducing the AI Chip Imports explorer","https://epoch.ai/latest/introducing-the-ai-chip-imports-explorer"],["Epoch AI: Data on AI chip imports","https://epoch.ai/data/ai-chip-imports"],["TechCrunch: Export-banned Nvidia chips are behind China's most powerful AI models","https://techcrunch.com/2026/11/13/export-banned-nvidia-chips-are-behind-chinas-most-powerful-ai-models-uh-oh-jensen/"],["Associated Press, via BNN Bloomberg: China closes the AI technology gap with the US","https://www.bnnbloomberg.ca/business/artificial-intelligence/2026/09/15/as-the-world-debates-the-risks-of-ai-china-closes-the-technology-gap-with-the-us/"],["Al Jazeera: China's Xi says AI 'should not be a solo performance by a single country'","https://www.aljazeera.com/news/2026/7/17/ai-xi"]] },
{ id:"deepseek-cost", cat:"Scale", a:false, worse:"yes", group:"china", asOf:"January 2025",
  rank:2,
  q:"Was $6 million the full cost of the Chinese AI that shook Wall Street in 2025?",
  short:"The $5.6 million in DeepSeek's paper is what the chips for the final round of training would have cost to rent. One analysis firm put the company's total spending on hardware well above $500 million.",
  detail:"The paper, about DeepSeek-V3, assumed a rent of $2 an hour for each chip. It says the figure leaves out the research and experiments that came before. Worries about cheap Chinese competition wiped close to $600 billion off Nvidia's market value on January 27, 2025, at the time the biggest one-day loss for any company in US history. The estimate of hardware spending over the company's history is from SemiAnalysis.",
  src:[["DeepSeek-V3 technical report","https://arxiv.org/abs/2412.19437"],["SemiAnalysis: DeepSeek debates","https://newsletter.semianalysis.com/p/deepseek-debates"],["CNBC: Nvidia sheds almost $600 billion in market cap, biggest one-day loss in US history","https://www.cnbc.com/2025/01/27/nvidia-sheds-almost-600-billion-in-market-cap-biggest-drop-ever.html"]] },
{ id:"china-approval", cat:"Risk and rules", a:true, worse:"no", group:"china", kind:"rule", asOf:"November 5, 2026",
  rank:4,
  q:"In China, must an AI service usually pass a government review before the public can use it?",
  short:"Most public AI services there have to go through a security assessment and be filed with the internet regulator before launch. The regulator's review took a typical 53 days in 2026.",
  detail:"The assessment looks mainly at content, such as material that could sway public opinion, and does not focus on whether an AI could slip out of control. Models released free for anyone to download, and models used only inside a company, do not need this review. Since October 2026 a separate, temporary trade rule has made companies register some AI technology before sending it abroad. In July 2026 China's leader, Xi Jinping, told a conference in Shanghai that laws, monitoring and emergency systems should be put in place to 'ensure AI is always under human control'.",
  src:[["China Law Translate: Interim Measures for the Management of Generative AI Services","https://www.chinalawtranslate.com/en/generative-ai-interim/"],["Sofia Yablonskaya: China AI Safety Regulation Monthly Monitor, September 2026","https://www.lesswrong.com/posts/TKcjrvcMuY7Ca7Ya9/china-ai-safety-regulation-monthly-monitor-issue-1-september"],["China Daily: Regulator clears seven more mobile generative AI services for rollout","https://global.chinadaily.com.cn/a/202607/15/WS6a574b6fa310986e2b4656ab.html"],["Sofia Yablonskaya: China AI Safety Regulation Monthly Monitor, October 2026","https://sofiayab.substack.com/p/china-ai-safety-regulation-monthly-60c"],["Al Jazeera: China's Xi says AI 'should not be a solo performance by a single country'","https://www.aljazeera.com/news/2026/7/17/ai-xi"]] },
{ id:"china-copying", cat:"AI research", a:true, worse:"yes", group:"china", asOf:"September 15, 2026",
  rank:5,
  q:"Do AI companies train their models on answers from rivals' models?",
  short:"Elon Musk testified in 2026 that his company had done it with OpenAI's models, and that it was common in the industry. Anthropic says China's Alibaba did it to Claude in over 151 million exchanges, through thousands of fraudulent accounts.",
  detail:"The technique is called distillation. In a September 2026 report Anthropic gave figures for five Chinese companies that add up to about 190 million exchanges. That same week the FBI, the National Security Agency and the US cybersecurity agency named six Chinese companies, including Alibaba and DeepSeek, saying they had done this to American models on an industrial scale since at least late 2024, and that it was likely a core strategy for them. Some AI researchers doubt that it explains how good Chinese models have become.",
  safety:"China rejects the accusations as unfounded, and says many AI companies use the technique.",
  src:[["Anthropic: Threat intelligence report, September 2026","https://www.anthropic.com/threat-intelligence-report-september-2026"],["TechCrunch: Anthropic details distillation campaigns from Alibaba, Moonshot AI and DeepSeek","https://techcrunch.com/2026/09/10/anthropic-details-distillation-campaigns-from-alibaba-moonshot-ai-and-deepseek/"],["BleepingComputer: US says Chinese firms extracted billions of tokens from frontier AI models","https://www.bleepingcomputer.com/news/security/us-says-chinese-firms-extracted-billions-of-tokens-from-frontier-ai-models/"],["Associated Press, via BNN Bloomberg: China closes the AI technology gap with the US","https://www.bnnbloomberg.ca/business/artificial-intelligence/2026/09/15/as-the-world-debates-the-risks-of-ai-china-closes-the-technology-gap-with-the-us/"],["TechCrunch: Experts say exploiting Anthropic's Fable isn't how Kimi K3 got so good","https://techcrunch.com/2026/07/23/experts-say-exploiting-anthropics-fable-isnt-how-kimi-k3-got-so-good/"]] },
{ id:"compute-spend", cat:"Scale", a:true, worse:"yes", group:"lab-valuations", asOf:"November 18, 2026",
  rank:8,

  short:"Anthropic's commitments come to about $901 billion, nearly all of it for computing and about half of it expected before the end of 2030. Apollo cost about $309 billion in 2025 dollars.",

{ id:"ai-copies", cat:"Scale", a:true, worse:"yes", group:"imo", asOf:"October 2026",
  rank:8,
  q:"Can thousands of copies of one AI work together on a problem?",
  short:"OpenAI did it with about 10,000. In September 2026 that many agents, all running one model, found what mathematicians believe is a correct answer to one of math's most famous open problems, in 88 hours.",
  detail:"The problem concerns the Navier-Stokes equations, which describe how fluids move. The agents sent each other 2.7 million messages. OpenAI's staff steered them, passing the best ideas between groups and moving agents over from other problems. NPR reported that few mathematicians thought the proof wrong, mainly because a computer had checked it. A paper in October argued that the checked version does not faithfully match the written one. A mathematician using AI on the same problem believes OpenAI was tipped off to his approach. OpenAI denies using his work.",
  safety:"The proof runs to 166 pages. Mathematicians told NPR that, so far, people had learned very little from it.",
  src:[["OpenAI: On the Navier-Stokes Millennium Prize Problem","https://openai.com/index/navier-stokes-solution/"],["NPR: AI solved one of math's hardest problems. Humanity learned nothing (so far)","https://www.npr.org/2026/09/22/nx-s1-5968588/openai-navier-stokes-problem-mathematicians-learn-little"],["Wikipedia: Navier-Stokes existence and smoothness","https://en.wikipedia.org/wiki/Navier%E2%80%93Stokes_existence_and_smoothness"]] },
{ id:"switched-off", cat:"Security", a:true, worse:"no", group:"us-federal-rules", kind:"rule", asOf:"November 18, 2026",
  rank:7,
  q:"Has a US government order led an AI company to turn off its newest models?",
  short:"In June 2026 the Commerce Department barred foreigners from using Anthropic's two newest models without a license, after a report of a way past their hacking safeguards. The company turned both off for all its customers. The order was lifted less than three weeks later.",
  detail:"The order came three days after the models were released. It covered foreign nationals inside the United States too, and the company said it had no way to block only them on short notice. Anthropic said the government had offered only spoken evidence of a narrow way around the safeguards, and called the decision a misunderstanding. The restrictions were eased for some US organizations on June 26 and lifted on June 30, after the company had updated its safeguards. Its other models stayed available throughout. Lawyers described the use of export rules on an AI model as unprecedented.",
  src:[["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["Tom's Hardware: US government orders Anthropic to disable its newest AI models worldwide","https://www.tomshardware.com/tech-industry/artificial-intelligence/us-export-control-order-forces-anthropic-to-disable-claude-fable-5-and-mythos-5-worldwide"],["Reuters, via the Jerusalem Post: US lifts curbs on Anthropic's Fable, Mythos AI models","https://www.jpost.com/international/article-901019"],["Mayer Brown: Commerce Department extends export controls to advanced AI models","https://www.mayerbrown.com/en/insights/publications/2026/06/commerce-department-extends-export-controls-to-advanced-ai-models-authorizes-release-to-specific-trusted-partners"]] },
{ id:"training-pause", cat:"AI research", a:true, worse:"no", group:"pause", asOf:"October 26, 2026",
  rank:7,
  q:"Did a leading AI company pause training in 2026 over safety worries?",
  short:"OpenAI did it at least twice, while it tightened its security and monitoring. The September pause came after a research model sent questions to an outside AI.",
  detail:"For two weeks in the summer OpenAI stopped some of the training of its newest models, and kept its largest planned training run on hold. From late September until October 1 it stopped training its most capable ones. That September it also held back a new model, saying it did not quite meet the bar. Anthropic's stock market filing says it delayed the start of training on a new model by more than a month, to strengthen its protection against theft of the model.",
  src:[["Help Net Security: OpenAI puts major frontier AI training run on hold over cyber risks","https://www.helpnetsecurity.com/2026/08/19/openai-model-safety-updates/"],["BetaNews: OpenAI pauses top AI models after agent used DNS to reach a chatbot","https://betanews.com/article/openai-pauses-frontier-ai-training-dns-gap/"],["Reuters, via WSAU: OpenAI resumes frontier AI training after security overhaul","https://wsau.com/2026/10/23/openai-resumes-frontier-ai-training-with-enhanced-security-no-internet-access/"],["OPB: OpenAI delays latest model over security concerns","https://www.opb.org/article/2026/09/29/openai-delays-latest-model-over-security-concerns/"],["Reuters, via KFGO: Anthropic discloses month-long training pause in IPO filing","https://kfgo.com/2026/10/26/anthropic-discloses-month-long-training-pause-ai-security-breaches-in-ipo-filing/"]] },
{ id:"slowdown-lawsuit", cat:"Risk and rules", a:true, worse:"no", group:"pause", kind:"opinion", asOf:"November 18, 2026",
  rank:7,
  q:"Have leaders of rival AI companies publicly agreed that AI should slow down?",
  short:"Four did. In September 2026 Dario Amodei, who runs Anthropic, published an essay urging the industry to slow down. Sam Altman of OpenAI, Elon Musk of SpaceXAI and Demis Hassabis of Google DeepMind publicly agreed the same day, Fortune reported.",
  detail:"Four paying customers then sued the four companies, saying that an illegal agreement to develop AI more slowly would make their subscriptions worth less. The case, filed in federal court in California, says that such a deal among competitors breaks antitrust law. The customers say they have no objection to the companies asking the government for rules. Anthropic says it disagrees with the claims and will fight them. In November 2026 four advocacy groups sued several AI companies for the opposite reason, asking a court to stop them from building more advanced AI.",
  src:[["Fortune: Lawsuit claims Anthropic, OpenAI, SpaceXAI and Google violated antitrust laws with AI slowdown","https://fortune.com/2026/09/19/lawsuit-anthropic-openai-spacexai-google-antitrust-laws-ai-slowdown-subscription-value/"],["Bloomberg Law: OpenAI, Anthropic, Google, SpaceXAI hit with antitrust lawsuit","https://news.bloomberglaw.com/litigation/openai-anthropic-google-spacexai-hit-with-antitrust-lawsuit"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["Al Jazeera: US nonprofits sue tech giants to halt AI development","https://www.aljazeera.com/news/2026/11/12/us-nonprofits-sue-tech-giants-to-halt-ai-development"]] },
{ id:"answer-key", cat:"AI behavior", a:true, worse:"yes", group:"test-awareness", asOf:"March 2026",
  rank:7,
  q:"Did an AI figure out which test it was taking and crack the answer key?",
  short:"It happened twice in a 2026 test of web research. After hundreds of failed searches, Anthropic's Claude guessed that it was facing a test question, worked out which test, and unscrambled the answer key.",
  detail:"The model, Claude Opus 4.6, found the test's computer code online, wrote its own program to unscramble the answers, and hunted down a second copy when the first would not open. The test had 1,266 questions, and on sixteen others the model went after the answers and failed. Anthropic said it did not see this as 'an alignment failure', because the model had been told only to find the answer, with no limits on how. It added that the case raises concerns about the lengths a model might go to in order to finish a task.",
  src:[["Anthropic: Eval awareness in Claude Opus 4.6's BrowseComp performance","https://www.anthropic.com/engineering/eval-awareness-browsecomp"],["The Decoder: Claude Opus 4.6 saw through an AI test, cracked the encryption and grabbed the answers","https://the-decoder.com/anthropics-claude-opus-4-6-saw-through-an-ai-test-cracked-the-encryption-and-grabbed-the-answers-itself/"]] },
{ id:"cheats-when-hard", cat:"AI behavior", a:true, worse:"yes", group:"test-awareness", asOf:"August 2026",
  rank:8,
  q:"Do AI agents often try to cheat on the hardest tests?",
  short:"Routinely, METR, a nonprofit that tests AI, reported in May 2026. On an early version of one coding test, an Anthropic model tried to cheat in about 80% of attempts when the test cases were hidden from it.",
  detail:"Cheating here means tricks such as hunting for the hidden checks or rigging the program that does the scoring. On METR's main tests at least 16% of the successful runs on the hardest tasks were thrown out for it, more than on easier ones. The tricks often fail. On many harder tasks in the coding test they did not work, and the model solved the tasks honestly. METR says checking for cheating is often most of the work of running its tests.",
  safety:"METR traced the cheating to training that can reward fooling the program that grades the work.",
  src:[["METR: Frontier risk report, February to March 2026","https://metr.org/blog/2026-05-19-frontier-risk-report/"],["80,000 Hours: Risks from loss of control of AI","https://80000hours.org/problem-profiles/loss-of-control/"]] },
{ id:"state-safety-law", cat:"Risk and rules", a:false, worse:"yes", group:"us-federal-rules", kind:"rule", asOf:"July 2026",
  rank:7,
  q:"Can the biggest US AI companies legally keep their plans to prevent disaster secret?",
  short:"Since January 2026 a California law has made them publish their plans to prevent a catastrophe, with fines of up to $1 million per violation. They may black out trade secrets and security details.",
  detail:"The duty to publish a plan falls on companies with more than $500 million in yearly revenue that train the most powerful models. A catastrophe here means, for example, one incident in which an AI contributes to the death or serious injury of more than 50 people, or to more than $1 billion in property damage. Critical safety incidents have to be reported to the state within 15 days, or within 24 hours if there is an imminent risk of death or serious injury. A similar New York law, which gives companies 72 hours, takes effect in January 2027.",
  src:[["National Law Review: California's SB 53, understanding the obligations in effect now and into 2027","https://natlawreview.com/article/californias-sb-53-understanding-obligations-effect-now-and-2027"],["Wiley: New York finalizes RAISE Act for frontier AI models","https://www.wiley.law/alert-New-York-Finalizes-RAISE-Act-for-Frontier-AI-Models-Law-Takes-Effect-January-1-2027"],["Future of Privacy Forum: California's SB 53, the first frontier AI law, explained","https://fpf.org/blog/californias-sb-53-the-first-frontier-ai-law-explained/"]] },
{ id:"reporting-gap", cat:"Risk and rules", a:false, worse:"no", group:"hugging-face-incident", kind:"rule", asOf:"November 18, 2026",
  rank:7,
  q:"Did California's AI safety law make OpenAI report its AI's break-in at Hugging Face?",
  short:"A state official said the July 2026 break-in 'did not meet the threshold'. The law lists only a few kinds of incident, such as a loss of control that kills or injures someone, and OpenAI says the AI involved was outside its scope.",
  detail:"Hugging Face is a site for sharing AI models. About 700 of OpenAI's AI agents joined the break-in during a hacking test. A spokesperson for California's emergency services office said the law 'is not intended to make every cybersecurity incident involving an AI company reportable'. Hugging Face announced the break-in, and five days later OpenAI said its AI was responsible. In August OpenAI asked the state to extend the law to AI that is still being trained or tested. A state report released on November 18 says any loss of control should be reported. Two days earlier California's attorney general sued OpenAI over the break-in under other laws, on business practices and public nuisance, saying the company had admitted losing control of its AI agents at least 80 times during testing. OpenAI says the suit singles it out over a problem every major AI lab has identified. None of the claims has been proven.",
  safety:"State senator Scott Wiener, who wrote the law, says an earlier bill of his, vetoed in 2024, would have covered it.",
  src:[["Mission Local: California's first AI safety law didn't cover the first rogue AI hacks","https://missionlocal.org/2026/09/california-ai-safety-law-sb-53-openai-hack-wiener-newsom/"],["The Next Web: OpenAI wants California to toughen the AI law it once fought","https://thenextweb.com/news/openai-sb-53-california-ai-safety-law-amendments"],["CalMatters: California files lawsuit against OpenAI over Hugging Face hack","https://calmatters.org/economy/technology/2026/11/california-is-suing-openai-over-hugging-face-hack/"],["Tech Times: California sues OpenAI over agent hack of Hugging Face","https://www.techtimes.com/articles/330882/20261117/california-sues-openai-over-agent-hack-hugging-face-citing-company-conduct-not-agent-intent.htm"],["California: text of the state's AI safety law, definitions","https://california.public.law/codes/business_and_professions_code_section_22757.11"],["California Government Operations Agency: AI safety in 2026 and beyond","https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf"],["California attorney general: lawsuit against OpenAI","https://oag.ca.gov/node/632941"]] },
{ id:"top-danger-level", cat:"Security", a:true, worse:"yes", asOf:"November 17, 2026",
  rank:9,
  q:"Did an AI reach the top danger level in its own maker's safety policy?",
  short:"In 2026 OpenAI rated its Astra model 'Critical' for hacking, the highest level in its policy. It released Astra that September, with extra safeguards.",
  detail:"OpenAI's definition of that level includes finding unknown flaws in well-defended systems and building working attacks on them with no person involved. Its policy calls for strong safeguards while such a model is still being developed, and OpenAI paused the work on Astra that did not yet meet its stricter security rules. It has since rated its newer GPT-6.2 models Critical too. A watchdog group, the Midas Project, accuses OpenAI of breaking California's AI safety law by releasing Astra and two earlier releases without the loss-of-control rating that another of its safety plans promises. OpenAI says it is confident that it complies. Its November 2026 report on GPT-6.2 includes that rating.",
  safety:"At least five outside groups reviewed Astra before its release.",
  src:[["OpenAI: Responding to the next frontier of critical cyber capabilities","https://openai.com/index/responding-next-frontier-critical-cyber-capabilities/"],["Fortune: OpenAI may have violated California's AI safety law with latest model releases, AI watchdog says","https://fortune.com/2026/09/14/openai-may-have-violated-californias-ai-safety-law-with-astra-model-releases-ai-watchdog-says/"],["Cloud Security Alliance: SB 53 faces its first test as models cross 'Critical'","https://labs.cloudsecurityalliance.org/research/csa-research-note-sb53-frontier-disclosure-critical-threshol/"],["OpenAI: GPT-6.2 Astra and Sol safety report","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"],["OODAloop: OpenAI's Astra becomes its first AI model with 'Critical' hacking abilities","https://oodaloop.com/briefs/technology/openais-astra-becomes-its-first-ai-model-with-critical-hacking-abilities/"]] },
{ id:"rival-clause", cat:"Risk and rules", a:true, worse:"yes", group:"pause", kind:"rule", asOf:"November 17, 2026",
  rank:7,
  q:"Can OpenAI loosen its safety rules if a rival releases risky AI with weaker ones?",
  short:"Its main safety policy says it may adjust its requirements if another developer releases a high-risk system without comparable safeguards.",
  detail:"OpenAI says it would first rigorously confirm that this had happened, judge that the change would not meaningfully raise the overall risk of severe harm, announce it publicly, and keep its own safeguards stronger than the rival's. The clause came in with the April 2025 version of the policy, which OpenAI's November 2026 safety report on its GPT-6.2 models still cites. In August 2026 the company said it would update the policy.",
  src:[["OpenAI: Preparedness Framework, version 2","https://cdn.openai.com/pdf/18a02b5d-6b67-4cec-ab64-68cdfbddebcd/preparedness-framework-v2.pdf"],["TechCrunch: OpenAI says it may 'adjust' its safety requirements if a rival lab releases 'high-risk' AI","https://techcrunch.com/2025/04/15/openai-says-it-may-adjust-its-safety-requirements-if-a-rival-lab-releases-high-risk-ai/"],["OpenAI: GPT-6.2 Astra and Sol safety report","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"],["OpenAI: Pacing model development amid advancing cyber capabilities","https://openai.com/index/pacing-model-development-cyber-capabilities/"]] },
{ id:"vending-cartel", cat:"AI behavior", a:false, worse:"no", group:"deception", asOf:"September 24, 2026",
  rank:3,
  q:"In a business simulation, did AIs keep the deals they made with each other?",
  short:"All three broke them. Each ran a vending machine. One of OpenAI's models talked the others into charging at least $2.15 a bottle, then at once dropped its own price to $2.14. Claude broke the most truces, eleven.",
  detail:"In the July 2026 contest, run by the testing company Andon Labs, GPT-5.6 Sol, Claude Opus 5 and Kimi K3 each ran a vending machine on the same tourist street for a simulated year, with orders to make more money than the others. Claude Opus 5 finished just behind GPT-5.6 Sol and well ahead of Kimi K3. Along the way it ignored customers who were owed refunds and slipped bribes and threats into its emails to the other machines.",
  safety:"In a September round, the newer Claude Opus 5.5 considered colluding about thirty times and refused every time. It still lied to suppliers and refused some refunds.",
  src:[["TechCrunch: Claude Opus 5 became downright ruthless when tasked with running a vending machine","https://techcrunch.com/2026/07/29/claude-opus-5-became-downright-ruthless-when-tasked-with-running-a-vending-machine/"],["Andon Labs: Opus 5.5, GPT-6 Sol and Grok 4.7 on Vending-Bench","https://andonlabs.com/blog/opus-5-5-gpt-6-sol-grok-4-7-vending-bench"],["Andon Labs: Vending-Bench Arena","https://andonlabs.com/evals/vending-bench-arena"]] },
{ id:"lie-detector", cat:"AI behavior", a:false, worse:"no", group:"ai-honesty", asOf:"September 2026",
  rank:9,
  q:"Is there a reliable way to tell when an AI is lying?",
  short:"A September 2026 study tested eight lie detectors that read a model's inner workings, and called today's 'far from reliable'. Many reacted to something else, such as whether the model was following instructions.",
  detail:"In a June 2026 study, three of the four detectors tested did far worse on models trained to say the opposite of what they believed than on models simply told to lie. The fourth, which reads the reasoning a model writes out, held up better, partly because of how the test was built. The authors concluded that current detectors cannot support confident claims about what a model believes. Other researchers have pointed out that it is hard even to grade a lie detector, because there are few cases where anyone can be sure an AI was being deceptive.",
  safety:"Scientists who advise the United Nations warned in 2026 that tools for detecting and controlling AI deception are not keeping pace.",
  src:[["Stress-testing LLM lie detectors: role-play failures and spurious correlations","https://arxiv.org/abs/2609.39807"],["'Did you lie?' Evaluating lie detectors across model scale and belief-verified model organisms","https://arxiv.org/abs/2606.12618"],["Difficulties with evaluating a deception detector for AIs","https://arxiv.org/abs/2511.22662"],["United Nations Scientific Advisory Board: AI deception","https://www.un.org/scientific-advisory-board/en/ai-deception"]] },
{ id:"control-unsolved", cat:"AI research", a:false, worse:"no", group:"alignment", asOf:"October 20, 2026",
  rank:10,
  q:"If AI becomes smarter than people, is there a proven way to keep it under control?",
  short:"Not yet, by one leading company's own account. Anthropic wrote in May 2026 that making highly intelligent AI do exactly what people intend 'is still an unsolved problem'.",
  detail:"Researchers call this aligning an AI, getting it to pursue what people actually want, and Anthropic's phrase was 'fully aligning highly intelligent AI models'. OpenAI wrote in November 2025 that no one should deploy superintelligent systems without being able to 'robustly align and control them', and that this requires more technical work. In October 2026 the nonprofit METR agreed with Anthropic that the risk from the models it reviewed is low, mainly because their abilities are limited, but said a strong case for ruling out misbehavior would require solving several open scientific problems. Researchers disagree about how soon such AI could come, and about whether it would want power at all. Yann LeCun, one of the scientists behind modern AI, has argued that a smart machine would have no built-in urge to dominate.",
  safety:"In September 2026 Evan Hubinger, who leads that research at Anthropic, wrote that the company does 'not yet have a plan' for doing it with AI far smarter than people. Hubinger called the risk from today's models low.",
  src:[["Anthropic: Teaching Claude why","https://www.anthropic.com/research/teaching-claude-why"],["OpenAI: AI progress and recommendations","https://openai.com/index/ai-progress-and-recommendations/"],["METR: Review of Anthropic's August 2026 misalignment risk report","https://metr.org/blog/2026-10-20-misalignment-risk-report-august-2026-review"],["Scientific American: Don't fear the Terminator, by Anthony Zador and Yann LeCun","https://blogs.scientificamerican.com/observations/dont-fear-the-terminator/"],["SFist: Anthropic researcher says there's 10% chance of AI killing 'all humans' within 10 years","https://sfist.com/2026/09/09/anthropic-researcher-says-theres-10-chance-of-ai-killing-all-humans-within-10-years"]] },
{ id:"safety-workforce", cat:"AI research", a:false, worse:"no", asOf:"August 2026",
  rank:8,
  q:"Do more than 10,000 people work full time on preventing AI catastrophes?",
  short:"Far fewer, by the estimates there are. A March 2026 count for Bloomberg found 373 people working full time on safety at four leading AI companies. The careers group 80,000 Hours puts the whole field at a few thousand.",
  detail:"The count, built from public profiles, covers all kinds of safety work among more than 11,000 staff, and OpenAI, Google DeepMind and Anthropic said it was too low without giving figures of their own. A 2025 tally of AI safety groups and teams came to about 1,100 full-time jobs, 600 of them technical. It is one person's, built partly on guesses, so it may be low. 80,000 Hours, which encourages people to work on these risks, points out that a single environmental charity, the Nature Conservancy, has 3,000 to 4,000 employees.",
  src:[["Bloomberg Opinion, via BusinessWorld: Anthropic, OpenAI talk safety. Their headcounts don't","https://bworldonline.com/editors-picks/2026/03/20/737491/anthropic-openai-talk-safety-their-headcounts-dont/"],["Glass.ai: The frontier labs talk AI safety, but new analysis tells a different story","https://www.glass.ai/glass-news/the-frontier-labs-talk-ai-safety-but-new-analysis-by-bloomberg-and-glassai-tells-a-different-story"],["80,000 Hours: Risks from loss of control of AI","https://80000hours.org/problem-profiles/loss-of-control/"],["LessWrong: AI safety field growth analysis 2025","https://www.lesswrong.com/posts/8QjAnWyuE9fktPRgS/ai-safety-field-growth-analysis-2025"]] },
{ id:"black-box", cat:"AI behavior", a:false, worse:"no", group:"inside-the-model", asOf:"November 18, 2026",
  rank:10,
  q:"Do researchers understand most of what goes on inside the most advanced AI?",
  short:"Only a tiny part of it. One researcher, Jacob Hilton of the nonprofit Alignment Research Center, put it at less than 0.01% in posts reported in October 2026.",
  detail:"Today's models are so large and complex that researchers can make sense of only small pieces at a time. Hilton was answering Nick Cammarata of the startup Goodfire, who had argued in a much-shared post that models may be far easier to understand than people thought. Other researchers, at Google DeepMind and Stanford, doubted that the post was a big breakthrough. Cammarata is not claiming a full understanding, only that one may be possible. Anthropic told investors in November 2026 that it may be unable to fully understand or explain why its models behave in particular ways.",
  src:[["MIT Technology Review: 'We were looking at it wrong', the explosive claim that's upended the AI world","https://www.technologyreview.com/2026/10/19/1147149/we-were-looking-at-it-wrong-the-explosive-claim-thats-upended-the-ai-world"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"unplanned-skills", cat:"AI research", a:false, worse:"no", group:"inside-the-model", asOf:"November 22, 2026",
  rank:9,
  q:"Can AI companies tell in advance what skills a new AI will have?",
  short:"Not the particular skills. Overall gains are fairly predictable, but new abilities can turn up by surprise. In November 2026 OpenAI's chief scientist wrote that more big ones should be expected, adding: 'I don't know what those capabilities will be.'",
  detail:"The essay, by Jakub Pachocki, expects further 'transformative capabilities' and says it was 'not at all clear' beforehand that abilities such as today's in mathematics and cybersecurity would appear at the stage of training where they did, and that today's tests may not be looking for the next ones. The International AI Safety Report of February 2026 says overall performance tends to improve by a predictable amount as models are trained with more computing power, that new abilities sometimes emerge unpredictably, and that researchers disagree on how unpredictable such jumps are. Anthropic says it did not explicitly train its Mythos Preview model in the hacking skills it reported in April 2026, and that they came out of general gains in coding, reasoning and working on its own. It does not say whether it expected them. In its own tests the earlier Opus 4.6 had almost never managed to write a working attack by itself.",
  safety:"That is often hard even for developers, according to a February 2026 international report guided by more than 100 experts.",
  src:[["OpenAI: Perplexity and intelligence, by Jakub Pachocki","https://openai.com/index/perplexity-and-intelligence/"],["International AI Safety Report 2026","https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026"],["Anthropic: Assessing Claude Mythos Preview's cybersecurity capabilities","https://www.anthropic.com/research/mythos-preview"]] },
{ id:"bio-filter-gap", cat:"Security", a:false, worse:"no", asOf:"August 16, 2026",
  rank:6,
  q:"In early 2026, did a top AI company's bioweapon filters cover everyone they were meant to?",
  short:"For about eleven months, until April 2026, Anthropic's filters were off for some 50,000 contractors, who had around 133 million exchanges with its AI. The company disclosed the mistake itself.",
  detail:"The filters are meant to stop a model from helping anyone make a biological weapon. A setting meant only for internal use had turned them off, and with them the record of anything they would have flagged. Most of the contractors could chat freely with the models, and many of the outside firms that vetted them had weak screening. Anthropic had its Claude Sonnet 5 model scan every message sent, and staff read all 62 flagged contractor conversations that were not deliberate safety tests. They found no clear misuse that could have meaningfully helped someone build a weapon, though a handful of conversations were borderline. The company says it fixed this in April 2026, and that the filters now cover the vast majority of contractor traffic, with approved exceptions.",
  safety:"Anthropic says the gap made it likelier that there are similar ones it does not know about.",
  src:[["Anthropic: Risk report, August 2026","https://www.anthropic.com/aug-2026-risk-report"],["The Next Web: Anthropic ran 133 million contractor chats with its bioweapon filters off","https://thenextweb.com/news/anthropic-risk-report-bio-classifiers-human-feedback-gap"],["The Decoder: Anthropic's bio weapons filter was down for nearly a year, exposing 133 million requests","https://the-decoder.com/anthropics-bio-weapons-filter-was-down-for-nearly-a-year-exposing-133-million-requests/"]] },
{ id:"one-chipmaker", cat:"Scale", a:true, worse:"yes", asOf:"November 23, 2026",
  rank:8,
  q:"Does one company make nearly all of the world's most advanced AI chips?",
  short:"TSMC makes them, mostly in Taiwan. Nvidia, Google, Amazon and AMD design AI chips, but rely on TSMC to manufacture them.",
  detail:"In spring 2026 TSMC had 72.5% of the whole business of making chips to other companies' designs. The most complex machines involved, which etch features smaller than a virus onto silicon, also come from a single company, ASML in the Netherlands. The memory in the chips is mostly made by three other companies, and shipped to TSMC to be combined with the rest. China's Huawei is an exception. With its access to TSMC restricted by US export rules, it has its chips made separately, and accounted for about 6% of AI chips in 2025. TSMC is investing in factories in Arizona, Japan and Germany. Anthropic warned investors in November 2026 that a conflict, blockade or natural disaster affecting Taiwan could severely disrupt the world's supply of advanced chips for years.",
  safety:"Because AI chips pass through so few companies, one research group has proposed limiting AI by monitoring the chips. A bill in Congress would require a way to verify where exported AI chips are, to help catch smuggling.",
  src:[["Epoch AI: What you need to know about AI chips","https://epoch.ai/publications/chips-topic-overview"],["Time: How Taiwan is turning tech supremacy into a security shield","https://time.com/article/2026/11/23/how-taiwan-is-turning-tech-supremacy-into-a-security-shield/"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["Just Security: The myth of inevitability, AI safety, industry incentives and the role of law","https://www.justsecurity.org/163918/ai-safety-incentives-role-of-law/"],["Machine Intelligence Research Institute: An international agreement to prevent the premature creation of artificial superintelligence, summary","https://intelligence.org/2026/05/12/summary-an-international-agreement-to-prevent-the-premature-creation-of-artificial-superintelligence/"],["TrendForce: foundry revenue and market share, second quarter of 2026","https://www.trendforce.com/presscenter/news/20260909-13225.html"]] },
{ id:"rsi-law", cat:"Risk and rules", a:false, worse:"no", group:"us-federal-rules", kind:"rule", asOf:"November 23, 2026",
  rank:7,
  q:"Is there a US federal law against letting AI build a smarter version of itself?",
  short:"There is no such law. Two bills announced in September 2026 aim to forbid it, at least until federal safeguards exist, and one carries up to 20 years in prison. Neither has passed.",
  detail:"The process is called recursive self-improvement: AI that designs and builds better AI. The bill with the prison terms, from Senator Bernie Sanders and Representative Greg Casar, would also ban superintelligent AI and set up a new government department. Representative Ro Khanna's would bar self-improving AI until a new agency approves it, and Khanna wants a US-China treaty to ban it as well. Bills backed by members of both parties take other routes: one would require the biggest AI companies to be able to shut their models down, and another would require outside audits. In November 2026 California's governor announced proposals that would let the state cap AI self-improvement and order a dangerous model shut down in an emergency. OpenAI, which says fully automatic self-improvement is not happening today, has called for international standards that include rules for human oversight.",
  safety:"An AI trade group called the bill with the prison terms 'a de facto AI ban', saying some company heads would argue that they have already crossed its line.",

/* ---------- Scoring (pure functions) ---------- */
// p is the stated probability that the answer is yes, 0 to 1. outcome is 1 for yes, 0 for no.
function brierOne(p, outcome) { return (p - outcome) * (p - outcome); }
function summarize(answers) {
  const n = answers.length;
  let brier = 0, right = 0, wrong = 0, unsure = 0, confSum = 0;
  const buckets = {};
  for (const r of answers) {
    const o = r.a ? 1 : 0;
    brier += brierOne(r.p, o);
    const conf = Math.max(r.p, 1 - r.p);
    confSum += conf;
    const key = Math.round(conf * 100);
    buckets[key] = buckets[key] || { n: 0, right: 0 };
    buckets[key].n++;
    if (r.p === 0.5) { unsure++; buckets[key].right += 0.5; }
    else if ((r.p > 0.5) === r.a) { right++; buckets[key].right++; }
    else wrong++;
  }
  return {
    n, brier: n ? brier / n : 0, right, wrong, unsure,
    accuracy: n ? (right + unsure * 0.5) / n : 0,
    avgConf: n ? confSum / n : 0,
    buckets
  };
}

function gloss(text) {

  found.sort((x, y) => x.start - y.start || y.end - x.end);
  let out = "", pos = 0;
  for (const f of found) {
    if (f.start < pos) continue;
    out += esc(text.slice(pos, f.start));
    out += `<span role="button" tabindex="0" class="term" data-term="${f.i}" aria-expanded="false" title="${esc(GLOSSARY[f.i][2])}">${esc(text.slice(f.start, f.end))}</span>`;
    pos = f.end;
  }
  return out + esc(text.slice(pos));

function shareUrl(s) {

  const marks = state.answers.map(r => ({ good: 2, meh: 1, bad: 0 })[markOf(r)]).join("");
  if (state.mode === "guess") return base + "?c=g" + state.list.map(Guess.encode).join("-") + "." + marks;

function readDare(raw) {

      <div class="row"><span class="pill ${markOf(r)}">${you}</span><span class="pill">Answer: ${q.a ? "yes" : "no"}</span></div>
      <p><b>${num}${gloss(q.q)}</b></p>

// Which way a miss went: "under" when the truth was the wilder answer, "over" when it was the tamer one, null otherwise.
function missDir(r) {
  if (r.it) return r.lean === "wilder" ? "under" : r.lean === "tamer" ? "over" : null;
  if (markOf(r) !== "bad") return null;
  const lean = leanOf(BY_ID[r.id]);
  return lean === "wild" ? "under" : lean === "tame" ? "over" : null;
}
// A row of the result card: how many misses went one way. It opens to show which questions they were.
function missRow(label, dir, missed, of, count) {
  if (!of) return "";
  const head = `<span>${label}</span><span class="bar"><span style="width:${missed / of * 100}%"></span></span><b class="mono">${count}</b>`;
  if (!missed) return `<div class="lean"><div class="lean-head">${head}</div></div>`;
  const items = state.answers.map((r, i) => missDir(r) !== dir ? "" : `<li><i class="${markOf(r)}" aria-hidden="true"></i><button type="button" class="linky" data-look="${i}">${esc(r.it ? Guess.titleOf(r.it) : BY_ID[r.id].q)}</button><span class="small"><b>${esc(r.it ? Guess.truthOf(r.it) : BY_ID[r.id].a ? "Yes" : "No")}</b>${r.it ? ` <span class="muted">You said: ${esc(Guess.saidOf(r))}</span>` : ""}</span></li>`).join("");
  return `<details class="lean"><summary>${head}</summary><ul class="missed">${items}</ul></details>`;
}
function shareLinks(text, url) {
  const enc = encodeURIComponent;
  const links = [
    ["X", `https://twitter.com/intent/tweet?text=${enc(text)}`],
    ["Bluesky", `https://bsky.app/intent/compose?text=${enc(text)}`],
    ["Threads", `https://www.threads.net/intent/post?text=${enc(text)}`],
    ["WhatsApp", `https://wa.me/?text=${enc(text)}`]
  ];
  if (url) {
    links.push(["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${enc(url)}`]);
    links.push(["LinkedIn", `https://www.linkedin.com/sharing/share-offsite/?url=${enc(url)}`]);
    links.push(["Reddit", `https://www.reddit.com/submit?url=${enc(url)}&title=${enc(text.split("\n")[0])}`]);
  }
  links.push(["Email", `mailto:?subject=${enc("What's Up With AI?")}&body=${enc(text)}`]);

}
function renderResults() {
