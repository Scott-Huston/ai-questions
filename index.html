<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can AI Do This?</title>
<meta name="description" content="A calibration quiz on what AI can and can't do as of November 2026. Rate your confidence, see the evidence, get a Brier score.">
<meta property="og:title" content="Can AI Do This?">
<meta property="og:description" content="Dozens of claims about what AI can do today. Say how sure you are, then see the evidence and your Brier score.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one left-aligned reading column, like a test paper. One question on screen at a time. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #14212b;
  --muted: #55636f;
  --line: #d5dce3;
  --accent: #2646c9;
  --accent-ink: #ffffff;
  --yes: #0c7458;
  --yes-bg: #e2f4ee;
  --no: #ab2c47;
  --no-bg: #fbe8ec;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b;
    --surface: #182129;
    --ink: #e7ecf0;
    --muted: #9aa8b4;
    --line: #2c3944;
    --accent: #93a6ff;
    --accent-ink: #0d1430;
    --yes: #56d3a8;
    --yes-bg: #12322a;
    --no: #ff8fa5;
    --no-bg: #3a1a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b;
  --surface: #182129;
  --ink: #e7ecf0;
  --muted: #9aa8b4;
  --line: #2c3944;
  --accent: #93a6ff;
  --accent-ink: #0d1430;
  --yes: #56d3a8;
  --yes-bg: #12322a;
  --no: #ff8fa5;
  --no-bg: #3a1a22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
main {
  max-width: 44rem;
  margin: 0 auto;
  padding: 28px 20px 72px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: clamp(1.45rem, 4.6vw, 1.9rem); font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px;
}
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 11px 18px;
  font-weight: 600;
  min-height: 46px;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-wide { flex: 1 1 140px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Start screen choices */
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; font-weight: 600; margin-bottom: 8px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; }
.choice label {
  display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  background: var(--surface); cursor: pointer; height: 100%;
}
.choice label b { font-weight: 600; }
.choice input:checked + label { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Progress */
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s ease; }

/* Confidence control */
.conf { display: flex; flex-direction: column; gap: 10px; }
.conf-read { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.conf-num { font-family: var(--font-mono); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 4.2ch; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; margin: 0; }
.conf-ends { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yn .btn { min-height: 58px; font-size: 1.1rem; }

/* Verdict */
.verdict { border-radius: 10px; padding: 18px 20px; border: 1px solid transparent; }
.verdict.yes { background: var(--yes-bg); border-color: var(--yes); }
.verdict.no { background: var(--no-bg); border-color: var(--no); }
.verdict-word { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1; }
.verdict.yes .verdict-word { color: var(--yes); }
.verdict.no .verdict-word { color: var(--no); }
.pill {
  display: inline-block; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
}
.pill.yes { color: var(--yes); }
.pill.no { color: var(--no); }
.pill.mid { color: var(--muted); }

.term {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: help;
  text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px;
  letter-spacing: inherit; text-align: inherit;
}
.term:hover, .term[aria-expanded="true"] { color: var(--accent); }
.defbox {
  font-family: var(--font-body); font-size: 0.95rem; font-weight: 400; line-height: 1.5; letter-spacing: 0;
  color: var(--ink); background: var(--bg); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; padding: 10px 14px; margin-top: 8px;
}
.defbox b { font-weight: 600; }
.verdict .defbox { background: var(--surface); }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style-position: inside; }
details > .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.sources { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 4px; }
.sources a { overflow-wrap: anywhere; }

/* Results */
.score { font-family: var(--font-mono); font-size: clamp(3rem, 14vw, 4.6rem); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.scale { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--yes) 0%, var(--line) 50%, var(--no) 100%); margin-top: 18px; }
.scale .mark { position: absolute; top: -7px; width: 4px; height: 26px; background: var(--ink); border-radius: 2px; transform: translateX(-2px); }
.scale-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-family: var(--font-mono); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.tile b { display: block; font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.award { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 16px 18px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.award.miss { border-left-color: var(--no); }
.award.hit { border-left-color: var(--yes); }
.award .eyebrow { color: var(--ink); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 0.82rem; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 4px; min-width: 80px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); }
textarea {
  width: 100%; font: inherit; font-size: 0.95rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; resize: vertical; min-height: 9.5rem;
}
.share-links { display: flex; flex-wrap: wrap; gap: 8px; }
.share-links a, .share-links button {
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: var(--surface);
  text-decoration: none; color: var(--ink); font-weight: 500; font-size: 0.92rem; min-height: 40px;
  display: inline-flex; align-items: center;
}
.share-links a:hover, .share-links button:hover { border-color: var(--accent); color: var(--accent); }
.review-item { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.review-item:last-child { border-bottom: 0; }
footer { color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>
</head>
