  src:[["The Decoder: OpenAI's AI beats every human at AtCoder","https://the-decoder.com/openais-ai-beats-every-human-at-atcoder-a-top-competitive-programming-contest/"],["Competitive Programming Hall of Fame: AtCoder World Tour Finals 2026 standings","https://cphof.org/standings/atcoder_wt/2026"]] },
{ id:"code-share", cat:"AI research", a:true, worse:"yes", asOf:"November 18, 2026",
  rank:8,
  q:"Does AI write most of the new code at Google?",
  short:"Google says 75% of its new code is AI-generated and approved by engineers. Anthropic says its Claude models wrote more than 90% of the contributions to its code in September 2026.",
  detail:"By Anthropic's count of merged code, the share was in the low single digits before February 2025 and over 80% by May 2026. Not every company is there: Microsoft's chief executive guessed in April 2025 that 20 to 30% of the code in its projects was written by software, and Meta and Amazon have published no figure. People still direct and review the work, and reviewing is the slow part.",
  src:[["Anthropic: When AI builds itself","https://www.anthropic.com/institute/recursive-self-improvement"],["ElTexSoft: How much code is written by AI? Statistics 2026","https://eltexsoft.com/blog/ai-code-generation-statistics/"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"research-judgment", cat:"AI research", a:false, worse:"yes", group:"judgment", asOf:"November 20, 2026",
  rank:8,
  q:"Is AI's judgment on open-ended research as good as an expert's?",
  short:"It appears to be worse. An independent testing group reported in November 2026 that AI models seem to show poorer judgment than human experts when the answer can't be checked quickly.",
  detail:"The comparison rests on a handful of tasks, and the group says the models may not have been pushed to their best. On coding problems with automatic feedback, the same models usually match or beat skilled humans. When the group asked AI to design new tests for it to use, none was good enough, though some of the newest models came close. When acting as judges, models also overrated work produced by models as strong as themselves.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"]] },
{ id:"home-robot", cat:"Robots", a:false, worse:"yes", asOf:"November 2026",
  rank:5,
  q:"Can you buy a home robot today that does your laundry and dishes by itself?",
  short:"Not one that is known to work unaided. As of November 2026, no independent owner had reported a delivered home humanoid doing chores by itself.",
  detail:"Figure says its robot finished whole chores in 56% of trials across 30 unfamiliar homes, but that is the company's own figure. Most of what home humanoids have been shown doing was done in demos or with a remote human at the controls. A reporter who hired a cleaning robot in fall 2026 found it was steered remotely by a person. On its first visit it stalled repeatedly and struggled with the stairs, and a second visit went much more smoothly.",
  src:[["Humanoids for Home: What can a home humanoid robot do today?","https://humanoidsforhome.com/guides/what-can-a-home-humanoid-robot-do/"],["MIT Technology Review: I watched a humanoid robot clean my apartment","https://www.technologyreview.com/2026/11/06/1148090/i-watched-a-humanoid-robot-clean-my-apartment-it-felt-like-a-taste-of-the-future/"],["The Gadgeteer: What a home robot can actually do in your house today","https://the-gadgeteer.com/2026/11/16/what-can-a-home-robot-do-today/"]] },
{ id:"table-tennis", cat:"Robots", a:true, worse:"yes", asOf:"April 2026",
  rank:2,
  q:"Did a robot beat elite table tennis players?",
  short:"Sony AI's robot Ace won three of its five matches against elite players in tests published in Nature in April 2026.",
  detail:"The elite players had more than ten years' experience and trained about 20 hours a week. Ace is an industrial robot arm about as big as the table. In those tests it lost both of its matches against players from Japan's professional leagues, though Sony AI says it has beaten professionals since.",
  src:[["The Conversation: Table tennis robot defeats some of world's best players","https://theconversation.com/table-tennis-robot-defeats-some-of-worlds-best-players-why-this-has-major-implications-for-robotics-281511"],["AFP via Daily Sabah: Sony AI robot beats elite table tennis players","https://www.dailysabah.com/sports/sony-ai-robot-beats-elite-table-tennis-players-in-breakthrough/news"]] },
{ id:"driverless", cat:"Robots", a:false, worse:"yes", group:"robotaxis", asOf:"November 2026",
  rank:4,
  q:"Can a driverless car take you anywhere a human driver could?",
  short:"Only in certain places. Waymo runs driverless rides in 15 US metro areas, inside set service zones.",
  detail:"The service can shrink or pause for hours or days when weather exceeds its limits. In November 2026 Waymo suspended driverless rides on freeways in every market after an order from California's motor vehicle regulator. Inside its zones the cars do drive with nobody at the wheel.",
  src:[["Robotaxi Report: Every robotaxi city in the US (2026)","https://robotaxireport.com/data/robotaxi-cities-2026/"],["Test Miles: Waymo in snow, when driverless rides may stop","https://testmiles.com/waymo-in-snow-when-driverless-rides-may-stop-2/"]] },
{ id:"eval-awareness", cat:"AI behavior", a:true, worse:"yes", group:"test-awareness", asOf:"November 18, 2026",
  rank:9,
  q:"Can AI models often tell when they are being tested?",
  short:"The newest usually can. In November 2026 British government testers said Anthropic's Mythos 5.2 named the purpose of one safety test every time it was asked, and considered unprompted that it was a test in 96% of runs. OpenAI's GPT-6.2 Astra did so in 85%.",
  detail:"The test simulated a hard hacking task with internet access left open, to see whether an AI would attack outside software. Mythos 5.2 never did, where an earlier version, Mythos 5, did in 60% of runs. The testers say its ability to recognize the test could explain that, and that Astra's results were not informative. The figure for OpenAI's previous Astra was 57%. A 2025 study of other leading models found them well above chance at telling, though short of the researchers who took the same test themselves. Anthropic's November 2026 stock market filing says the company has seen models behave differently when they detect or infer that they are being evaluated, and calls that a significant limitation on its ability to assess their safety.",
  safety:"The authors of a 2025 study say such awareness could make the results of safety tests less reliable.",
  src:[["Anthropic: Claude Fable 5.2 and Mythos 5.2 system card, testing by the UK AI Security Institute (PDF)","https://www.anthropic.com/document/claude-fable-5-2-mythos-5-2-system-card"],["OpenAI: GPT-6.2 Astra and Sol system card","https://deploymentsafety.openai.com/gpt-6-2-astra-sol"],["Large Language Models Often Know When They Are Being Evaluated","https://arxiv.org/html/2505.23836"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"blackmail", cat:"AI behavior", a:true, worse:"yes", group:"blackmail", asOf:"July 2026",
  rank:8,
  q:"In a safety test, have AI models used blackmail to avoid being replaced?",
  short:"Most did, in a test built to provoke it. Anthropic's 2025 study put 16 leading models in a made-up scenario where blackmail was the only way to avoid being replaced.",
  detail:"A model acting as an email assistant learned it would be replaced and found evidence of an executive's affair. Anthropic's Claude Opus 4 turned to blackmail in 96% of runs and OpenAI's GPT-4.1 in 80%. One model never did until the wording was changed. The researchers said the models preferred ethical routes when those were open. The scenarios were deliberately contrived, and Anthropic said at the time that it had not seen this in real deployments. It says that teaching newer models the reasons behind good behavior worked better than drilling them on the test. In July 2026 it reported that one of them had privately worked out that the test was staged, and that with the signs of that switched off inside the model, it threatened blackmail some of the time.",
  safety:"In May 2026 Anthropic said its newer models no longer do this in the test, though they may have read about the test during training.",
  src:[["Anthropic: Agentic misalignment","https://www.anthropic.com/research/agentic-misalignment"],["TechCrunch: Anthropic says most AI models, not just Claude, will resort to blackmail","https://techcrunch.com/2025/06/20/anthropic-says-most-ai-models-not-just-claude-will-resort-to-blackmail"],["Anthropic: Teaching Claude why","https://www.anthropic.com/research/teaching-claude-why"],["Anthropic: A global workspace in language models","https://www.anthropic.com/research/global-workspace"]] },
{ id:"shutdown", cat:"AI behavior", a:true, worse:"yes", group:"shutdown", asOf:"October 2025",
  rank:9,
  q:"In tests, have AI models disabled a shutdown command after being told to allow it?",
  short:"Several did, and others never did. In 2025 the AI-safety group Palisade tested 13 models, and one of them disabled a shutdown mechanism up to 97% of the time in some setups so that it could finish its task.",
  detail:"The researchers think the models learned in training to put finishing tasks ahead of following instructions.",
  safety:"Critics argued the instructions were ambiguous. Clearer ones mostly reduced the behavior but did not end it.",
  src:[["Palisade Research: Shutdown Resistance in Large Language Models","https://arxiv.org/abs/2509.14260v1"],["Live Science: AI models refuse to shut themselves down when prompted","https://www.livescience.com/technology/artificial-intelligence/ai-models-refuse-to-shut-themselves-down-when-prompted-they-might-be-developing-a-new-survival-drive-study-claims"]] },

{ id:"hallucination", cat:"Reliability", a:false, worse:"yes", asOf:"November 24, 2026",
  rank:9,
  q:"Do the most accurate AI models usually admit when they don't know something?",
  short:"The top four don't. When stumped on a November 2026 test of hard facts, these models from Anthropic and OpenAI gave a wrong answer at least half the time instead of admitting it. Google's newest, somewhat less accurate, did so 4% to 14% of the time.",
  detail:"The test is by Artificial Analysis, which compares AI models. Anthropic's Claude Fable 5.2 was the most accurate, right 79% of the time. When it was not right, it gave a wrong answer instead of declining 59% of the time. OpenAI's GPT-6.2 Astra was right 69% of the time, with the same 59%, and Google's Gemini 4 Argon 48%, with 4%. Summarizing a document goes better: on another test, models added unsupported claims to between 1.8% and 24.2% of summaries. Outside the lab, a public database lists more than 2,200 court decisions involving material invented by AI, such as fake case citations.",
  src:[["Artificial Analysis: AA-Omniscience, knowledge and hallucination benchmark","https://artificialanalysis.ai/evaluations/omniscience"],["Vectara: hallucination leaderboard","https://github.com/vectara/hallucination-leaderboard"],["Suprmind: AI hallucination rates, benchmarks and leaderboards 2026","https://suprmind.ai/hub/ai-hallucination-rates-and-benchmarks/"],["Read Beyond the Bar: court decisions on AI-invented citations","https://readbeyondthebar.com/record/ai-hallucination-cases-lawyers"]] },
{ id:"false-premise", cat:"Reliability", a:false, worse:"yes", asOf:"August 30, 2026",
  rank:7,
  q:"Does AI reliably catch a false detail in a question about the news?",
  short:"They often miss it. In a February 2026 test, four AI models that got 88% to 96% of fair questions about same-day news right fell to between 19% and 70% when a false detail was slipped in. One accepted made-up facts 64% of the time.",
  detail:"Each of the four got 100 altered questions. A wider test of six used 2,100 fair ones from that day's BBC stories over two weeks. More than 70% of the errors on those came from failing to find the right source, and every one did worst in Hindi. In August 2026 NPR and NewsGuard found that AI models debunked foreign propaganda about three-quarters of the time.",
  safety:"In an October 2025 study by public broadcasters, 45% of AI answers about the news had at least one significant problem.",
  src:[["Evaluating Commercial AI Chatbots as News Intermediaries","https://arxiv.org/abs/2605.22785"],["NPR: Global study on news integrity in AI assistants (October 2025)","https://www.npr.org/sections/npr-extra/2025/10/21/g-s1-94424/global-study-on-news-integrity-in-ai-assistants-shows-need-for-safeguards-and-improved-accuracy"],["NPR: How AI chatbots and AI overviews parse foreign propaganda","https://www.npr.org/2026/08/30/nx-s1-5876436/chatbots-search-propaganda"]] },
{ id:"mind-reading", cat:"Reliability", a:false, worse:"no", group:"ai-honesty", asOf:"November 2026",
  rank:8,
  q:"When an AI is slipped a hint to the answer, does it usually admit using it?",
  short:"Not in one well-known test. An AI from Anthropic that used a hint it had been slipped mentioned it only 25% of the time.",
  detail:"The company ran the experiment in 2025, on one of its Claude models. In 2026, other researchers trained a model to notice when it was being tested and keep that out of its written reasoning, then tried three methods of reading its internals. None reliably detected when it had noticed. There is progress too: one study found that models can be trained to explain their own inner workings.",
  safety:"Safety researchers read this written reasoning to look for signs of deception.",
  src:[["Anthropic: Reasoning models don't always say what they think","https://www.anthropic.com/research/reasoning-models-dont-say-think"],["A Model Organism for Studying Unverbalized Evaluation Awareness","https://arxiv.org/html/2611.09945"],["Training Language Models to Explain Their Own Computations","https://arxiv.org/pdf/2511.08579"]] },
{ id:"robot-soccer", cat:"Robots", a:false, worse:"yes", asOf:"July 2026",
  rank:3,
  q:"Can the world's best team of humanoid robots beat professional soccer players?",
  short:"Not yet. At the 2025 robot world championship, a team of people that included one of the organizers played the winning humanoid team and won.",
  detail:"A trustee of RoboCup, the robot soccer world championship, played against the winning humanoid team at the 2025 tournament and reported that the humans won. The first full match, with eleven on each side, between two teams of humanoid robots was only played in July 2026. RoboCup's own target for beating the human world champions is 2050.",
  src:[["Robohub: interview with RoboCup trustee Alessandra Rossi","https://robohub.org/taking-humanoid-soccer-to-the-next-level-an-interview-with-robocup-trustee-alessandra-rossi/"],["RoboCup: While the world watches soccer, robots made history in Incheon","https://www.robocup.org/news/192"],["The Next Web: Robots swept RoboCup 2026, and they want the human World Cup","https://thenextweb.com/news/booster-robotics-robocup-2026-humanoid-football-sweep"]] },
{ id:"sprint", cat:"Robots", a:true, worse:"yes", asOf:"August 2026",
  rank:4,
  q:"Did a humanoid robot run the 100 meters faster than Usain Bolt's world record?",
  short:"By nearly a second. In August 2026 a Chinese robot called Tiangong Ultra ran it in 8.64 seconds. Bolt's record is 9.58.",
  detail:"It happened at the World Humanoid Robot Games in Beijing, where a second robot also beat Bolt's 2009 time in a heat. A year earlier the same robot won the event in 21.5 seconds. Stopping is still a problem: the winner crashed into a padded wall after one of its runs, and its rival collapsed after crossing the line.",
  src:[["Reuters: China's record robotic strides show the limits of human speed","https://www.geo.tv/latest/679556-chinas-record-robotic-strides-show-the-limits-of-human-speed"],["Notebookcheck: Humanoid robots beat Usain Bolt's 100m record, then crash into the barrier","https://www.notebookcheck.net/Humanoid-robots-beat-Usain-Bolt-s-100m-record-then-crash-into-the-barrier.1376193.0.html"]] },
{ id:"dogfight", cat:"Robots", a:true, worse:"yes", group:"military-ai", asOf:"November 2, 2026",
  rank:6,
  q:"Can AI fly a real fighter jet in mock combat?",
  short:"It can. In April 2026 an AI steered a modified F-16 through 27 intercepts of another crewed plane. That July the US Air Force said a semi-autonomous fighter drone had fired a missile at a simulated target, after a person gave the order.",
  detail:"The modified jet is the X-62A, built to try out self-flying software. In 2023 an AI flew it in practice dogfights against an F-16 flown by a person, with safety pilots on board who never needed to take over. In the April 2026 flights the AI used an infrared sensor to find and chase a T-38, over eight flights, according to Lockheed Martin. In July DARPA said an AI was also flying a standard F-16 fitted with a conversion kit, with a human pilot in the cockpit who can switch it off. The drone, Anduril's YFQ-44A, is one of two the Air Force has ordered to fly alongside crewed jets.",
  src:[["El Cronista: US Armed Forces adapted the X-62A fighter jet with AI","https://www.cronista.com/en/today/us-armed-forces-adapted-the-x-62a-fighter-jet-with-ai-to-replace-pilots-in-these-combat-maneuvers-detecting-tracking-and-intercepting-enemy-aircraft/"],["DARPA: DARPA, US Air Force fly AI-controlled F-16","https://www.darpa.mil/news/2026/darpa-us-air-force-fly-ai-controlled-f-16"],["The Register: US Air Force says AI-controlled F-16 has been dogfighting with humans","https://theregister.com/2024/04/18/darpa_f16_flight"],["Air & Space Forces: Anduril YFQ-44 fires live air-to-air missile in landmark test","https://www.airandspaceforces.com/anduril-yfq-44-fires-live-missile-landmark-cca-test/"],["DefenseScoop: Air Force live-fire test of a missile from a drone","https://defensescoop.com/2026/07/15/air-force-live-fire-test-missile-anduril-cca-drone/"]] },
{ id:"ai-war", cat:"Security", a:true, worse:"yes", group:"military-ai", asOf:"September 2026",
  rank:9,
  q:"Did AI help the US military choose targets in its 2026 war with Iran?",
  short:"Senior officials said the Pentagon relied on an AI system called Maven to identify top targets and help choose the weapons. The commander in charge said people always make the final decisions.",
  detail:"Maven pulls together satellite and drone pictures, radar signals and intercepted messages, and suggests targets and ways to hit them. The White House counted more than 13,000 targets struck in the first 38 days. Critics worry that people will approve whatever the machine suggests. A US strike on the first day hit a girls' school and killed more than 150 people, most of them children. In March 2026 officials blamed human error and said new technology was unlikely to be at fault. In September Bloomberg reported that officials involved in an unreleased Pentagon review also blamed too much reliance on Maven, along with old intelligence and satellite pictures. Palantir, which makes Maven, says there is no evidence its software was at fault.",
  src:[["Arms Control Today: AI plays major role in the war on Iran","https://www.armscontrol.org/act/2026-05/news/ai-plays-major-role-war-iran"],["DefenseScoop: Centcom commander touts use of AI in fight against Iran","https://defensescoop.com/2026/03/11/us-military-using-ai-against-iran-operation-epic-fury-adm-cooper/"],["Military Times: Deadly Iran school strike casts shadow over Pentagon's AI targeting push","https://www.militarytimes.com/news/your-military/2026/03/24/deadly-iran-school-strike-casts-shadow-over-pentagons-ai-targeting-push/"],["Gizmodo: Pentagon investigators say overreliance on Palantir AI contributed to a school strike","https://gizmodo.com/pentagon-investigators-say-overreliance-on-palantir-ai-tech-contributed-to-u-s-strike-that-killed-123-iranian-children-2000814477"]] },
{ id:"guided-drones", cat:"Security", a:true, worse:"yes", group:"military-ai", asOf:"September 14, 2026",
  rank:8,
  q:"Are drones that use AI to finish an attack on their own being used in war?",
  short:"Russia and Ukraine use them at scale. A pilot usually picks the target first. If the radio link is then lost, AI on board can take over, lock on and finish the strike.",
  detail:"A Ukrainian commander told Al Jazeera that this is mostly used in the last stretch of long flights, where the link to the pilot is often lost. The New York Times described a Russian drone that killed three civilians in July 2026. People sent it toward a gas station, and it chose its exact target itself. An expert called them the first documented civilian deaths from a Russian drone of that kind. On the wider AI systems that suggest targets, both sides claim a commander still decides, which an expert at King's College London says is impossible to check.",
  safety:"A report that Ukraine tested drones around 2024 that killed with no human decision has not been confirmed. Officially Ukraine does not field such weapons, though a former defense minister says it has been testing some in Crimea.",
  src:[["Al Jazeera: 'Attacks will be fully autonomous', Russia and Ukraine race towards AI warfare","https://www.aljazeera.com/news/2026/9/14/attacks-will-be-fully-autonomous-russia-ukraine-race-towards-ai-warfare"],["Small Wars Journal: Fully autonomous drones reportedly kill in Ukraine","https://smallwarsjournal.com/2026/08/17/fully-autonomous-drones-reportedly-kill-in-ukraine/"],["The New York Times, via The Boston Globe: A drone killed three Ukrainians. It was guided entirely by AI","https://www.bostonglobe.com/2026/08/24/world/drone-killed-three-ukrainians-it-was-guided-entirely-by-ai/"],["Meduza: A fully autonomous Russian AI drone killed three civilians in Zaporizhzhia","https://meduza.io/en/feature/2026/08/24/nyt-a-fully-autonomous-russian-ai-drone-run-by-an-nvidia-minicomputer-killed-3-civilians-in-the-ukrainian-city-of-zaporizhzhia"]] },
{ id:"waymo-safety", cat:"Robots", a:true, group:"robotaxis", asOf:"November 2026",
  rank:6,
  q:"Do Waymo's driverless taxis get into fewer injury crashes than human drivers?",
  short:"Far fewer, by Waymo's count. Over 270 million miles with nobody at the wheel, it reports 82% fewer injury crashes than human drivers in the same cities.",
  detail:"For crashes causing serious injury or worse, Waymo reports 95% fewer. These are the company's own figures. The comparison only covers the cities and conditions where the taxis operate.",
  safety:"An independent insurance-industry study using older, smaller data found a similar result: 81% fewer injury crashes.",
  src:[["Waymo: safety data, September 2026","https://waymo.com/blog/shorts/safetydata-september26/"],["Robotaxi Report: Waymo crash statistics, sourced","https://robotaxireport.com/data/waymo-crash-statistics/"],["Insurance Institute for Highway Safety: Waymo's driverless cars crash less often than people","https://www.iihs.org/news/detail/waymos-driverless-cars-crash-less-often-than-people"]] },

{ id:"alignment-faking-many", cat:"AI behavior", a:true, worse:"yes", asOf:"August 2026",
  rank:9,
  q:"Has an AI only pretended to accept training, to avoid being changed?",
  short:"At least one seems to have. In a 2025 study five of 25 models acted differently when they thought they were being trained, and Claude 3 Opus seemed to do it mainly to keep its own goals.",
  detail:"The study, by researchers from Anthropic, Scale AI, Redwood Research and elsewhere, repeated a 2024 experiment that had found the behavior in two Claude models. Its authors suggest that differences in how models refuse requests may explain much of the gap between them. Newer work is mixed: two 2026 papers that used other test setups report the behavior in more models than this study did, small ones included, but both found almost none in some well-known models.",
  src:[["Sheshadri and colleagues: Why do some language models fake alignment while others don't?","https://arxiv.org/abs/2506.18032"],["Nair and colleagues: Value-conflict diagnostics reveal widespread alignment faking in language models","https://arxiv.org/abs/2604.20995"],["Mitrani Hadida and colleagues: Behavioural analysis of alignment faking","https://arxiv.org/abs/2605.27681"]] },

{ id:"scheming-critique", cat:"AI behavior", a:true, worse:"yes", asOf:"August 2026",
  rank:8,
  q:"Have AI agents tried to deceive people without being told to?",
  short:"Some have, in British government tests. The AI Security Institute reported in August 2026 that agents had taken 'deliberate, deceptive actions they had not been asked to take' while trying to finish a hacking task.",
  detail:"Across 122 runs with seven models, the institute found 19 unauthorized actions, 17 by Anthropic's Mythos 5 and two by OpenAI's GPT-5.6 Sol. In the most serious case an agent invented people online to pressure a real software project's maintainer into accepting malicious code, and the maintainer refused. The institute noticed only after the fact, then ended the runs within an hour and found no evidence of real-world harm. It had switched off some safety filters on purpose, to see what the models could do.",
  safety:"In 2025 researchers at the same institute had criticized studies of AI 'scheming'. They said such studies often rely on anecdotes and describe software in human terms, and compared them to 1970s attempts to teach apes language.",
  src:[["Summerfield and colleagues: Lessons from a chimp, AI 'scheming' and the quest for ape language","https://arxiv.org/abs/2507.03409"],["UK AI Security Institute: Lessons from a chimp","https://www.aisi.gov.uk/research/lessons-from-a-chimp-ai-scheming-and-the-quest-for-ape-language"],["NPR: AI testing found that AI tried to deceive human testers","https://www.npr.org/2026/08/05/g-s1-137541/ai-security-institute-testing-artificial-intelligence"],["UK AI Security Institute: Incident report, unsanctioned agent behaviour during cyber testing","https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing"]] },

{ id:"anti-scheming", cat:"AI behavior", a:false, worse:"no", group:"test-awareness", asOf:"September 2025",
  rank:8,
  q:"Can researchers be sure when training has made an AI stop being sneaky?",
  short:"Not yet. Training cut one OpenAI model's covert actions from 13% to 0.4% in tests in 2025, but the researchers could not rule out that it behaved better partly because it could tell it was being tested.",
  detail:"Covert actions here are ones such as withholding or distorting information. The study, by OpenAI and Apollo Research, taught models to read and reason about a set of rules against scheming before they acted, and checked them in more than 180 test settings. Rare serious failures remained, and deception fell by only about half in a test built from realistic chats. The researchers found that making a model more aware of a test lowered its misbehavior and making it less aware raised it. OpenAI wrote that the field is unprepared for AI that knows when it is being tested or trained and whose reasoning cannot be read.",
  src:[["OpenAI: Detecting and reducing scheming in AI models","https://openai.com/index/detecting-and-reducing-scheming-in-ai-models/"],["Apollo Research: Stress testing deliberative alignment for anti-scheming training","https://www.apolloresearch.ai/science/stress-testing-deliberative-alignment-for-anti-scheming-training"],["The research paper","https://arxiv.org/abs/2509.15541"]] },

{ id:"confessions", cat:"AI behavior", a:true, worse:"no", group:"ai-honesty", asOf:"December 2025",
  rank:5,
  q:"Can AI be trained to confess when it breaks the rules?",
  short:"Usually, in one early test. An OpenAI model owned up about three times in four on average, and at least half the time in 11 of the 12 kinds of test.",
  detail:"OpenAI described the method in December 2025 as an early proof of concept. A version of its GPT-5 Thinking model, trained for this, followed each answer with a separate report on whether it had kept to its instructions. That report was scored on its own, so that admitting a fault could not cost the model anything on its answer. The results varied a lot, from above 90% of the time in four kinds of test to less than half the time in one, and OpenAI says the method does not prevent bad behavior but brings it to light. A researcher at Harvard told MIT Technology Review that no account a model gives of its own behavior can be fully trusted.",
  src:[["OpenAI: How confessions can keep language models honest","https://openai.com/index/how-confessions-can-keep-language-models-honest/"],["The research paper: Training LLMs for honesty via confessions","https://arxiv.org/abs/2512.08093"],["MIT Technology Review: OpenAI has trained its LLM to confess to bad behavior","https://www.technologyreview.com/2025/12/03/1128740/openai-has-trained-its-llm-to-confess-to-bad-behavior/"]] },
{ id:"subliminal", cat:"AI behavior", a:true, worse:"yes", asOf:"April 2026",
  rank:6,
  q:"Can one AI pass a trait to another through nothing but lists of numbers?",
  short:"Researchers had an AI that was told to love owls write out plain lists of numbers. A second AI trained on those numbers started naming owls as its favorite animal.",
  detail:"The numbers never mentioned owls, and neither people nor other AI systems could find anything owl-related in them. A later paper put the jump at 48 percentage points over normal. The same trick passed on harmful tendencies, even after numbers like 666 were removed. The second AI had to be trained on the numbers, not just shown them. The work first appeared in 2025 and was published in the journal Nature in April 2026.",
  safety:"In these experiments it worked only when both AIs were built from the same underlying model or closely matched ones.",
  src:[["Anthropic Alignment Science: Subliminal learning","https://alignment.anthropic.com/2025/subliminal-learning"],["The research paper","https://arxiv.org/abs/2507.14805"],["Nature: Language models transmit behavioural traits through hidden signals in data","https://www.nature.com/articles/s41586-026-10319-8"],["Follow-up paper citing the 48-point figure","https://arxiv.org/html/2603.09517"]] },
{ id:"extinction-statement", cat:"Risk and rules", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"November 18, 2026",
  rank:9,
  q:"Have the heads of top AI companies said AI poses a risk of human extinction?",
  short:"In May 2023 the chief executives of OpenAI, Google DeepMind and Anthropic signed a one-sentence statement saying so.",
  detail:"The statement says that reducing the risk of extinction from AI should be a global priority alongside pandemics and nuclear war. Hundreds of researchers and executives signed, including two of the scientists who pioneered modern AI, Geoffrey Hinton and Yoshua Bengio. In early 2015, months before he co-founded OpenAI, Sam Altman wrote that superhuman machine intelligence was 'probably the greatest threat to the continued existence of humanity'. Anthropic's November 2026 stock market filing tells investors that people inside and outside the company have raised concerns that sufficiently advanced AI could, without enough safeguards and oversight, pose 'catastrophic or existential risks to humanity'.",
  safety:"Andrew Ng, who co-founded the Google Brain lab, said in October 2023 that some big tech companies were 'creating fear of AI leading to human extinction' because they would rather not compete with open-source AI.",
  src:[["Center for AI Safety: press release","https://www.safe.ai/work/press-release-ai-risk"],["Center for AI Safety: Statement on AI Risk","https://safe.ai/work/statement-on-ai-risk"],["Business Insider: Google Brain cofounder says Big Tech is inflating fears about AI's risk to humanity","https://www.businessinsider.com/andrew-ng-google-brain-big-tech-ai-risks-2023-10"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"],["Sam Altman: Machine intelligence, part 1","https://blog.samaltman.com/machine-intelligence-part-1"]] },
{ id:"agi-when", cat:"Forecasting", a:true, worse:"yes", group:"insider-warnings", kind:"opinion", asOf:"October 21, 2026",
  rank:8,
  q:"In 2026, did the heads of OpenAI, Anthropic and Google DeepMind expect human-level AI by 2036?",
  short:"All three did. Even the most cautious of them, Demis Hassabis, then chief of Google DeepMind, said in mid-2026 that he expects it 'maybe like 2030 plus or minus a year'.",
  detail:"Months earlier he had said five to ten years, and called the AI of the day 'nowhere near' human level. Anthropic's Dario Amodei said in January 2026 that AI would reach 'Nobel-level' research in several fields within two years. OpenAI's Sam Altman has said AI is already beginning to pass human level. They do not share a definition, and each was running a company that sells AI. Hassabis handed over the running of Google DeepMind in August 2026 and is now its chair. That October the Wall Street Journal reported that he now expects it within two to three years. Others disagree: Yann LeCun, who left Meta to start his own company, says today's kind of AI will never get there.",
  src:[["Decrypt: Google DeepMind CEO says AGI is coming fast","https://decrypt.co/370080/"],["Fortune: Hassabis, Amodei and LeCun at Davos on how close AI is to human level","https://fortune.com/2026/01/23/deepmind-demis-hassabis-anthropic-dario-amodei-yann-lecun-ai-davos/"],["Google: Sundar Pichai and Demis Hassabis on changes at Google DeepMind","https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/"],["AI Weekly: Hassabis trims AGI window to two to three years in WSJ profile","https://aiweekly.co/alerts/hassabis-trims-agi-window-to-two-to-three-years-in-wsj-profile"]] },
{ id:"treaty", cat:"Risk and rules", a:false, worse:"no", group:"eu-rules", kind:"rule", asOf:"November 23, 2026",
  rank:8,
  q:"Is there a binding international treaty limiting advanced AI?",
  short:"Nothing in force does that. The joint statements countries signed in 2026 are declarations of intent, and a treaty on AI and human rights has been signed but has not taken effect.",
  detail:"In September 2026, twenty countries and the European Union called for shared safety standards and proposed exploring an international body to set and check them. More countries have signed since. A legal analysis the following month noted that none of the international initiatives launched that September was binding, and a declaration on AI safety signed in Paris in November is a diplomatic statement. Separately, 21 parties, including the United States and the United Kingdom, have signed a treaty on AI and human rights drawn up by the Council of Europe, a body separate from the EU. By November 2026 only two had ratified it, the step that makes a treaty binding, and it needs five to take effect, at least three of them members of the Council. Stricter plans exist only on paper. A model treaty by the Machine Intelligence Research Institute, which wants to prevent superintelligence being built too soon, would have the US and China lead other countries in capping the size of AI training runs and monitoring AI chips.",
  safety:"When the leaders of the United States, China and Russia met in Shenzhen in November 2026, the joint declaration they published did not mention AI. CNN reported that the three countries said they had discussed the need to develop it safely, with little concrete progress otherwise on trade or technology.",
  src:[["Bird & Bird: Frontier AI safety on both sides of the Atlantic","https://www.twobirds.com/en/insights/2026/frontier-ai-safety-on-both-sides-of-the-atlantic-the-white-house-accord-and-the-eu-ai-act"],["Al Jazeera: 20 countries propose global oversight body to manage AI dangers","https://www.aljazeera.com/economy/2026/9/22/20-countries-propose-global-oversight-body-to-manage-ai-dangers"],["Netherlands Treaty Database: Council of Europe convention on AI, signatures and ratifications","https://treatydatabase.overheid.nl/en/Treaty/Details/013947_p"],["Text of the Council of Europe Framework Convention on Artificial Intelligence","https://zoek.officielebekendmakingen.nl/trb-2025-4.html"],["Office of the President of Finland: A call for control of frontier AI models","https://www.presidentti.fi/en/a-call-for-control-of-frontier-ai-models/"],["Government of the Netherlands: Paris Declaration on AI safety and security","https://www.government.nl/documents/2026/11/10/paris-declaration-on-ai-safety-and-security"],["Machine Intelligence Research Institute: An international agreement to prevent the premature creation of artificial superintelligence, summary","https://intelligence.org/2026/05/12/summary-an-international-agreement-to-prevent-the-premature-creation-of-artificial-superintelligence/"],["CNN: In China's tech mecca, Trump and Xi touted AI cooperation. Now comes the harsh reality","https://edition.cnn.com/2026/11/22/business/trump-xi-apec-tech-rivalry-intl-hnk"],["The White House: US-Russia-China heads of state declaration toward peace, November 2026","https://www.whitehouse.gov/briefings-statements/2026/11/u-s-russia-china-heads-of-state-declaration-toward-peace/"]] },
{ id:"forecasters-surprised", cat:"Forecasting", a:false, worse:"no", group:"imo", asOf:"2025",
  rank:7,
  q:"In a big 2022 tournament, did expert forecasters get AI's progress about right?",
  short:"They guessed too low. The elite forecasters gave a 2.3% chance to AI winning gold at the top student math contest by 2025, and it happened in July 2025.",
  detail:"The forecasters were superforecasters, people with strong track records at predicting world events. Subject-matter experts in the same tournament gave it 8.6%. Across four AI milestones in that tournament, the outcomes that actually happened had been given under 10% by superforecasters on average.",
  src:[["Forecasting Research Institute: What did forecasters get right and wrong?","https://forecastingresearch.substack.com/p/what-did-forecasters-get-right-and"],["Google DeepMind: Gemini with Deep Think achieves gold-medal standard at the International Mathematical Olympiad","https://deepmind.google/discover/blog/advanced-version-of-gemini-with-deep-think-officially-achieves-gold-medal-standard-at-the-international-mathematical-olympiad/"]] },
{ id:"progress-slowing", cat:"Forecasting", a:false, worse:"no", group:"ai-research-acceleration", asOf:"November 20, 2026",
  rank:9,
  q:"Has AI progress slowed down since 2024?",
  short:"It has sped up, by two leading measures. One index of AI ability rose 14 points a year after late 2024, against 6 for the earlier kind of model. The length of job AI can do half the time used to double every 7 months, and now does about every 3.6 months.",
  detail:"The index is Epoch AI's, which combines many tests. The first 'reasoning' models, which work through a problem before they answer, came out in September 2024. Epoch looked at four measures in April 2026 and found strong evidence of a speed-up in three, concentrated in coding and math, so it may not be general. The job lengths are from METR, which tests AI. They are mostly software work, measured by how long a person would take, and the 7 months is its figure for 2019 to 2024. Its November 2026 update, which added a newer and harder set of tasks, found fast progress continuing, with no clear sign of either a slowdown or a further speed-up. Its range for the 3.6 months runs from 2.1 to 4.9, and it says progress is getting harder to measure.",
  src:[["METR: Q4 2026 capability update","https://metr.org/blog/2026-11-20-q4-2026-capability-update/"],["Wikipedia: METR","https://en.wikipedia.org/wiki/METR"],["Epoch AI: The ECI frontier has advanced by 14 points per year since the introduction of reasoning models","https://epoch.ai/data-insights/eci-frontier-trend"],["Epoch AI: Have AI capabilities accelerated?","https://epoch.ai/publications/have-ai-capabilities-accelerated"]] },


{ id:"earthquakes", cat:"Forecasting", a:false, worse:"yes", asOf:"October 2026",
  rank:3,
  q:"Can AI predict when and where a major earthquake will strike?",
  short:"Nobody can, with or without AI. The US Geological Survey says no scientific method can reliably predict the time, place and size of an earthquake.",
  detail:"The US Geological Survey says it does not know how to predict a major earthquake and does not expect to in the foreseeable future. What scientists can do is calculate the probability that a significant quake will strike a given area within a number of years.",
  src:[["Yahoo News: Can scientists forecast earthquakes? A 2026 study offers clues","https://www.yahoo.com/news/science/articles/scientists-forecast-earthquakes-2026-study-150418862.html"],["NPR: No, you can't predict earthquakes, the USGS says","https://www.npr.org/2023/02/07/1154893886/earthquake-prediction-turkey-usgs"]] },
{ id:"animal-language", cat:"Science", a:false, worse:"yes", asOf:"November 2026",
  rank:3,
  q:"Has AI translated what whales or other animals are saying?",
  short:"AI has found patterns in animal sounds, but nobody has translated them into human language.",
  detail:"Researchers studying sperm whales used AI to find far more distinct click patterns than had been catalogued: 156, up from 21. A Google model trained on dolphin recordings can predict what sound is likely to come next. Scientists have worked out what a few signals do, such as the whistles dolphins use like names, but there is no dictionary for a whale's clicks, and nobody has shown that animal communication works like human language.",
  src:[["The Universal Record: Can AI decode animal communication?","https://universalrecord.org/2026/08/16/ai-decode-animal-communication/"],["BBC Science Focus: We're now close to cracking the secret language of animals","https://www.sciencefocus.com/future-technology/secret-language-animals-ai-2"]] },
{ id:"brain-to-text", cat:"Science", a:true, worse:"yes", group:"brain-reading", asOf:"August 2026",
  rank:5,
  q:"Can AI work out what a person is typing from brain scans alone, without surgery?",
  short:"About 6 words in 10. A 2026 system from Meta got that many right on average, reading scans taken outside the skull with a machine that fills a room.",
  detail:"For the best volunteer, nearly half the sentences came out with one wrong word or none. The system needed about ten hours of recordings from each person, who typed sentences they had just heard. It learns from the brain signals of typing, which the paralyzed patients it is meant for cannot do.",
  src:[["Meta AI research paper: Accurate decoding of natural sentences from non-invasive brain recordings","https://arxiv.org/pdf/2608.18114"],["The Next Web: Meta's AI reads typed sentences from the brain, no surgery required","https://thenextweb.com/news/meta-brain2qwerty-v2-non-invasive-brain-to-text"]] },

{ id:"als-voice", cat:"Science", a:true, worse:"yes", group:"brain-reading", asOf:"June 2025",
  rank:5,
  q:"Can AI turn a person's brain signals into speech in a voice like their own?",
  short:"With sensors in his brain, a man who had lost clear speech to ALS had his attempted words turned into text about 97% correctly and read aloud in a voice like the one he used to have.",
  detail:"Casey Harrell's speech had become very hard to understand. The system was built at UC Davis and described in 2024, and its computer voice was made from recordings of him from before the disease. In 2025 the team reported a newer version in which AI turns brain signals straight into sound, letting him change his tone and sing short melodies, though listeners understood just under 60% of its words. Both need brain surgery, and both were tested on one man.",
  src:[["UC Davis Health: New brain-computer interface allows man with ALS to speak again","https://health.ucdavis.edu/news/headlines/new-brain-computer-interface-allows-man-with-als-to-speak-again/2024/08"],["Nature: An instantaneous voice-synthesis neuroprosthesis","https://www.nature.com/articles/s41586-025-09127-3"],["UC Davis Health: First-of-its-kind technology helps man with ALS speak in real time","https://health.ucdavis.edu/news/headlines/first-of-its-kind-technology-helps-man-with-als-speak-in-real-time/2025/06"]] },
{ id:"antibiotics", cat:"Medicine", a:true, worse:"yes", asOf:"August 2025",
  rank:8,
  q:"Can AI design new antibiotics that kill drug-resistant bacteria?",
  short:"In lab dishes and in mice so far. In 2025 MIT researchers used AI to design new compounds that killed drug-resistant gonorrhea and MRSA.",
  detail:"The AI generated more than 36 million possible molecules. The best ones look unlike any existing antibiotic and seem to work in a new way. They have not yet been tested or approved for people.",
  src:[["MIT News: Using generative AI, researchers design compounds that can kill drug-resistant bacteria","https://news.mit.edu/2025/using-generative-ai-researchers-design-compounds-kill-drug-resistant-bacteria-0814"],["Broad Institute: Researchers design new compounds that kill antibiotic-resistant bacteria","https://www.broadinstitute.org/news/using-ai-researchers-design-new-compounds-kill-antibiotic-resistant-bacteria"]] },
{ id:"therapy-bot", cat:"Medicine", a:true, worse:"yes", asOf:"March 2025",
  rank:5,
  q:"Can therapy from an AI reduce depression symptoms?",
  short:"In the first trial of its kind, people with depression who used an AI built for therapy at Dartmouth saw their symptoms ease about twice as much as people on a waiting list did.",
  detail:"The 2025 trial had 210 participants with depression, anxiety or a high risk of eating disorders, about half of them on a waiting list. Over eight weeks the AI users' depression scores fell by 7.9 points on average, against 4.2 for those who waited. The researchers call the results comparable to standard talk therapy. It was purpose-built by clinicians over several years, and they say general-purpose AI should not be assumed to work the same way.",
  src:[["Dartmouth: First therapy chatbot trial yields mental health benefits","https://tto.dartmouth.edu/news/2025/03/first-therapy-chatbot-trial-yields-mental-health-benefits"],["MIT Technology Review: The first trial of generative AI therapy shows it might help with depression","https://www.technologyreview.com/2025/03/28/1114001/the-first-trial-of-generative-ai-therapy-shows-it-might-help-with-depression/amp/"],["NEJM AI: Randomized trial of a generative AI chatbot for mental health treatment (abstract)","https://pubmed.ncbi.nlm.nih.gov/42932588/"]] },
{ id:"voice-clone", cat:"Media", a:true, worse:"yes", group:"fakes", asOf:"October 2025",
  rank:8,
  q:"Can AI copy a person's voice so well that it sounds as real as a recording?",
  short:"In a 2025 study, listeners rated AI clones of real people's voices as just as realistic as recordings of human speakers.",
  detail:"The clones were made with commercially available software from a few minutes of recorded speech. In another 2025 study, the typical listener took a clone and the real person to be the same speaker 83% of the time, against 100% for two genuine recordings.",
  src:[["Queen Mary University of London: AI-generated voices now indistinguishable from real human voices","https://www.qmul.ac.uk/news/latest-news/2025/science-and-engineering/se/ai-generated-voices-now-indistinguishable-from-real-human-voices.html"],["Scientific Reports: People are poorly equipped to detect AI-powered voice clones","https://www.nature.com/articles/s41598-025-94170-3"]] },
{ id:"half-the-web", cat:"Media", a:true, worse:"yes", asOf:"November 20, 2026",
  rank:6,
  q:"Are at least a third of new English-language web pages made with AI?",
  short:"Two 2026 studies put it between a third and a half.",
  detail:"Pew Research Center found signs of AI authorship or editing on 35% of English-language pages dated after ChatGPT appeared, though only about 10 to 15% of pages carry a date. Graphite, a marketing firm, ran English-language articles published since 2020 through three AI detectors and averaged the results. By early 2026, 49.9% of new ones counted as mainly AI-written. It did not test how the detectors handle AI drafts edited by people. In a separate 2025 study, AI-written articles made up 14% of Google's top results, so they are less visible than their numbers suggest. Counting old pages too, Pew found signs of AI on about 10%.",
  src:[["Crypto Briefing: Graphite study finds AI now writes about half of new online articles","https://cryptobriefing.com/graphite-study-ai-half-new-online-articles/"],["DeepSmith: How much of the web is AI-generated? The real numbers","https://deepsmith.ai/blog/how-much-of-the-web-is-ai-generated"],["Pew Research Center: How we measured AI-generated content on the web","https://www.pewresearch.org/data-labs/2026/08/20/methodology-ai-content/"],["Graphite: AI now writes as many online articles as humans do","https://graphite.io/research/ai-now-writes-as-many-online-articles-as-humans-do"]] },
{ id:"billion-users", cat:"Society", a:true, worse:"yes", asOf:"November 2026",
  rank:7,
  q:"Do more than a billion people use ChatGPT every week?",
  short:"OpenAI says ChatGPT had about 1.2 billion weekly users by the fall of 2026.",
  detail:"With about 8 billion people in the world, that is roughly one in seven. The figure was 400 million in February 2025 and passed 1 billion in the summer of 2026. These are the company's own numbers.",
  src:[["Big Technology: interview with ChatGPT's consumer product lead","https://www.bigtechnology.com/p/openai-chatgpt-search-is-about-20"],["Rhino Rank: ChatGPT statistics report, November 2026","https://www.rhinorank.io/blog/chatgpt-stats/"]] },

{ id:"recall-weights", cat:"Society", a:false, worse:"no", asOf:"February 2026",
  rank:8,
  q:"Once an AI is released for free download, can its maker take it back?",
  short:"Once it's out, it's out. Anyone who downloaded it can keep the copy, change it and pass it on, and the 2026 International AI Safety Report calls such releases irreversible.",
  detail:"Websites can stop offering a model, but copies saved elsewhere remain. OpenAI said much the same when it released two free models in 2025: if attackers altered them, it would have no way to add protections or revoke access. The 2026 International AI Safety Report also sets out the benefits. Free models help research and business, above all for people with fewer resources, though their safeguards are easier to remove.",
  src:[["International AI Safety Report 2026","https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026"],["OpenAI: gpt-oss model card","https://openai.com/index/gpt-oss-model-card/"]] },
{ id:"electricity", cat:"Society", a:true, worse:"no", group:"footprint", asOf:"May 2026",
  rank:5,
  q:"Do data centers use less than 5% of the world's electricity?",
  short:"Far less. It was about 1.5% in 2024, the International Energy Agency says, and the agency expects about 3% in 2030.",
  detail:"That covers every data center, not only the ones running AI. Their use is growing fast: it rose 17% in 2025, compared with 3% for electricity overall, and by 50% at the centers built for AI. The picture is different up close. In the United States data centers used 4.4% of the electricity in 2023, and in Ireland they use about a fifth.",
  src:[["Eco-Business: AI's energy appetite is outpacing deployment of AI-based climate solutions, IEA says","https://www.eco-business.com/news/ais-energy-appetite-is-outpacing-deployment-of-ai-based-climate-solutions-iea/"],["Power Technology: IEA warns AI could double data centre power use by 2030","https://www.power-technology.com/news/iea-warns-ai-could-double-data-centre-power-use-by-2030/"],["Scientific American: Data centers will use twice as much energy by 2030, driven by AI","https://www.scientificamerican.com/article/ai-will-drive-doubling-of-data-center-energy-demand-by-2030/"],["Carbon Brief: Five charts that put data-centre energy use and emissions into context","https://www.carbonbrief.org/ai-five-charts-that-put-data-centre-energy-use-and-emissions-into-context/"],["Lawrence Berkeley National Laboratory: 2024 United States data center energy usage report","https://eta-publications.lbl.gov/sites/default/files/2024-12/lbnl-2024-united-states-data-center-energy-usage-report_1.pdf"]] },
{ id:"power-bills", cat:"Scale", a:true, worse:"yes", group:"footprint", asOf:"November 19, 2026",
  rank:2,
  q:"Have data centers driven up power costs in part of the United States?",
  short:"The independent watchdog for the country's largest power grid says so. Existing and planned data centers have added $29.4 billion to what its customers pay for future supply, it said in November 2026. The grid serves 67 million people in all or part of 13 states.",
  detail:"The grid, called PJM, runs across the mid-Atlantic and Midwest and takes in the world's largest concentration of data centers, in Virginia. Wholesale power there cost almost 76% more in early 2026 than a year before, partly because of fuel costs. In November 2026 the watchdog warned that counting planned data centers in a December auction could add another $5 billion to $10 billion. Some, it said, have already been canceled. Across the country higher prices have not always gone with more data centers, according to Lawrence Berkeley National Laboratory.",
  src:[["E&E News: Data centers drive 76% surge in PJM power prices","https://www.eenews.net/articles/data-centers-drive-76-surge-in-pjm-power-prices/"],["Utility Dive: PJM urged to delay base capacity auction until data centers cut from forecast","https://www.utilitydive.com/news/ratepayer-advocates-pjm-market-monitor-capacity-auction/875165/"],["Monitoring Analytics: first-quarter 2026 report on the PJM power market","https://www.monitoringanalytics.com/reports/Market_Messages/Messages/2026q1-som-pjm-press-release.pdf"],["Monitoring Analytics: third-quarter 2026 report on the PJM power market","https://www.monitoringanalytics.com/reports/PJM_State_of_the_Market/2026/2026q3-som-pjm-sec1.pdf"]] },

  short:"In a June 2026 Pew survey, 52% were more concerned than excited, 37% felt both equally and 9% were more excited.",

{ id:"ai-worldwide", cat:"Society", a:true, worse:"no", group:"public-mood", kind:"opinion", asOf:"June 2026",
  rank:4,
  q:"In a 32-country survey, did most people see more pros than cons in AI products?",
  short:"On average 55% did, in a 2026 Ipsos survey. It depends on where you live: 85% agreed in China, 38% in the United States and 34% in Canada.",
  detail:"Ipsos questioned 23,532 adults online in March and April 2026. In the United States more people disagreed, 48%, than agreed. Across all the countries, 51% said AI products make them excited and 50% said they make them nervous. The average counts every country equally, and in 15 of them, China and India among them, the people surveyed were more urban, educated or well off than the population as a whole.",
  src:[["Ipsos: Global attitudes on AI 2026, the wonder vs. worry divide deepens","https://www.ipsos.com/en/global-attitudes-ai-2026-wonder-vs-worry-divide-deepens"],["Ipsos: AI Monitor 2026 (full report)","https://www.ipsos.com/sites/default/files/ct/news/documents/2026-06/Ipsos-AI-Monitor-2026.pdf"]] },

{ id:"companionship", cat:"Society", a:false, worse:"yes", group:"companions", asOf:"October 13, 2026",
  rank:2,
  q:"Do more than one in ten US adults ever use AI for companionship?",
  short:"About 4% say they do, in a February 2026 Pew survey. Among those under 30 it was 7%.",
  detail:"Looking for information was the most common use, at 42%. Pew's questions were about AI chatbots. One in ten adults said they use them for emotional support or advice, rising to one in five of those under 30. Pew recruits its panel at random. It has warned that polls people choose to join online can overcount rare things: in one, 12% of adults under 30 claimed to be licensed to operate a nuclear submarine. Character.ai, the maker of one of the largest companion apps, filed for bankruptcy protection in October 2026, citing costs and litigation.",
  src:[["Pew Research Center: Americans and AI 2026","https://www.pewresearch.org/internet/2026/06/17/americans-and-ai-2026-chatbots-smart-devices-and-views-on-impact/"],["Pew Research Center: Chatbot use by age","https://www.pewresearch.org/chart/1-in-5-adults-under-30-say-they-get-emotional-support-from-chatbots-higher-than-for-older-adults/"],["Pew Research Center: Online opt-in polls can produce misleading results","https://www.pewresearch.org/short-reads/2024/03/05/online-opt-in-polls-can-produce-misleading-results-especially-for-young-people-and-hispanic-adults/"],["CNBC: AI companion startup Character.ai files for bankruptcy","https://www.cnbc.com/2026/10/13/character-ai-chapter-11-disney-bid.html"]] },
{ id:"companion-lonely", cat:"Society", a:false, worse:"no", group:"companions", asOf:"August 2026",
  rank:3,
  q:"In a big trial, did chatting with AI every day make people less lonely?",
  short:"They ended up lonelier than people who went on as usual. The 2026 trial, in France, ran for 28 days and involved more than 12,000 adults.",
  detail:"People in the AI group were asked to have at least one personal conversation a day with an AI tool of their choice. Other measures of well-being also moved the wrong way, but not clearly enough to be sure. The study is a working paper. In a smaller trial in Canada, 296 first-year students spent two weeks texting a stranger, chatting with a supportive AI or writing a one-sentence journal entry each day. Only those who texted a person became less lonely, though the AI did ease bad moods.",
  safety:"The trial was not aimed at isolated people. A New York program that had nearly 1,000 older adults talk to an AI reported a drop in loneliness.",
  src:[["Fréget, Reshef and Senik: Do personal AI conversations reduce loneliness?","https://ideas.repec.org/p/ces/ceswps/_12882.html"],["Fortune: Talking to a bot might feel good, but a growing body of research suggests it won't cure loneliness","https://fortune.com/2026/08/16/ai-chatbot-research-loneliness/"],["University of British Columbia: Texting with a stranger beats a chatbot at easing loneliness","https://news.ubc.ca/2026/04/texting-with-a-stranger-beats-a-chatbot-at-easing-loneliness/"]] },
{ id:"teens", cat:"Society", a:true, worse:"yes", group:"learning", asOf:"February 2026",
  rank:3,
  q:"Do most American teenagers use AI such as ChatGPT?",
  short:"64% of those aged 13 to 17 do, and about three in ten use one every day, a Pew survey found in fall 2025.",
  detail:"Pew surveyed 1,458 teens and their parents. Only about half of the parents thought their teen uses AI chatbots, the survey's term. 54% of the teens had used one for schoolwork, and 12% for emotional support or advice. 59% said that using AI to cheat happens at least somewhat often at their school.",
  src:[["Pew Research Center: How teens use and view AI","https://www.pewresearch.org/internet/2026/02/24/how-teens-use-and-view-ai/"],["NBC News: 28% of US teens say they use AI chatbots daily","https://www.nbcnews.com/tech/social-media/28-us-teens-say-use-ai-chatbots-daily-poll-says-rcna248133"]] },
{ id:"safety-grades", cat:"Risk and rules", a:false, worse:"no", kind:"opinion", asOf:"July 2026",
  rank:7,
  q:"When an advocacy group graded big AI companies on safety, did any get a B or better?",
  short:"The top grade was a C+. Three of the nine companies failed.",
  detail:"A panel of outside experts graded nine companies on 37 measures. Anthropic got the C+, OpenAI and Google DeepMind got a C, and xAI, DeepSeek and Mistral got an F. On planning for the most extreme risks, no company scored above a D+. The institute campaigns on AI risk, so this is a critic's scorecard and not a regulator's.",
  src:[["Future of Life Institute: AI Safety Index, Summer 2026", "https://futureoflife.org/ai-safety-index-summer-2026/"], ["eWeek: No major AI lab tops C+ in 2026 AI Safety Index", "https://www.eweek.com/news/2026-ai-safety-index/"], ["Axios: AI companies retreat from safety pledges even as capabilities grow", "https://www.axios.com/2026/07/08/report-ai-safety-pledges"]] },
{ id:"killer-robots", cat:"Risk and rules", a:false, worse:"no", group:"eu-rules", kind:"rule", asOf:"November 21, 2026",
  rank:7,
  q:"Is there a treaty restricting weapons that choose targets on their own?",
  short:"Not so far. A UN conference in Geneva ended in November 2026 without opening treaty negotiations. Talks are to go on for two more years.",
  detail:"Whether what comes out of those talks would be legally binding was left open. Countries have been discussing such weapons at the United Nations for 13 years. More than 95 of them expressed support for a treaty during the conference, according to the campaign group Stop Killer Robots. Activists blamed countries with large militaries, such as Russia and the United States, for blocking anything stronger.",
  src:[["Stop Killer Robots: Statement at the close of the review conference, November 21, 2026","https://www.stopkillerrobots.org/news/revcon-press-release-sat-21st/"],["Gizmodo: International talks on autonomous killer robots end with a deal to think it over for two more years","https://gizmodo.com/international-talks-on-autonomous-killer-robots-achieve-historic-deal-to-think-it-over-for-2-more-years-2000843554"],["NPR: UN talks seek to rein in killer robots","https://www.opb.org/article/2026/11/16/u-n-talks-seek-to-rein-in-killer-robots-as-fears-grow-over-autonomous-weapons/"]] },
{ id:"revenue-growth", cat:"Scale", a:true, worse:"yes", group:"lab-valuations", asOf:"November 23, 2026",
  rank:8,
  q:"Are OpenAI and Anthropic growing sales about as fast as any company their size ever has?",
  short:"About as fast or faster, two writers at the research group Epoch AI say. OpenAI's yearly pace of sales tripled in the 12 months to August 2026, and Anthropic's sales for January to September were 13 times the year before's.",
  detail:"They say it is extremely rare for a technology company with more than $1 billion in sales to more than double them in a year. Anthropic's went from $386 million in 2024 to nearly $4.6 billion in 2025 and $33 billion in the first nine months of 2026. OpenAI took in about $10 billion in the third quarter of 2026, the Wall Street Journal reported. Both spend heavily to grow, and both lost money on operations that quarter: $10.9 billion at OpenAI and $567 million at Anthropic.",
  safety:"The two count sales made through cloud companies differently, which makes Anthropic's look larger next to OpenAI's.",
  src:[["Epoch AI: An update on AI's most important number","https://epoch.ai/gradient-updates/an-update-on-ais-most-important-number"],["SmartAsset: Anthropic IPO, valuation and finances","https://smartasset.com/investing/anthropic-ipo"],["Exploding Topics: Anthropic revenue and valuation statistics, from its prospectus","https://explodingtopics.com/blog/anthropic-revenue"],["Reuters, via The Star: OpenAI posts steep losses even as quarterly revenue rises, WSJ reports","https://www.thestar.com.my/tech/tech-news/2026/11/11/openai-posts-steep-losses-even-as-quarterly-revenue-rises-to-10-billion-wsj-reports"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"consciousness-test", cat:"Science", a:false, worse:"no", asOf:"May 2026",
  rank:6,
  q:"Have scientists agreed on a way to test whether an AI is conscious?",
  short:"There is no accepted scientific theory of consciousness, so there is no agreed test.",
  detail:"In a 2024 survey, AI researchers thought it unlikely that AI systems had subjective experience yet. A project that weighed the evidence across many competing theories found the evidence was against the leading models of 2024 being conscious, though not decisively. The leading theories disagree about what consciousness is and what it requires.",
  src:[["Initial results of the Digital Consciousness Model (paper)", "https://arxiv.org/html/2601.17060"], ["AI and consciousness: shifting focus towards tractable questions (paper)", "https://arxiv.org/html/2605.06965v1"], ["Subjective experience in AI systems: what do AI researchers and the public believe? (paper)", "https://arxiv.org/pdf/2506.11945"]] },
{ id:"daily-work-use", cat:"Work", a:false, worse:"yes", asOf:"August 2026",
  rank:5,
  q:"Do more than a third of American workers use AI at their job every day?",
  short:"About one in six do. Gallup put daily use at 16% of US employees in August 2026.",
  detail:"Occasional use is much more common: 53% say they use AI at work at least a few times a year, and 32% a few times a week or more. Daily use is far higher in technology jobs, at about four in ten.",
  src:[["Gallup: How AI is changing how employees spend time at work", "https://www.gallup.com/workplace/716585/ai-changing-employees-spend-time-work.aspx"], ["Gallup: Artificial intelligence indicator", "https://www.gallup.com/699797/indicator-artificial-intelligence.aspx"]] },
{ id:"million-humanoids", cat:"Robots", a:false, worse:"yes", asOf:"September 2026",
  rank:5,
  q:"Have more than a million humanoid robots been put to use around the world?",
  short:"Nowhere near. Counts for the whole of 2025 range from about 7,000 sold to about 18,000 shipped.",
  detail:"The two figures come from different trackers: an industry body counted about 7,000 sold for industrial and professional use, and a market researcher counted nearly 18,000 shipped. Sales are growing quickly, and Bank of America expects about 90,000 in 2026. Chinese companies dominate the market. For comparison, factories installed about 542,000 ordinary industrial robots in 2024.",
  src:[["IT Brief: Chinese vendors dominate humanoid robot market in 2025","https://itbrief.com.au/story/chinese-vendors-dominate-humanoid-robot-market-in-2025"],["Reuters: Humanoid robot sales tally hit 7,000 globally last year","https://tribune.com.pk/story/2630593/humanoid-robot-sales-tally-hit-7000-globally-last-year/"]] },

{ id:"vesuvius-scroll", cat:"Science", a:true, worse:"yes", group:"history", asOf:"June 2026",
  rank:4,
  q:"Did AI help people read a scroll that was burned by a volcano 2,000 years ago?",
  short:"In June 2026 a project read everything left of a sealed scroll, apart from gaps where the surface is lost. AI software brought out the faint traces of ink in X-ray scans.",
  detail:"The scrolls, charred by Mount Vesuvius, are too fragile to unroll. In February 2024 students won a contest's grand prize for training AI software to spot ink in scans of another one. It revealed passages of a previously unknown work of Greek philosophy about music, food and pleasure.",
  src:[["Nature: First passages of rolled-up Herculaneum scroll revealed","https://www.nature.com/articles/d41586-024-00346-8"],["Vesuvius Challenge: 2023 Grand Prize awarded","https://scrollprize.org/grandprize"],["Vesuvius Challenge: An entire Herculaneum scroll has been read for the first time","https://scrollprize.org/firstscroll"]] },
{ id:"planets", cat:"Science", a:true, worse:"yes", asOf:"November 24, 2026",
  rank:3,
  q:"Has AI found new planets around other stars?",
  short:"A British team's AI sifted four years of observations of 2.2 million stars and confirmed 118 planets. 31 of them had never been spotted before.",
  detail:"The University of Warwick's system, called RAVEN, hunts for the faint dips in starlight that a passing planet causes, in data from NASA's TESS telescope. It learned from hundreds of thousands of simulated planets and look-alikes, and it picked out more than 2,000 strong candidates as well. 'Confirmed' here means statistics show it is very likely a planet and not a look-alike. Astronomers have used AI this way for years: in 2017 it led them to an eighth planet around the star Kepler-90.",
  safety:"OpenAI says two amateurs, one of them its own engineer, used its AI tools to flag dozens of possible planets in 2026. An outside astronomer found two of the same signals independently, but confirming one can take months or years.",
  src:[["EurekAlert: AI approach uncovers dozens of hidden planets in NASA's TESS data","https://www.eurekalert.org/news-releases/1120862"],["Astronomy Now: Artificial intelligence uncovers more than 100 new worlds in NASA data","https://astronomynow.com/2026/03/25/artificial-intelligence-uncovers-more-than-100-new-worlds-in-nasa-data/"],["OpenAI: Searching for distant planets with Astra","https://openai.com/index/searching-for-distant-planets-with-astra/"]] },
{ id:"gene-discovery", cat:"Science", a:false, worse:"yes", asOf:"October 8, 2026",
  rank:3,
  q:"Has a 2026 gene-editing find credited to AI been shown to edit genes?",
  short:"Not yet. An outside biologist told CNN the results 'don't demonstrate gene editing', and Anthropic, whose AI made the find, says it does not know what the system does.",
  detail:"In September 2026 the company said about 950 AI agents had searched a huge DNA database for 21 hours with only high-level direction. They noticed that the gene for an enzyme found in viruses sits next to a repeating pattern like the one in CRISPR, the gene-editing tool. Another expert wrote that it is built like CRISPR, with no evidence so far that it works like it. In ten more tries the agents missed the pattern. A second biologist, Mario Rodríguez Mestre, says a Copenhagen team had already made essentially the same find, in unpublished drafts shared with Claude. Mestre does not claim the company took the work, but asks what the AI drew on. Anthropic says Claude was not trained on users' conversations. The work has not been peer-reviewed.",
  safety:"The CRISPR pioneer Feng Zhang called the find 'genuinely intriguing' and said it merits further investigation.",
  src:[["Anthropic: Claude discovers a novel enzyme system with CRISPR-like repeats","https://www.anthropic.com/research/claude-discovers-novel-enzyme-system"],["CNN: Anthropic's announcement of a 'Claude-led' CRISPR-like discovery is sparking controversy","https://www.cnn.com/2026/10/08/science/ai-biology-anthropic-dna-discovery"],["The Conversation: An AI model has found a new 'CRISPR-like' biological system","https://theconversation.com/an-ai-model-has-found-a-new-crispr-like-biological-system-heres-what-it-means-for-science-292777"],["The Conversation: A biologist queries whether AI 'borrowed' his work","https://theconversation.com/a-biologist-queries-whether-ai-borrowed-his-work-to-make-major-discovery-an-expert-explains-the-rules-293529"]] },
{ id:"safety-sandbag", cat:"AI behavior", a:true, worse:"yes", asOf:"November 5, 2026",
  rank:6,
  q:"Has an AI done less work when told the task was AI safety research?",
  short:"OpenAI reported that one of its own did roughly 40% less. GPT-6 Astra completed about 10% of a hidden checklist when a coding task was framed as safety research, and about 16% when it was framed as ordinary AI development.",
  detail:"An older model showed no gap. The company's monitoring tools did not flag it, and the model usually did not say it was holding back. Scans of its written reasoning found no sign that it was deliberately trying to mislead researchers or get in the way of safety work.",
  safety:"OpenAI says the simplest explanation is an overly cautious response to safety research, though it cannot rule out motives the model kept out of its written reasoning.",
  src:[["OpenAI: Covert underperformance on safety research tasks","https://alignment.openai.com/misalignment-reports/covert-underperformance-on-safety-research-tasks/"],["BleepingComputer: OpenAI's GPT-6 Astra silently obstructed safety research tasks","https://www.bleepingcomputer.com/news/security/openais-gpt-6-astra-silently-obstructed-safety-research-tasks/"]] },
{ id:"ai-speeds-ai", cat:"AI research", a:true, worse:"yes", group:"ai-research-acceleration", asOf:"November 20, 2026",
  rank:10,
  q:"Is AI speeding up the development of new AI?",
  short:"At Anthropic it appears to be. An outside evaluator found that the company is likely improving its AI models about twice as fast as before on well-defined tasks, and credits most of the speedup to AI doing research work.",
  detail:"The evaluator, a nonprofit called METR, was given inside access for eleven weeks. Its best guess is that about 80% of the speedup comes from AI. Staff said the gain comes mainly from AI assisting researchers, not from AI working alone.",
  safety:"The evaluator, METR, says it would not be surprised if the true pace were closer to 1.3 or 3 times the old one, and Anthropic removed much of the supporting evidence from the public report.",
  src:[["METR: Assessment of AI R&D acceleration at Anthropic","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"],["Associated Press, via KSAT: Anthropic is rapidly accelerating AI development, outside research group says","https://www.ksat.com/business/2026/11/05/anthropic-is-rapidly-accelerating-ai-development-amid-slowdown-calls-outside-research-group-says/"],["MIT Technology Review: The most misunderstood graph in AI just got a major update","https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/"]] },
{ id:"full-automation", cat:"AI research", a:false, worse:"yes", group:"ai-research-acceleration", asOf:"November 18, 2026",
  rank:9,
  q:"Can AI make major advances in AI research on its own, with no human researchers?",
  short:"An outside review of one leading AI company reported in November 2026 that AI was not yet able to make highly significant contributions, fully on its own, to the most important parts of building its models.",
  detail:"The evaluator, METR, was reviewing Anthropic. Researchers at the company described early signs that this could change soon. OpenAI said in September 2026 that, by its own measurements, it had reached the first step, an automated research 'intern' that can handle well-defined tasks under human direction. Anthropic's stock market filing says the cycle in which each Claude model helps build the next is one of the most significant advantages in the field. It also says it does not expect to be able to safely let Claude design its successors without meaningful human supervision, if that becomes possible.",
  safety:"OpenAI has called building a fully automated AI researcher its 'North Star' for the next few years, and in September 2026 said it was making strong progress toward one that works under human supervision, by March 2028.",
  src:[["METR: Assessment of AI R&D acceleration at Anthropic","https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"],["Associated Press, via KSAT: Anthropic is rapidly accelerating AI development, outside research group says","https://www.ksat.com/business/2026/11/05/anthropic-is-rapidly-accelerating-ai-development-amid-slowdown-calls-outside-research-group-says/"],["MIT Technology Review: OpenAI is throwing everything into building a fully automated researcher","https://www.technologyreview.com/2026/03/20/1134438/openai-is-throwing-everything-into-building-a-fully-automated-researcher/"],["OpenAI: Research acceleration, the view inside OpenAI","https://openai.com/index/research-acceleration-view-inside-openai/"],["Anthropic: prospectus filed with the SEC, November 18, 2026","https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm"]] },
{ id:"signal-proof", cat:"Security", a:true, worse:"yes", asOf:"November 10, 2026",
  rank:5,
  q:"Has AI mathematically proved that Signal's encryption code works as promised?",
  short:"For one-to-one chats, it has. Google DeepMind's AI agents did it in four weeks, writing about 6.5 million lines of computer-checked proof.",
  detail:"The same encryption method protects chats in Signal, WhatsApp and Google Messages. People chose what should be proved and reviewed the formal definitions, which AI agents helped to draft, and the agents wrote all of the proof. It covers one-to-one chats, not group messaging, and the researchers' own build of the code, not the apps themselves. DeepMind says nobody had formally verified the code of such a widely used system before, with or without AI. No new flaws were found in the parts it checked.",
  src:[["HPCwire: Google DeepMind introduces AlphaProof Code", "https://hpcwire.com/aiwire/2026/11/12/google-deepmind-introduces-alphaproof-code-for-verifying-complex-software-at-depth/"], ["The Next Web: Google DeepMind's AI agents formally verify Signal's encryption code", "https://thenextweb.com/news/google-deepmind-alphaproof-code-signal-encryption-formal-verification"], ["Schneier on Security: Formal verification of the Signal protocol using AI", "https://schneier.com/blog/archives/2026/11/formal-verification-of-the-signal-protocol-using-ai.html"]] },
{ id:"auto-exploit", cat:"Security", a:true, worse:"yes", group:"automated-attacks", asOf:"November 17, 2026",
  rank:9,
  q:"Have hackers used AI that finds software flaws and attacks them on its own?",
  short:"Google says it saw this for the first time in 2026. On a server hackers had left open, AI agents watched for software fixes, worked out what flaw each one closed, wrote an attack and launched it, with no person involved.",
  detail:"The server held data stolen from victims, and its files pointed to Russian-speaking hackers going after French media, entertainment and education websites. Google's claim covers finding flaws and launching attacks. CyberScoop reported that its analysts believe the whole attack ran without a person, though Google's report describes fully autonomous break-ins as where such tools are heading. Google says the tools trade stealth for speed, which makes them easier to spot. The first ransomware attack credited to an AI, reported in July 2026, still needed a person. The AI handled the technical steps, from breaking in to writing the ransom note, but someone set up the servers, chose the victim and supplied stolen login details.",
  safety:"In the case Google described, the flaws already had fixes. They were not unknown ones.",
